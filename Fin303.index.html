td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><p>A positive FCF means the firm generates more cash internally than it needs for its current investments; a negative FCF means it must raise outside money to cover the gap.</p><div class='example'><span class='example-label'>Worked example \u2014 Allied, 2021</span>NOPAT = EBIT(1 \u2212 T) = <span class='src-box ln2-ebit y2021'>$278M</span> \u00d7 (1 \u2212 0.25) = <span class='src-box calc-result'>$208.5M</span>. Adding depreciation: <span class='src-box calc-result'>$208.5M</span> + <span class='src-box ln2-dep y2021'>$100M</span> = <span class='src-box calc-result'>$308.5M</span> generated from operations. Investment needs: capital expenditures of $230M plus \u0394NOWC of $150M (<span class='src-box calc-result'>$800M NOWC</span> in 2021 minus <span class='src-box calc-result'>$650M</span> in 2020) = $380M. FCF = <span class='src-box calc-result'>$308.5M</span> \u2212 $380M = <strong><span class='src-box calc-result'>\u2212$71.5 million</span></strong>. The negative FCF isn't necessarily alarming here \u2014 it's driven mainly by a one-time $230M new processing plant that should support growth for years, so FCF is expected to improve going forward.</div><div class='example'><span class='example-label'>Concrete example \u2014 a small business version (the pizza shop)</span>A family pizza shop earns $75,000 in net income for the year, but has to spend $50,000 renovating the kitchen and restrooms. Even though the accounting 'profit' looks healthy, the owners' free cash flow \u2014 what they can actually take out of the business \u2014 is far lower, because most of the profit has to be reinvested. The same logic that applies to Allied applies here: it's free cash flow, not accounting net income, that determines how much value (and how much cash) a business is really generating for its owners.</div>"}, {"heading": "Measuring value creation beyond the accounting statements: MVA and EVA (Section 3-8)", "html": "<p>Because book values reflect historical cost rather than what a company is actually worth today, analysts also use two market-based measures. <span class='term' data-cid='ch3-market-value-added-mva'>Market value added (MVA)</span> compares what the market currently thinks a firm's equity is worth to what stockholders have actually put into the business (paid-in capital plus retained earnings):</p><div class='formula-box'><span class='formula-label'>Formula \u2014 market value added (MVA)</span><div class='formula-eq'>MVA = Market Value of Equity \u2212 Book Value of Equity</div><div class='example'><span class='example-label'>Worked example \u2014 Allied</span>Market value of equity = <span class='src-box ln2-price y2021'>$23.06</span> \u00d7 <span class='src-box ln2-shares y2021'>75 million</span> shares = <span class='src-box calc-result'>$1,729.5M</span>. Book value of equity (from the balance sheet) = <span class='src-box ln-tce y2021'>$940M</span>. MVA = <span class='src-box calc-result'>$1,729.5M</span> \u2212 <span class='src-box ln-tce y2021'>$940M</span> = <strong><span class='src-box calc-result'>$789.5 million</span></strong> \u2014 meaning Allied's stockholders could sell the whole business for about $789.5M more than they've collectively put into it.</div></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><p><span class='term' data-cid='ch3-economic-value-added-eva'>Economic value added (EVA)</span> is a related, more granular measure \u2014 it can be calculated for a division, not just the whole firm \u2014 that compares after-tax operating profit to the actual dollar cost of all the capital used to generate it:</p><div class='formula-box'><span class='formula-label'>Formula \u2014 economic value added (EVA)</span><div class='formula-eq'>EVA = NOPAT \u2212 (Total Invested Capital \u00d7 After-Tax % Cost of Capital)</div><div class='example'><span class='example-label'>Worked example</span>A company raises $1 million in total capital at a 10% after-tax cost. Its annual dollar cost of capital is $1,000,000 \u00d7 0.10 = $100,000. If that capital generates $150,000 of NOPAT, EVA = $150,000 \u2212 $100,000 = <strong>$50,000</strong> of real economic profit \u2014 value genuinely created above and beyond what investors could earn elsewhere for the same risk.</div></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>The key difference from ordinary accounting income: net income subtracts the cost of debt (interest) but never subtracts the cost of equity capital \u2014 as if equity financing were free. EVA charges for <em>both</em>, which is why a company can report positive net income and still have negative EVA if it isn't earning enough to cover what its equity investors could have earned elsewhere.</p>"}], "3.3": [{"heading": "How individual income taxes work (Sections 3-9, 3-9A)", "html": "<p>The U.S. individual income tax is <span class='term' data-cid='ch3-progressive-tax'>progressive</span> \u2014 higher income is taxed at a higher rate. This creates a gap between two related ideas: the <span class='term' data-cid='ch3-marginal-tax-rate'>marginal tax rate</span> (the rate paid on the <em>next</em> dollar earned) and the <span class='term' data-cid='ch3-average-tax-rate'>average tax rate</span> (total tax paid divided by total taxable income).</p><div class='formula-box'><span class='formula-label'>Formula \u2014 average tax rate</span><div class='formula-eq'>Average Tax Rate = Total Tax Paid \u00f7 Taxable Income</div><div class='example'><span class='example-label'>Worked example \u2014 2020 single-filer brackets</span>A single filer with $45,000 of taxable income owes $4,617.50 (the tax on the first $40,125) plus 22% of the amount over that: $4,617.50 + ($45,000 \u2212 $40,125) \u00d7 0.22 = $4,617.50 + $1,072.50 = <strong>$5,690</strong>. Average tax rate = $5,690 \u00f7 $45,000 = <strong>12.64%</strong> \u2014 well below the 22% marginal rate, because only the last slice of income is taxed at 22%; everything below it is taxed at the lower bracket rates.</div></div><p><span class='term' data-cid='ch3-capital-gain'>Capital gains</span> and <span class='term' data-cid='ch3-capital-loss'>capital losses</span> (profits or losses from selling an asset like stock, above or below its purchase price) get special treatment: short-term gains (asset held a year or less) are taxed just like ordinary income, but long-term gains (held more than a year) are taxed at preferential rates \u2014 0%, 15%, or 20% depending on income \u2014 because Congress wants to encourage long-term investment. Qualified dividends get similarly preferential rates, partly to soften the blow of double taxation (corporate income is taxed once at the company, then again as dividends to shareholders).</p><p>Retirement accounts get preferential treatment too: contributions to a <span class='term' data-cid='ch3-traditional-ira'>Traditional IRA</span> are tax-deductible now, with taxes deferred until withdrawal after age 59\u00bd; contributions to a <span class='term' data-cid='ch3-roth-ira'>Roth IRA</span> get no upfront deduction, but withdrawals (including all the investment growth) are tax-free after 59\u00bd. As a rule of thumb, Roth accounts tend to favor people who expect their tax rate to be higher later in life \u2014 which is part of why younger investors, expecting rising income over time, allocate the large majority of their IRA contributions to Roth accounts.</p>"}, {"heading": "The Tax Cuts and Jobs Act (TCJA) of 2017 (Section 3-9, box)", "html": "<p>The <span class='term' data-cid='ch3-tax-cuts-and-jobs-act-tcja'>Tax Cuts and Jobs Act (TCJA)</span>, signed into law in December 2017, was the most sweeping tax overhaul since 1986. On the individual side (provisions set to sunset at the end of 2025), it lowered the top rate from 39.6% to 37%, eliminated the personal exemption, roughly doubled the <span class='term' data-cid='ch3-standard-deduction'>standard deduction</span> (to $12,400 single / $24,800 married-joint in 2020), capped the mortgage-interest deduction at $750,000 of principal, and capped state-and-local-tax deductions at $10,000. On the corporate side (mostly permanent), it set a flat 21% corporate rate (versus a prior top rate around 35%, among the highest in the world), allowed immediate 100% expensing of many new and used asset purchases through 2022 (phasing out through 2026), repealed the corporate AMT, and capped the interest deduction at 30% of income.</p>"}, {"heading": "How corporate income taxes work (Section 3-9B)", "html": "<p>This textbook uses a simplified flat federal-plus-state corporate rate of 25% throughout (reflecting the TCJA's 21% federal rate plus a typical state add-on):</p><div class='formula-box'><span class='formula-label'>Formula \u2014 corporate tax bill</span><div class='formula-eq'>Taxes = Taxable Income \u00d7 Tax Rate</div><div class='example'><span class='example-label'>Worked example</span>A firm with $65,000 of taxable income: Taxes = $65,000 \u00d7 0.25 = <strong>$16,250</strong>.</div></div><p>Corporations get a break on dividends they receive from other companies (to avoid triple taxation \u2014 the paying company's income, the receiving company's income, and eventually the final shareholder's income all getting taxed on the same dollars): 50% of dividends received is excluded from taxable income, so only the remaining 50% is taxed at the 25% rate \u2014 an effective rate of just 12.5% on dividend income, versus the full 25% on interest income. This is why a corporation investing surplus cash gets a better after-tax return from dividend-paying stock than from bonds paying a similar rate.</p><p>The tax code also favors <strong>debt over equity financing</strong> for the exact same reason it favors received dividends the way it does: interest paid is tax-deductible, but dividends paid are not.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 pretax income needed to pay $1 of dividends</span><div class='formula-eq'>Pretax Income Needed = $1 \u00f7 (1 \u2212 Tax Rate)</div><div class='example'><span class='example-label'>Worked example</span>At a 25% tax rate: $1 \u00f7 (1 \u2212 0.25) = $1 \u00f7 0.75 = <strong>$1.33</strong> of pretax income needed to pay $1 of dividends (versus just $1 of pretax income to pay $1 of interest, since that dollar is fully deductible). A firm with $10 million of assets and $1.5 million of EBIT would deliver the full $1.5 million to investors if financed entirely with debt, but only about $1.125 million after tax if financed entirely with equity \u2014 a real difference in the return investors receive depending purely on how the firm is financed.</div></div><p>Finally, the <span class='term' data-cid='ch3-loss-carryforward'>loss carryforward</span> rule lets a firm apply this year's operating loss against future years' taxable income (indefinitely, though capped at 80% of that future year's taxable income), so that companies with genuinely volatile year-to-year profits aren't penalized relative to steadily profitable ones.</p><div class='example'><span class='example-label'>Worked example \u2014 using a loss carryforward</span>Company X loses $12 million in 2021. In 2022 it earns $10 million of taxable income; 80% of that is $8 million, so it can carry forward $8 million of the 2021 loss, leaving 2022 taxable income of $10M \u2212 $8M = $2M and a tax bill of $2M \u00d7 0.25 = $500,000. That still leaves $12M \u2212 $8M = $4 million of unused loss. In 2023, with another $10 million of taxable income, the full remaining $4 million carryforward can be applied (since it's less than 80% of $10M), leaving 2023 taxable income of $10M \u2212 $4M = $6 million and a tax bill of $6M \u00d7 0.25 = <strong>$1.5 million</strong> \u2014 with the entire 2021 loss now fully used up.</div>"}], "4.1": [{"heading": "What ratio analysis is, and the five categories of ratios (Section 4-1)", "html": "<p>The primary goal of financial management is to maximize shareholder wealth, not accounting measures like book income or EPS \u2014 but accounting data still drives stock prices, so managers and investors both need tools to interpret it. <span class='term' data-cid='ch4-ratio-analysis'>Ratio analysis</span> is exactly that tool: it uses relationships between financial statement numbers to evaluate a firm's condition and performance, and to compare it against other firms in its industry or against its own past results.</p><p>The chapter divides ratios into five categories. <span class='term' data-cid='ch4-liquidity-ratios'>Liquidity ratios</span> give an idea of a firm's ability to pay off debts maturing within a year. <span class='term' data-cid='ch4-asset-management-ratios'>Asset management ratios</span> give an idea of how efficiently a firm uses its assets. <span class='term' data-cid='ch4-debt-management-ratios'>Debt management ratios</span> give an idea of how the firm has financed its assets, and how well it can service its long-term debt. <span class='term' data-cid='ch4-profitability-ratios'>Profitability ratios</span> give an idea of how profitably the firm is operating and using its assets. And <span class='term' data-cid='ch4-market-value-ratios'>Market value ratios</span> give an idea of what investors think about the firm's prospects, based on its stock price.</p><div class='example'><span class='example-label'>Why this matters beyond one chapter</span>Satisfactory liquidity is necessary for a firm to keep operating; asset and debt management ratios help explain WHY liquidity looks the way it does; and profitability ratios are the net result of all of a firm's financing and operating decisions combined \u2014 the categories build on each other rather than standing alone.</div>"}], "4.2": [{"heading": "Liquidity and the current ratio (Sections 4-2, 4-2A)", "html": "<p>A liquid asset is one that trades in an active market and can be quickly converted to cash at a fair market value. A firm is generally considered liquid if it can pay its bills on time without straining its operations. The most commonly used liquidity measure is the <span class='term' data-cid='ch4-current-ratio'>current ratio</span>, calculated by dividing current assets by current liabilities.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 current ratio</span><div class='formula-eq'>Current Ratio = Current Assets \u00f7 Current Liabilities</div><ol class='step-list'><li><strong>Total current assets</strong> (from the balance sheet, Table 3.1): <span class='src-box ln-tca y2021'>$1,000 million</span>.</li><li><strong>Total current liabilities</strong> (from the balance sheet): <span class='src-box ln-tcl y2021'>$310 million</span>.</li><li><span class='src-box ln-tca y2021'>$1,000M</span> \u00f7 <span class='src-box ln-tcl y2021'>$310M</span> = <strong><span class='src-box calc-result'>3.2\u00d7</span></strong>, versus an industry average of <strong>4.2\u00d7</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><p>If a company starts running into financial difficulty, it typically begins paying its accounts payable more slowly and borrowing more from its bank \u2014 both of which raise current liabilities. If current liabilities are rising faster than current assets, the current ratio falls, and that's a signal of possible trouble. Allied's 3.2\u00d7 current ratio is below the 4.2\u00d7 industry average, so its liquidity position is somewhat weak, but by no means desperate.</p><p>Industry averages aren't a magic number every firm should hit exactly \u2014 some very well-managed firms sit above the average, and some good firms sit below it. A firm well above the industry average may actually signal too much old inventory sitting unsold, or too many receivables that will turn into bad debts; a firm well below average might simply be managing its current assets more tightly than competitors. Either direction is worth investigating further, not assuming automatically good or bad.</p>"}, {"heading": "The quick (acid-test) ratio (Section 4-2B)", "html": "<p>The second liquidity ratio is the <span class='term' data-cid='ch4-quick-ratio'>quick, or acid-test, ratio</span>, calculated by subtracting inventories from current assets and then dividing the remainder by current liabilities.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 quick (acid-test) ratio</span><div class='formula-eq'>Quick Ratio = (Current Assets \u2212 Inventories) \u00f7 Current Liabilities</div><ol class='step-list'><li><strong>Current assets</strong>: <span class='src-box ln-tca y2021'>$1,000 million</span>. <strong>Inventories</strong>: <span class='src-box ln-inv y2021'>$615 million</span>. <span class='src-box ln-tca y2021'>$1,000M</span> \u2212 <span class='src-box ln-inv y2021'>$615M</span> = <span class='src-box calc-result'>$385 million</span>.</li><li><strong>Current liabilities</strong>: <span class='src-box ln-tcl y2021'>$310 million</span>.</li><li><span class='src-box calc-result'>$385M</span> \u00f7 <span class='src-box ln-tcl y2021'>$310M</span> = <strong><span class='src-box calc-result'>1.2\u00d7</span></strong>, versus an industry average of <strong>2.2\u00d7</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><p>Inventories are typically the least liquid current asset \u2014 if sales slow down, they might not convert to cash as quickly as expected, and inventory is also the asset most likely to lose value in a liquidation. So the quick ratio, which measures a firm's ability to pay short-term obligations without relying on selling inventory, is an important supplement to the current ratio. Allied's 1.2\u00d7 quick ratio is well below the 2.2\u00d7 industry average \u2014 though if its receivables can be collected, it can still pay off its current liabilities even if inventory proves hard to sell.</p><div class='example'><span class='example-label'>Worked practice example (from the chapter's Self-Test)</span>A company has current liabilities of $500 million and a current ratio of 2.0. Current assets = 2.0 \u00d7 $500M = $1,000 million. If that same firm's quick ratio is 1.6, then (Current assets \u2212 Inventories) \u00f7 $500M = 1.6, so Inventories = $1,000M \u2212 1.6($500M) = $1,000M \u2212 $800M = $200 million.</div><div class='example'><span class='example-label'>Finding ratio data in practice</span>A wide range of free financial data is available online \u2014 sites like Yahoo Finance and Google Finance provide stock quotes, financial statements, and analyst estimates with just a stock's ticker symbol, while sites like CNBC, Reuters, and Value Line offer deeper industry comparisons. When comparing ratios across sources, remember that different sites sometimes calculate the same ratio differently (for example, using trailing 12-month data versus a single fiscal year), so it's worth checking each site's own definitions before comparing numbers directly.</div>"}], "4.3": [{"heading": "Why asset management ratios matter (Section 4-3)", "html": "<p><span class='term' data-cid='ch4-asset-management-ratios'>Asset management ratios</span> answer a simple question: is the amount of each type of asset reasonable, too high, or too low, given a firm's current and projected sales? This matters because assets cost money \u2014 if Allied or any company has too many assets, its cost of capital will be too high, depressing profits; if its assets are too low, it will lose profitable sales it could otherwise have made. A firm must strike a balance between too many and too few assets, and these ratios help identify where that balance sits.</p>"}, {"heading": "Inventory turnover ratio (Section 4-3A)", "html": "<p>\u201cTurnover ratios\u201d generally divide sales by some asset, showing how many times that asset is \u201cturned over\u201d during the year. The <span class='term' data-cid='ch4-inventory-turnover-ratio'>inventory turnover ratio</span> is calculated a bit differently, though \u2014 since sales are stated at market prices while inventories are carried at cost, using sales in the numerator would overstate the true turnover, so cost of goods sold is used instead.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 inventory turnover ratio</span><div class='formula-eq'>Inventory Turnover = Cost of Goods Sold \u00f7 Inventories</div><ol class='step-list'><li><strong>Cost of goods sold</strong>: Allied's COGS is 70% of sales, or <span class='src-box ln2-cogs y2021'>$2,100 million</span>.</li><li><strong>Inventories</strong> (from the balance sheet): <span class='src-box ln-inv y2021'>$615 million</span>.</li><li><span class='src-box ln2-cogs y2021'>$2,100M</span> \u00f7 <span class='src-box ln-inv y2021'>$615M</span> = <strong><span class='src-box calc-result'>3.4\u00d7</span></strong>, versus an industry average of <strong>7.6\u00d7</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>As a rough approximation, each item of Allied's inventory is sold and restocked about 3.4 times a year \u2014 much lower than the 7.6\u00d7 industry average, suggesting Allied is holding too much inventory. Excess inventory is unproductive and represents an investment with a low or zero rate of return, and a low turnover ratio also raises the possibility that some of that inventory is obsolete and not worth its stated value. Note too that cost of goods sold accrues over the whole year while the inventory figure is a single point in time, so for highly seasonal businesses or firms with a strong sales trend, it can be more accurate to use an average inventory figure instead.</p>"}, {"heading": "Days sales outstanding (Section 4-3B)", "html": "<p>Accounts receivable are evaluated using the <span class='term' data-cid='ch4-days-sales-outstanding-dso'>days sales outstanding (DSO)</span> ratio, also called the average collection period (ACP). It's calculated by dividing accounts receivable by average daily sales, to find how many days' worth of sales are tied up in receivables \u2014 in other words, how long the firm must wait after a sale before receiving cash.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 days sales outstanding</span><div class='formula-eq'>DSO = Receivables \u00f7 (Annual Sales \u00f7 365)</div><ol class='step-list'><li><strong>Receivables</strong>: <span class='src-box ln-ar y2021'>$375 million</span>.</li><li><strong>Average daily sales</strong>: <span class='src-box ln2-sales y2021'>$3,000M</span> \u00f7 365 = <span class='src-box calc-result'>$8.2192 million</span> per day.</li><li><span class='src-box ln-ar y2021'>$375M</span> \u00f7 <span class='src-box calc-result'>$8.2192M</span> = 45.625, rounded to <strong><span class='src-box calc-result'>\u2248 46 days</span></strong>, versus an industry average of <strong>36 days</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>Allied's DSO should also be compared with its own stated credit terms, not just the industry: Allied's credit policy calls for payment within 30 days, so 46 days of sales outstanding shows customers are, on average, paying quite late. That deprives the company of funds it could otherwise use to pay down bank loans or other costly capital, and late-paying customers are also the ones most likely to eventually default, turning into bad debts that are never collected. The chapter also notes that Allied's DSO has been rising over the past few years even though its credit policy hasn't changed \u2014 reinforcing that its credit manager should take steps to collect receivables faster.</p>"}, {"heading": "Fixed assets turnover ratio (Section 4-3C)", "html": "<p>The <span class='term' data-cid='ch4-fixed-assets-turnover-ratio'>fixed assets turnover ratio</span>, the ratio of sales to net fixed assets, measures how effectively a firm uses its plant and equipment.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 fixed assets turnover ratio</span><div class='formula-eq'>Fixed Assets Turnover = Sales \u00f7 Net Fixed Assets</div><ol class='step-list'><li><strong>Sales</strong>: <span class='src-box ln2-sales y2021'>$3,000 million</span>.</li><li><strong>Net fixed assets</strong> (from the balance sheet): <span class='src-box ln-ppe y2021'>$1,000 million</span>.</li><li><span class='src-box ln2-sales y2021'>$3,000M</span> \u00f7 <span class='src-box ln-ppe y2021'>$1,000M</span> = <strong><span class='src-box calc-result'>3.0\u00d7</span></strong>, versus an industry average of <strong>2.8\u00d7</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>Allied's 3.0\u00d7 ratio is slightly above the 2.8\u00d7 industry average, meaning it's using its fixed assets at least as intensively as other firms in the industry \u2014 so Allied appears to have about the right amount of fixed assets relative to its sales. One interpretation problem: fixed assets are shown at historical cost less depreciation, and inflation can seriously understate the value of assets purchased long ago. An older firm with fully depreciated assets can therefore show a higher fixed assets turnover than an identical newer firm that just acquired its assets \u2014 reflecting the age of the assets rather than any real difference in efficiency. In Allied's case this isn't a serious issue, since firms across its industry have all been expanding their asset bases at roughly the same rate, keeping the comparison reasonably fair.</p>"}, {"heading": "Total assets turnover ratio (Section 4-3D)", "html": "<p>The final asset management ratio, the <span class='term' data-cid='ch4-total-assets-turnover-ratio'>total assets turnover ratio</span>, measures the turnover of all of a firm's assets, calculated by dividing sales by total assets.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 total assets turnover ratio</span><div class='formula-eq'>Total Assets Turnover = Sales \u00f7 Total Assets</div><ol class='step-list'><li><strong>Sales</strong>: <span class='src-box ln2-sales y2021'>$3,000 million</span>.</li><li><strong>Total assets</strong> (from the balance sheet): <span class='src-box ln-ta y2021'>$2,000 million</span>.</li><li><span class='src-box ln2-sales y2021'>$3,000M</span> \u00f7 <span class='src-box ln-ta y2021'>$2,000M</span> = <strong><span class='src-box calc-result'>1.5\u00d7</span></strong>, versus an industry average of <strong>1.8\u00d7</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>Allied's ratio is somewhat below the industry average, indicating it isn't generating enough sales given its total assets. Since its fixed assets turnover was already in line with the industry, the problem must lie with its current assets \u2014 specifically the low inventory turnover and slow receivables collection already identified. Reducing inventory and collecting receivables faster would directly improve this ratio.</p><table class='mini-table'><thead><tr><th>Ratio</th><th>Formula</th><th>Allied</th><th>Industry Avg.</th></tr></thead><tbody><tr><td>Inventory turnover</td><td>COGS \u00f7 Inventories</td><td>3.4\u00d7</td><td>7.6\u00d7</td></tr><tr><td>Days sales outstanding</td><td>Receivables \u00f7 (Sales \u00f7 365)</td><td>46 days</td><td>36 days</td></tr><tr><td>Fixed assets turnover</td><td>Sales \u00f7 Net fixed assets</td><td>3.0\u00d7</td><td>2.8\u00d7</td></tr><tr><td>Total assets turnover</td><td>Sales \u00f7 Total assets</td><td>1.5\u00d7</td><td>1.8\u00d7</td></tr></tbody></table><div class='example'><span class='example-label'>Worked practice example (from the chapter's Self-Test)</span>A firm has annual sales of $100 million, cost of goods of $80 million, inventory of $20 million, and accounts receivable of $30 million. Inventory turnover = $80M \u00f7 $20M = 4\u00d7. DSO = $30M \u00f7 ($100M \u00f7 365) = $30M \u00f7 $0.2740M \u2248 109.5 days.</div>"}], "4.4": [{"heading": "Debt management ratios and the effects of financial leverage (Section 4-4)", "html": "<p>Using debt \u2014 \u201cleveraging up\u201d \u2014 raises a firm's ROE if it earns more on its assets than the interest rate it pays on that debt. But debt also exposes the firm to more risk than if it were financed only with equity. In this section, the chapter compares two otherwise-identical firms that differ only in how they're financed: Firm U (Unlevered) has no debt at all and is 100% common equity; Firm L (Leveraged) has raised $50 of its $100 in total assets as debt at a 10% interest rate. Both firms have $100 in total assets, and their sales are expected to range from a $150 \u201cgood\u201d year down to a $75 \u201cbad\u201d year depending on business conditions.</p><table class='bs-table'><caption>Table 4.1 \u2014 The Effects of Financial Leverage</caption><thead><tr><th>Firm U \u2014 Unlevered (No Debt)</th><th>Good</th><th>Expected</th><th>Bad</th></tr></thead><tbody><tr><td>Sales revenues</td><td>$150.00</td><td>$100.00</td><td>$75.00</td></tr><tr><td>Total operating costs</td><td>105.00</td><td>85.00</td><td>75.00</td></tr><tr class='bs-subtotal'><td>Operating income (EBIT)</td><td>$45.00</td><td>$15.00</td><td>$0.00</td></tr><tr><td>Interest (rate = 10%)</td><td>0.00</td><td>0.00</td><td>0.00</td></tr><tr><td>Taxable income (EBT)</td><td>$45.00</td><td>$15.00</td><td>$0.00</td></tr><tr><td>Taxes (Rate = 25%)</td><td>11.25</td><td>3.75</td><td>0.00</td></tr><tr class='bs-total'><td>Net income (NI)</td><td>$33.75</td><td>$11.25</td><td>$0.00</td></tr><tr class='bs-total'><td>ROE<sub>U</sub></td><td>33.75%</td><td>11.25%</td><td>0.00%</td></tr></tbody></table><table class='bs-table' style='margin-top:14px;'><thead><tr><th>Firm L \u2014 Leveraged (Some Debt)</th><th>Good</th><th>Expected</th><th>Bad</th></tr></thead><tbody><tr><td>Sales revenues</td><td>$150.00</td><td>$100.00</td><td>$75.00</td></tr><tr><td>Total operating costs</td><td>105.00</td><td>85.00</td><td>75.00</td></tr><tr class='bs-subtotal'><td>Operating income (EBIT)</td><td>$45.00</td><td>$15.00</td><td>$0.00</td></tr><tr><td>Interest (rate = 10% on $50 debt)</td><td>5.00</td><td>5.00</td><td>5.00</td></tr><tr><td>Taxable income (EBT)</td><td>$40.00</td><td>$10.00</td><td>\u2212$5.00</td></tr><tr><td>Taxes (Rate = 25%)</td><td>10.00</td><td>2.50</td><td>0.00</td></tr><tr class='bs-total'><td>Net income (NI)</td><td>$30.00</td><td>$7.50</td><td>\u2212$5.00</td></tr><tr class='bs-total'><td>ROE<sub>L</sub></td><td>60.00%</td><td>15.00%</td><td>\u221210.00%</td></tr></tbody></table><p>Notice that operating income (EBIT) is identical for both firms in every scenario \u2014 leverage only changes what happens below EBIT. Firm L's fixed $5 of interest must be paid regardless of how the economy performs, so at first glance it looks like Firm U is better off in all cases, but that isn't quite right: Firm L's stockholders have only put up $50 (versus Firm U's $100), so their investment should be judged relative to that smaller amount. Under good conditions, Firm L's ROE is a stunning 60% (versus 33.75% for U); under expected conditions it's still higher, at 15% (versus 11.25%). But under bad conditions, Firm L's ROE falls to \u221210%, meaning Firm L would go bankrupt if conditions this poor persisted for several years.</p><p>Thus, firms with relatively high debt ratios typically have higher expected returns when the economy is normal, but they experience lower returns \u2014 and possibly bankruptcy \u2014 if the economy goes into a downturn. Determining the optimal amount of debt is a complicated process the chapter defers to a later discussion of capital structure. For now, analysts examine a firm's debt using two procedures: checking the balance sheet to determine the proportion of total funds provided by debt, and reviewing the income statement to see the extent to which interest is covered by operating profits.</p>"}, {"heading": "Total debt to total capital (Section 4-4A)", "html": "<p>The ratio of <span class='term' data-cid='ch4-total-debt-to-total-capital'>total debt to total capital</span> measures the percentage of a firm's capital provided by debtholders. Recall from Chapter 3 that total debt includes only short-term and long-term interest-bearing debt \u2014 it does not include operating items such as accounts payable and accruals.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 total debt to total capital</span><div class='formula-eq'>Total Debt to Total Capital = Total
