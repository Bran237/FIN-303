Harrah's Entertainment, Neiman Marcus, Clear Channel, and Keurig Green Mountain. More recent deals include BDT Capital Partners and JAB Holding's $7.16 billion acquisition of Panera Bread (2017), Sycamore Partners' $6.9 billion purchase of Staples (2017), Bain Capital's roughly $18 billion deal for Toshiba's memory chip unit \u2014 teaming with Apple, Dell, and SK Hynix while Toshiba retained a 40% stake (2018), and Keurig Green Mountain's (backed by JAB Holding) $18.7 billion purchase of Dr Pepper Snapple (2018). Other major private equity firms include The Carlyle Group, Kohlberg Kravis Roberts (KKR), The Blackstone Group, Apollo Global Management, and TPG.</li></ol>"}, {"heading": "Passive vs. active investing, and the Buffett bet (Section 2-3, box)", "html": "<div class='key-concept'><span class='kc-label'>Lower fees motivate investors to move toward index funds</span><p>Actively managed funds and hedge funds often charge considerably higher fees than passive products like index funds and ETFs \u2014 a passive fund costs less largely because there's no team of expensive managers being paid to try to beat the market; the fund simply replicates a given index, increasingly with the help of technology. A 2017 <i>Wall Street Journal</i> analysis of Morningstar data found the average annual cost per $10,000 invested in an actively managed U.S. stock fund was $81 \u2014 more than five times the $14 average cost for passively managed U.S. stock funds. More than 100 passive mutual funds and ETFs charge less than $10 per $10,000 invested.</p><p>This fee gap has pushed many investors toward passive products: Morningstar's Annual Funds Flow reports show passive funds pulling in more and more net new money than active funds nearly every year from 2007 through 2018, with active funds seeing net <i>outflows</i> in most years since 2013.</p><p>The historical evidence further strengthens the case for passive investing: it has consistently shown that the average actively managed fund fails to outperform its corresponding index fund, meaning investors in actively managed products are often paying more for worse relative performance. (In any single year, the very best actively managed funds do outperform the index \u2014 the real challenge is finding, in advance, which funds will consistently beat the market.)</p><div class='example'><span class='example-label'>Warren Buffett's million-dollar bet</span>In 2007, Warren Buffett made a well-publicized 'million-dollar bet' with Ted Seides, co-manager of the asset management firm Prot\u00e9g\u00e9 Partners. Each side put $500,000 toward charity on a bet over which of two approaches would perform better over the following 10 years: Buffett chose a low-cost S&amp;P 500 index fund managed by Vanguard; Seides chose a portfolio of five hedge funds. In his 2018 letter to Berkshire Hathaway shareholders, Buffett reported the final results: the index fund rose 125.8% over the decade (an average annual compounded return of 8.5%), while the five hedge funds' individual 10-year returns ranged from just 2.8% to 87.7% (average annual returns between 0.3% and 6.5%) \u2014 in every case, well below the index fund.</div></div>"}, {"heading": "When hedge funds fail (Section 2-3, box)", "html": "<p>Hedge funds can take on risk considerably higher than that of an average stock or mutual fund. Some of the 10 biggest hedge fund failures to date illustrate the range of ways that can go wrong:</p><ul><li><b>Bernard L. Madoff Investment Securities</b> \u2014 turned out to be an outright Ponzi scheme.</li><li><b>SAC Capital, The Galleon Group, and Pequot Capital</b> \u2014 each failed after being caught engaging in insider trading.</li><li><b>Long-Term Capital Management (LTCM)</b> \u2014 ran highly leveraged arbitrage strategies meant to exploit temporary market mispricings; when the trades didn't pan out, the fund nearly took down the global financial system in 1998. The Federal Reserve organized a bailout, and its creditors took over the fund.</li><li><b>Amaranth Capital</b> \u2014 used convertible bond arbitrage strategies but folded in 2006 when derivative bets went wrong, losing more than $6.5 billion.</li><li><b>Tiger Funds</b> \u2014 failed in 2000 after shorting overpriced tech stocks (selling borrowed shares, hoping to buy them back cheaper later) just as tech stocks kept soaring through the bull market, producing massive losses.</li><li><b>Aman Capital</b> \u2014 failed in 2005 when leveraged trades in credit derivatives produced an estimated loss of hundreds of millions of dollars.</li><li><b>Marin Capital</b> \u2014 failed in 2005 after a large credit-arbitrage and convertible-arbitrage bet on General Motors was crushed when GM's stock fell and its bonds were downgraded to junk.</li><li><b>Bailey Coates Cromwell Fund</b> \u2014 failed in 2005 on bad bets about U.S. stock movements combined with poor leveraged-trade decisions.</li></ul><p>Despite the bumpy history, hedge funds overall have grown tremendously over the past two decades. Assets under management fell sharply after the financial crisis and didn't return to pre-crisis levels until 2013. At the same time, many hedge funds have faced criticism over high fees and underwhelming performance, along with rising competition from other investment products \u2014 which has pushed some funds to lower both their minimum investments and their fees.</p><table class='mini-table'><caption>Table 2.3 \u2014 The 10 Largest Hedge Funds (Second Quarter, 2019)</caption><thead><tr><th>Fund</th><th>Assets Under Management (Billions)</th></tr></thead><tbody><tr><td>Bridgewater Associates, LP</td><td>$132.05</td></tr><tr><td>Renaissance Technologies</td><td>110.00</td></tr><tr><td>Man Group</td><td>62.00</td></tr><tr><td>AQR Capital Management</td><td>60.84</td></tr><tr><td>Two Sigma Investments</td><td>42.90</td></tr><tr><td>Millennium Management LLC</td><td>38.78</td></tr><tr><td>Elliott Management</td><td>37.77</td></tr><tr><td>BlackRock</td><td>32.91</td></tr><tr><td>Citadel Advisors LLC</td><td>32.24</td></tr><tr><td>Davidson Kempner Capital Management</td><td>30.88</td></tr></tbody></table><p class='small-muted'><em>Source (as cited in the textbook): \u201cLargest Hedge Fund Firms,\u201d Wikipedia, Second Quarter 2019.</em></p>"}, {"heading": "Regulating financial institutions (Section 2-3, cont.)", "html": "<p>With the exception of hedge funds and private equity companies, financial institutions are regulated to help ensure their safety and to protect investors. Historically, many of these regulations \u2014 a ban on nationwide branch banking, restrictions on what types of assets institutions could hold, ceilings on the interest rates they could pay, and limits on what services they could offer \u2014 actually tended to impede the free flow of capital and hurt market efficiency. Recognizing this, policymakers took several steps during the 1980s and 1990s to deregulate financial services companies; for example, the ban on nationwide bank branching was lifted in 1999.</p><p>Many observers believe that excessive deregulation and insufficient oversight of the financial sector were partly to blame for the 2007\u20132008 financial crisis. In response, Congress passed the <span class='term' data-cid='ch1-dodd-frank-act'>Dodd-Frank Act</span>, aiming to create a new consumer-protection agency, increase transparency around derivative transactions, and push financial institutions to limit excessive risk-taking and hold more capital. Dodd-Frank's effectiveness has been debated ever since \u2014 some credit it with accomplishing its main goals, while others (including President Trump) have argued it imposed heavy compliance costs on the industry. In May 2018, President Trump signed legislation rolling back parts of Dodd-Frank, easing regulatory scrutiny for smaller and regional banks (institutions like BB&amp;T, SunTrust, KeyBank, and American Express) as well as community banks and credit unions.</p><table class='mini-table'><caption>Table 2.4 \u2014 Largest Banks and Underwriters (partial)</caption><thead><tr><th>Panel A: U.S. Bank Holding Companies</th><th>Panel B: World Banking Companies</th><th>Panel C: Leading Global IPO Underwriters</th></tr></thead><tbody><tr><td>JPMorgan Chase &amp; Co.</td><td>Industrial &amp; Commercial Bank of China Ltd. (China)</td><td>Morgan Stanley</td></tr><tr><td>Bank of America Corp.</td><td>China Construction Bank Corporation (China)</td><td>Goldman Sachs &amp; Co.</td></tr></tbody></table><p class='small-muted'><em>This table is only partially captured \u2014 your textbook page cuts off after the first two rows of each panel. The rest of Panel A, B, and C can be added once the remaining rows are available.</em></p><p>Among the world's 10 largest banks, only one is based in the United States \u2014 U.S. banks have grown dramatically through recent mergers, but remain comparatively small by global standards. Five of the top IPO underwriters also appear as major commercial banks or bank-holding-company subsidiaries elsewhere in the table, which underscores how much the lines between different types of financial institutions have blurred.</p>"}, {"heading": "Securitization and the 2007\u20132008 financial crisis (Section 2-3, box)", "html": "<div class='key-concept'><span class='kc-label'>Securitization has dramatically transformed the banking industry</span><p>Commercial banking used to be simpler: a bank took deposits and used them to make loans, generally holding each loan on its books until it matured. Because banks originated and held their own loans, they understood the risks involved \u2014 but their limited funding capped how many loans they could hold, and since most loans went to local borrowers, banks had little ability to spread their risk.</p><p>To address this, financial engineers developed <span class='term' data-cid='ch2-securitization'>securitization</span>: an agent (often an investment bank) creates an entity that buys a large number of loans from many different banks, then issues securities backed by the cash flows from that pooled loan portfolio. Securitization began in the 1970s, when government-backed entities purchased pools of home mortgages and issued securities backed by the cash flows from that diversified mortgage pool. This was a genuine innovation: banks no longer had to hold mortgages on their books, so they could convert originated loans to cash and redeploy that capital into new loans, while investors gained access to a diversified portfolio of mortgages that traded on the open market and could be bought or sold as their views changed.</p><p>Over the following decades this accelerated, with bankers securitizing all sorts of loans into many different kinds of securities. One well-known example is the <span class='term' data-cid='ch2-collateralized-debt-obligation-cdo'>collateralized debt obligation (CDO)</span>, where an entity issues several classes ('tranches') of securities backed by one loan portfolio. For example, an investment bank might purchase $100 million of mortgage loans from banks and brokers nationwide, then use that pool as collateral to create $100 million in new securities split into three classes. Class A bonds have first claim on the mortgage cash flows \u2014 so they're the least risky and typically rated AAA. Class B bonds get paid after Class A, and usually still carry a fairly high rating. Class C bonds are paid last, making them the riskiest \u2014 they'll earn the highest returns if the underlying mortgages perform well, but suffer the most if those mortgages don't.</p><p>CDOs backed by pools of higher-risk (subprime) mortgages played a major role in the 2007\u20132008 financial crisis. During the housing boom, financial institutions and mortgage brokers originated huge numbers of new mortgages, and fee-hungry investment bankers were happy to package them into new CDOs. These securities were sold mainly to other commercial and investment banks and to institutions like hedge funds, mutual funds, and pension funds \u2014 many of whom treated them as safe investments, reassured by the mistaken belief that housing prices would never fall and by the CDOs' high credit ratings.</p><p>When the housing market collapsed, the value of these securities plummeted \u2014 and because they were backed by such large, diverse pools of mortgages, they became extremely hard to value accurately. Many institutions, unsure exactly what they held, tried to sell these securities simultaneously, and that 'rush to the exit' pushed prices down even further, deepening the crisis. In the aftermath, many have pushed to reform the securitization business, and rating agencies have faced sharp criticism for having routinely assigned high credit ratings to securities that, in hindsight, were extremely risky.</p></div>"}], "2.2": [{"heading": "Physical location exchanges (Sections 2-4, 2-4A)", "html": "<p><span class='term' data-cid='ch2-physical-location-exchanges'>Physical location exchanges</span> like the NYSE are tangible entities with a real trading floor, a governing board, and a limited number of trading licenses (auctioned to member firms for roughly $50,000 a year). They function as auction markets: brokers bring buy and sell orders together, and <span class='term' data-cid='ch2-specialist'>specialists</span> keep an inventory of specific stocks to keep supply and demand in balance, quoting a bid price (what they'll pay) and an ask price (what they'll sell for) \u2014 the gap between the two, the bid-ask spread, is their profit margin.</p><p>Technology has pushed exchanges to globalize aggressively. <span class='term' data-cid='ch2-electronic-communications-network-ecn'>Electronic communications networks (ECNs)</span> let investors trade around the clock, bypassing the NYSE and NASDAQ entirely \u2014 which pushed both exchanges to go public themselves so they could use their own stock to acquire ECNs and rival exchanges worldwide (NASDAQ bought a stake in the London Stock Exchange; NYSE merged with Euronext and was later bought by the Intercontinental Exchange).</p>"}, {"heading": "Over-the-counter markets and NASDAQ (Section 2-4B)", "html": "<p>Not every stock trades on a physical floor. The <span class='term' data-cid='ch2-over-the-counter-otc-market'>over-the-counter (OTC) market</span> \u2014 today called a <span class='term' data-cid='ch2-dealer-market'>dealer market</span> \u2014 covers everything else: dealers who hold inventory and 'make a market' in a stock, brokers who connect dealers with investors, and the electronic networks linking them. <span class='term' data-cid='ch2-finra'>FINRA</span> (the Financial Industry Regulatory Authority) oversees these dealers and brokers, and <span class='term' data-cid='ch2-nasdaq'>NASDAQ</span> (its computerized quotation system) has grown from a simple price board into a full organized market with its own listing standards \u2014 one that many large tech companies (Microsoft, Alphabet, Intel) stick with even though they'd qualify for the NYSE.</p>"}, {"heading": "Closely held vs. publicly owned stock, and how new shares reach the market (Sections 2-5, 2-5A)", "html": "<p>A <span class='term' data-cid='ch2-closely-held-corporation'>closely held corporation</span> is owned by a small number of people (often its own managers), while a <span class='term' data-cid='ch2-publicly-owned-corporation'>publicly owned corporation</span> is owned by thousands of largely passive investors. Stock transactions fall into three types: trading of already-outstanding shares (the ordinary secondary market), a public company issuing additional new shares (a primary market transaction), and a private company selling shares to the public for the very first time \u2014 an <span class='term' data-cid='ch2-initial-public-offering-ipo'>initial public offering (IPO)</span>, or 'going public.'</p><div class='example'><span class='example-label'>IPOs don't always behave the way you'd expect</span>Google's 2004 IPO priced at $85/share using a <span class='term' data-cid='ch2-dutch-auction'>Dutch auction</span> (where the price is set at whatever level clears all the offered shares) \u2014 its parent Alphabet later traded above $1,160. Facebook's 2012 IPO, by contrast, priced at $38 and fell below $18 within months before eventually recovering, while Twitter's IPO generated a lot of first-day buzz but then languished for years. Spotify took a different route entirely in 2018, using a <span class='term' data-cid='ch2-direct-listing'>direct listing</span> \u2014 selling only existing shareholders' stock with no new shares issued, meaning the company itself raised no new capital at all.</div>"}], "2.3": [{"heading": "Reading a stock quote (Sections 2-6, 2-6A)", "html": "<p>A basic online stock quote packs in a lot: the current market price and how much it's changed since the previous close, the day's trading range and the 52-week range, trading volume versus the recent average, the bid and ask prices dealers are quoting, the stock's total market capitalization, its P/E ratio (price divided by trailing 12-month earnings), its beta (volatility relative to the overall market), and analysts' 1-year price target.</p><div class='example'><span class='example-label'>Concrete example \u2014 Twitter, March 27, 2020</span>Twitter traded around $24.98, down from a $26.41 prior close, inside a 52-week range of $20.00\u2013$45.86. Its beta of 0.37 meant it moved only about 40% as much as the overall market; its P/E was 13.41 on trailing EPS of $1.87; and it paid no dividend at all.</div>"}, {"heading": "Expected returns vs. what actually happens (Section 2-6B)", "html": "<p>An investor's expected return on a stock is always positive going in \u2014 otherwise nobody would buy it \u2014 but realized returns can and do go negative. The S&P 500's total return was negative in 11 of the 52 years from 1968\u20132019, including three straight losing years from 2000\u20132002, even though the long-run trend has clearly been upward.</p><p>The three leading U.S. benchmarks each measure something different: the <span class='term' data-cid='ch2-dow-jones-industrial-average-djia'>Dow Jones Industrial Average (DJIA)</span> tracks just 30 large, widely held companies; the <span class='term' data-cid='ch2-s-p-500-index'>S&P 500 Index</span> is weighted by market value across 500 leading companies and is the most commonly used benchmark for the broad U.S. market; and the <span class='term' data-cid='ch2-nasdaq-composite-index'>NASDAQ Composite Index</span> covers roughly 3,300 NASDAQ-listed companies and is treated as a proxy for the tech sector, since just five companies (Apple, Microsoft, Amazon, Facebook, and Google/Alphabet) make up close to 40% of its value. Over the 25 years through January 2020, annualized returns ranged from about 8.1% (S&P 500) to 10.5% (NASDAQ) \u2014 all comfortably ahead of short-term Treasury bills over the same stretch.</p>"}], "2.4": [{"heading": "Defining an efficient market (Section 2-7)", "html": "<p>Four concepts anchor this discussion: a stock's <span class='term' data-cid='ch2-market-price-stock-market-context'>market price</span> is simply its current trading price; its <span class='term' data-cid='ch2-intrinsic-value-stock-market-context'>intrinsic value</span> (introduced in Chapter 1) is what it would sell for if every investor had all knowable information; its <span class='term' data-cid='ch2-equilibrium-price'>equilibrium price</span> balances buy and sell orders at a given moment; and a market is called <span class='term' data-cid='ch2-efficient-market'>efficient</span> when prices stay close to intrinsic values and stocks are generally in equilibrium. The formal <span class='term' data-cid='ch2-efficient-markets-hypothesis-emh'>efficient markets hypothesis (EMH)</span> comes in three flavors: <em>weak form</em> (past price patterns can't predict future prices), <em>semi-strong form</em> (all public information is already reflected in price), and <em>strong form</em> (not even company insiders can consistently beat the market).</p>"}, {"heading": "The case for \u2014 and against \u2014 efficient markets (Section 2-7, cont.)", "html": "<p>The case for efficiency: roughly 100,000 highly trained analysts (many with advanced technical degrees) follow a universe of under 3,000 major stocks, backed by institutions and billionaire investors with the capital to instantly exploit any bargain, while SEC disclosure rules mean new information reaches everyone at roughly the same time. Fittingly, the 2013 Nobel Prize in Economics went jointly to Eugene Fama (a pioneer of efficient-market theory), Robert Shiller (one of its most prominent skeptics), and Lars Hansen \u2014 a sign that both camps have serious empirical support.</p><p>The case against full efficiency draws on real anomalies: the May 2010 'flash crash,' where the Dow fell nearly 1,000 points and then rebounded the same day with no real news to justify it; the 2000 collapse of internet stock prices with little corresponding news; and investors like Warren Buffett who have beaten the market consistently over long periods, which shouldn't be possible if prices were always exactly right. The chapter resolves this with an <span class='term' data-cid='ch2-efficiency-continuum'>efficiency continuum</span>: large, heavily followed companies with strong investor communications tend to be priced efficiently, while small, thinly followed companies are more likely to be mispriced \u2014 creating room for <span class='term' data-cid='ch2-arbitrage'>arbitrage</span>, buying low and reselling higher.</p>"}, {"heading": "What market efficiency means for how you invest (Section 2-7B)", "html": "<p>If markets really are efficient, actively hunting for underpriced stocks is largely a waste of time for most investors \u2014 buying a low-cost index fund is the better bet. But investors managing very large sums may still profit from small mispricings that are meaningless at a small scale, and markets for entire companies (as opposed to individual shares) may be less efficient \u2014 which is exactly the opportunity private equity firms are built to exploit. Whatever your view on efficiency, the chapter's practical bottom line is the same: hold a diversified portfolio across industries and asset types rather than betting heavily on any one stock.</p>"}], "2.5": [{"heading": "Why behavioral finance emerged as a challenge to the EMH (Section 2-7A)", "html": "<p>The efficient markets hypothesis assumes rational traders will quickly correct any mispricing \u2014 buying when a stock looks cheap, selling when it looks expensive. <span class='term' data-cid='ch2-behavioral-finance'>Behavioral finance</span>, pioneered by psychologists Daniel Kahneman and Amos Tversky along with economist Richard Thaler, argues that real investor behavior often isn't rational, and that irrational mispricings can persist far longer than classical theory predicts.</p>"}, {"heading": "Two arguments behind the behavioral critique (Section 2-7A, cont.)", "html": "<p>First, exploiting a mispriced asset is often genuinely risky: a trader who correctly believes a stock is underpriced may still avoid buying it for fear the price stays artificially low for a long time \u2014 and during the dot-com bubble, plenty of traders who correctly believed prices were too high lost money short-selling before the eventual crash, because prices climbed even higher first. This is sometimes called the <span class='term' data-cid='ch2-limits-to-arbitrage'>limits to arbitrage</span> problem.</p><p>Second, psychology itself creates the mispricing in the first place. People tend to treat gains and losses asymmetrically \u2014 preferring a certain $500 over a coin flip for $1,000, but preferring to gamble when the alternative is a certain $500 <em>loss</em> \u2014 and traders who are already ahead tend to take on more risk than those who are behind. Add to this <span class='term' data-cid='ch2-self-attribution-bias'>self-attribution bias</span> (crediting your own skill for wins while blaming bad luck for losses) and <span class='term' data-cid='ch2-hindsight-bias'>hindsight bias</span> (believing after the fact that you 'saw it coming'), and the result is chronic <span class='term'>overconfidence</span> \u2014 the same overconfidence researchers have separately linked to excessive trading among individual investors and to overly optimistic capital-investment decisions by corporate managers.</p><div class='example'><span class='example-label'>A number worth remembering</span>Studies find that upward of 90% of people rate themselves as above-average drivers \u2014 a statistical impossibility that illustrates just how pervasive overconfidence bias really is.</div>"}], "3.1": [{"heading": "The annual report and the four financial statements (Section 3-1)", "html": "<p>The <span class='term' data-cid='ch3-annual-report'>annual report</span> is the most important document a corporation issues to its stockholders. It has two parts: a verbal section (often a letter from the chairperson explaining the year's results and future plans) and four <span class='term'>financial statements</span>: the <span class='term' data-cid='ch3-balance-sheet'>balance sheet</span> (what the firm owns and who has claims on it, as of one specific date), the <span class='term' data-cid='ch3-income-statement'>income statement</span> (sales, costs, and profit over a period of time), the <span class='term' data-cid='ch3-statement-of-cash-flows'>statement of cash flows</span> (how the firm's cash balance changed and why), and the <span class='term' data-cid='ch3-statement-of-stockholders-equity'>statement of stockholders' equity</span> (how and why equity changed during the year). All four are interrelated \u2014 for example, net income flows from the income statement into retained earnings on the balance sheet.</p><div class='example'><span class='example-label'>Concrete example \u2014 reading McDonald's at a glance</span>McDonald's fourth-quarter 2019 report showed U.S. same-store sales up 5.1% even though customer visits fell 1.9% (price increases and strong menu items made up the difference). Its year-end balance sheet showed $47.5 billion in total assets against $55.72 billion in total liabilities \u2014 meaning book equity was actually negative. Its cash flow statement showed $8.12 billion generated from operations, about $3 billion used for investing (including new kiosk technology), and nearly $5 billion used for financing (mostly dividends and share buybacks) \u2014 netting out to a $32.5 million increase in cash for the year.</div>"}, {"heading": "The balance sheet: assets, liabilities, and equity (Section 3-2)", "html": "<p>The balance sheet is a financial <em>snapshot</em> at one point in time. Assets split into <span class='term' data-cid='ch3-current-assets-working-capital'>current assets</span> (cash, accounts receivable, inventory \u2014 convertible to cash within a year) and long-term/fixed assets (plant and equipment, reported net of depreciation). Claims against those assets split into <span class='term'>current liabilities</span> (accounts payable, accruals, notes payable \u2014 due within a year), long-term debt, and stockholders' equity.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 stockholders' equity, two equivalent ways to see it</span><div class='formula-eq'>Stockholders' Equity = Paid-in Capital + Retained Earnings</div><div class='formula-eq'>Stockholders' Equity = Total Assets \u2212 Total Liabilities</div><div class='formula-vars'><div><strong>Paid-in capital</strong> = what stockholders originally paid the company for their shares</div><div><strong>Retained earnings</strong> = the cumulative total of every dollar of earnings the company has kept (not paid out as dividends) since it was founded \u2014 not just the latest year's earnings</div></div></div><p>Because equity is a <em>residual</em> claim (total assets minus total liabilities), stockholders absorb the full impact of both good and bad management decisions \u2014 if an asset's value drops, liabilities don't change, so equity must absorb the entire loss. That's exactly why common stock is riskier than bonds, but also why the rewards from good decisions flow to stockholders too.</p>"}, {"heading": "Reading a real balance sheet \u2014 Allied Food Products (Section 3-2A)", "html": "<p>Before looking at any formulas, let's establish what this table actually is. <b>Table 3.1 is Allied Food Products' balance sheet</b> \u2014 a snapshot of what the company owned and who had claims on those assets, on one specific date (December 31), shown side-by-side for 2021 and 2020 so you can see what changed. Every formula in this section (NWC, NOWC, total debt, book value per share) and in Chapter 4's ratio calculations pulls its inputs directly from the rows of this one table, so it's worth reading it closely once, right now, before the formulas start.</p><p class='small-muted'>Each account below has its own color, and that color follows the number wherever it's used later \u2014 in a formula, in a calculation, anywhere. A <b>solid border</b> always means a 2021 value; a <b>dashed border</b> always means 2020. A <b>green box</b> always means a number that was calculated, not pulled directly from the table.</p><table class='bs-table'><caption>Table 3.1 \u2014 Allied Food Products: Balance Sheets, December 31 (Millions of Dollars)</caption><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets: <span class='tbl-annot'>often called \u201cworking capital\u201d in this textbook \u2014 see Key Concept below</span></td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents <span class='tbl-annot'>actual spendable money</span></td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable <span class='tbl-annot'>credit sales not yet collected</span></td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories <span class='tbl-annot'>raw materials, work in process, finished goods</span></td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment <span class='tbl-annot'>cost of buildings/equipment used in operations, minus depreciation taken on them</span></td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable <span class='tbl-annot'>supplier credit \u2014 effectively short-term financing from suppliers, see Key Concept below</span></td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals <span class='tbl-annot'>wages/taxes owed but not yet paid</span></td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable <span class='tbl-annot'>short-term, interest-bearing bank borrowing</span></td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings <span class='tbl-annot'>accumulated earnings kept in the business, not paid out as dividends</span></td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table><p><b>What should you notice, reading across this table?</b></p><ul><li>Cash fell sharply, from $80 million to $10 million.</li><li>Accounts receivable rose from $315 million to $375 million.</li><li>Inventories rose from $415 million to $615 million.</li><li>Total current assets rose from $810 million to $1,000 million.</li><li>Long-term bonds rose from $580 million to $750 million \u2014 Allied borrowed a lot of new long-term debt this year.</li><li>Retained earnings rose from $750 million to $810 million, since the company was still profitable.</li><li>Total assets rose by exactly the same amount as total liabilities and equity \u2014 <b>$320 million each</b> \u2014 because a balance sheet must always balance: every dollar of assets has to be claimed by either a creditor or a stockholder.</li></ul><p><b>Why do these observations matter?</b> Read together, they tell a specific story: Allied grew its assets substantially in 2021, but it paid for that growth mostly by borrowing (both short-term notes payable and long-term bonds rose) and by letting its cash cushion shrink to almost nothing \u2014 not by generating enough cash internally. That combination (rapid growth, rising debt, thin cash) is exactly the kind of pattern the ratio analysis in Chapter 4 is built to flag, so keep it in mind.</p><p><b>2021 Total Assets</b> = <span class='src-box ln-ta y2021'>$2,000</span> million<br><b>2020 Total Assets</b> = <span class='src-box ln-ta y2020'>$1,680</span> million</p><p><b>Change in Total Assets:</b><br><span class='src-box ln-ta y2021'>$2,000</span> \u2212 <span class='src-box ln-ta y2020'>$1,680</span> = <span class='src-box calc-result'>$320 million</span></p><p>Allied's total assets increased by $320 million between 2020 and 2021. If you trace the other side of the table the same way \u2014 <span class='src-box ln-tle y2021'>$2,000</span> total liabilities and equity minus <span class='src-box ln-tle y2020'>$1,680</span> \u2014 you get the exact same <span class='src-box calc-result'>$320 million</span>. That's not a coincidence; it's the balance sheet identity holding: Total Assets = Total Liabilities + Total Equity, in every year, without exception. Notice that Total Assets and Total Liabilities &amp; Equity share the same cyan color in this app \u2014 that's deliberate, since by definition they're always equal.</p><div class='key-concept'><span class='kc-label'>Key Concept \u2014 Cash versus other assets</span><p>Although assets are reported in dollar terms, only the <b>Cash and equivalents</b> account (<span class='src-box ln-cash y2021'>$10</span> in the table above) represents actual spendable money. <b>Accounts receivable</b> represent credit sales that have not yet been collected. <b>Inventories</b> show the cost of raw materials, work in process, and finished goods. <b>Net fixed assets</b> represent the cost of the buildings and equipment used in operations, minus the depreciation that has been taken on these assets.</p><p>At the end of 2021, Allied has $10 million of cash; hence, it could write checks totaling that amount. The noncash assets should generate cash over time, but they do not represent cash in hand. And the cash they would bring in if they were sold today could be higher or lower than the values reported on the balance sheet.</p></div><div class='key-concept'><span class='kc-label'>Key Concept \u2014 Working capital</span><p><span class='term' data-cid='ch3-current-assets-working-capital'>Current assets</span> are often called <b>working capital</b> because these assets \u201cturn over\u201d \u2014 that is, they are used and then replaced throughout the year. When Allied buys inventory items on credit, its suppliers, in effect, lend it the money used to finance the inventory items. Allied could have borrowed from its bank or sold stock to obtain the money, but it received the funds from its suppliers. These loans are shown as <b>accounts payable</b> (<span class='src-box ln-ap y2021'>$60</span> in the table above).</p></div><div class='key-concept'><span class='kc-label'>Key Concept \u2014 Other sources of funds</span><p>Notes payable, accounts payable, accruals, long-term bonds, and common equity aren't the only way companies finance themselves. Many firms also use \u2018hybrid\u2019 securities that blend features of debt and equity: <span class='term' data-cid='ch3-preferred-stock'>preferred stock</span> pays a fixed amount each year like a bond, but skipping that payment doesn't trigger bankruptcy the way skipping a bond payment would. Convertible bonds are debt instruments that give the lender the right to exchange them for shares of common stock later on. If a firm using preferred stock ever went bankrupt, the payout order matters: bondholders get paid first, preferred stockholders next, and common stockholders only receive whatever is left over \u2014 which is why preferred stock sits on the balance sheet between total debt and common stock, and why there's no single rule for whether to treat it as debt or as equity when calculating ratios.</p></div><div class='key-concept'><span class='kc-label'>Key Concept \u2014 Depreciation</span><p>Most companies actually keep two separate sets of books: one following <span class='term' data-cid='ch3-depreciation'>GAAP</span> rules for the financial statements shown to investors, and a separate one following IRS rules to calculate the taxes actually owed. Firms typically choose straight-line depreciation for the investor-facing statements, since it reports higher near-term earnings than an accelerated method would. For tax purposes, though, faster write-offs are usually better, since they lower taxable income \u2014 and therefore lower taxes \u2014 sooner. Before the Tax Cuts and Jobs Act (TCJA), firms used <span class='term' data-cid='ch3-macrs-depreciation'>MACRS</span>, an accelerated depreciation method, for this purpose. Under the TCJA passed in 2017, firms can now immediately expense 100% of the cost of certain new and used assets (though this provision is scheduled to phase out over time). Allied, like many firms, actually uses its tax depreciation method for both sets of statements rather than keeping the two separate.</p></div><div class='key-concept'><span class='kc-label'>Key Concept \u2014 Market values versus book values</span><p>Companies report their balance sheets using GAAP, which generally means assets are carried at their historical cost minus accumulated depreciation \u2014 not at what they'd actually sell for today. Allied's own Chicago headquarters, purchased back in 1991, is a good example: after 26+ years of Chicago real-estate appreciation, its true market value is almost certainly well above what the balance sheet shows. The same book-versus-market gap shows up in Allied's stock: book value per share was <span class='src-box ln2-bvps y2021'>$12.53</span> at the end of 2021, but the market price was $23.06 \u2014 investors were willing to pay nearly double book value, partly because of inflation in asset values and partly because they expect Allied's future earnings to grow. This gap can run either direction. Apple, with very strong growth prospects, traded at more than 14 times its book value in early March 2020. Genworth Financial, a struggling insurer, traded around just $4.50 a share against a book value near $26 at that same moment \u2014 the market pricing in real doubts about its future.</p></div><div class='key-concept'><span class='kc-label'>Key Concept \u2014 Time dimension</span><p>A balance sheet is a snapshot of a firm's financial position at one specific instant \u2014 December 31, in Allied's case \u2014 not a video of the whole year. Allied's own numbers make the point: it had <span class='src-box ln-cash y2020'>$80 million</span> of cash on December 31, 2020, but that had fallen to just <span class='src-box ln-cash y2021'>$10 million</span> by December 31, 2021. The balance sheet is changing constantly in between those two snapshots, as inventory rises and falls and bank loans are drawn down or repaid. This matters even more for seasonal businesses: a firm like Allied typically holds low inventory right before harvest season and high inventory right after crops are processed, the same way most retailers carry high inventory (and, afterward, high receivables) right before and after the December holidays, and comparatively little the rest of the year. Chapter 4 picks this thread back up when comparing companies' financial statements and evaluating performance.</p></div><div class='formula-box'><span class='formula-label'>Formula \u2014 net working capital (NWC)</span><div class='formula-eq'>Net Working Capital = Total Current Assets \u2212 Total Current Liabilities</div><div class='formula-vars'><div><b>Meaning:</b> how much of a firm's current assets are financed by something other than short-term debt \u2014 the cushion left over once current liabilities are covered.</div></div><ol class='step-list'><li><b>Total current assets</b>: <span class='src-box ln-tca y2021'>$1,000</span> million.</li><li><b>Total current liabilities</b>: <span class='src-box ln-tcl y2021'>$310</span> million.</li><li><b>Calculation:</b> <span class='src-box ln-tca y2021'>$1,000</span> \u2212 <span class='src-box ln-tcl y2021'>$310</span> = <span class='src-box calc-result'>$690 million</span>.</li></ol><p><b>Interpretation:</b> Allied has $690 million more in current assets than it owes in current liabilities \u2014 a cushion of short-term resources beyond what's needed to cover short-term obligations.</p><div class='example'><span class='example-label'>Try it yourself with the 2020 column</span><span class='src-box ln-tca y2020'>$810</span> \u2212 <span class='src-box ln-tcl y2020'>$220</span> = <span class='src-box calc-result'>$590 million</span>. That's the practice question the textbook actually asks after this table.</div></div><p>Analysts often refine NWC into <span class='term' data-cid='ch3-net-operating-working-capital-nowc'>net operating working capital (NOWC)</span>, which strips out cash held for non-operating purposes and interest-bearing notes payable (since those are financing decisions, not operating ones):</p><div class='formula-box'><span class='formula-label'>Formula \u2014 net operating working capital (NOWC)</span><div class='formula-eq'>NOWC = (Current Assets \u2212 Excess Cash) \u2212 (Current Liabilities \u2212 Notes Payable)</div><div class='formula-vars'><div><b>Meaning:</b> the working capital actually tied up running day-to-day operations, with financing items (excess cash sitting idle, short-term bank debt) removed so it isolates operations from financing.</div></div><ol class='step-list'><li><b>Total current assets</b>: <span class='src-box ln-tca y2021'>$1,000</span>. Assume $0 is \u2018excess\u2019 (non-operating) cash, since Allied's <span class='src-box ln-cash y2021'>$10</span> cash balance is small \u2014 so <i>operating</i> current assets = <span class='src-box ln-tca y2021'>$1,000</span> \u2212 $0 = <span class='src-box calc-result'>$1,000</span>.</li><li><b>Notes payable</b>: <span class='src-box ln-np y2021'>$110</span>. This is interest-bearing financing, not an operating liability, so subtract it from Total current liabilities (<span class='src-box ln-tcl y2021'>$310</span>): <span class='src-box ln-tcl y2021'>$310</span> \u2212 <span class='src-box ln-np y2021'>$110</span> = <span class='src-box calc-result'>$200</span> in <i>operating</i> current liabilities.</li><li><b>Calculation:</b> <span class='src-box calc-result'>$1,000</span> \u2212 <span class='src-box calc-result'>$200</span> = <span class='src-box calc-result'>$800 million</span>.</li></ol><p><b>Interpretation:</b> stripping out financing effects, Allied has $800 million genuinely tied up in operating working capital \u2014 this is the number Chapter 3's free cash flow formula actually needs (not the simpler NWC figure).</p><div class='example'><span class='example-label'>Try it yourself with the 2020 column</span>Operating current assets = <span class='src-box ln-tca y2020'>$810</span> \u2212 $0 = $810. Operating current liabilities = <span class='src-box ln-tcl y2020'>$220</span> \u2212 <span class='src-box ln-np y2020'>$60</span> = $160. NOWC = $810 \u2212 $160 = <span class='src-box calc-result'>$650 million</span> \u2014 this is the exact 2020 figure the Free Cash Flow calculation in the next section needs.</div></div><p>One assumption is doing real work in that NOWC calculation: since Allied's 2021 cash balance (<span class='src-box ln-cash y2021'>$10 million</span>) is fairly small, the formula above assumes all of it is held for operating purposes \u2014 none of it is treated as \u2018excess\u2019 cash sitting idle. If instead you assumed that entire <span class='src-box ln-cash y2021'>$10 million</span> was excess (non-operating) cash, it would get subtracted from current assets, and NOWC would come out to <span class='src-box calc-result'>$790 million</span> instead of the <span class='src-box calc-result'>$800 million</span> calculated above. For Allied that $10 million difference barely matters. But the assumption becomes critical for cash-rich companies: at the end of 2019, both Alphabet and Apple were each sitting on more than $100 billion in cash and short-term investments, and whether that's treated as operating or excess cash swings their NOWC by a huge amount. Whenever it matters, this app will tell you which assumption is being made.</p><p>The chapter also distinguishes <span class='term' data-cid='ch3-total-debt'>total debt</span> (only interest-bearing borrowing) from <span class='term' data-cid='ch3-total-liabilities'>total liabilities</span> (debt plus the \u2018free,\u2019 non-interest-bearing liabilities like accounts payable and accruals):</p><div class='formula-box'><span class='formula-label'>Formula \u2014 total debt vs. total liabilities</span><div class='formula-eq'>Total Debt = Notes Payable + Long-Term Bonds</div><div class='formula-eq'>Total Liabilities = Total Debt + Accounts Payable + Accruals</div><ol class='step-list'><li><b>Notes payable</b> (<span class='src-box ln-np y2021'>$110</span>) + <b>Long-term bonds</b> (<span class='src-box ln-ltb y2021'>$750</span>) = <span class='src-box calc-result'>$860 million</span> Total Debt.</li><li><b>Accounts payable</b>: <span class='src-box ln-ap y2021'>$60</span>. <b>Accruals</b>: <span class='src-box ln-accr y2021'>$140</span>. These are \u2018free\u2019 liabilities \u2014 no interest charged.</li><li>Total Liabilities = <span class='src-box calc-result'>$860</span> + <span class='src-box ln-ap y2021'>$60</span> + <span class='src-box ln-accr y2021'>$140</span> = <span class='src-box ln-tl y2021'>$1,060</span> \u2014 matching the table's own \u201cTotal liabilities\u201d row exactly (same slate-blue color), which is a good way to check your work.</li></ol></div><div class='example'><span class='example-label'>Quick Question \u2014 2020 total debt</span>Total Debt<sub>2020</sub> = Short-term debt + Long-term debt = <span class='src-box ln-np y2020'>$60</span> + <span class='src-box ln-ltb y2020'>$580</span> = <strong><span class='src-box calc-result'>$640 million</span></strong>.</div><div class='formula-box'><span class='formula-label'>Formula \u2014 book value per share</span><div class='formula-eq'>Book Value per Share = Total Common Equity \u00f7 Shares Outstanding</div><ol class='step-list'><li><b>Total common equity</b>: <span class='src-box ln-tce y2021'>$940</span> million.</li><li><b>Shares outstanding</b> (from the table header): 75,000,000 shares, or 75 million.</li><li><span class='src-box ln-tce y2021'>$940M</span> \u00f7 75M shares = <span class='src-box calc-result'>$12.53 per share</span>.</li></ol><div class='example'><span class='example-label'>Why this matters</span>Allied's stock actually traded at $23.06 \u2014 almost double its $12.53 book value \u2014 because investors were paying for expected future growth, not just what's on the books today. That gap can run either way: in early 2020 Apple traded at more than 14\u00d7 its book value on strong growth prospects, while struggling insurer Genworth Financial traded around $4.50/share against a book value near $26, with the market pricing in real doubts about its future.</div></div><div class='recap-block'><h4>What you need to understand</h4><ul><li>Why the balance sheet must always balance (Assets = Liabilities + Equity), and what it means when both sides change by the same amount.</li><li>Why cash is treated differently from every other asset on the balance sheet.</li><li>Why accounts payable functions as a form of financing, not just a bill owed.</li></ul><h4>What you need to remember</h4><ul><li>NWC = Current Assets \u2212 Current Liabilities. NOWC additionally removes excess cash and notes payable.</li><li>Total Debt = only interest-bearing debt (notes payable + long-term bonds). Total Liabilities = Total Debt + accounts payable + accruals.</li></ul><h4>What you need to be able to calculate</h4><ul><li>NWC, NOWC, Total Debt, Total Liabilities, and Book Value per Share, given a balance sheet you haven't seen before.</li></ul><h4>What you need to be able to identify in a financial statement</h4><ul><li>Which balance sheet lines are current vs. long-term, and which liabilities are interest-bearing (debt) vs. \u2018free\u2019 financing (payables, accruals).</li></ul><h4>Common confusions</h4><ul><li>Confusing NWC with NOWC \u2014 remember NOWC removes notes payable and excess cash; NWC does not.</li><li>Assuming \u201ctotal liabilities\u201d and \u201ctotal debt\u201d mean the same thing \u2014 they don't; total liabilities is the larger number.</li></ul><h4>Possible exam question</h4><ul><li>\u201cGiven this balance sheet, calculate the firm's NWC, NOWC, and total debt-to-total-liabilities gap, and explain in one sentence what each number tells a lender.\u201d</li></ul></div>"}, {"heading": "The income statement: sales, profit, and the 'bottom line' (Section 3-3)", "html": "<p>Before the formulas, here's what you're looking at: <b>Table 3.2 is Allied Food Products' income statement</b> \u2014 unlike the balance sheet's single-moment snapshot, this covers an entire period (the 2021 and 2020 calendar years), working down from sales through costs to what's left over for stockholders.</p><table class='bs-table'><caption>Table 3.2 \u2014 Allied Food Products: Income Statements (Millions of Dollars, Except Per-Share Data)</caption><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td style='padding-left:28px;'>Operating costs except depreciation and amortization <span class='tbl-annot'>includes cost of goods sold, operating expenses, and overhead; COGS alone is 70% of net sales, or $2,100 million in 2021</span></td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td style='padding-left:28px;'>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income, or EBIT <span class='tbl-annot'>earnings before interest and taxes</span></td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td style='padding-left:28px;'>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td style='padding-left:28px;'>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr class='bs-section'><td colspan='3'>Related items</td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>$86.3</span></td><td><span class='src-box ln2-div y2020'>$79.5</span></td></tr><tr><td>Addition to retained earnings <span class='tbl-annot'>Net income minus total dividends</span></td><td><span class='src-box ln2-addre y2021'>$60.0</span></td><td><span class='src-box ln2-addre y2020'>$72.8</span></td></tr><tr class='bs-section'><td colspan='3'>Per-share data</td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p><b>What should you notice?</b> Net income actually fell from 2020 to 2021 ($152.3M \u2192 $146.3M) even though sales grew \u2014 mainly because interest expense jumped from $60M to $83M as Allied took on more debt, and operating costs grew roughly in step with sales. EPS fell for the same reason ($2.03 \u2192 $1.95), and so did the stock price ($26.00 \u2192 $23.06). Meanwhile book value per share still edged up ($11.73 \u2192 $12.53), since retained earnings kept growing even in a weaker year. Allied has 75 million shares outstanding in both years, so every per-share figure above is simply the dollar total divided by 75 million.</p><p>The income statement covers a <em>period</em> of time (unlike the balance sheet's single-date snapshot), working from net sales down through operating costs to <span class='term'>net income</span>. <span class='term' data-cid='ch3-earnings-per-share-eps'>Earnings per share (EPS)</span> is often called 'the bottom line' since it's what stockholders watch most closely.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 EPS, DPS, and book value per share</span><div class='formula-eq'>EPS = Net Income \u00f7 Shares Outstanding &nbsp;|&nbsp; DPS = Dividends Paid \u00f7 Shares Outstanding</div><div class='example'><span class='example-label'>Worked example \u2014 Allied, 2021</span>EPS = <span class='src-box ln2-ni y2021'>$146.3M</span> \u00f7 <span class='src-box ln2-shares y2021'>75M</span> shares = <strong><span class='src-box ln2-eps y2021'>$1.95</span></strong>. DPS = <span class='src-box ln2-div y2021'>$86.3M</span> \u00f7 <span class='src-box ln2-shares y2021'>75M</span> shares = <strong><span class='src-box ln2-dps y2021'>$1.15</span></strong> (up from <span class='src-box ln2-dps y2020'>$1.06</span> in 2020, even though EPS fell from <span class='src-box ln2-eps y2020'>$2.03</span>).</div></div><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>Analysts usually look past net income to <span class='term' data-cid='ch3-operating-income-ebit'>operating income</span> (also called <span class='term' data-cid='ch3-operating-income-ebit'>EBIT</span>, earnings before interest and taxes), because it strips out financing choices (interest) and tax situations that can make two operationally identical companies report very different net incomes.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 operating income (EBIT)</span><div class='formula-eq'>EBIT = Sales Revenue \u2212 Operating Costs</div><div class='example'><span class='example-label'>Worked example \u2014 Allied, 2021</span>EBIT = <span class='src-box ln2-sales y2021'>$3,000M</span> \u2212 <span class='src-box ln2-toc y2021'>$2,722M</span> = <strong><span class='src-box ln2-ebit y2021'>$278 million</span></strong> (up from <span class='src-box ln2-ebit y2020'>$263M</span> in 2020) \u2014 yet net income still fell, because a <span class='src-box calc-result'>$23M jump</span> in interest expense (from more debt) ate into the gain.</div></div><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p><span class='term' data-cid='ch3-depreciation'>Depreciation</span> (the write-off of tangible asset costs over time) and <span class='term' data-cid='ch3-amortization'>amortization</span> (the same idea for intangible assets like patents and goodwill) are both non-cash charges \u2014 no cash actually leaves the company when they're recorded. That's why analysts also compute <span class='term' data-cid='ch3-ebitda'>EBITDA</span> (earnings before interest, taxes, depreciation, and amortization) when they want a cleaner read on the cash a company's operations are generating: Allied's 2021 EBITDA was EBIT (<span class='src-box ln2-ebit y2021'>$278M</span>) + depreciation (<span class='src-box ln2-dep y2021'>$100M</span>) = <strong><span class='src-box calc-result'>$378 million</span></strong>.</p>"}, {"heading": "The statement of cash flows (Section 3-4)", "html": "<p>Net income isn't cash \u2014 and in finance, 'cash is king,' since a share's value depends on the cash flows it generates, not on accounting profit. The <span class='term' data-cid='ch3-statement-of-cash-flows'>statement of cash flows</span> explains the gap between the two, organized into four parts: <b>operating activities</b> (net income, plus non-cash add-backs like depreciation, plus or minus changes in working-capital accounts), <b>investing activities</b> (spending on or selling long-term assets), <b>financing activities</b> (borrowing, repaying debt, issuing stock, paying dividends), and a <b>summary</b> that ties the net change in cash back to the beginning and ending cash balances on the balance sheet.</p><p><b>What am I looking at?</b> Table 3.3 is Allied's actual statement of cash flows for 2021 \u2014 it takes the same net income figure from Table 3.2 and walks it through exactly which activities turned that accounting profit into a real $70 million net <i>decrease</i> in the company's cash.</p><table class='bs-table'><caption>Table 3.3 \u2014 Allied Food Products: Statement of Cash Flows for 2021 (Millions of Dollars)</caption><thead><tr><th>&nbsp;</th><th>2021</th></tr></thead><tbody><tr class='bs-section'><td colspan='2'>I. Operating Activities</td></tr><tr><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td></tr><tr><td>Depreciation and amortization <span class='tbl-annot'>added back \u2014 it reduced net income but never actually cost any cash</span></td><td><span class='src-box ln2-dep y2021'>100.0</span></td></tr><tr><td>Increase in inventories <span class='tbl-annot'>a use of cash \u2014 buying inventory ties up cash</span></td><td><span class='src-box ln3-invchg y2021'>(200.0)</span></td></tr><tr><td>Increase in accounts receivable <span class='tbl-annot'>a use of cash \u2014 sales made on credit, not yet collected</span></td><td><span class='src-box ln3-archg y2021'>(60.0)</span></td></tr><tr><td>Increase in accounts payable <span class='tbl-annot'>a source of cash \u2014 suppliers financed part of the inventory purchase</span></td><td><span class='src-box ln3-apchg y2021'>30.0</span></td></tr><tr><td>Increase in accrued wages and taxes <span class='tbl-annot'>a source of cash \u2014 employees/tax authorities effectively lent Allied this amount</span></td><td><span class='src-box ln3-accrchg y2021'>10.0</span></td></tr><tr class='bs-total'><td>Net cash provided by (used in) operating activities</td><td><span class='src-box calc-result'>$26.3</span></td></tr><tr class='bs-section'><td colspan='2'>II. Investing Activities</td></tr><tr><td>Additions to property, plant, and equipment</td><td><span class='src-box ln3-capex y2021'>($230.0)</span></td></tr><tr class='bs-total'><td>Net cash used in investing activities</td><td><span class='src-box calc-result'>($230.0)</span></td></tr><tr class='bs-section'><td colspan='2'>III. Financing Activities</td></tr><tr><td>Increase in notes payable</td><td><span class='src-box ln3-npchg y2021'>$50.0</span></td></tr><tr><td>Increase in bonds</td><td><span class='src-box ln3-bondschg y2021'>170.0</span></td></tr><tr><td>Payment of dividends to stockholders</td><td><span class='src-box ln2-div y2021'>(86.3)</span></td></tr><tr class='bs-total'><td>Net cash provided by financing activities</td><td><span class='src-box calc-result'>$133.8</span></td></tr><tr class='bs-section'><td colspan='2'>IV. Summary</td></tr><tr><td>Net decrease in cash (net sum of I, II, and III)</td><td><span class='src-box calc-result'>($70.0)</span></td></tr><tr><td>Cash and equivalents at the beginning of the year</td><td><span class='src-box ln-cash y2020'>80.0</span></td></tr><tr class='bs-total'><td>Cash and equivalents at the end of the year</td><td><span class='src-box ln-cash y2021'>$10.0</span></td></tr></tbody></table><p><b>What should you notice?</b> Every number here reconciles back to Tables 3.1 and 3.2: the $200M inventory increase is exactly Table 3.1's inventories rising from $415M to $615M; the $60M receivables increase is exactly $375M \u2212 $315M; the $30M payables increase is exactly $60M \u2212 $30M; the $50M notes payable increase and $170M bonds increase match Table 3.1's debt changes exactly; and the ending cash of $10M is precisely Table 3.1's 2021 cash balance, starting from precisely its 2020 balance of $80M. This is exactly the point of the statement \u2014 it's not a new, disconnected set of numbers, it's an explanation of how the OTHER two statements' cash balance actually got from one year to the next.</p><div class='recap-block'><h4>What each line means</h4><ul><li><b>Net income</b> is the starting point \u2014 the first source of cash \u2014 but it only equals actual cash generated if every sale were for cash and every cost were paid immediately, which isn't true in the real world, so the rest of the statement makes the necessary adjustments.</li><li><b>Depreciation and amortization</b> gets added back because it reduced net income on paper without ever costing Allied any actual cash.</li><li><b>Increases in inventories or receivables</b> use cash: making or buying inventory, or selling on credit instead of for cash, both tie up money the firm hasn't gotten back yet. If Allied had reduced either instead, that would show as a positive (a source of cash).</li><li><b>Increases in payables or accruals</b> are the flip side \u2014 they represent free financing from suppliers, employees, and tax authorities, so a rising balance is actually a source of cash, not a use.</li><li><b>Investing activities</b> cover spending on (or proceeds from selling) long-term assets. Allied's only investing activity in 2021 was buying $230 million of new plant and equipment \u2014 an outflow, shown in parentheses. If Allied had sold equipment instead, that would show up as a positive inflow here.</li><li><b>Financing activities</b> cover borrowing, repaying, issuing stock, and paying dividends. Allied raised new financing three ways \u2014 $50M more in notes payable, $170M more in bonds \u2014 while paying out $86.3M in dividends, netting to a $133.8M inflow.</li><li><b>The summary</b> adds up all three sections: $26.3M (operating) \u2212 $230.0M (investing) + $133.8M (financing) = a $70.0M net <i>decrease</i> in cash, taking Allied from $80.0M at the start of 2021 down to $10.0M by year end.</li></ul><h4>Why this should concern Allied's managers and investors</h4><ul><li>Operating activities alone generated only $26.3 million \u2014 nowhere near enough to cover the $230 million spent on new plant and equipment. That gap had to be plugged by borrowing more and by drawing the cash balance down from $80M to $10M. That's a sustainable move for one year, but not indefinitely: going forward, Allied needs section I (operating cash flow) to grow substantially, or it needs section II's capital spending to roughly match what operations can actually fund on their own.</li></ul><h4>Possible exam question</h4><ul><li>\u201cGiven a balance sheet showing inventories rising and accounts payable rising, explain whether each change is a source or a use of cash on the statement of cash flows, and why.\u201d</li></ul></div>"}, {"heading": "Stockholders' equity, and the limits of financial statements (Sections 3-5, 3-6)", "html": "<p>Changes in stockholders' equity during the year are reported in the <span class='term' data-cid='ch3-statement-of-stockholders-equity'>statement of stockholders' equity</span>. It's the shortest of the four statements, but it answers a specific question: exactly how did retained earnings (and total equity) move from last year-end to this one?</p><table class='bs-table'><caption>Table 3.4 \u2014 Allied Food Products: Statement of Stockholders' Equity, December 31, 2021 (Millions of Dollars)</caption><thead><tr><th>&nbsp;</th><th>Shares (000)</th><th>Common Stock Amount</th><th>Retained Earnings</th><th>Total Stockholders' Equity</th></tr></thead><tbody><tr><td>Balances, December 31, 2020</td><td><span class='src-box ln2-shares y2020'>75,000</span></td><td><span class='src-box ln-cs y2020'>$130.0</span></td><td><span class='src-box ln-re y2020'>$750.0</span></td><td><span class='src-box ln-tce y2020'>$880.0</span></td></tr><tr><td>2021 Net income</td><td></td><td></td><td><span class='src-box ln2-ni y2021'>146.3</span></td><td><span class='src-box calc-result'>146.3</span></td></tr><tr><td>Cash dividends</td><td></td><td></td><td><span class='src-box ln2-div y2021'>(86.3)</span></td><td><span class='src-box calc-result'>(86.3)</span></td></tr><tr><td>Addition to retained earnings</td><td></td><td></td><td></td><td><span class='src-box ln2-addre y2021'>60.0</span></td></tr><tr class='bs-total'><td>Balances, December 31, 2021</td><td><span class='src-box ln2-shares y2021'>75,000</span></td><td><span class='src-box ln-cs y2021'>$130.0</span></td><td><span class='src-box ln-re y2021'>$810.0</span></td><td><span class='src-box ln-tce y2021'>$940.0</span></td></tr></tbody></table><p><b>What should you notice?</b> This table is really just one sentence turned into numbers: Allied earned <span class='src-box ln2-ni y2021'>$146.3 million</span> during 2021, paid out <span class='src-box ln2-div y2021'>$86.3 million</span> of it to stockholders as dividends, and kept (\u2018plowed back\u2019) the remaining <span class='src-box ln2-addre y2021'>$60 million</span> in the business. That $60 million is exactly why retained earnings on Table 3.1 climbed from $750 million at the end of 2020 to $810 million at the end of 2021 \u2014 and why total stockholders' equity climbed from $880 million to $940 million over the same year. Every number in this table is one you've already seen on Table 3.1 or Table 3.2; this statement's whole job is showing how they connect.</p><div class='key-concept'><span class='kc-label'>Key Concept \u2014 Retained earnings is a claim, not a pile of cash</span><p>It's tempting to picture 'retained earnings' as a stack of cash sitting somewhere in Allied's bank account, but that's not what it represents. It's a <i>claim against assets</i> \u2014 an accounting record of how much of the company's total assets belong to stockholders because the company chose to reinvest past profits rather than pay them all out as dividends. Management typically puts those retained earnings to work funding new plant and equipment, larger inventories, and similar investments \u2014 not leaving them idle as cash. That's exactly why Allied's own cash balance fell to just $10 million in 2021 even as its retained earnings kept climbing: the two numbers measure completely different things, and retained earnings are not literally 'available' to pay a dividend or cover any other cash need.</p></div><div class='recap-block'><h4>What you need to understand</h4><ul><li>Why retained earnings represents a claim on assets, not cash held in reserve.</li><li>Why this statement's ending balances must exactly match Table 3.1's retained earnings and total common equity for the same year.</li></ul><h4>What you need to remember</h4><ul><li>Addition to retained earnings = Net income \u2212 Dividends paid, and it flows directly into next year's retained earnings balance.</li></ul><h4>Common confusions</h4><ul><li>Assuming a firm with large retained earnings must be sitting on a large cash balance \u2014 it usually isn't; the earnings have typically already been reinvested in assets.</li></ul><h4>Possible exam question</h4><ul><li>\u201cExplain why a company with $810 million of retained earnings might still have only $10 million of cash on hand.\u201d</li></ul></div><p>Financial statements aren't infallible. Because <span class='term'>GAAP</span> (Generally Accepted Accounting Principles) still leaves managers real discretion \u2014 over inventory valuation methods, depreciation methods, and the timing of certain transactions \u2014 two companies in identical situations can report different-looking numbers, entirely legally. Watch out especially when executives are paid bonuses tied to short-term earnings, since that creates an incentive to manage the numbers. In the worst cases, companies cross the line into outright fraud: WorldCom overstated its asset values by roughly $11 billion to understate costs and inflate profits, while Enron overstated asset values and shuffled them into subsidiary companies to hide the truth \u2014 both collapsed into bankruptcy, sent executives to jail, and put their auditor out of business. The Sarbanes-Oxley Act of 2002 was Congress's direct response, requiring stronger internal auditing and CEO/CFO certification of the statements.</p>"}], "3.2": [{"heading": "Free cash flow: the formula (Section 3-7)", "html": "<p>Accounting statements are built for creditors and tax collectors, not managers and investors \u2014 so analysts adjust the numbers to get <span class='term' data-cid='ch3-free-cash-flow-fcf'>free cash flow (FCF)</span>: the cash a firm could withdraw without hurting its ability to keep operating and generating future cash flows.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 free cash flow</span><div class='formula-eq'>FCF = [EBIT \u00d7 (1 \u2212 T) + Depreciation &amp; Amortization] \u2212 [Capital Expenditures + \u0394NOWC]</div><div class='formula-vars'><div><strong>EBIT \u00d7 (1 \u2212 T)</strong> = <span class='term' data-cid='ch3-nopat'>NOPAT</span> (net operating profit after taxes) \u2014 the profit the firm would generate with no debt at all</div><div><strong>T</strong> = the firm's tax rate</div><div><strong>Capital expenditures</strong> = cash spent on new fixed assets (plant, equipment)</div><div><strong>\u0394NOWC</strong> = the change in net operating working capital from last year to this year \u2014 cash tied up to support growth</div></div></div><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></
