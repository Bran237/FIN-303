    const g = gameState; const item = g.items[g.index];
    const val = (document.getElementById('wai-guess').value||'').trim().toLowerCase();
    const correct = val === item.answer.toLowerCase();
    document.getElementById('wai-feedback').innerHTML = `<p style="color:${correct?'var(--good)':'var(--bad)'};">${correct?'Correct!':'Not quite — it was: '+item.answer}</p>`;
    if (correct) g.score++;
    g.index++; g.clueIdx = 0;
    setTimeout(render, 900);
  },
  ftgGuess(){
    const g = gameState; const item = g.items[g.index];
    const val = (document.getElementById('ftg-guess').value||'').trim().toLowerCase();
    const correct = val === item.answer.toLowerCase();
    document.getElementById('ftg-feedback').innerHTML = `<p style="color:${correct?'var(--good)':'var(--bad)'};">${correct?'Correct!':'Answer: '+item.answer}</p>`;
    if (correct) g.score++;
    g.index++;
    setTimeout(render, 900);
  },
  oiPick(el){ gameState.built.push(decodeURIComponent(el.dataset.step)); render(); },
  oiCheck(){
    const g = gameState; const item = g.items[g.index];
    const correct = JSON.stringify(g.built) === JSON.stringify(item.steps);
    document.getElementById('oi-feedback').innerHTML = `<p style="color:${correct?'var(--good)':'var(--bad)'};">${correct?'Correct order!':'Not quite — correct order: '+item.steps.join(' → ')}</p>`;
    if (correct) g.score++;
    g.index++;
    setTimeout(()=>{ setupOrderItRound(); render(); }, 1200);
  },
  ttAnswer(el){
    const g = gameState; const q = g.items[g.index];
    const correct = parseInt(el.dataset.idx,10) === q.correctIndex;
    document.getElementById('tt-feedback').innerHTML = `<p style="color:${correct?'var(--good)':'var(--bad)'};">${q.explanation}</p>`;
    if (correct) g.score++;
    g.index++;
    setTimeout(render, 1400);
  },
  sortPick(el){
    const g = gameState; const item = g.items[g.index];
    const correct = el.dataset.val === item.chapterId;
    document.getElementById('sort-feedback').innerHTML = `<p style="color:${correct?'var(--good)':'var(--bad)'};">${correct?'Correct!':'It belongs to '+CONTENT.chapters[item.chapterId].title}</p>`;
    if (correct) g.score++;
    g.index++;
    setTimeout(render, 900);
  },
  connAnswer(el){
    const g = gameState; const p = g.pairs[g.index];
    const correct = p.options[parseInt(el.dataset.idx,10)] === p.correct;
    document.getElementById('conn-feedback').innerHTML = `<p style="color:${correct?'var(--good)':'var(--bad)'};">${correct?'Correct!':'Best connection: '+p.correct}</p>`;
    if (correct) g.score++;
    g.index++;
    setTimeout(render, 1100);
  },
  scenAnswer(el){
    const g = gameState; const q = g.items[g.index];
    const correct = parseInt(el.dataset.idx,10) === q.correctIndex;
    document.getElementById('scen-feedback').innerHTML = `<p style="color:${correct?'var(--good)':'var(--bad)'};">${q.explanation}</p>`;
    if (correct) g.score++;
    g.index++;
    setTimeout(render, 1600);
  },

  highlightGo(el){ setMainMode('study'); setTimeout(()=>jumpToLO(el.dataset.id), 30); },
  deleteHighlight(el){
    PROGRESS.highlights = PROGRESS.highlights.filter(h=>h.id!==el.dataset.id);
    saveProgress(); render();
  },
  enableReminders: async () => {
    const ok = await requestNotificationPermission();
    toast(ok ? 'Daily reminders enabled.' : 'Reminders need notification permission to work \u2014 try again and allow it.');
    closeModal(); render();
  },
  exportData: async () => {
    const jsonText = JSON.stringify({content:CONTENT, progress:PROGRESS}, null, 2);
    try{
      const downloads = await claude.use('downloads');
      if (downloads){
        const res = await downloads.save({filename:'study_companion_export.json', data:jsonText});
        if (res) toast('Export saved.');
        return;
      }
    }catch(e){ /* fall through to legacy path below */ }
    try{
      const blob = new Blob([jsonText], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'study_companion_export.json'; a.click();
    }catch(e){ toast('Downloads are not available in this view.'); }
  },
  resetProgress(){
    if (!confirm('This will erase all your quiz history, flashcard status, highlights, and XP. Continue?')) return;
    PROGRESS = DEFAULT_PROGRESS(); saveProgress(); render(); toast('Progress reset.');
  },

  matchTerm(el){
    if (_matchedKeys.includes(el.dataset.key)) return;
    matchGame.selectedKey = el.dataset.key; render();
  },
  matchDef(el){
    if (!matchGame.selectedKey || _matchedKeys.includes(el.dataset.key)) return;
    if (matchGame.selectedKey === el.dataset.key){
      _matchedKeys.push(el.dataset.key);
      matchGame.matched++;
      addXP(5);
      matchGame.selectedKey = null;
      render();
      const total = matchGame.rounds[matchGame.round].length;
      if (matchGame.matched === total){
        const isLast = matchGame.round === matchGame.rounds.length-1;
        setTimeout(() => {
          const footer = document.getElementById('matchFooter');
          if (footer) footer.innerHTML = `<p style="font-family:var(--font-head);font-weight:700;font-size:16px;">${isLast?'All terms matched!':'Round complete!'}</p>
            <button class="btn small" data-action="matchNext" data-last="${isLast?1:0}">${isLast?'Play again':'Continue'}</button>`;
        }, 50);
      }
    } else {
      matchGame.selectedKey = null; render();
    }
  },
  matchNext(el){
    if (el.dataset.last === '1'){ initMatchGame(); } else { matchGame.round++; matchGame._terms=null; }
    render();
  },
  matchRestart(){ initMatchGame(); render(); },

  xwCheck(){
    document.querySelectorAll('.xw-cell input').forEach(inp => {
      const r = parseInt(inp.dataset.r,10), c = parseInt(inp.dataset.c,10);
      inp.classList.remove('ok','no');
      if (!inp.value) return;
      inp.classList.add(inp.value === xwState.solution[r][c] ? 'ok' : 'no');
    });
  },
  xwReveal(){
    document.querySelectorAll('.xw-cell input').forEach(inp => {
      const r = parseInt(inp.dataset.r,10), c = parseInt(inp.dataset.c,10);
      inp.value = xwState.solution[r][c];
      inp.classList.remove('no'); inp.classList.add('ok');
    });
  },
  xwNew(){ xwState = null; render(); },

  buildSession(el){
    const min = parseInt(el.dataset.min,10);
    sessionState = { phase:'running', plan: buildSessionPlan(min), index:0, minutes:min };
    render();
  },
  sessionGo(el){
    const map = {weak:'weak-areas', flash:'flashcards', quiz:'quiz', game:'games', recall:'active-recall'};
    navigate(map[el.dataset.target] || 'dashboard');
  },
  sessionNextStep(){
    logStudyMinutes(sessionState.plan[sessionState.index].minutes);
    sessionState.index++;
    navigate('study-session');
  },

  examBegin(){
    if (examState && examState.timerId) clearInterval(examState.timerId);
    const scope = document.getElementById('ex-scope').value;
    const count = parseInt(document.getElementById('ex-count').value,10);
    const timerSec = parseInt(document.getElementById('ex-timer').value,10);
    let cfg = readScopedConfig(scope, { difficulty:['easy','medium','hard','exam'] });
    cfg.timerSec = timerSec;
    const qs = shuffleArr(quizForScope(cfg)).slice(0, count);
    examState = { phase:'active', questions:qs, index:0, answers:[], config:cfg, timeLeft:timerSec||0 };
    navigate('exam');
  },
  examAnswer(el){
    const q = examState.questions[examState.index];
    let correct;
    if (el.dataset.val !== undefined && q.type==='true_false') correct = (el.dataset.val==='true') === q.correctAnswer;
    else correct = parseInt(el.dataset.idx,10) === q.correctIndex;
    examState.answers.push({correct});
    PROGRESS.quizAttempts.push({ts:Date.now(), conceptId:q.concept, correct, difficulty:q.difficulty, lo:q.lo, mode:'exam'});
    saveProgress();
    examNextQuestion();
  },
  examAnswerFill(){
    const q = examState.questions[examState.index];
    const val = (document.getElementById('exam-fill-input').value||'').trim().toLowerCase();
    const accepted = (q.acceptableAnswers||[q.correctAnswer]).map(a=>a.toLowerCase());
    const correct = accepted.includes(val);
    examState.answers.push({correct});
    PROGRESS.quizAttempts.push({ts:Date.now(), conceptId:q.concept, correct, difficulty:q.difficulty, lo:q.lo, mode:'exam'});
    saveProgress();
    examNextQuestion();
  },
  examReviewMistakes(){
    const missedConceptIds = examState.questions.filter((q,i)=>examState.answers[i] && !examState.answers[i].correct).map(q=>q.concept).filter(Boolean);
    PROGRESS.examHistory.push({ts:Date.now(), score:examState.answers.filter(a=>a.correct).length, total:examState.answers.length});
    saveProgress();
    if (!missedConceptIds.length){ toast('No mistakes to review — great job!'); return; }
    startQuiz({conceptIds:missedConceptIds, count:999, difficulty:['easy','medium','hard','exam']});
  },
  examRestart(){ if (examState && examState.timerId) clearInterval(examState.timerId); examState = { phase:'setup', questions:[], index:0, answers:[], config:null }; render(); },
  flowGoStage(el){
    const stage = el.dataset.val;
    const p = chapterFlowProgress(FLOW_CHAPTER);
    const locked = { reading:false, flashcards: !(p.readingDone && p.termsDone), quiz: !p.flashDone, review: !p.quizDone, complete: !p.complete };
    if (locked[stage]){ toast('Finish the current step first.'); return; }
    FLOW_STAGE = stage; FLOW_QUIZ_FEEDBACK = null; flowFcIndex = 0;
    render();
  },
  flowSwitchChapter(el){
    FLOW_CHAPTER = el.dataset.val; FLOW_STAGE = nextFlowStage(FLOW_CHAPTER); FLOW_QUIZ_FEEDBACK = null; flowFcIndex = 0;
    render();
  },
  flowReviewRemainingTerms(){
    const flow = getFlow(FLOW_CHAPTER);
    const remaining = conceptsForChapter(FLOW_CHAPTER).find(t => !flow.termsOpened.includes(t.id));
    if (!remaining) return;
    const el = document.querySelector(`#flowReadingSections span[data-cid='${remaining.id}']`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  },
  flowFcFlip(){
    const el = document.getElementById('flowFcCard');
    if (!el) return;
    el.classList.toggle('flipped');
    const cid = el.dataset.cid;
    if (cid) markFlashcardReviewed(FLOW_CHAPTER, cid);
  },
  flowFcMark(el){
    const cardEl = document.getElementById('flowFcCard');
    const cid = cardEl ? cardEl.dataset.cid : null;
    if (cid){
      markFlashcardReviewed(FLOW_CHAPTER, cid);
      PROGRESS.flashcardStatus[cid] = el.dataset.val === 'difficult' ? 'difficult' : 'known';
      saveProgress();
    }
    flowFcIndex++;
    render();
  },
  flowQuizPick(el){ submitFlowQuizAnswer(el.dataset.val); },
  flowQuizSubmitFill(){
    const input = document.getElementById('flowFillInput');
    submitFlowQuizAnswer(input ? input.value : '');
  },
  flowQuizSubmitMatch(){
    const qid = currentFlowQuizQuestionId(FLOW_CHAPTER, FLOW_STAGE);
    const q = CONTENT.quiz.find(x=>x.id===qid);
    if (!q) return;
    const response = q.pairs.map((p,i) => { const sel = document.getElementById('flowMatchSel'+i); return sel ? sel.value : ''; });
    submitFlowQuizAnswer(response);
  },
  flowQuizNext(){ FLOW_QUIZ_FEEDBACK = null; render(); },
};

function examNextQuestion(){
  clearInterval(examState.timerId);
  examState.index++;
  if (examState.index >= examState.questions.length){ examState.phase = 'results'; }
  else if (examState.config.timerSec) examState.timeLeft = examState.config.timerSec;
  render();
}
function stopSpeedTimer(){ clearInterval(gameState.timerId); }

function afterRender(){
  if (MAIN_MODE === 'practice' && PRACTICE_TAB === 'exam' && examState.phase === 'active' && examState.config && examState.config.timerSec){
    clearInterval(examState.timerId);
    const myExam = examState;
    myExam.timerId = setInterval(() => {
      if (examState !== myExam){ clearInterval(myExam.timerId); return; }
      myExam.timeLeft--;
      const d = document.getElementById('ex-timer-display');
      if (d) d.textContent = myExam.timeLeft + 's';
      if (myExam.timeLeft <= 0){
        myExam.answers.push({correct:false});
        examNextQuestion();
      }
    }, 1000);
  }
  if (MAIN_MODE === 'practice' && PRACTICE_TAB === 'games' && gameState.type === 'speed' && gameState.qs && gameState.qs[gameState.index] && !gameState.timerId){
    const myGame = gameState;
    myGame.timerId = setInterval(() => {
      if (gameState !== myGame){ clearInterval(myGame.timerId); return; }
      myGame.timeLeft--;
      if (myGame.timeLeft <= 0 || !myGame.qs[myGame.index]){
        clearInterval(myGame.timerId);
        myGame.timeLeft = 0;
        render();
      } else {
        const el = document.querySelector('.timer-display');
        if (el) el.textContent = '⏳ ' + myGame.timeLeft + 's';
      }
    }, 1000);
  }
  if (MAIN_MODE === 'practice' && PRACTICE_TAB === 'crossword'){
    document.querySelectorAll('.xw-cell input').forEach(inp => {
      if (inp._wired) return;
      inp._wired = true;
      inp.addEventListener('input', () => {
        inp.value = inp.value.toUpperCase().slice(-1);
        inp.classList.remove('ok','no');
        const r = parseInt(inp.dataset.r,10), c = parseInt(inp.dataset.c,10);
        if (inp.value){
          const right = document.querySelector(`.xw-cell input[data-r="${r}"][data-c="${c+1}"]`);
          const down_ = document.querySelector(`.xw-cell input[data-r="${r+1}"][data-c="${c}"]`);
          if (right) right.focus(); else if (down_) down_.focus();
        }
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value){
          const r = parseInt(inp.dataset.r,10), c = parseInt(inp.dataset.c,10);
          const left = document.querySelector(`.xw-cell input[data-r="${r}"][data-c="${c-1}"]`);
          if (left) left.focus();
        }
      });
    });
  }
}

async function initApp(){
  await loadState();
  renderShell();
  requestDailyReminderSetupIfNeeded();
}
initApp();
</script>
