span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>This positive EVA indicates that Allied's shareholders actually earned $28.5 million more than they could have earned by investing in other stocks with the same risk as Allied. To see where this $28.5 comes from, let's trace what happened to the money: the firm generated <span class='src-box ln2-ebit y2021'>$278</span> of operating income; <span class='src-box ln2-tax y2021'>$48.8</span> went to the government to pay taxes, leaving <span class='src-box calc-result'>$229.3</span> available for investors (stockholders and bondholders); <span class='src-box ln2-int y2021'>$83</span> went to the bondholders in the form of interest payments, thus leaving <span class='src-box ln2-ni y2021'>$146.3</span> for the stockholders. However, Allied's shareholders must also earn a return on the equity capital they have invested in the firm, because they could have invested in other companies of comparable risk \u2014 this is the cost of Allied's equity. Once Allied's shareholders are 'paid' their required return, the firm has an additional $28.5 million \u2014 this is the economic value added. Allied's management created positive wealth because it provided shareholders a higher return than they could have earned on alternative investments with the same risk as Allied's stock.</p><p>EVA is different from traditional accounting profit because it reflects the cost of equity as well as the cost of debt. Using the numbers above, we could also express EVA as net income minus the dollar cost of equity:</p><div class='formula-box'><span class='formula-label'>Formula \u2014 the ROE-EVA connection</span><div class='formula-eq'>EVA = Net Income \u2212 (Equity \u00d7 Cost of Equity)</div><div class='formula-eq'>EVA = (Equity)(Net Income \u00f7 Equity \u2212 Cost of Equity)</div><div class='formula-eq'>EVA = Equity(ROE \u2212 Cost of Equity)</div></div><p>This last expression implies that EVA depends on three factors: rate of return, as reflected in ROE; risk, which affects the cost of equity; and size, which is measured by the equity employed. These three examples suggest that a project's ROE must be combined with its size and risk to determine its effect on shareholder value.</p>"}], "4.8": [{"heading": "Using financial ratios to assess performance (Section 4-9)", "html": "<p>Although financial ratios help us evaluate financial statements, it is often hard to evaluate a company by just looking at the ratios. For example, if you see that a company has a current ratio of 1.2, it is hard to know if that is good or bad unless you put the ratio in its proper perspective. Allied's management could look at industry averages, it could compare itself to specific companies or 'benchmarks,' and it can analyze the trends in each ratio. We look at all three approaches in this section.</p>"}, {"heading": "Comparison to industry average (Section 4-9A)", "html": "<p>One way to assess performance is to compare a company's key ratios to the industry averages, as has been done for Allied throughout this chapter. Table 4.2 provides a summary of every ratio discussed in this chapter, useful as a quick reference, with a comment on each of Allied's strengths and weaknesses relative to the average food processing company.</p><table class='bs-table'><caption>Table 4.2 \u2014 Allied Food Products: Summary of Financial Ratios (Millions of Dollars)</caption><thead><tr><th>Ratio</th><th>Calculation</th><th>Ratio</th><th>Industry Avg.</th><th>Comment</th></tr></thead><tbody><tr class='bs-section'><td colspan='5'>Liquidity</td></tr><tr><td>Current</td><td>$1,000 \u00f7 $310</td><td>3.2\u00d7</td><td>4.2\u00d7</td><td>Poor</td></tr><tr><td>Quick</td><td>$385 \u00f7 $310</td><td>1.2\u00d7</td><td>2.2\u00d7</td><td>Poor</td></tr><tr class='bs-section'><td colspan='5'>Asset Management</td></tr><tr><td>Inventory turnover</td><td>$2,100 \u00f7 $615</td><td>3.4\u00d7</td><td>7.6\u00d7</td><td>Poor</td></tr><tr><td>Days sales outstanding</td><td>$375 \u00f7 $8.2192</td><td>46 days</td><td>36 days</td><td>Poor</td></tr><tr><td>Fixed assets turnover</td><td>$3,000 \u00f7 $1,000</td><td>3.0\u00d7</td><td>2.8\u00d7</td><td>OK</td></tr><tr><td>Total assets turnover</td><td>$3,000 \u00f7 $2,000</td><td>1.5\u00d7</td><td>1.8\u00d7</td><td>Somewhat low</td></tr><tr class='bs-section'><td colspan='5'>Debt Management</td></tr><tr><td>Total debt to total capital</td><td>$860 \u00f7 $1,800</td><td>47.8%</td><td>36.4%</td><td>High (risky)</td></tr><tr><td>Times-interest-earned</td><td>$278 \u00f7 $83</td><td>3.3\u00d7</td><td>6.0\u00d7</td><td>Low (risky)</td></tr><tr class='bs-section'><td colspan='5'>Profitability</td></tr><tr><td>Operating margin</td><td>$278 \u00f7 $3,000</td><td>9.3%</td><td>10.0%</td><td>Low</td></tr><tr><td>Profit margin</td><td>$146.3 \u00f7 $3,000</td><td>4.9%</td><td>6.0%</td><td>Poor</td></tr><tr><td>Return on total assets</td><td>$146.3 \u00f7 $2,000</td><td>7.3%</td><td>10.8%</td><td>Poor</td></tr><tr><td>Return on common equity</td><td>$146.3 \u00f7 $940</td><td>15.6%</td><td>18.7%</td><td>Poor</td></tr><tr><td>Return on invested capital</td><td>$208.5 \u00f7 $1,800</td><td>11.6%</td><td>13.2%</td><td>Poor</td></tr><tr><td>Basic earning power</td><td>$278 \u00f7 $2,000</td><td>13.9%</td><td>18.0%</td><td>Poor</td></tr><tr class='bs-section'><td colspan='5'>Market Value</td></tr><tr><td>Price/earnings</td><td>$23.06 \u00f7 $1.95</td><td>11.8\u00d7</td><td>13.6\u00d7</td><td>Low</td></tr><tr><td>Market/book</td><td>$23.06 \u00f7 $12.53</td><td>1.8\u00d7</td><td>2.6\u00d7</td><td>Low</td></tr><tr><td>EV/EBITDA</td><td>$2,579.5 \u00f7 $378</td><td>6.8\u00d7</td><td>9.2\u00d7</td><td>Low</td></tr></tbody></table><p>To give a further sense of some 'real-world' ratios, Table 4.3 provides a list of ratios for a number of different industries in mid-March 2020, based on data from MSN Money Analysis and NYU Stern School of Business.</p><table class='mini-table'><thead><tr><th>Industry</th><th>Current Ratio</th><th>Inventory Turnover</th><th>Total Assets Turnover</th><th>LT Debt/LT Capital</th><th>Net Profit Margin</th><th>ROA</th><th>ROE</th><th>P/E</th><th>EV/EBITDA</th></tr></thead><tbody><tr><td>Aerospace/defense</td><td>1.13</td><td>2.60</td><td>0.68</td><td>56.52%</td><td>4.69%</td><td>4.39%</td><td>16.91%</td><td>0.00</td><td>14.94</td></tr><tr><td>Apparel stores</td><td>1.29</td><td>4.18</td><td>1.46</td><td>48.45</td><td>4.09</td><td>3.85</td><td>12.74</td><td>10.93</td><td>8.45</td></tr><tr><td>Auto mfg. \u2014 major</td><td>1.21</td><td>6.83</td><td>0.75</td><td>31.46</td><td>3.63</td><td>0.48</td><td>4.87</td><td>129.65</td><td>14.39</td></tr><tr><td>Beverage (soft drink)</td><td>1.10</td><td>3.82</td><td>0.53</td><td>46.24</td><td>11.95</td><td>8.87</td><td>16.89</td><td>23.95</td><td>19.92</td></tr><tr><td>Electronics \u2014 diversified</td><td>1.44</td><td>6.49</td><td>1.02</td><td>38.27</td><td>2.42</td><td>3.46</td><td>17.73</td><td>23.95</td><td>13.07</td></tr><tr><td>Grocery stores</td><td>0.97</td><td>10.36</td><td>1.76</td><td>51.92</td><td>1.65</td><td>4.33</td><td>16.83</td><td>22.07</td><td>8.93</td></tr><tr><td>Health services \u2014 specialized</td><td>1.17</td><td>10.64</td><td>0.99</td><td>52.15</td><td>3.97</td><td>6.05</td><td>14.22</td><td>6.77</td><td>9.37</td></tr><tr><td>Lodging</td><td>1.08</td><td>7.99</td><td>0.58</td><td>55.16</td><td>8.14</td><td>6.26</td><td>14.51</td><td>5.04</td><td>12.74</td></tr><tr><td>Newspapers</td><td>1.07</td><td>8.62</td><td>0.47</td><td>49.24</td><td>7.88</td><td>5.07</td><td>10.72</td><td>0.00</td><td>9.18</td></tr><tr><td>Paper and paper products</td><td>1.26</td><td>5.79</td><td>0.77</td><td>52.83</td><td>4.77</td><td>5.06</td><td>11.16</td><td>10.07</td><td>7.53</td></tr><tr><td>Railroad</td><td>1.15</td><td>25.34</td><td>0.86</td><td>53.05</td><td>19.05</td><td>4.90</td><td>12.22</td><td>12.56</td><td>16.88</td></tr><tr><td>Restaurant</td><td>1.07</td><td>7.94</td><td>0.57</td><td>55.16</td><td>8.27</td><td>4.32</td><td>14.69</td><td>7.26</td><td>18.06</td></tr><tr><td>Retail (department stores)</td><td>1.12</td><td>6.19</td><td>1.57</td><td>33.74</td><td>3.58</td><td>6.90</td><td>14.94</td><td>9.10</td><td>12.21</td></tr><tr><td>Scientific &amp; technical instruments</td><td>1.80</td><td>5.23</td><td>0.74</td><td>33.77</td><td>7.28</td><td>5.95</td><td>10.91</td><td>28.43</td><td>15.71</td></tr><tr><td>Sporting goods</td><td>2.23</td><td>4.29</td><td>1.01</td><td>28.57</td><td>5.54</td><td>7.92</td><td>10.73</td><td>6.53</td><td>13.31</td></tr><tr><td>Steel and iron</td><td>1.36</td><td>4.56</td><td>0.71</td><td>39.02</td><td>5.64</td><td>6.19</td><td>9.25</td><td>9.87</td><td>6.24</td></tr><tr><td>Tobacco (cigarettes)</td><td>1.25</td><td>5.02</td><td>0.80</td><td>43.18</td><td>5.42</td><td>6.12</td><td>10.54</td><td>14.09</td><td>12.30</td></tr></tbody></table><p><em>Data source (as cited in the textbook): MSN Money Analysis, March 19, 2020, and enterprise value multiples from Aswath Damodaran, NYU Stern School of Business, January 2020.</em></p>"}, {"heading": "Benchmarking (Section 4-9B)", "html": "<p>Ratio analysis involves comparisons with industry average figures, but Allied and many other companies also compare themselves with a subset of top competitors in their industry. This is called <span class='term' data-cid='ch4-benchmarking'>benchmarking</span>, and the companies used for the comparison are called benchmark companies. Allied's management benchmarks against Campbell Soup, a leading manufacturer of canned soups; Tyson Foods, a processor of chicken, beef, and pork products; J&J Snack Foods, a manufacturer of nutritional snack foods; Conagra Brands, a packaged food company that supplies entrees, sauces, frozen potatoes, and other vegetables to commercial customers; Flowers Foods, a producer of bakery and snack-food goods; Hershey Foods, a producer of chocolates and non-chocolate confectionary products; and Kellogg Company, a manufacturer of ready-to-eat cereals and convenience foods.</p><table class='mini-table'><thead><tr><th>Company</th><th>Profit Margin</th></tr></thead><tbody><tr><td>Campbell Soup</td><td>17.95%</td></tr><tr><td>Hershey</td><td>14.40%</td></tr><tr><td>J&amp;J Snack Brands</td><td>7.88%</td></tr><tr><td>Conagra Brands</td><td>7.62%</td></tr><tr><td>Kellogg</td><td>7.07%</td></tr><tr><td><strong>Allied Food Products</strong></td><td><strong>4.88%</strong></td></tr><tr><td>Tyson Foods</td><td>4.71%</td></tr><tr><td>Flowers Foods</td><td>3.99%</td></tr></tbody></table><p>The benchmarking setup makes it easy for Allied's management to see exactly where it stands relative to the competition. As the data show, Allied is near the bottom of the benchmark group relative to its profit margin, so it has lots of room for improvement. Other ratios are analyzed similarly.</p><p>Comparative ratios are available from a number of sources, including both Yahoo! Finance and MSN Money. Useful ratios are also compiled by Value Line, Dun and Bradstreet (D&B), and the Risk Management Association, the national association of bank loan officers. Each of the data-supplying organizations uses a somewhat different set of ratios designed for its own purposes \u2014 D&B, for example, deals mainly with small firms, many of which are proprietorships, and it sells its services primarily to banks and other lenders, so it is concerned largely with the creditor's viewpoint and emphasizes current assets and liabilities, not market value ratios. Be sure your emphasis is similar to that of the agency whose ratios you plan to use, and verify the exact definitions of the ratios presented by different sources before using them for consistency with your own work.</p>"}, {"heading": "Trend analysis (Section 4-9C)", "html": "<p>As a final comparison, Allied compares its ratios to its own past levels. It is important to analyze trends in ratios as well as their absolute levels, for trends give clues as to whether a firm's financial condition is likely to improve or to deteriorate. To do a <span class='term' data-cid='ch4-trend-analysis'>trend analysis</span>, simply plot a ratio over time, as illustrated below for Allied's ROE, 2017\u20132021.</p><table class='mini-table'><thead><tr><th>Year</th><th>Allied ROE</th><th>Industry ROE</th></tr></thead><tbody><tr><td>2017</td><td>~17%</td><td>~17.5%</td></tr><tr><td>2018</td><td>~20%</td><td>~20%</td></tr><tr><td>2019</td><td>~18.5%</td><td>~19%</td></tr><tr><td>2020</td><td>~17%</td><td>~20%</td></tr><tr><td>2021</td><td><strong>15.6%</strong></td><td><strong>18.7%</strong></td></tr></tbody></table><p><em>Values for 2017\u20132020 are approximate, read from the chapter's Figure 4.1 chart; 2021 figures are exact.</em></p><p>This graph shows that Allied's ROE has been declining since 2018 even though the industry average has been relatively stable. All the other ratios could be analyzed similarly, and such an analysis can be quite useful in gaining insights as to why Allied's ROE has behaved the way it did.</p>"}, {"heading": "Uses and limitations of ratios (Section 4-10)", "html": "<p>As noted earlier, ratio analysis is used by three main groups: <strong>managers</strong>, who use ratios to help analyze, control, and thus improve their firms' operations; <strong>credit analysts</strong>, including bank loan officers and bond rating analysts, who analyze ratios to help judge a company's ability to repay its debts; and <strong>stock analysts</strong>, who are interested in a company's efficiency, risk, and growth prospects.</p><p>While ratio analysis can provide useful information concerning a company's operations and financial condition, it does have limitations, and analysts should keep the following points in mind:</p><ol><li>Many firms have divisions that operate in different industries; for such companies, it is difficult to develop a meaningful set of industry averages. Ratio analysis is therefore more useful for narrowly focused firms than for multidivisional ones.</li><li>Most firms want to be better than average, so merely attaining average performance is not necessarily good. As a target for high-level performance, it is best to focus on the industry leaders' ratios. Benchmarking helps in this regard.</li><li>Inflation has distorted many firms' balance sheets \u2014 book values are often different from market values. Market values would be more appropriate for most purposes, but we cannot generally get market value figures because assets such as used machinery are not traded in the marketplace. Further, inflation affects asset values, depreciation charges, inventory costs, and thus profits. Therefore, a ratio analysis for one firm over time or a comparative analysis of firms of different ages must be interpreted with care and judgment.</li></ol>"}]}, "chapterWrapUp": {"ch1": {"title": "Tying It All Together", "html": "<p>The throughline of this chapter is that management's primary goal should be maximizing the stock's long-run <span class='term'>intrinsic value</span>. Firms pursue that goal by building products people actually want, producing them efficiently, pricing them competitively, and following the laws that govern corporate conduct \u2014 which means that a firm succeeding at value maximization is, in the process, generally also contributing to social welfare rather than working against it.</p><p>Businesses can be organized as proprietorships, partnerships, corporations, LLCs, or LLPs, but corporations conduct the large majority of business by dollar value \u2014 which is why they're the focus for the rest of this book.</p><p>The CFO's job comes down to four core tasks: keeping the accounting system supplying reliable numbers for both internal decisions and outside investors; making sure the firm is financed properly; evaluating whether operating units are performing optimally; and vetting every proposed capital expenditure to confirm it will actually increase the firm's value.</p>"}, "ch2": {"title": "Tying It All Together", "html": "<p>Chapter 1 established that a firm's goal is maximizing long-run shareholder value \u2014 and this chapter shows exactly where that value gets determined: in the financial markets. Capital moves from savers to borrowers directly, through investment banks, or through financial intermediaries, and it flows through a whole ecosystem of institutions \u2014 commercial and investment banks, pension and mutual funds, ETFs, hedge funds, and private equity \u2014 each suited to a different kind of saver or borrower.</p><p>The stock market itself splits into physical location exchanges like the NYSE and dealer-based markets like NASDAQ, and new shares reach investors through primary issuances or IPOs before trading on in the secondary market indefinitely afterward.</p><p>Whether that market prices shares efficiently is genuinely contested: the classical view says prices track intrinsic value closely because so many well-resourced analysts are watching; behavioral finance counters that psychology can keep prices wrong for a long time. In practice, both views point toward the same practical advice for most investors \u2014 diversify broadly, and be skeptical of anyone claiming they can consistently beat a market this closely watched.</p>"}, "ch3": {"title": "Tying It All Together", "html": "<p>This chapter's throughline connects directly back to Chapter 1's central claim: management's job is to maximize the firm's long-run intrinsic value, and intrinsic value is built from future cash flows \u2014 not from accounting profit. The four financial statements are where that story starts: the balance sheet shows what the firm owns and owes, the income statement shows whether it's profitable, the statement of cash flows shows whether that profit is actually turning into cash, and the statement of stockholders' equity ties the pieces together.</p><p>Free cash flow takes those accounting numbers and reshapes them into the number that actually matters for valuation \u2014 how much cash the firm could hand to investors without starving its own future. MVA and EVA push further still, measuring value creation against the market's real-time judgment and against the true dollar cost of all the capital a firm uses, not just its debt.</p><p>Taxes touch every one of these numbers: the after-tax cost of debt versus equity shapes how firms finance themselves, depreciation and expensing rules shape reported income and cash flow alike, and the TCJA's 2017 changes reset many of these incentives at once. None of these topics stand alone \u2014 a change in tax policy flows straight through to free cash flow, and free cash flow is what ultimately drives the stock price Chapter 1 said managers should be maximizing.</p>"}, "ch4": {"title": "Tying It All Together", "html": "<p>This chapter's throughline connects ratio analysis directly back to Chapter 1's central claim and Chapter 3's building blocks: managers and investors both use these ratios to judge whether a firm's decisions are moving it toward or away from maximizing its long-run intrinsic value.</p><p>The five categories build on each other rather than standing alone. Liquidity ratios (current, quick) check whether a firm can meet its immediate obligations. Asset management ratios (inventory turnover, DSO, fixed and total assets turnover) explain WHY liquidity and efficiency look the way they do. Debt management ratios (total debt to total capital, TIE) reveal how much of that efficiency is being amplified \u2014 or put at risk \u2014 by financial leverage, as the Firm U vs. Firm L comparison showed dramatically. And profitability ratios (operating margin, profit margin, ROA) are the net result of everything above: Allied's below-average profitability traces directly back to its weak inventory and receivables management, and is made worse by its heavier-than-average use of debt.</p><p>The chapter's most important habit to take away: never judge a company from a single ratio in isolation. Look at several ratios together, understand what each one is really measuring, and only then draw conclusions about a firm's financial health and what actions might improve it.</p>"}}, "crossword": {"ch1": [{"answer": "CORPORATION", "clue": "Legal entity separate from its owners, offering limited liability and unlimited life"}, {"answer": "PROPRIETORSHIP", "clue": "Unincorporated business owned by a single individual"}, {"answer": "PARTNERSHIP", "clue": "Business owned by two or more people, usually with unlimited personal liability"}, {"answer": "GOVERNANCE", "clue": "Corporate ___: board rules keeping managers focused on shareholders' interests"}, {"answer": "EQUILIBRIUM", "clue": "The condition where a stock's market price equals its intrinsic value"}, {"answer": "COVENANT", "clue": "A bond ___ restricts a firm's ability to take on more debt"}, {"answer": "TAKEOVER", "clue": "A hostile ___ is an acquisition pushed through over management's objection"}, {"answer": "LIABILITY", "clue": "Unlimited personal ___ is a major drawback of proprietorships and partnerships"}, {"answer": "ETHICS", "clue": "A company's standards of conduct toward employees, customers, and shareholders"}, {"answer": "RAIDER", "clue": "An investor who targets an undervalued firm for a hostile acquisition"}, {"answer": "DIVIDEND", "clue": "A payout to shareholders that's taxed a second time under double taxation"}, {"answer": "INSIDER", "clue": "___ trading: using material, nonpublic information to trade a security"}, {"answer": "CFO", "clue": "Abbreviation for the officer in charge of accounting, treasury, and capital budgeting"}, {"answer": "ESG", "clue": "Abbreviation for the environmental, social, and governance criteria used to rate a firm's social responsibility"}], "ch2": [{"answer": "ARBITRAGE", "clue": "Buying low in an inefficient market and reselling higher for a profit"}, {"answer": "HEDGING", "clue": "Using a derivative to reduce risk exposure, like a farmer locking in a future crop price"}, {"answer": "SPECULATION", "clue": "Taking on extra risk via derivatives in hope of a higher return"}, {"answer": "DERIVATIVE", "clue": "A security whose value is derived from another underlying asset"}, {"answer": "NASDAQ", "clue": "Electronic, dealer-based stock market that grew from a simple quotation system"}, {"answer": "OVERCONFIDENCE", "clue": "The bias behind why ~90% of people rate themselves above-average drivers"}, {"answer": "CROWDFUNDING", "clue": "Raising money directly from many small investors online, e.g. via Kickstarter"}, {"answer": "SECURITIZATION", "clue": "Bundling loans like mortgages into new tradable securities"}, {"answer": "DEALER", "clue": "A market maker who quotes bid and ask prices for OTC stocks"}, {"answer": "INTERMEDIARY", "clue": "A bank, insurer, or fund that stands between savers and borrowers"}, {"answer": "HEDGEFUND", "clue": "Largely unregulated pool of capital marketed to institutions and wealthy investors"}, {"answer": "IPO", "clue": "Abbreviation for a private company's first stock sale to the public"}, {"answer": "ETF", "clue": "Abbreviation for a fund that trades like a stock but holds a whole portfolio"}, {"answer": "CDS", "clue": "Abbreviation for a contract offering protection against a borrower's default"}], "ch3": [{"answer": "DEPRECIATION", "clue": "A noncash charge reflecting the cost of tangible assets used up in production"}, {"answer": "AMORTIZATION", "clue": "Like depreciation, but for the declining value of intangible assets like patents"}, {"answer": "LIABILITIES", "clue": "Claims against a firm's assets that it owes to others"}, {"answer": "CARRYFORWARD", "clue": "A tax rule letting a loss offset future years' taxable income"}, {"answer": "DIVIDEND", "clue": "A cash payout to shareholders, not deductible by the paying corporation"}, {"answer": "PROGRESSIVE", "clue": "Type of tax system where higher incomes are taxed at higher rates"}, {"answer": "EQUITY", "clue": "Stockholders' ___: paid-in capital plus retained earnings"}, {"answer": "EBITDA", "clue": "Earnings before interest, taxes, depreciation, and ___ (fill the last word, then abbreviate the whole phrase)"}, {"answer": "EBIT", "clue": "Operating income, or earnings before interest and taxes (abbr.)"}, {"answer": "NOPAT", "clue": "EBIT times (1 minus the tax rate) \u2014 net operating profit after taxes (abbr.)"}, {"answer": "MVA", "clue": "Market value of equity minus its book value (abbr.)"}, {"answer": "EVA", "clue": "NOPAT minus the dollar cost of capital (abbr.)"}, {"answer": "FCF", "clue": "Cash a firm could withdraw without harming future operations (abbr.)"}, {"answer": "IRA", "clue": "Traditional or Roth \u2014 a tax-advantaged retirement account (abbr.)"}, {"answer": "TCJA", "clue": "The 2017 law that set a flat 21% corporate tax rate (abbr.)"}], "ch4": [{"answer": "CURRENT", "clue": "The ___ ratio divides current assets by current liabilities"}, {"answer": "QUICK", "clue": "The ___ (or acid-test) ratio excludes inventories from current assets"}, {"answer": "LIQUIDITY", "clue": "___ ratios measure a firm's ability to pay short-term debts"}, {"answer": "INVENTORY", "clue": "Turnover ratio dividing cost of goods sold by ___"}, {"answer": "TURNOVER", "clue": "Asset management ratios are often called ___ ratios"}, {"answer": "LEVERAGE", "clue": "Financial ___: using debt in hopes of boosting stockholders' return"}, {"answer": "MARGIN", "clue": "Operating ___ and profit ___ both divide a measure of income by sales"}, {"answer": "RECEIVABLES", "clue": "Days sales outstanding divides ___ by average daily sales"}, {"answer": "INTEREST", "clue": "The TIE ratio divides EBIT by ___ charges"}, {"answer": "CAPITAL", "clue": "Total debt to total ___ measures the debt-funded share of financing"}, {"answer": "DSO", "clue": "Abbreviation for days sales outstanding"}, {"answer": "TIE", "clue": "Abbreviation for the times-interest-earned ratio"}, {"answer": "ROA", "clue": "Abbreviation for return on total assets"}, {"answer": "DUPONT", "clue": "The ___ equation breaks ROE into profit margin, turnover, and the equity multiplier"}, {"answer": "MULTIPLIER", "clue": "Equity ___: Total Assets divided by Total Common Equity"}, {"answer": "BENCHMARKING", "clue": "Comparing a firm's ratios against a chosen set of close competitors"}, {"answer": "ENTERPRISE", "clue": "___ value: market value of equity plus debt, minus cash"}, {"answer": "ROIC", "clue": "Abbreviation for return on invested capital"}, {"answer": "ROE", "clue": "Abbreviation for return on common equity"}, {"answer": "BEP", "clue": "Abbreviation for the basic earning power ratio"}]}, "miniGames": {"whoAmI": [{"id": "wai1", "answer": "Intrinsic value", "clues": ["I'm an estimate, not a fact.", "I'm based on a stock's expected future cash flows and risk.", "The Enron case shows how far I can drift from the market price."]}, {"id": "wai2", "answer": "Free cash flow", "clues": ["Many analysts say I matter more than net income.", "I can be negative even for a healthy, fast-growing company.", "Allied's plant expansion pushed me to -$71.5 million in 2021."]}, {"id": "wai3", "answer": "Hostile takeover", "clues": ["I happen when a company's stock looks like a bargain.", "I usually cost the target's executives their jobs.", "I'm the market's way of punishing an undervalued stock."]}, {"id": "wai4", "answer": "Efficient markets hypothesis", "clues": ["I come in weak, semi-strong, and strong forms.", "Eugene Fama is one of my most famous defenders.", "Behavioral finance is my most direct academic rival."]}, {"id": "wai5", "answer": "Progressive tax", "clues": ["The more you earn, the higher rate I charge on each new dollar.", "I'm why marginal and average tax rates differ.", "The U.S. individual income tax system works this way."]}, {"id": "wai6", "answer": "Agency conflict", "clues": ["I show up between stockholders and managers, or stockholders and bondholders.", "Jensen and Meckling wrote the classic paper about me.", "Corporate governance exists mainly to manage me."]}], "fillTheGap": [{"id": "ftg1", "text": "Intellectual \u2014 wait, wrong course! FCF = [EBIT(1-T) + Depreciation] \u2212 [CapEx + \u0394 ______].", "answer": "NOWC"}, {"id": "ftg2", "text": "A firm is in ______ when its market price equals its intrinsic value.", "answer": "equilibrium"}, {"id": "ftg3", "text": "The TCJA set a flat corporate tax rate of ______%.", "answer": "21"}, {"id": "ftg4", "text": "Net Operating Working Capital = Operating Current Assets minus Operating Current ______.", "answer": "Liabilities"}, {"id": "ftg5", "text": "A(n) ______ market is where a corporation raises brand-new capital by issuing new securities.", "answer": "primary"}, {"id": "ftg6", "text": "MVA = Market Value of Equity minus ______ Value of Equity.", "answer": "Book"}], "orderIt": [{"id": "oi1", "title": "The Capital Formation Process (least to most institutional)", "steps": ["Direct transfer", "Transfer through an investment bank", "Transfer through a financial intermediary"]}, {"id": "oi2", "title": "From Operating Profit to Free Cash Flow", "steps": ["Start with EBIT", "Multiply by (1 \u2212 Tax Rate) to get NOPAT", "Add back Depreciation & Amortization", "Subtract CapEx and \u0394NOWC to get FCF"]}, {"id": "oi3", "title": "Corporate Life Cycle (business organization forms)", "steps": ["Proprietorship", "Partnership", "S Corporation", "C Corporation"]}], "conceptSortCategories": ["Ch1: Overview of Financial Management", "Ch2: Financial Markets and Institutions", "Ch3: Financial Statements, Cash Flow, and Taxes"], "matchingPool": ["ch1-corporation", "ch1-proprietorship", "ch1-partnership", "ch1-intrinsic-value", "ch1-agency-theory-agency-conflict", "ch1-hostile-takeover", "ch1-business-ethics", "ch1-corporate-governance", "ch2-primary-markets", "ch2-secondary-markets", "ch2-mutual-funds", "ch2-hedge-funds", "ch2-initial-public-offering-ipo", "ch2-efficient-markets-hypothesis-emh", "ch2-behavioral-finance", "ch3-balance-sheet", "ch3-income-statement", "ch3-free-cash-flow-fcf", "ch3-nopat", "ch3-market-value-added-mva"]}};
let CONTENT = null;
let PROGRESS = null;
let saveProgressTimer = null;
let SYNC_MODE = 'local';
let SYNC_CODE = null;
let fsDocRef = null;

const DEFAULT_PROGRESS = () => ({
  xp: 0, streakDays: 0, lastStudyDate: null, studyLog: [],
  quizAttempts: [], flashcardStatus: {}, srs: {}, highlights: [], examHistory: [], badges: [],
  settings: { dark: false },
  weeklyGoal: null, lastReminderDate: null, chapterFlow: {},
});

function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function loadLocalProgress(){
  try{
    const raw = localStorage.getItem('finmgmt_progress');
    PROGRESS = raw ? Object.assign(DEFAULT_PROGRESS(), JSON.parse(raw)) : DEFAULT_PROGRESS();
  }catch(e){ PROGRESS = DEFAULT_PROGRESS(); }
}

const FIXED_SYNC_ID = 'brandon-finmgmt303-progress';
async function loadState(){
  CONTENT = JSON.parse(JSON.stringify(SEED_CONTENT));
  await initFirebase();
  SYNC_CODE = FIXED_SYNC_ID;
  if (window.__fb){
    SYNC_MODE = 'firestore';
    try{
      const { db, doc, getDoc } = window.__fb;
      fsDocRef = doc(db, 'studyProgress', SYNC_CODE);
      const snap = await getDoc(fsDocRef);
      PROGRESS = (snap && snap.exists()) ? Object.assign(DEFAULT_PROGRESS(), snap.data()) : DEFAULT_PROGRESS();
    }catch(e){
      console.warn('Firestore load failed, using local storage for this session', e);
      SYNC_MODE = 'local';
      loadLocalProgress();
    }
  } else {
    SYNC_MODE = 'local';
    loadLocalProgress();
  }
  PROGRESS.settings = Object.assign({dark:false}, PROGRESS.settings||{});
}
function saveProgress(){
  clearTimeout(saveProgressTimer);
  saveProgressTimer = setTimeout(async () => {
    if (SYNC_MODE === 'firestore' && fsDocRef && window.__fb){
      try{ await window.__fb.setDoc(fsDocRef, PROGRESS); }
      catch(e){
        console.warn('Firestore save failed, saving locally instead', e);
        try{ localStorage.setItem('finmgmt_progress', JSON.stringify(PROGRESS)); }catch(e2){}
      }
    } else {
      try{ localStorage.setItem('finmgmt_progress', JSON.stringify(PROGRESS)); }
      catch(e){ console.warn('progress save failed', e); }
    }
  }, 300);
}

function logStudyMinutes(mins){
  const day = todayStr();
  let entry = PROGRESS.studyLog.find(l => l.date === day);
  if (!entry){ entry = {date:day, minutes:0}; PROGRESS.studyLog.push(entry); }
  entry.minutes += mins;
  bumpStreak(day);
  saveProgress();
}
function bumpStreak(day){
  if (PROGRESS.lastStudyDate === day) return;
  const y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if (PROGRESS.lastStudyDate === y || !PROGRESS.lastStudyDate) PROGRESS.streakDays = (PROGRESS.streakDays||0) + 1;
  else PROGRESS.streakDays = 1;
  PROGRESS.lastStudyDate = day;
}
function addXP(n){ PROGRESS.xp = (PROGRESS.xp||0) + n; saveProgress(); }

function getConcept(id){ return CONTENT.concepts.find(c => c.id === id); }
function allConcepts(){ return CONTENT.concepts; }
function conceptsForChapter(chapterId){ return CONTENT.concepts.filter(c => c.chapterId === chapterId); }
function conceptsForLO(loId){
  const lo = CONTENT.learningObjectives.find(l => l.id === loId);
  if (!lo) return [];
  return CONTENT.concepts.filter(c => (lo.keyConcepts||[]).includes(c.id) || c.lo === lo.code);
}
function loByCode(code){ return CONTENT.learningObjectives.find(l => l.code === code); }
function quizForScope(scope){
  let qs = CONTENT.quiz.slice();
  if (scope.chapterId) qs = qs.filter(q => q.chapterId === scope.chapterId);
  if (scope.loCode) qs = qs.filter(q => q.lo === scope.loCode);
  if (scope.conceptIds) qs = qs.filter(q => scope.conceptIds.includes(q.concept));
  if (scope.difficulty && scope.difficulty.length) qs = qs.filter(q => scope.difficulty.includes(q.difficulty));
  if (scope.types && scope.types.length) qs = qs.filter(q => scope.types.includes(q.type));
  return qs;
}

function conceptAccuracy(conceptId){
  const attempts = PROGRESS.quizAttempts.filter(a => a.conceptId === conceptId);
  if (!attempts.length) return null;
  const correct = attempts.filter(a => a.correct).length;
  return { attempts: attempts.length, correct, accuracy: Math.round(100*correct/attempts.length) };
}
function loStats(loId){
  const lo = CONTENT.learningObjectives.find(l => l.id === loId);
  const concepts = conceptsForLO(loId);
  const conceptIds = concepts.map(c=>c.id);
  const attempts = PROGRESS.quizAttempts.filter(a => conceptIds.includes(a.conceptId));
  const total = attempts.length;
  const correct = attempts.filter(a=>a.correct).length;
  const accuracy = total ? Math.round(100*correct/total) : null;
  let status = 'Not Started';
  if (total >= 1 && total < 4) status = 'Learning';
  else if (total >= 4 && accuracy !== null && accuracy < 80) status = 'Improving';
  else if (total >= 4 && accuracy !== null && accuracy >= 80) status = 'Mastered';
  const weak = concepts.map(c => ({id:c.id, term:c.term, stat: conceptAccuracy(c.id)}))
                        .filter(c => c.stat && c.stat.accuracy < 70)
                        .sort((a,b)=>a.stat.accuracy-b.stat.accuracy);
  return { lo, total, correct, accuracy, status, weak, concepts };
}
function statusClass(status){
  return {'Not Started':'notstarted','Learning':'learning','Improving':'improving','Mastered':'mastered'}[status] || 'notstarted';
}
function chapterMastery(chapterId){
  const los = CONTENT.learningObjectives.filter(l => l.chapterId === chapterId);
  if (!los.length) return 0;
  const accs = los.map(l => { const s = loStats(l.id); return s.accuracy===null?0:s.accuracy; });
  return Math.round(accs.reduce((a,b)=>a+b,0)/los.length);
}

// ================= WEEKLY STUDY SESSION (gated chapter flow) =================
function getFlow(chapterId){
  if (!PROGRESS.chapterFlow) PROGRESS.chapterFlow = {};
  if (!PROGRESS.chapterFlow[chapterId]){
    PROGRESS.chapterFlow[chapterId] = {
      termsOpened: [], sectionsViewed: [], flashcardsReviewed: [],
      quiz: { pool: [], attempted: [], missedEver: [], missQueue: [], round: 0, completed: false, topicMisses: {} }
    };
  }
  const f = PROGRESS.chapterFlow[chapterId];
  if (!f.quiz.topicMisses) f.quiz.topicMisses = {};
  return f;
}
function markTermOpened(chapterId, conceptId){
  const flow = getFlow(chapterId);
  if (!flow.termsOpened.includes(conceptId)){
    flow.termsOpened.push(conceptId);
    saveProgress();
    if (MAIN_MODE === 'flow') renderFlowPanel();
  }
}
function markFlashcardReviewed(chapterId, conceptId){
  if (!chapterId) return;
  const flow = getFlow(chapterId);
  if (!flow.flashcardsReviewed.includes(conceptId)){
    flow.flashcardsReviewed.push(conceptId);
    saveProgress();
  }
}
function chapterSectionList(chapterId){
  const los = CONTENT.learningObjectives.filter(l => l.chapterId === chapterId);
  const list = [];
  los.forEach(lo => {
    const secs = CONTENT.loProse[lo.code] || [];
    secs.forEach((s, idx) => list.push({ key: lo.code+'::'+idx, loCode: lo.code, idx, heading: s.heading, html: s.html }));
  });
  return list;
}
function markSectionViewed(chapterId, key){
  const flow = getFlow(chapterId);
  if (!flow.sectionsViewed.includes(key)){
    flow.sectionsViewed.push(key);
    saveProgress();
    renderFlowStageBarOnly();
  }
}
function chapterQuizPool(chapterId){
  return CONTENT.quiz.filter(q => q.chapterId === chapterId).map(q => q.id);
}
function chapterFlowProgress(chapterId){
  const flow = getFlow(chapterId);
  const sections = chapterSectionList(chapterId);
  const terms = conceptsForChapter(chapterId);
  const termIds = terms.map(t=>t.id);
  const pool = chapterQuizPool(chapterId);

  const sectionsViewedN = flow.sectionsViewed.filter(k => sections.some(s=>s.key===k)).length;
  const termsOpenedN = flow.termsOpened.filter(id => termIds.includes(id)).length;
  const flashReviewedN = flow.flashcardsReviewed.filter(id => termIds.includes(id)).length;
  const quizAttemptedN = flow.quiz.attempted.filter(id => pool.includes(id)).length;

  const readingPct = sections.length ? sectionsViewedN/sections.length : 1;
  const termsPct = terms.length ? termsOpenedN/terms.length : 1;
  const flashPct = terms.length ? flashReviewedN/terms.length : 1;
  const quizPct = pool.length ? quizAttemptedN/pool.length : 1;
  const missedTotal = flow.quiz.missedEver.length;
  const correctedCount = Math.max(0, missedTotal - flow.quiz.missQueue.length);
  const masteryPct = missedTotal ? correctedCount/missedTotal : (flow.quiz.completed ? 1 : 0);

  const pctTotal = Math.round(15*readingPct + 25*termsPct + 25*flashPct + 25*quizPct + 10*masteryPct);

  const readingDone = sections.length===0 || sectionsViewedN>=sections.length;
  const termsDone = terms.length===0 || termsOpenedN>=terms.length;
  const flashDone = terms.length===0 || flashReviewedN>=terms.length;
  const quizDone = pool.length===0 || quizAttemptedN>=pool.length;
  const masteryDone = quizDone && flow.quiz.missQueue.length===0;

  return {
    pct: Math.max(0, Math.min(100, pctTotal)),
    sections, terms, pool,
    readingDone, termsDone, flashDone, quizDone, masteryDone,
    sectionsViewedN, sectionsTotal: sections.length,
    termsOpenedN, termsTotal: terms.length,
    flashReviewedN, flashTotal: terms.length,
    quizAttemptedN, quizTotal: pool.length,
    missedTotal, correctedCount,
    complete: readingDone && termsDone && flashDone && quizDone && masteryDone
  };
}
function nextFlowStage(chapterId){
  const p = chapterFlowProgress(chapterId);
  if (!p.readingDone || !p.termsDone) return 'reading';
  if (!p.flashDone) return 'flashcards';
  if (!p.quizDone) return 'quiz';
  if (!p.masteryDone) return 'review';
  return 'complete';
}
function pickTargetChapterGated(){
  const chapters = CONTENT.course.chapters.map(id => CONTENT.chapters[id]);
  const notDone = chapters.filter(ch => !chapterFlowProgress(ch.id).complete);
  return (notDone[0] || chapters[chapters.length-1]).id;
}


// ---- Weekly goal + daily reminder system ----
function mondayOf(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}
function daysLeftInWeek(){
  const day = new Date().getDay(); // 0 = Sun
  return day === 0 ? 0 : 7 - day;
}
function pickTargetChapter(){ return pickTargetChapterGated(); }
function ensureWeeklyGoal(){
  const thisMonday = mondayOf(todayStr());
  if (!PROGRESS.weeklyGoal || PROGRESS.weeklyGoal.weekStart !== thisMonday){
    PROGRESS.weeklyGoal = { weekStart: thisMonday, chapterId: pickTargetChapter() };
    saveProgress();
  }
  return PROGRESS.weeklyGoal;
}
function notifPermissionLabel(){
  if (!('Notification' in window)) return 'Not supported on this device';
  if (Notification.permission === 'granted') return 'On';
  if (Notification.permission === 'denied') return 'Blocked \u2014 check your browser/OS notification settings';
  return 'Not enabled yet';
}
async function requestNotificationPermission(){
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  try{ return (await Notification.requestPermission()) === 'granted'; }
  catch(e){ return false; }
}
function registerServiceWorkerForNotifications(){
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => { /* fine if sw.js isn't hosted alongside this file */ });
  }
}
async function showLocalNotification(title, body){
  try{
    if (!('Notification' in window) || Notification.permission !== 'granted') return false;
    if ('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg){ await reg.showNotification(title, {body}); return true; }
    }
    new Notification(title, {body});
    return true;
  }catch(e){ return false; }
}
async function requestDailyReminderSetupIfNeeded(){
  registerServiceWorkerForNotifications();
  const goal = ensureWeeklyGoal();
  const today = todayStr();
  if (PROGRESS.lastReminderDate === today) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const ch = CONTENT.chapters[goal.chapterId];
  const mastery = chapterMastery(goal.chapterId);
  const daysLeft = daysLeftInWeek();
  if (mastery >= 90) return;
  const shown = await showLocalNotification(
    daysLeft > 0 ? `${daysLeft} day${daysLeft===1?'':'s'} left this week` : 'Last day of the week',
    `Chapter ${ch.number}: ${ch.title} is at ${mastery}% mastery. Let's close the gap before Sunday.`
  );
  if (shown){ PROGRESS.lastReminderDate = today; saveProgress(); }
}
function weakConceptsList(minAttempts){
  minAttempts = minAttempts || 1;
  return CONTENT.concepts
    .map(c => ({c, stat: conceptAccuracy(c.id)}))
    .filter(x => x.stat && x.stat.attempts >= minAttempts)
    .sort((a,b) => a.stat.accuracy - b.stat.accuracy)
    .slice(0, 12);
}
function flashcardsMasteredCount(){
  return Object.values(PROGRESS.flashcardStatus||{}).filter(v => v === 'know').length;
}

const SRS_INTERVALS = { didnt:0, almost:1, knew:3, easy:7 };
function rateRecall(conceptId, rating){
  const now = new Date();
  const cur = PROGRESS.srs[conceptId] || {interval:0, dueDate:todayStr(), lastRating:null, streak:0};
  let interval = SRS_INTERVALS[rating] ?? 1;
  if (rating === 'easy' && cur.lastRating === 'easy') interval = Math.min((cur.interval||1)*2, 30);
  const due = new Date(now.getTime() + interval*86400000).toISOString().slice(0,10);
  PROGRESS.srs[conceptId] = { interval, dueDate: due, lastRating: rating, streak: rating==='didnt'?0:(cur.streak||0)+1 };
  saveProgress();
}
function dueConcepts(chapterId){
  const today = todayStr();
  const all = chapterId ? conceptsForChapter(chapterId) : allConcepts();
  const due = all.filter(c => {
    const s = PROGRESS.srs[c.id];
    return !s || s.dueDate <= today;
  });
  due.sort((a,b) => (a.tier==='must_know'?0:1) - (b.tier==='must_know'?0:1));
  return due.length ? due : all;
}

function navigate(route, param){
  if (route === 'dashboard'){ setMainMode('dashboard'); return; }
  if (route === 'study'){ setMainMode('study'); if (param) scrollToChapterTop(param); return; }
  if (route === 'chapter'){ setMainMode('study'); scrollToChapterTop(param || 'ch1'); return; }
  if (route === 'lo'){ setMainMode('study'); jumpToLO(param); return; }
  if (route === 'concept'){ openConceptModal(param); return; }
  if (route === 'flashcards'){ setMainMode('practice'); setPracticeTab('flashcards'); return; }

  if (route === 'active-recall'){ setMainMode('practice'); setPracticeTab('recall'); return; }

  if (route === 'weak-areas'){ setMainMode('practice'); setPracticeTab('weak'); return; }
  if (route === 'study-session'){ setMainMode('practice'); setPracticeTab('session'); return; }
  if (route === 'highlights'){ setMainMode('progress'); setProgressTab('highlights'); return; }
  if (route === 'progress'){ setMainMode('progress'); setProgressTab('stats'); return; }
  if (route === 'flow'){ setMainMode('flow'); FLOW_CHAPTER = param || (PROGRESS.weeklyGoal && PROGRESS.weeklyGoal.chapterId) || pickTargetChapterGated(); FLOW_STAGE = null; FLOW_QUIZ_FEEDBACK = null; render(); return; }

function onSidebarSearch(){
  const q = this.value.trim().toLowerCase();
  const box = document.getElementById('sideSearchResults');
  if (q.length < 2){ box.innerHTML = ''; return; }
  const results = [];
  CONTENT.concepts.forEach(c => {
    const hay = [c.term, c.definition, c.plain, c.example].filter(Boolean).join(' ').toLowerCase();
    if (hay.includes(q)) results.push({kind:'concept', id:c.id, label:c.term, sub:'LO '+c.section});
  });
  CONTENT.learningObjectives.forEach(lo => {
    if (lo.text.toLowerCase().includes(q)) results.push({kind:'lo', id:lo.id, label:'LO '+lo.code, sub:lo.text.slice(0,50)});
  });
  if (!results.length){ box.innerHTML = '<div class="side-search-item">No matches</div>'; return; }
  box.innerHTML = results.slice(0,20).map((r,i) => `<div class="side-search-item" data-i="${i}">${r.label}<span class="ssi-sub">${r.sub}</span></div>`).join('');
  box._results = results;
  box.querySelectorAll('.side-search-item').forEach(item => {
    item.addEventListener('click', () => {
      const r = box._results[parseInt(item.dataset.i,10)];
      if (!r) return;

function attachHighlightHandlers(panel){
  panel.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      if (hlCategory === sw.dataset.cat){ hlCategory = null; panel.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected')); }
      else { hlCategory = sw.dataset.cat; panel.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected', s===sw)); }
    });
  });
  const clearBtn = panel.querySelector('#hlClearBtn');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    panel.querySelectorAll('mark.uhl').forEach(unwrapMark);
    PROGRESS.highlights = [];
    saveProgress();
  });
  panel.addEventListener('mouseup', (e) => {
    if (e.target.tagName === 'MARK' && e.target.classList.contains('uhl')){
      const id = e.target.dataset.hid;
      unwrapMark(e.target);
      if (id){ PROGRESS.highlights = PROGRESS.highlights.filter(h=>h.id!==id); saveProgress(); }
      return;
    }
    if (!hlCategory) return;
    if (e.target.closest('.hl-toolbar') || e.target.closest('table.gloss')) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    if (!panel.contains(sel.anchorNode)) return;
    const text = sel.toString().trim();
    if (!text || text.length < 2) return;
    try{
      const range = sel.getRangeAt(0);
      const mark = document.createElement('mark');
      const hid = uid('hl');
      mark.className = 'uhl'; mark.dataset.hid = hid;
      mark.style.background = hlCatColor(hlCategory);
      range.surroundContents(mark);
      sel.removeAllRanges();
      const sourceSec = mark.closest('section.lo');
      PROGRESS.highlights.push({ id:hid, ts:Date.now(), text, category:hlCategory, note:'',
        source:{ type:'lo', id: sourceSec ? sourceSec.id.replace('sec-','') : '', label: sourceSec ? sourceSec.querySelector('h2').textContent : 'Study text' } });
      saveProgress(); addXP(1);
      toast('Highlight saved ('+hlCategory+')');
    }catch(err){ sel.removeAllRanges(); }
  });
}
function unwrapMark(m){
  const parent = m.parentNode;
  while (m.firstChild) parent.insertBefore(m.firstChild, m);
  parent.removeChild(m);
  parent.normalize();
}

  if (perfectQuiz) b.push('Perfect Exam');

function shuffleArr(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

/* ================= MATCH GAME (rounds of 6) ================= */
let matchGame = { round:0, matched:0, selectedKey:null, rounds:[] };
function initMatchGame(){
  const pool = pickSpreadConcepts(18);
  const rounds = [];
  for (let i=0;i<pool.length;i+=6) rounds.push(pool.slice(i,i+6));
  matchGame = { round:0, matched:0, selectedKey:null, rounds };
  _matchedKeys = [];
}
function pickSpreadConcepts(max){
  const bySection = {};
  const order = [];
  allConcepts().forEach(c => {
    if (!bySection[c.section]){ bySection[c.section]=[]; order.push(c.section); }
    bySection[c.section].push(c);
  });
  const pool = []; let idx=0, more=true;
  while (pool.length < max && more){
    more = false;
    for (const sec of order){
      const arr = bySection[sec];
      if (arr[idx]){ pool.push(arr[idx]); more=true; if (pool.length>=max) break; }
    }
    idx++;
  }
  return shuffleArr(pool).slice(0,max);
}
function viewMatchGame(){
  if (!matchGame.rounds.length) initMatchGame();
  const roundConcepts = matchGame.rounds[matchGame.round];
  if (!roundConcepts) return '<div class="empty-state">Round data missing. <button class="btn small" data-action="matchRestart">Restart</button></div>';
  if (!matchGame._terms || matchGame._roundKey !== matchGame.round){
    const terms = roundConcepts.map((c,i)=>({key:'t'+i, text:c.term}));
    const defs = roundConcepts.map((c,i)=>({key:'t'+i, text:c.definition}));
    matchGame._terms = shuffleArr(terms);
    matchGame._defs = shuffleArr(defs);
    matchGame._roundKey = matchGame.round;
    matchGame.matched = 0; matchGame.selectedKey = null;
  }
  return `
    <div class="match-head"><span>Round ${matchGame.round+1} of ${matchGame.rounds.length}</span><span>Matched ${matchGame.matched} / ${roundConcepts.length}</span></div>
    <div class="match-grid">
      <div>${matchGame._terms.map(t=>`<button class="match-cell term-cell ${_matchedKeys.includes(t.key)?'correct':''} ${matchGame.selectedKey===t.key?'selected':''}" ${_matchedKeys.includes(t.key)?'disabled':''} data-action="matchTerm" data-key="${t.key}">${t.text}</button>`).join('')}</div>
      <div>${matchGame._defs.map(d=>`<button class="match-cell ${_matchedKeys.includes(d.key)?'correct':''}" ${_matchedKeys.includes(d.key)?'disabled':''} data-action="matchDef" data-key="${d.key}">${d.text}</button>`).join('')}</div>
    </div>
    <div id="matchFooter" style="text-align:center;margin-top:16px;"></div>
  `;
}

let xwState = null;
let xwChapter = 'ch1';
function buildCrossword(wordList){
  const GRID = 24;
  const grid = []; for (let r=0;r<GRID;r++) grid.push(new Array(GRID).fill(null));
  const placements = [];
  const words = shuffleArr(wordList.slice()).sort((a,b)=>b.answer.length-a.answer.length);

  function inb(r,c){ return r>=0 && c>=0 && r<GRID && c<GRID; }
  function get(r,c){ return inb(r,c) ? grid[r][c] : undefined; }
  function canPlace(answer,row,col,dir){
    for (let i=0;i<answer.length;i++){
      const r = dir==='down'?row+i:row, c = dir==='across'?col+i:col;
      if (!inb(r,c)) return false;
      const cell = grid[r][c];
      if (cell && cell!==answer[i]) return false;
      if (!cell){
        if (dir==='across'){ if (get(r-1,c) || get(r+1,c)) return false; }
        else { if (get(r,c-1) || get(r,c+1)) return false; }
      }
    }
    if (dir==='across'){ if (get(row,col-1) || get(row,col+answer.length)) return false; }
    else { if (get(row-1,col) || get(row+answer.length,col)) return false; }
    return true;
  }
  function place(answer,row,col,dir){
    for (let i=0;i<answer.length;i++){ const r=dir==='down'?row+i:row, c=dir==='across'?col+i:col; grid[r][c]=answer[i]; }
  }

  const first = words[0];
  const startRow = Math.floor(GRID/2), startCol = Math.floor((GRID-first.answer.length)/2);
  place(first.answer, startRow, startCol, 'across');
  placements.push({answer:first.answer, clue:first.clue, row:startRow, col:startCol, dir:'across'});

  for (let wi=1; wi<words.length; wi++){
    const w = words[wi];
    let best = null;
    for (let pi=0; pi<placements.length && !best; pi++){
      const p = placements[pi];
      for (let i=0;i<w.answer.length && !best;i++){
        for (let j=0;j<p.answer.length && !best;j++){
          if (w.answer[i] !== p.answer[j]) continue;
          const dir = p.dir==='across' ? 'down' : 'across';
          let row,col;
          if (dir==='down'){ row=p.row-i; col=p.col+j; } else { row=p.row+j; col=p.col-i; }
          if (canPlace(w.answer,row,col,dir)) best = {row,col,dir};
        }
      }
    }
    if (best){ place(w.answer,best.row,best.col,best.dir); placements.push({answer:w.answer,clue:w.clue,row:best.row,col:best.col,dir:best.dir}); }
    else {
      outer: for (let r2=0;r2<GRID;r2++){
        for (let c2=0;c2<=GRID-w.answer.length;c2++){
          if (canPlace(w.answer,r2,c2,'across')){ place(w.answer,r2,c2,'across'); placements.push({answer:w.answer,clue:w.clue,row:r2,col:c2,dir:'across'}); break outer; }
        }
      }
    }
  }

  let minR=GRID,maxR=0,minC=GRID,maxC=0;
  placements.forEach(p => {
    const r2 = p.dir==='down'?p.row+p.answer.length-1:p.row;
    const c2 = p.dir==='across'?p.col+p.answer.length-1:p.col;
    minR=Math.min(minR,p.row); maxR=Math.max(maxR,r2); minC=Math.min(minC,p.col); maxC=Math.max(maxC,c2);
  });
  placements.forEach(p => { p.row-=minR; p.col-=minC; });
  const rows = maxR-minR+1, cols = maxC-minC+1;

  const hasLetter=[]; for(let r=0;r<rows;r++) hasLetter.push(new Array(cols).fill(false));
  const solution=[]; for(let r=0;r<rows;r++) solution.push(new Array(cols).fill(null));
  placements.forEach(p => { for(let i=0;i<p.answer.length;i++){ const r=p.dir==='down'?p.row+i:p.row, c=p.dir==='across'?p.col+i:p.col; hasLetter[r][c]=true; solution[r][c]=p.answer[i]; } });
  const numberGrid=[]; for(let r=0;r<rows;r++) numberGrid.push(new Array(cols).fill(null));
  let num=1;
  for (let r=0;r<rows;r++){
    for (let c=0;c<cols;c++){
      if (!hasLetter[r][c]) continue;
      const startsAcross = (c===0 || !hasLetter[r][c-1]) && (c+1<cols && hasLetter[r][c+1]);
      const startsDown = (r===0 || !hasLetter[r-1][c]) && (r+1<rows && hasLetter[r+1][c]);
      if (startsAcross || startsDown){ numberGrid[r][c]=num; num++; }
    }
  }
  placements.forEach(p => { p.number = numberGrid[p.row][p.col]; });
  placements.sort((a,b) => a.number-b.number || (a.dir>b.dir?1:-1));
  return { rows, cols, hasLetter, solution, numberGrid, placements };
}

function viewCrosswordGame(){
  if (!xwState) xwState = buildCrossword((CONTENT.crossword && CONTENT.crossword[xwChapter]) || []);
  const xw = xwState;
  const chapters = CONTENT.course.chapters.map(id => CONTENT.chapters[id]);
  let gridHtml = `<div class="xw-grid" style="grid-template-columns:repeat(${xw.cols},25px);grid-template-rows:repeat(${xw.rows},25px);display:grid;">`;
  for (let r=0;r<xw.rows;r++){
    for (let c=0;c<xw.cols;c++){
      if (!xw.hasLetter[r][c]) gridHtml += '<div class="xw-cell block"></div>';
      else {
        const n = xw.numberGrid[r][c];
        gridHtml += `<div class="xw-cell">${n?`<span class="xw-num">${n}</span>`:''}<input maxlength="1" data-r="${r}" data-c="${c}"></div>`;
      }
    }
  }
  gridHtml += '</div>';
  const across = xw.placements.filter(p=>p.dir==='across');
  const down = xw.placements.filter(p=>p.dir==='down');
  const cluesHtml = `<div class="xw-clues"><h4>Across</h4><ul style="list-style:none;padding-left:0;">${across.map(p=>`<li>${p.number}. ${p.clue}</li>`).join('')}</ul>
    <h4>Down</h4><ul style="list-style:none;padding-left:0;">${down.map(p=>`<li>${p.number}. ${p.clue}</li>`).join('')}</ul></div>`;
  return `
    <div class="xw-toolbar">
      <label style="margin:0;">Chapter:</label>
      <select id="xwChapterSelect" style="width:auto;">${chapters.map(ch=>`<option value="${ch.id}" ${xwChapter===ch.id?'selected':''}>Chapter ${ch.number}</option>`).join('')}</select>
      <button class="btn small" data-action="xwCheck">Check answers</button>
      <button class="btn small" data-action="xwReveal">Reveal answers</button>
      <button class="btn small" data-action="xwNew">New layout</button>
    </div>
    <div class="xw-wrap">${gridHtml}${cluesHtml}</div>
  `;
}

  {id:'speed', title:'Speed Round', desc:'Answer quick questions against a timer.'},
  {id:'whoami', title:'Who Am I?', desc:'Read the clues, guess the concept.'},
  {id:'fillgap', title:'Fill the Gap', desc:'Complete the key statement or formula.'},
  {id:'orderit', title:'Order It', desc:'Place steps or stages in the correct order.'},
  {id:'twotruths', title:'Two Truths and a Trap', desc:'Spot the one incorrect statement.'},
  {id:'sort', title:'Concept Sort', desc:'Sort each concept into the chapter it belongs to.'},
  {id:'connections', title:'Concept Connections', desc:'Connect each concept to its most closely related idea.'},
  {id:'scenario', title:'Scenario Challenge', desc:'Apply concepts to realistic financial scenarios.'},
  {id:'boss', title:'Boss Battle', desc:'A hard, mixed-question final test covering the whole course.'},
];
let gameState = { type:null };
function viewGames(){
  return `
    <div class="panel-header"><h1>Mini Games</h1></div>
    <div class="grid grid-3">
      ${GAME_DEFS.map(g => `
        <div class="card clickable" data-action="startGame" data-game="${g.id}">
          <h4>${g.title}</h4>
          <p class="small-muted">${g.desc}</p>
        </div>`).join('')}
    </div>
  `;
}
function startGame(id){
  if (gameState && gameState.timerId){ clearInterval(gameState.timerId); }
  const pool = allConcepts().filter(c=>c.tier==='must_know');
  if (id === 'matching'){
    const picks = shuffleArr(pool).slice(0,6);
    const terms = shuffleArr(picks.map(c=>({id:c.id, text:c.term})));
    const defs = shuffleArr(picks.map(c=>({id:c.id, text:c.definition})));
    gameState = {type:'matching', picks, terms, defs, selectedTerm:null, matched:[], wrong:null};
  } else if (id === 'speed'){
    const qs = shuffleArr(CONTENT.quiz.filter(q=>['easy','medium'].includes(q.difficulty) && (q.type==='multiple_choice'||q.type==='true_false'))).slice(0,10);
    gameState = {type:'speed', qs, index:0, score:0, timeLeft:60, timerId:null, answered:false};
  } else if (id === 'whoami'){
    const items = shuffleArr(CONTENT.miniGames.whoAmI.slice());
    gameState = {type:'whoami', items, index:0, clueIdx:0, score:0, done:false};
  } else if (id === 'fillgap'){
    const items = shuffleArr(CONTENT.miniGames.fillTheGap.slice());
    gameState = {type:'fillgap', items, index:0, score:0, revealed:false};
  } else if (id === 'orderit'){
    const items = shuffleArr(CONTENT.miniGames.orderIt.slice());
    gameState = {type:'orderit', items, index:0, score:0, current:null, built:[]};
    setupOrderItRound();
  } else if (id === 'twotruths'){
    const items = shuffleArr(CONTENT.quiz.filter(q=>q.type==='two_truths_trap'));
    gameState = {type:'twotruths', items, index:0, score:0, answered:false};
  } else if (id === 'sort'){
    const items = shuffleArr(allConcepts()).slice(0,10);
    gameState = {type:'sort', items, index:0, score:0, answered:false};
  } else if (id === 'connections'){
    const pairs = buildConceptConnections();
    gameState = {type:'connections', pairs, index:0, score:0, answered:false};
  } else if (id === 'scenario'){
    const items = shuffleArr(CONTENT.quiz.filter(q=>q.type==='scenario' || q.type==='multiple_choice'));
    gameState = {type:'scenario', items:items.slice(0,8), index:0, score:0, answered:false};
  } else if (id === 'boss'){
    startQuiz({difficulty:['hard','exam'], count:999});
    return;
  }
  setPracticeTab('games');
}
function buildConceptConnections(){
  const CURATED = [
    ['ch1-corporation','ch1-shareholder-wealth-maximization'],
    ['ch1-agency-theory-agency-conflict','ch1-corporate-governance'],
    ['ch1-hostile-takeover','ch1-agency-theory-agency-conflict'],
    ['ch2-primary-markets','ch2-secondary-markets'],
    ['ch2-mutual-funds','ch2-hedge-funds'],
    ['ch2-efficient-markets-hypothesis-emh','ch2-behavioral-finance'],
    ['ch3-balance-sheet','ch3-income-statement'],
    ['ch3-nopat','ch3-free-cash-flow-fcf'],
    ['ch3-market-value-added-mva','ch3-economic-value-added-eva'],
  ];
  const all = allConcepts();
  return CURATED.map(([aId,bId]) => {
    const a = getConcept(aId), b = getConcept(bId);
    if (!a || !b) return null;
    const distractors = shuffleArr(all.filter(c=>c.id!==aId && c.id!==bId)).slice(0,3).map(c=>c.term);
    return { a, correct: b.term, options: shuffleArr([b.term, ...distractors]) };
  }).filter(Boolean);
}
function setupOrderItRound(){
  const item = gameState.items[gameState.index];
  if (!item) return;
  gameState.current = { correct: item.steps, shuffled: shuffleArr(item.steps) };
  gameState.built = [];
}
function viewGamePlay(id){
  const g = gameState;
  if (!g || g.type !== id) return `<div class="empty-state">Game session not found. <button class="btn small" data-action="nav" data-route="games">Back to Games</button></div>`;
  switch(id){
    case 'matching': return gameMatchingHTML();
    case 'speed': return gameSpeedHTML();
    case 'whoami': return gameWhoAmIHTML();
    case 'fillgap': return gameFillGapHTML();
    case 'orderit': return gameOrderItHTML();
    case 'twotruths': return gameTwoTruthsHTML();
    case 'sort': return gameSortHTML();
    case 'connections': return gameConnectionsHTML();
    case 'scenario': return gameScenarioHTML();
    default: return `<div class="empty-state">Unknown game.</div>`;
  }
}

function examResultsHTML(){
  const answers = examState.answers;
  const total = answers.length;
  const correct = answers.filter(a=>a.correct).length;
  const byLO = {};
  examState.questions.forEach((q,i)=>{ byLO[q.lo]=byLO[q.lo]||{correct:0,total:0}; byLO[q.lo].total++; if(answers[i]&&answers[i].correct) byLO[q.lo].correct++; });
  const strong = Object.keys(byLO).filter(lo=>byLO[lo].correct/byLO[lo].total >= 0.8);
  const weakLOs = Object.keys(byLO).filter(lo=>byLO[lo].correct/byLO[lo].total < 0.6);
  return `
    <div class="panel-header"><h1>Exam Results</h1></div>
    <div class="card" style="text-align:center; margin-bottom:20px;">
      <div class="stat-value" style="font-size:2.6rem;">${correct}/${total}</div>
      <div class="small-muted">${total?Math.round(100*correct/total):0}%</div>
    </div>

      <div class="card">
        <h3>Performance by LO</h3>
        ${Object.keys(byLO).sort().map(lo=>`<div class="flex-between" style="padding:5px 0;border-bottom:1px solid var(--rule);"><span>LO ${lo}</span><b>${byLO[lo].correct}/${byLO[lo].total}</b></div>`).join('')}

      <div class="card">
        <h3>Strong / Weak Areas</h3>
        <div><b>Strong:</b> ${strong.length?strong.map(l=>'LO '+l).join(', '):'—'}</div>
        <div><b>Weak:</b> ${weakLOs.length?weakLOs.map(l=>'LO '+l).join(', '):'—'}</div>
      </div>
    </div>
    <div class="wrap-row" style="margin-top:16px;">
      <button class="btn" data-action="examReviewMistakes">Personalized Review of Mistakes</button>
      <button class="btn secondary" data-action="examRestart">New Exam</button>
    </div>
  `;
}

function buildSessionPlan(minutes){
  const plan = [];
  const alloc = (pct)=>Math.max(2, Math.round(minutes*pct));
  plan.push({label:'Review weak concepts', minutes: alloc(0.2), action:'weak'});
  plan.push({label:'Flashcards', minutes: alloc(0.2), action:'flash'});
  plan.push({label:'Quiz questions', minutes: alloc(0.3), action:'quiz'});
  plan.push({label:'Mini-game', minutes: alloc(0.15), action:'game'});
  plan.push({label:'Active recall', minutes: alloc(0.15), action:'recall'});
  return plan;
}

// ---- Contextual source-number tracing (click a sourced number to see it light up everywhere it matches) ----
let srcTraceTimer = null;
function clearSrcTrace(){
  document.querySelectorAll('.src-box.active').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('tr.src-row-active').forEach(t => t.classList.remove('src-row-active'));
}
document.addEventListener('click', (e) => {
  const box = e.target.closest('.src-box');
  if (!box) return;
  const lnClass = [...box.classList].find(c => c.startsWith('ln-') || c.startsWith('ln2-'));
  if (!lnClass) return; // calc-result and other non-sourced boxes aren't traceable
  const isY2020 = box.classList.contains('y2020');
  clearTimeout(srcTraceTimer);
  clearSrcTrace();
  const matches = [...document.querySelectorAll('.src-box.' + lnClass)].filter(b => b.classList.contains('y2020') === isY2020);
  matches.forEach(m => {
    m.classList.add('active');
    const row = m.closest('tr');
    if (row) row.classList.add('src-row-active');
    const details = m.closest('details.src-fold');
    if (details && !details.open) details.open = true;
  });
  const scrollTarget = matches.find(m => m !== box) || matches[0];
  if (scrollTarget){
    scrollTarget.scrollIntoView({behavior:'smooth', block:'center'});

// ================= FLOW PANEL RENDER FUNCTIONS =================
let FLOW_CHAPTER = null;
let FLOW_STAGE = null;
let FLOW_QUIZ_FEEDBACK = null;
let flowFcIndex = 0;
let flowSectionObserver = null;

function currentFlowQuizQuestionId(chapterId, phase){
  const flow = getFlow(chapterId);
  if (phase === 'quiz') return flow.quiz.pool.find(id => !flow.quiz.attempted.includes(id));
  return flow.quiz.missQueue[0];
}
function buildAnswerUI(q){
  if (q.type === 'multiple_choice' || q.type === 'two_truths_trap'){
    return `<div class="flow-quiz-options">${q.options.map((opt,i)=>`<button class="flow-quiz-opt" data-action="flowQuizPick" data-val="${i}">${opt}</button>`).join('')}</div>`;
  }
  if (q.type === 'true_false'){
    return `<div class="flow-quiz-options">
      <button class="flow-quiz-opt" data-action="flowQuizPick" data-val="true">True</button>
      <button class="flow-quiz-opt" data-action="flowQuizPick" data-val="false">False</button>
    </div>`;
  }
  if (q.type === 'fill_blank'){
    return `<div class="wrap-row"><input type="text" id="flowFillInput" placeholder="Type your answer" style="flex:1;padding:9px 11px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper-2);color:var(--ink);">
      <button class="btn primary small" data-action="flowQuizSubmitFill">Submit</button></div>`;
  }
  if (q.type === 'matching'){
    const shuffledRights = shuffleArr(q.pairs.map(p=>p.right));
    return `<div id="flowMatchWrap">${q.pairs.map((p,i)=>`
      <div class="flex-between" style="margin-bottom:8px;">
        <span>${p.left}</span>
        <select id="flowMatchSel${i}" style="padding:6px 8px;border-radius:6px;background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);">
          <option value="">Select match...</option>
          ${shuffledRights.map(r=>`<option value="${r.replace(/"/g,'&quot;')}">${r}</option>`).join('')}
        </select>
      </div>`).join('')}
      <button class="btn primary small" data-action="flowQuizSubmitMatch" style="margin-top:8px;">Submit</button></div>`;
  }
  return '';
}
function checkFlowAnswer(q, response){
  if (q.type === 'multiple_choice' || q.type === 'two_truths_trap') return parseInt(response,10) === q.correctIndex;
  if (q.type === 'true_false') return (response === 'true') === q.correctAnswer;
  if (q.type === 'fill_blank'){
    const norm = (response||'').trim().toLowerCase();
    const accepted = (q.acceptableAnswers||[q.correctAnswer]).map(a=>String(a).toLowerCase());
    return accepted.includes(norm);
  }
  if (q.type === 'matching') return q.pairs.every((p,i) => response[i] === p.right);
  return false;
}
function flowCorrectAnswerLabel(q){
  if (q.type === 'multiple_choice' || q.type === 'two_truths_trap') return q.options[q.correctIndex];
  if (q.type === 'true_false') return q.correctAnswer ? 'True' : 'False';
  if (q.type === 'fill_blank') return q.correctAnswer;
  if (q.type === 'matching') return q.pairs.map(p=>`${p.left} \u2192 ${p.right}`).join('; ');
  return '';
}
function submitFlowQuizAnswer(response){
  const chapterId = FLOW_CHAPTER;
  const phase = FLOW_STAGE;
  const flow = getFlow(chapterId);
  const qid = currentFlowQuizQuestionId(chapterId, phase);
  if (!qid) return;
  const q = CONTENT.quiz.find(x=>x.id===qid);
  const correct = checkFlowAnswer(q, response);
  let yourAnswerLabel = '';
  if (q.type==='multiple_choice'||q.type==='two_truths_trap') yourAnswerLabel = q.options[parseInt(response,10)] ?? '(no answer)';
  else if (q.type==='true_false') yourAnswerLabel = response==='true'?'True':'False';
  else if (q.type==='fill_blank') yourAnswerLabel = response || '(blank)';
  else if (q.type==='matching') yourAnswerLabel = 'See correct pairing below';

  PROGRESS.quizAttempts.push({ id: uid('qa'), qid: q.id, concept: q.concept, correct, ts: Date.now() });

  if (phase === 'quiz'){
    if (!flow.quiz.attempted.includes(qid)) flow.quiz.attempted.push(qid);
    if (!correct && !flow.quiz.missedEver.includes(qid)){
      flow.quiz.missedEver.push(qid);
      flow.quiz.missQueue.push(qid);
      if (q.concept) flow.quiz.topicMisses[q.concept] = (flow.quiz.topicMisses[q.concept]||0)+1;
    }
  } else {
    flow.quiz.missQueue.shift();
    if (!correct){
      flow.quiz.missQueue.push(qid);
      flow.quiz.round++;
      if (q.concept) flow.quiz.topicMisses[q.concept] = (flow.quiz.topicMisses[q.concept]||0)+1;
    }
  }
  if (flow.quiz.attempted.length >= flow.quiz.pool.length && flow.quiz.missQueue.length===0) flow.quiz.completed = true;
  saveProgress();
  FLOW_QUIZ_FEEDBACK = { qid, correct, yourAnswerLabel };
  renderFlowPanel();
}
function renderFlowTopicBreakdown(chapterId){
  const flow = getFlow(chapterId);
  const entries = Object.entries(flow.quiz.topicMisses||{}).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) return '';
  return `<div style="text-align:left;max-width:360px;margin:0 auto;">
    <p class="small-muted" style="margin-bottom:6px;"><b>Topics That Needed Additional Practice:</b></p>
    <ol style="padding-left:20px;">
    ${entries.map(([cid,count])=>{ const c=getConcept(cid); return `<li>${c?c.term:cid} \u2014 ${count} mistake${count===1?'':'s'}</li>`; }).join('')}
    </ol>

}

        <b>${fb.correct?'\u2713 Correct':'\u2717 Incorrect'}</b>
        ${!fb.correct?`<div style="margin-top:6px;">Your Answer: ${fb.yourAnswerLabel}<br>Correct Answer: ${flowCorrectAnswerLabel(q)}</div>`:''}
      </div>

      <button class="btn primary" data-action="flowQuizNext">Continue \u2192</button>
    </div>`;
  }
  return `<div class="card">
    <div class="small-muted" style="margin-bottom:6px;">${phase==='review'?`Missed questions remaining: ${flow.quiz.missQueue.length}`:'Question '+(flow.quiz.attempted.length+1)+' of '+flow.quiz.pool.length}</div>

function wireFlowReading(chapterId){
  const container = document.getElementById('flowReadingSections');
  if (!container) return;
  container.querySelectorAll("span.term[data-cid]").forEach(span => {
    span.addEventListener('click', (e) => { e.stopPropagation(); openConceptModal(span.dataset.cid); });
  });
  if (flowSectionObserver) flowSectionObserver.disconnect();
  flowSectionObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio > 0.4){
        markSectionViewed(chapterId, entry.target.dataset.key);
      }
    });
  }, { threshold: [0.4] });
  container.querySelectorAll('.flow-reading-section').forEach(el => flowSectionObserver.observe(el));
}
