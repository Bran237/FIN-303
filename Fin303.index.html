 Debt \u00f7 (Total Debt + Total Equity)</div><ol class='step-list'><li><strong>Total debt</strong>: <span class='src-box ln-np y2021'>$110M</span> notes payable + <span class='src-box ln-ltb y2021'>$750M</span> long-term bonds = <span class='src-box calc-result'>$860 million</span>.</li><li><strong>Total equity</strong> (from the balance sheet): <span class='src-box ln-tce y2021'>$940 million</span>. Total capital = <span class='src-box calc-result'>$860M</span> + <span class='src-box ln-tce y2021'>$940M</span> = <span class='src-box calc-result'>$1,800 million</span>.</li><li><span class='src-box calc-result'>$860M</span> \u00f7 <span class='src-box calc-result'>$1,800M</span> = <strong><span class='src-box calc-result'>47.8%</span></strong>, versus an industry average of <strong>36.4%</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><p>Allied's debt ratio of 47.8% means its creditors have supplied roughly half of its total funds. Creditors generally prefer low debt ratios since a bigger equity cushion protects them if the firm liquidates; stockholders, on the other hand, may want more leverage if it can magnify expected earnings, as seen in the Firm U vs. Firm L comparison above. Because Allied's ratio exceeds the industry average by a wide margin, this is a red flag: creditors will likely be reluctant to lend Allied more money without it first raising additional equity, and management may be subjecting the firm to too much risk of bankruptcy if it tries to borrow substantially more.</p>"}, {"heading": "Times-interest-earned ratio (Section 4-4B)", "html": "<p>The <span class='term' data-cid='ch4-times-interest-earned-tie-ratio'>times-interest-earned (TIE) ratio</span> is determined by dividing EBIT by interest charges.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 times-interest-earned ratio</span><div class='formula-eq'>TIE = EBIT \u00f7 Interest Charges</div><ol class='step-list'><li><strong>EBIT</strong> (from the income statement, Chapter 3): <span class='src-box ln2-ebit y2021'>$278 million</span>.</li><li><strong>Interest charges</strong>: <span class='src-box ln2-int y2021'>$83 million</span>.</li><li><span class='src-box ln2-ebit y2021'>$278M</span> \u00f7 <span class='src-box ln2-int y2021'>$83M</span> = <strong><span class='src-box calc-result'>3.3\u00d7</span></strong>, versus an industry average of <strong>6.0\u00d7</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>The TIE ratio measures how far operating income can decline before a firm is unable to meet its annual interest costs; failure to pay interest brings legal action from creditors and can lead to bankruptcy. Note that EBIT, not net income, is used in the numerator \u2014 because interest is paid with pretax dollars, a firm's ability to pay current interest isn't affected by taxes. Allied's interest is covered only 3.3 times, versus 6.0 times for the industry average, reinforcing the debt ratio's conclusion: Allied would face real difficulties if it tried to borrow additional money.</p><table class='mini-table'><thead><tr><th>Ratio</th><th>Formula</th><th>Allied</th><th>Industry Avg.</th></tr></thead><tbody><tr><td>Total debt to total capital</td><td>Total Debt \u00f7 (Debt + Equity)</td><td>47.8%</td><td>36.4%</td></tr><tr><td>Times-interest-earned (TIE)</td><td>EBIT \u00f7 Interest Charges</td><td>3.3\u00d7</td><td>6.0\u00d7</td></tr></tbody></table>"}], "4.5": [{"heading": "Why profitability ratios matter (Section 4-5)", "html": "<p>Accounting statements reflect events that already happened, but they also provide clues about what's likely to happen in the future. Liquidity, asset management, and debt ratios tell part of the story about a firm's policies and operations; <span class='term' data-cid='ch4-profitability-ratios'>profitability ratios</span> reflect the net result of ALL of a firm's financing policies and operating decisions combined.</p>"}, {"heading": "Operating margin (Section 4-5A)", "html": "<p>The <span class='term' data-cid='ch4-operating-margin'>operating margin</span>, calculated by dividing operating income (EBIT) by sales, gives the operating profit earned per dollar of sales.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 operating margin</span><div class='formula-eq'>Operating Margin = EBIT \u00f7 Sales</div><ol class='step-list'><li><strong>EBIT</strong>: <span class='src-box ln2-ebit y2021'>$278 million</span>.</li><li><strong>Sales</strong>: <span class='src-box ln2-sales y2021'>$3,000 million</span>.</li><li><span class='src-box ln2-ebit y2021'>$278M</span> \u00f7 <span class='src-box ln2-sales y2021'>$3,000M</span> = <strong><span class='src-box calc-result'>9.3%</span></strong>, versus an industry average of <strong>10.0%</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>Allied's 9.3% operating margin is below the 10.0% industry average, a subpar result the chapter ties directly to Allied's high operating costs \u2014 consistent with the weak inventory turnover and DSO ratios already identified.</p>"}, {"heading": "Profit margin (Section 4-5B)", "html": "<p>The <span class='term' data-cid='ch4-profit-margin'>profit margin</span>, sometimes called the net profit margin, is calculated by dividing net income by sales.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 profit margin</span><div class='formula-eq'>Profit Margin = Net Income \u00f7 Sales</div><ol class='step-list'><li><strong>Net income</strong>: <span class='src-box ln2-ni y2021'>$146.3 million</span>.</li><li><strong>Sales</strong>: <span class='src-box ln2-sales y2021'>$3,000 million</span>.</li><li><span class='src-box ln2-ni y2021'>$146.3M</span> \u00f7 <span class='src-box ln2-sales y2021'>$3,000M</span> = <strong><span class='src-box calc-result'>4.9%</span></strong>, versus an industry average of <strong>6.0%</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>Allied's 4.9% profit margin is below the 6.0% industry average for two reasons: first, its operating margin is already below average due to high operating costs; second, its profit margin is further hurt by its heavier use of debt. Consider two firms with identical sales, operating costs, and operating income, where one simply uses more debt than the other \u2014 the more indebted firm pays more interest, which pulls down net income even though operations are identical, producing a lower profit margin purely from financing choices. It's also worth remembering that a high margin alone isn't the whole picture: a firm that prices very high may earn a strong margin per sale but fail to make many sales, producing a high margin but low overall net income.</p>"}, {"heading": "Return on total assets (Section 4-5C)", "html": "<p>Net income divided by total assets gives the <span class='term' data-cid='ch4-return-on-total-assets-roa'>return on total assets (ROA)</span>.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 return on total assets</span><div class='formula-eq'>ROA = Net Income \u00f7 Total Assets</div><ol class='step-list'><li><strong>Net income</strong>: <span class='src-box ln2-ni y2021'>$146.3 million</span>.</li><li><strong>Total assets</strong>: <span class='src-box ln-ta y2021'>$2,000 million</span>.</li><li><span class='src-box ln2-ni y2021'>$146.3M</span> \u00f7 <span class='src-box ln-ta y2021'>$2,000M</span> = <strong><span class='src-box calc-result'>7.3%</span></strong>, versus an industry average of <strong>10.8%</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></the de cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>Allied's 7.3% ROA is well below the 10.8% industry average \u2014 generally not a good sign. But a low ROA can also result from a conscious decision to use a lot of debt (as is partly the case for Allied), since the resulting high interest expense pulls net income down. The chapter's broader lesson: never judge a company from a single ratio \u2014 look at a number of ratios, see what each suggests, and only then form a judgment about overall performance and what actions the firm should take to improve.</p><table class='mini-table'><thead><tr><th>Ratio</th><th>Formula</th><th>Allied</th><th>Industry Avg.</th></tr></thead><tbody><tr><td>Operating margin</td><td>EBIT \u00f7 Sales</td><td>9.3%</td><td>10.0%</td></tr><tr><td>Profit margin</td><td>Net Income \u00f7 Sales</td><td>4.9%</td><td>6.0%</td></tr><tr><td>Return on total assets (ROA)</td><td>Net Income \u00f7 Total Assets</td><td>7.3%</td><td>10.8%</td></tr></tbody></table>"}, {"heading": "Return on common equity (Section 4-5D)", "html": "<p>Another important accounting ratio is the <span class='term' data-cid='ch4-return-on-common-equity-roe'>return on common equity (ROE)</span>.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 return on common equity</span><div class='formula-eq'>ROE = Net Income \u00f7 Common Equity</div><ol class='step-list'><li><strong>Net income</strong>: <span class='src-box ln2-ni y2021'>$146.3 million</span>.</li><li><strong>Common equity</strong>: <span class='src-box ln-tce y2021'>$940 million</span>.</li><li><span class='src-box ln2-ni y2021'>$146.3M</span> \u00f7 <span class='src-box ln-tce y2021'>$940M</span> = <strong><span class='src-box calc-result'>15.6%</span></strong>, versus an industry average of <strong>18.7%</strong>.</li></ol></div><details reciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>ROIC differs from ROA in two ways: its return is based on total invested capital rather than total assets, and its numerator uses after-tax operating income (NOPAT) rather than net income. The key difference is that net income subtracts the firm's after-tax interest expense and so represents only the income available to shareholders, while NOPAT is the amount of funds available to pay both stockholders AND debtholders.</p><div class='example'><span class='example-label'>Worked practice example (from the chapter's Quick Question)</span>A company has $20 billion of sales and $1 billion of net income. Total assets equal total invested capital of $10 billion, split half debt and half common equity. The interest rate is 5% and the tax rate is 25%.<br><br><strong>a. Profit margin</strong> = Net Income \u00f7 Sales = $1B \u00f7 $20B = <strong>5%</strong>.<br><strong>b. ROA</strong> = Net Income \u00f7 Total Assets = $1B \u00f7 $10B = <strong>10%</strong>.<br><strong>c. ROE</strong> = Net Income \u00f7 Common Equity = $1B \u00f7 $5B = <strong>20%</strong>.<br><strong>d. ROIC</strong> \u2014 first find EBIT by working up the income statement: Interest = 0.05 \u00d7 $5B debt = $250,000,000. EBT = Net income \u00f7 (1 \u2212 0.25) = $1,000,000,000 \u00f7 0.75 = $1,333,333,333. EBIT = EBT + Interest = $1,583,333,333. ROIC = EBIT(1\u2212T) \u00f7 Total invested capital = $1,583,333,333(0.75) \u00f7 $10,000,000,000 = <strong>11.9%</strong>.<br><strong>e.</strong> If the firm used less debt, net income would rise (less interest expense) while total assets stay the same \u2014 so <strong>ROA would increase</strong>. (ROIC, by contrast, would stay unchanged, since NOPAT and total invested capital aren't affected by how the capital is split between debt and equity.)</div>"}, {"heading": "Basic earning power ratio (Section 4-5F)", "html": "<p>The <span class='term' data-cid='ch4-basic-earning-power-bep-ratio'>basic earning power (BEP) ratio</span> is calculated by dividing operating income (EBIT) by total assets.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 basic earning power</span><div class='formula-eq'>BEP = EBIT \u00f7 Total Assets</div><ol class='step-list'><li><strong>EBIT</strong>: <span class='src-box ln2-ebit y2021'>$278 million</span>.</li><li><strong>Total assets</strong>: <span class='src-box ln-ta y2021'>$2,000 million</span>.</li><li><span class='src-box ln2-ebit y2021'>$278M</span> \u00f7 <span class='src-box ln-ta y2021'>$2,000M</span> = <strong><span class='src-box calc-result'>13.9%</span></strong>, versus an industry average of <strong>18.0%</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>This ratio shows the raw earning power of a firm's assets before the influence of taxes and debt, which makes it useful when comparing firms with different debt and tax situations. Because of its low turnover ratios and poor profit margin on sales, Allied has a lower BEP ratio than the average food processing company.</p>"}], "4.6": [{"heading": "Market value ratios (Section 4-6)", "html": "<p>ROE reflects the effects of all of the other ratios, and it is the single best accounting measure of performance. Investors like a high ROE, and high ROEs are correlated with high stock prices. However, other things come into play \u2014 financial leverage generally increases ROE but also raises a firm's risk, so if a high ROE is achieved using a great deal of debt, the stock price might end up lower than if the firm had used less debt and had a lower ROE. The chapter's final set of ratios \u2014 the <span class='term' data-cid='ch4-market-value-ratios'>market value ratios</span>, which relate a stock's price to its earnings and book value price \u2014 help address this: if the liquidity, asset management, debt management, and profitability ratios all look good, and if investors believe those ratios will continue to look good in the future, the market value ratios will be high, the stock price will be as high as can be expected, and management will be judged as having done a good job.</p><p>Market value ratios are used in three primary ways: by investors deciding whether to buy or sell a stock, by investment bankers setting the share price for a new stock issue (an IPO), and by firms deciding how much to offer for another firm in a potential merger.</p>"}, {"heading": "Price/earnings ratio (Section 4-6A)", "html": "<p>The <span class='term' data-cid='ch4-price-earnings-pe-ratio'>price/earnings (P/E) ratio</span> shows how much investors are willing to pay per dollar of reported profits.</p><div class='formula-box'><span class='formula-label'>Formula \u2014 price/earnings ratio</span><div class='formula-eq'>P/E Ratio = Price per Share \u00f7 Earnings per Share</div><ol class='step-list'><li><strong>Price per share</strong>: <span class='src-box ln2-price y2021'>$23.06</span>.</li><li><strong>EPS</strong>: <span class='src-box ln2-eps y2021'>$1.95</span>.</li><li><span class='src-box ln2-price y2021'>$23.06</span> \u00f7 <span class='src-box ln2-eps y2021'>$1.95</span> = <strong><span class='src-box calc-result'>11.8\u00d7</span></strong>, versus an industry average of <strong>13.6\u00d7</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>P/E ratios are relatively high for firms with strong growth prospects and little risk, but low for slowly growing or risky firms. Allied's P/E is below its industry average, suggesting the company is regarded as relatively risky, as having poor growth prospects, or both.</p><p>P/E ratios vary considerably over time and across firms. In mid-2020, the S&P 500's P/E ratio was 18.90\u00d7. At that same point in time, Apple Inc. had a P/E of 22.07\u00d7, while Amazon, the world's highest-grossing online retailer, had a P/E of 77.87\u00d7. AFLAC, a supplemental health and life insurer whose industry had been impacted by the Affordable Care Act and related uncertainties, had a P/E ratio of just 7.83\u00d7.</p>"}, {"heading": "Market/book ratio (Section 4-6B)", "html": "<p>The ratio of a stock's market price to its book value gives another indication of how investors regard a company. For Allied, we first find its book value per share:</p><div class='formula-box'><span class='formula-label'>Formula \u2014 book value per share</span><div class='formula-eq'>Book Value per Share = Common Equity \u00f7 Shares Outstanding</div><div class='example'><span class='example-label'>Worked example \u2014 Allied</span><span class='src-box ln-tce y2021'>$940M</span> \u00f7 <span class='src-box ln2-shares y2021'>75M</span> shares = <strong><span class='src-box calc-result'>$12.53</span></strong></div></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><p>We then divide the market price per share by the book value per share to get the <span class='term' data-cid='ch4-market-book-mb-ratio'>market/book (M/B) ratio</span>:</p><div class='formula-box'><span class='formula-label'>Formula \u2014 market/book ratio</span><div class='formula-eq'>M/B Ratio = Market Price per Share \u00f7 Book Value per Share</div><ol class='step-list'><li><strong>Market price per share</strong>: <span class='src-box ln2-price y2021'>$23.06</span>.</li><li><strong>Book value per share</strong>: <span class='src-box calc-result'>$12.53</span>.</li><li><span class='src-box ln2-price y2021'>$23.06</span> \u00f7 <span class='src-box calc-result'>$12.53</span> = <strong><span class='src-box calc-result'>1.8\u00d7</span></strong>, versus an industry average of <strong>2.6\u00d7</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>Investors are willing to pay less for a dollar of Allied's book value than for one of an average food processing company. M/B ratios typically exceed 1.0, which means investors are willing to pay more for stocks than their accounting book values, as reported by accountants on corporate balance sheets \u2014 which do not reflect either inflation or goodwill. Assets purchased years ago at pre-inflation prices are carried at their original costs even though inflation might have caused their actual values to rise substantially; successful companies' values rise above their historical costs, whereas unsuccessful ones have low M/B ratios.</p><p>This point is demonstrated by Alphabet Inc. (now the parent of Google) and MetLife, Inc.: in mid-March 2020, Alphabet's M/B ratio was 4.50\u00d7, while MetLife's was only 0.56\u00d7. Alphabet's stockholders now have $4.50 in market value per $1.00 of equity, whereas MetLife's stockholders have only $0.56 for each dollar they invested.</p>"}, {"heading": "Enterprise value/EBITDA ratio (Section 4-6C)", "html": "<p>In recent years, a lot of analysts have begun to focus intently on another key ratio, the <span class='term' data-cid='ch4-enterprise-value-ebitda-ratio'>enterprise value/EBITDA (EV/EBITDA) ratio</span>. Unlike the P/E and market/book ratios, both of which focus on the relative market value of a company's equity, the EV/EBITDA ratio looks at the relative market value of all of a company's key financial claims. One benefit of this approach is that unlike the P/E ratio, the EV/EBITDA ratio is not heavily influenced by a company's debt and tax circumstances. For Allied, we first find its <span class='term' data-cid='ch4-enterprise-value'>enterprise value (EV)</span> (in millions of dollars):</p><div class='formula-box'><span class='formula-label'>Formula \u2014 enterprise value</span><div class='formula-eq'>EV = Market Value of Equity + Market Value of Total Debt + Market Value of Other Financial Claims \u2212 Cash and Equivalents</div><ol class='step-list'><li><strong>Market value of equity</strong>: <span class='src-box ln2-price y2021'>$23.06</span> \u00d7 <span class='src-box ln2-shares y2021'>75M</span> shares = <span class='src-box calc-result'>$1,729.5 million</span>.</li><li><strong>Market value of total debt</strong> (assumed at book/par value): <span class='src-box ln-np y2021'>$110M</span> + <span class='src-box ln-ltb y2021'>$750M</span> = <span class='src-box calc-result'>$860 million</span>. Other financial claims (e.g., preferred stock): $0.</li><li><strong>Cash and equivalents</strong>: <span class='src-box ln-cash y2021'>$10 million</span>.</li><li><span class='src-box calc-result'>$1,729.5M</span> + <span class='src-box calc-result'>$860M</span> + $0 \u2212 <span class='src-box ln-cash y2021'>$10M</span> = <strong><span class='src-box calc-result'>$2,579.5 million</span></strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><p>The market value of equity is the total number of shares multiplied by the current stock price. Total debt includes long-term debt plus short-term interest-bearing debt. For simplicity, the market value of Allied's debt is assumed to equal its book value. Enterprise value also subtracts out the company's cash holdings \u2014 without this adjustment, a company with large cash holdings but inefficient operations would mistakenly appear to be outperforming a peer that is much more efficient but has less cash on hand.</p><p>Finally, we divide Allied's enterprise value by its 2021 EBITDA of $378 million:</p><div class='formula-box'><span class='formula-label'>Formula \u2014 EV/EBITDA</span><div class='formula-eq'>EV/EBITDA = Enterprise Value \u00f7 EBITDA</div><ol class='step-list'><li><strong>Enterprise value</strong>: <span class='src-box calc-result'>$2,579.5 million</span>.</li><li><strong>EBITDA</strong>: <span class='src-box calc-result'>$378 million</span>.</li><li><span class='src-box calc-result'>$2,579.5M</span> \u00f7 <span class='src-box calc-result'>$378M</span> = <strong><span class='src-box calc-result'>6.8\u00d7</span></strong>, versus an industry average of <strong>9.2\u00d7</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>Allied's EV/EBITDA ratio is significantly lower than the industry average, reinforcing the chapter's other calculations that the firm's operations are not run as efficiently as they could be.</p>"}], "4.7": [{"heading": "Tying the ratios together: the DuPont equation (Section 4-7)", "html": "<p>We've discussed many ratios, so it's useful to see how they work together to determine ROE. For this, we use the <span class='term' data-cid='ch4-dupont-equation'>DuPont equation</span>, a formula developed by the chemical giant's financial staff in the 1920s:</p><div class='formula-box'><span class='formula-label'>Formula 4.1 \u2014 the DuPont equation</span><div class='formula-eq'>ROE = ROA \u00d7 Equity Multiplier = Profit Margin \u00d7 Total Assets Turnover \u00d7 Equity Multiplier</div><ol class='step-list'><li><strong>Profit margin</strong> = Net Income \u00f7 Sales = <span class='src-box ln2-ni y2021'>$146.3M</span> \u00f7 <span class='src-box ln2-sales y2021'>$3,000M</span> = <strong><span class='src-box calc-result'>4.88%</span></strong>.</li><li><strong>Total assets turnover</strong> = Sales \u00f7 Total Assets = <span class='src-box ln2-sales y2021'>$3,000M</span> \u00f7 <span class='src-box ln-ta y2021'>$2,000M</span> = <strong><span class='src-box calc-result'>1.5 times</span></strong>.</li><li><strong><span class='term' data-cid='ch4-equity-multiplier'>Equity multiplier</span></strong> = Total Assets \u00f7 Total Common Equity = <span class='src-box ln-ta y2021'>$2,000M</span> \u00f7 <span class='src-box ln-tce y2021'>$940M</span> = <strong><span class='src-box calc-result'>2.13 times</span></strong>.</li><li><span class='src-box calc-result'>4.88%</span> \u00d7 <span class='src-box calc-result'>1.5</span> \u00d7 <span class='src-box calc-result'>2.13</span> = <strong><span class='src-box calc-result'>15.6%</span></strong>, versus the industry's 6.0% \u00d7 1.8 \u00d7 1.73 = <strong>18.7%</strong>.</li></ol></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details><details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details><p>The first term, the profit margin, tells how much the firm earns on its sales. This ratio depends primarily on costs and sales prices \u2014 if a firm can command a premium price and hold down its costs, its profit margin will be high, which will help its ROE.</p><p>The second term is the total assets turnover \u2014 a 'multiplier' that tells how many times the profit margin is earned each year. Allied earned 4.88% on each dollar of sales, and its assets were turned over 1.5 times each year, so its return on assets was 4.88% \u00d7 1.5 = 7.3%. Note, though, that this entire 7.3% return on assets belongs to the common stockholders \u2014 the bondholders earned a return in the form of interest, and that interest was deducted before we calculated net income. So the whole 7.3% return on assets belongs to the stockholders; the return on assets must therefore be adjusted upward to obtain the return on equity.</p><p>That brings us to the third term, the equity multiplier, which is the adjustment factor. Allied's assets are 2.13 times its equity, so we must multiply the 7.3% return on assets by the 2.13\u00d7 equity multiplier to arrive at its ROE of 15.6%.</p>"}, {"heading": "What the DuPont breakdown reveals, and how managers use it (Section 4-7, cont.)", "html": "<p>Note that ROE as calculated using the DuPont equation is identical to Allied's ROE calculated directly. What's the point of going through all the steps? The answer is that the DuPont equation helps us see WHY Allied's ROE is only 15.6% versus 18.7% for the industry: first, its profit margin is below average, indicating that its costs aren't being controlled as well as they should be and that it cannot charge premium prices. Second, because it uses more debt than most companies, its high interest charges also reduce its profit margin. Third, its total assets turnover is below the industry average, indicating it has more assets than it needs. Finally, because its equity multiplier is relatively high, its heavy use of debt offsets to some extent its low profit margin and turnover. However, the high debt ratio exposes Allied to above-average bankruptcy risk, so it might want to cut back on its financial leverage. But if it reduced its debt to the same level as the average firm in its industry without any other changes, its ROE would decline significantly, to 4.88% \u00d7 1.5 \u00d7 1.73 = <strong>12.66%</strong>.</p><p>Allied's management can use the DuPont equation to help identify ways to improve its performance. Focusing on the profit margin, its marketing people can study the effects of raising sales prices or introducing new products with higher margins. Its cost accountants can study various expense items and, working with engineers, purchasing agents, and other operating personnel, seek ways to cut costs. The credit manager can investigate ways to speed up collections, which would reduce accounts receivable and therefore improve the total assets turnover ratio. And the financial staff can analyze the effects of alternative debt policies, showing how changes in leverage would affect both the expected ROE and the risk of bankruptcy.</p><div class='example'><span class='example-label'>Concrete example \u2014 Allied's CEO acts on this analysis</span>As a result of this analysis, Ellen Jackson, Allied's chief executive officer (CEO), undertook a series of moves expected to cut operating costs by more than 20%. Jackson and Allied's other executives have a strong incentive to improve the firm's financial performance \u2014 their compensation depends on how well the company operates.</div>"}, {"heading": "Potential misuses of ROE (Section 4-8)", "html": "<p>Although ROE is an important measure of performance, we know that managers should strive to maximize shareholder wealth. If a firm takes steps that improve its ROE, does that mean shareholder wealth will also be increased? Not necessarily. Indeed, three problems are likely to arise if a firm relies too heavily on ROE to measure performance.</p><p><strong>First, ROE does not consider risk.</strong> Shareholders care about ROE, but they also care about risk. To illustrate, consider two divisions within the same firm: Division S has stable cash flows and a predictable 15% ROE. Division R has a 16% expected ROE, but its cash flows are quite risky, so the expected ROE may not materialize. If managers are compensated based only on the coming year's ROE, and if the expected ROEs were actually achieved during the coming year, Division R's manager would receive a higher bonus than S's, even though S might actually be creating more value for shareholders as a result of its lower risk.</p><p><strong>Second, ROE does not consider the amount of invested capital.</strong> To illustrate, consider a company choosing between two mutually exclusive projects: Project A calls for investing $50,000 at an expected ROE of 50%, while Project B calls for investing $1,000,000 at an expected ROE of 45%. The projects are equally risky, and the company's cost of capital is 10%. Project A has the higher ROE, but it is much smaller \u2014 Project B should be chosen because it would add more to shareholder value.</p><p><strong>Third, a focus on ROE can cause managers to turn down profitable projects.</strong> For example, suppose you manage a division of a large firm and the firm determines bonuses solely on the basis of ROE. You project that your division's ROE for the year will be an impressive 45%. Now you have an opportunity to invest in a large, low-risk project with an estimated ROE of 35%, which is well above the firm's 10% cost of capital. Even though this project is extremely profitable, you might still be reluctant to undertake it because it would reduce your division's average ROE and therefore your year-end bonus.</p>"}, {"heading": "Economic Value Added (EVA) versus net income (Section 4-8, box)", "html": "<p>As mentioned in Chapter 3, economic value added (EVA) is a measure of how much management has added to shareholders' wealth during the year. To better understand the idea behind EVA, let's look at Allied's 2021 numbers (in millions): Allied's total invested capital consists of $110 of notes payable, $750 of long-term debt, and $940 of common equity, totaling $1,800. Debt represents 47.78% of this total, and common equity is 52.22% of this total. To simplify things, we estimate its capital cost at 10%. Thus, the firm's total dollar cost of capital (which includes both debt and common equity) per year is 0.10 \u00d7 $1,800 = $180.</p><p>Now let's look at Allied's income statement: its operating income, EBIT, is <span class='src-box ln2-ebit y2021'>$278</span>, and its interest expense is <span class='src-box ln2-int y2021'>$83</span>. Therefore, its taxable income is <span class='src-box ln2-ebit y2021'>$278</span> \u2212 <span class='src-box ln2-int y2021'>$83</span> = <span class='src-box ln2-ebt y2021'>$195</span>. Taxes equal 25% of taxable income, or 0.25(<span class='src-box ln2-ebt y2021'>$195</span>) = <span class='src-box ln2-tax y2021'>$48.8</span>, so the firm's net income is <span class='src-box ln2-ni y2021'>$146.3</span>. Given this data, we can now calculate Allied's <span class='term' data-cid='ch3-economic-value-added-eva'>EVA</span>. The basic formula for EVA, as discussed in Chapter 3, is as follows:</p><div class='formula-box'><span class='formula-label'>Formula \u2014 EVA (revisited)</span><div class='formula-eq'>EVA = EBIT(1 \u2212 T) \u2212 (Total Invested Capital) \u00d7 (After-Tax % Cost of Capital)</div><div class='example'><span class='example-label'>Worked example \u2014 Allied</span>EVA = <span class='src-box ln2-ebit y2021'>$278</span>(1 \u2212 0.25) \u2212 (<span class='src-box calc-result'>$1,800</span>)(0.10) = <span class='src-box calc-result'>$208.5</span> \u2212 <span class='src-box calc-result'>$180</span> = <strong><span class='src-box calc-result'>$28.5 million</span></strong></div></div><details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</
