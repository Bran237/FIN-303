apterId": "ch3", "section": "3.1", "definition": "Total debt plus a firm's 'free,' non-interest-bearing liabilities such as accounts payable and accruals."}, {"id": "ch3-book-value-per-share", "term": "Book value per share", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "Total common equity divided by the number of shares outstanding."}, {"id": "ch3-earnings-per-share-eps", "term": "Earnings per share (EPS)", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "Net income divided by the number of common shares outstanding \u2014 often called 'the bottom line.'"}, {"id": "ch3-dividends-per-share-dps", "term": "Dividends per share (DPS)", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "Total dividends paid to common stockholders divided by the number of shares outstanding."}, {"id": "ch3-operating-income-ebit", "term": "Operating income (EBIT)", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "Earnings before interest and taxes \u2014 profit from a firm's core business, before financing and tax effects."}, {"id": "ch3-depreciation", "term": "Depreciation", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "A non-cash annual charge reflecting the estimated cost of tangible assets used up in production."}, {"id": "ch3-amortization", "term": "Amortization", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "A non-cash charge similar to depreciation, but for the decline in value of intangible assets like patents or goodwill."}, {"id": "ch3-ebitda", "term": "EBITDA", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "Earnings before interest, taxes, depreciation, and amortization \u2014 a rough proxy for cash generated by operations."}, {"id": "ch3-free-cash-flow-fcf", "term": "Free cash flow (FCF)", "tier": "must_know", "lo": "3.2", "chapterId": "ch3", "section": "3.2", "definition": "The amount of cash a firm could withdraw without harming its ability to operate and produce future cash flows.", "plain": "The actual spendable cash a company could hand to its investors without hurting its ability to keep running and growing.", "why": "Many analysts consider this THE single most important number in all of corporate finance \u2014 more important than net income \u2014 because it's what ultimately funds dividends, buybacks, and debt paydown.", "example": "A family pizza shop's accounting profit looks healthy, but most of it has to be reinvested in a kitchen renovation, leaving little cash the owners can actually take home.", "textbookExample": "Allied's 2021 FCF was calculated as \u2212$71.5 million, driven mainly by a one-time $230 million plant expansion rather than any operating weakness.", "commonMistake": "Negative FCF isn't automatically a red flag \u2014 fast-growing companies often have negative FCF simply because they're investing heavily, which can be a good sign if the investments pay off.", "examQuestion": "Write out the FCF formula from memory and explain what each bracketed term represents.", "mnemonic": "FCF = cash IN from operations (NOPAT + D&A) minus cash OUT for growth (CapEx + \u0394NOWC)."}, {"id": "ch3-nopat", "term": "NOPAT", "tier": "must_know", "lo": "3.2", "chapterId": "ch3", "section": "3.2", "definition": "Net operating profit after taxes \u2014 EBIT \u00d7 (1 \u2212 tax rate); the profit a firm would generate if it had no debt.", "plain": "The profit a company would have generated if it had zero debt at all \u2014 pure operating profit after tax, with financing stripped out.", "why": "It's the starting building block of both free cash flow and EVA, letting analysts compare operating performance across companies regardless of how they're financed.", "example": "Two companies with identical operations but different debt levels will have different net income, but the same NOPAT.", "textbookExample": "Allied's 2021 NOPAT = EBIT(1 \u2212 T) = $278M \u00d7 (1 \u2212 0.25) = $208.5 million.", "commonMistake": "NOPAT is NOT net income \u2014 it deliberately ignores interest expense (a financing cost), which is exactly why it lets you compare firms with different amounts of debt.", "examQuestion": "Calculate NOPAT for a firm with $200 million EBIT and a 25% tax rate.", "mnemonic": "NOPAT = EBIT \u00d7 (1 \u2212 Tax Rate)."}, {"id": "ch3-market-value-added-mva", "term": "Market value added (MVA)", "tier": "must_know", "lo": "3.2", "chapterId": "ch3", "section": "3.2", "definition": "The excess of the market value of a firm's equity over its book value.", "plain": "The gap between what the stock market currently says a company's equity is worth and what stockholders have actually put into the business over its whole history.", "why": "It's a real-time, market-based scorecard for management performance that book-value accounting alone can't capture.", "example": "A founder invests $500,000 in a startup that grows into a company worth $19.5 million in the market \u2014 the $19 million gap is MVA.", "textbookExample": "Allied's MVA = ($23.06 \u00d7 75 million shares) \u2212 $940 million book equity = $789.5 million.", "commonMistake": "MVA isn't purely a measure of skill \u2014 the chapter notes that a rising overall stock market lifts most firms' MVA, so some of it may not reflect management performance at all.", "examQuestion": "Calculate MVA for a firm with 10 million shares trading at $40 and book equity of $300 million.", "mnemonic": "MVA = Market Value of Equity \u2212 Book Value of Equity."}, {"id": "ch3-economic-value-added-eva", "term": "Economic value added (EVA)", "tier": "must_know", "lo": "3.2", "chapterId": "ch3", "section": "3.2", "definition": "NOPAT minus the annual dollar cost of all the capital used to generate it; a measure of true economic profit.", "plain": "A more granular, division-level version of MVA that checks whether after-tax operating profit actually beats what it cost to raise all the capital used to generate it.", "why": "Unlike ordinary net income, it charges for the cost of equity capital too, not just debt \u2014 giving a truer picture of whether a business is creating or destroying real economic value.", "example": "A division reports positive net income but is still destroying value if its returns don't even cover what its equity investors could have earned elsewhere for similar risk.", "textbookExample": "The chapter's worked example: $1 million of capital at a 10% after-tax cost generating $150,000 of NOPAT yields EVA of $50,000 in genuine economic profit.", "commonMistake": "Positive net income does NOT guarantee positive EVA \u2014 EVA can be negative even when accounting profit looks fine, since accounting income never subtracts the cost of equity.", "examQuestion": "Explain why a company can report positive net income yet have negative EVA.", "mnemonic": "EVA = NOPAT \u2212 (Capital \u00d7 Cost of Capital)."}, {"id": "ch3-progressive-tax", "term": "Progressive tax", "tier": "must_know", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "A tax system, like the U.S. individual income tax, in which higher incomes are taxed at higher rates.", "plain": "A tax system where the tax rate itself climbs as income climbs \u2014 the more you make, the higher percentage you pay on each additional dollar.", "why": "It's the reason marginal and average tax rates diverge, which trips up almost everyone the first time they calculate their own taxes.", "example": "The first $10,000 you earn might be taxed at 10%, while your next $30,000 gets taxed at 12%, and so on up the brackets.", "textbookExample": "The chapter's worked example: a single filer with $45,000 of taxable income pays $5,690 total, an average rate of 12.64% \u2014 well below their 22% marginal rate.", "commonMistake": "A common and costly mistake: assuming your entire income gets taxed at your top marginal rate. Only the last slice of income is taxed at that rate.", "examQuestion": "Explain, using the chapter's $45,000 example, why the average tax rate is lower than the marginal tax rate.", "mnemonic": null}, {"id": "ch3-marginal-tax-rate", "term": "Marginal tax rate", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "The tax rate applied to the last (next) dollar of a person's or firm's income."}, {"id": "ch3-average-tax-rate", "term": "Average tax rate", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "Total taxes paid divided by taxable income."}, {"id": "ch3-capital-gain", "term": "Capital gain", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "The profit from selling a capital asset (like stock) for more than its purchase price."}, {"id": "ch3-capital-loss", "term": "Capital loss", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "The loss from selling a capital asset for less than its purchase price."}, {"id": "ch3-traditional-ira", "term": "Traditional IRA", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "A retirement account where qualified contributions are tax-deductible now, with taxes deferred until withdrawal after age 59\u00bd."}, {"id": "ch3-roth-ira", "term": "Roth IRA", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "A retirement account funded with after-tax dollars, where qualified withdrawals (including all growth) are tax-free after age 59\u00bd."}, {"id": "ch3-alternative-minimum-tax-amt", "term": "Alternative Minimum Tax (AMT)", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "A parallel tax system designed to prevent high-income taxpayers from using deductions to avoid paying meaningful tax."}, {"id": "ch3-tax-cuts-and-jobs-act-tcja", "term": "Tax Cuts and Jobs Act (TCJA)", "tier": "must_know", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "The 2017 tax law that set a flat 21% corporate tax rate and made major changes to individual tax brackets and deductions.", "plain": "The sweeping 2017 tax overhaul that cut the corporate tax rate to a flat 21% and reshaped individual brackets, deductions, and depreciation rules.", "why": "Its changes ripple through nearly every other concept in this chapter \u2014 corporate tax bills, the debt-vs-equity financing decision, depreciation and capital budgeting, and personal tax planning all shifted because of it.", "example": "A corporation that previously paid close to 35% on its profits now pays a flat 21% federal rate, directly boosting its after-tax free cash flow.", "textbookExample": "The chapter notes most individual-side provisions (lower top rate, bigger standard deduction, capped SALT deduction) are set to sunset at the end of 2025, while most corporate provisions are largely permanent.", "commonMistake": "Don't assume every TCJA provision is permanent \u2014 the individual-side changes have a built-in 2025 sunset date that the corporate-side changes mostly don't share.", "examQuestion": "Name two individual-side and two corporate-side changes made by the TCJA.", "mnemonic": null}, {"id": "ch3-standard-deduction", "term": "Standard deduction", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "A fixed amount taxpayers can deduct from taxable income without itemizing individual deductions."}, {"id": "ch3-loss-carryforward", "term": "Loss carryforward", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "A tax provision letting a firm apply this year's net operating loss against future years' taxable income."}, {"id": "ch3-consolidated-tax-return", "term": "Consolidated tax return", "tier": "supporting", "lo": "3.3", "chapterId": "ch3", "section": "3.3", "definition": "A single tax return filed by a parent corporation and subsidiaries it owns 80% or more of, letting losses offset gains across the group."}, {"id": "ch4-ratio-analysis", "term": "Ratio analysis", "tier": "supporting", "lo": "4.1", "chapterId": "ch4", "section": "4.1", "definition": "Using relationships between financial statement numbers to evaluate a firm's financial condition and performance, and to compare it against other firms or against its own past."}, {"id": "ch4-liquidity-ratios", "term": "Liquidity ratios", "tier": "supporting", "lo": "4.1", "chapterId": "ch4", "section": "4.1", "definition": "Ratios that give an idea of a firm's ability to pay off debts that are maturing within a year."}, {"id": "ch4-asset-management-ratios", "term": "Asset management ratios", "tier": "supporting", "lo": "4.1", "chapterId": "ch4", "section": "4.1", "definition": "Ratios that give an idea of how efficiently a firm is using its assets to generate sales."}, {"id": "ch4-debt-management-ratios", "term": "Debt management ratios", "tier": "supporting", "lo": "4.1", "chapterId": "ch4", "section": "4.1", "definition": "Ratios that give an idea of how a firm has financed its assets, and its ability to meet long-term debt obligations."}, {"id": "ch4-profitability-ratios", "term": "Profitability ratios", "tier": "supporting", "lo": "4.1", "chapterId": "ch4", "section": "4.1", "definition": "Ratios that give an idea of how profitably a firm is operating and utilizing its assets."}, {"id": "ch4-market-value-ratios", "term": "Market value ratios", "tier": "supporting", "lo": "4.1", "chapterId": "ch4", "section": "4.1", "definition": "Ratios that give an idea of what investors think about a firm and its future prospects, based on its stock price."}, {"id": "ch4-current-ratio", "term": "Current ratio", "tier": "must_know", "lo": "4.2", "chapterId": "ch4", "section": "4.2", "definition": "Current assets divided by current liabilities; measures a firm's ability to pay off short-term obligations with assets expected to convert to cash within a year.", "formula": "Current Ratio = Current Assets \u00f7 Current Liabilities", "plain": "A quick gut-check on whether a company has enough short-term stuff (cash, receivables, inventory) to cover what it owes in the next year.", "why": "It's the most commonly cited liquidity ratio and the first thing creditors check before extending short-term credit.", "example": "A company with $500,000 in current assets and $250,000 in current liabilities has a current ratio of 2.0 \u2014 twice as many short-term assets as short-term debts.", "textbookExample": "Allied Food Products: $1,000M \u00f7 $310M = 3.2\u00d7, versus an industry average of 4.2\u00d7 \u2014 slightly weak, but not desperate.", "commonMistake": "A high current ratio isn't automatically good \u2014 it can mean the firm is sitting on too much old, unproductive inventory or too many uncollected receivables instead of managing cash efficiently.", "examQuestion": "A firm has current liabilities of $500 million and a current ratio of 2.0. What is its total current assets?", "mnemonic": "Current ratio = Current assets over Current liabilities \u2014 'current over current.'"}, {"id": "ch4-quick-ratio", "term": "Quick (acid-test) ratio", "tier": "must_know", "lo": "4.2", "chapterId": "ch4", "section": "4.2", "definition": "Current assets minus inventories, divided by current liabilities; a stricter liquidity test that excludes the least liquid current asset.", "formula": "Quick Ratio = (Current Assets \u2212 Inventories) \u00f7 Current Liabilities", "plain": "Like the current ratio, but it removes inventory first \u2014 because inventory is the current asset least likely to convert to cash quickly if the company needs money fast.", "why": "Inventory can be slow-moving or even obsolete, so backing it out gives a more conservative, realistic view of short-term solvency than the current ratio alone.", "example": "A retailer with lots of current assets tied up in unsold seasonal inventory looks fine on the current ratio but much weaker on the quick ratio.", "textbookExample": "Allied Food Products: ($1,000M \u2212 $615M) \u00f7 $310M = $385M \u00f7 $310M = 1.2\u00d7, versus an industry average of 2.2\u00d7.", "commonMistake": "Don't forget to subtract inventories from current assets before dividing \u2014 using the same numerator as the current ratio is the most common calculation error here.", "examQuestion": "A company's current ratio is 2.0 and its quick ratio is 1.6, with current liabilities of $500 million. How much inventory does it have?", "mnemonic": "Quick ratio = the 'no-inventory' version of the current ratio."}, {"id": "ch4-inventory-turnover-ratio", "term": "Inventory turnover ratio", "tier": "must_know", "lo": "4.3", "chapterId": "ch4", "section": "4.3", "definition": "Cost of goods sold divided by inventories; shows how many times a firm's inventory is sold and restocked during the year.", "formula": "Inventory Turnover = Cost of Goods Sold \u00f7 Inventories", "plain": "How many times a year a company completely sells through and replaces its inventory \u2014 higher generally means leaner, more efficient inventory management.", "why": "Excess inventory is unproductive and ties up capital that could be earning a return elsewhere, so this ratio flags whether a firm is overstocked.", "example": "A grocery store that restocks perishable items weekly will have a far higher inventory turnover than a car dealership that holds vehicles for months.", "textbookExample": "Allied Food Products: $2,100M \u00f7 $615M = 3.4\u00d7, versus an industry average of 7.6\u00d7 \u2014 suggesting Allied is holding too much inventory, some of which may be obsolete.", "commonMistake": "Sales are stated at market prices while inventory is carried at cost \u2014 using sales instead of cost of goods sold in the numerator overstates the true turnover.", "examQuestion": "A firm has annual sales of $100 million, cost of goods sold of $80 million, and inventory of $20 million. What is its inventory turnover ratio?", "mnemonic": "Turnover ratios all divide by an asset \u2014 this one divides Cost of goods sold by Inventory."}, {"id": "ch4-days-sales-outstanding-dso", "term": "Days sales outstanding (DSO)", "tier": "must_know", "lo": "4.3", "chapterId": "ch4", "section": "4.3", "definition": "Receivables divided by average sales per day; also called the average collection period (ACP), it measures how long a firm must wait after a sale before receiving cash.", "formula": "DSO = Receivables \u00f7 (Annual Sales \u00f7 365)", "plain": "On average, how many days it takes a company to actually collect cash after it makes a credit sale.", "why": "A high DSO relative to a firm's own credit terms is a red flag \u2014 it ties up cash in receivables and raises the risk that some customers never pay at all.", "example": "A company that requires payment within 30 days but has a DSO of 55 is effectively giving customers almost double the credit period it intended.", "textbookExample": "Allied Food Products: $375M \u00f7 ($3,000M \u00f7 365) = $375M \u00f7 $8.2192M = 45.6, rounded to 46 days \u2014 well above both the 36-day industry average and Allied's own 30-day credit policy.", "commonMistake": "Forgetting to convert annual sales into an average daily sales figure first (dividing by 365) before dividing into receivables.", "examQuestion": "Using the chapter's example, explain why Allied's 46-day DSO is a warning sign given its stated 30-day credit policy.", "mnemonic": "DSO tells you how many Days of Sales are still Outstanding (uncollected)."}, {"id": "ch4-fixed-assets-turnover-ratio", "term": "Fixed assets turnover ratio", "tier": "must_know", "lo": "4.3", "chapterId": "ch4", "section": "4.3", "definition": "Sales divided by net fixed assets; measures how effectively a firm uses its plant and equipment to generate sales.", "formula": "Fixed Assets Turnover = Sales \u00f7 Net Fixed Assets", "plain": "How many dollars of sales a company squeezes out of every dollar tied up in its plant and equipment.", "why": "It flags whether a firm has too much (or too little) fixed-asset capacity relative to what it's actually selling.", "example": "A factory running near full capacity around the clock will have a higher fixed assets turnover than an identical factory sitting half-idle.", "textbookExample": "Allied Food Products: $3,000M \u00f7 $1,000M = 3.0\u00d7, versus an industry average of 2.8\u00d7 \u2014 Allied is using its fixed assets about as intensively as its competitors.", "commonMistake": "Comparing an old firm's ratio (whose assets are heavily depreciated on the books) directly against a new firm's ratio can be misleading, since it may reflect asset age rather than true efficiency.", "examQuestion": "Why might an older firm show a higher fixed assets turnover ratio than an otherwise identical newer firm?", "mnemonic": null}, {"id": "ch4-total-assets-turnover-ratio", "term": "Total assets turnover ratio", "tier": "must_know", "lo": "4.3", "chapterId": "ch4", "section": "4.3", "definition": "Sales divided by total assets; measures the turnover of all of a firm's assets.", "formula": "Total Assets Turnover = Sales \u00f7 Total Assets", "plain": "The broadest efficiency measure \u2014 how many dollars of sales the whole balance sheet is generating, assets of every kind included.", "why": "It's the summary asset-utilization ratio, and a weak result here often traces back to specific problems in the narrower ratios (inventory, receivables, or fixed assets).", "example": "A capital-light software company will typically show a much higher total assets turnover than a capital-heavy airline, simply because it needs far fewer assets to generate the same sales.", "textbookExample": "Allied Food Products: $3,000M \u00f7 $2,000M = 1.5\u00d7, versus an industry average of 1.8\u00d7 \u2014 since Allied's fixed assets turnover was already in line with the industry, the shortfall traces back to excess inventory and slow receivables collection.", "commonMistake": "Treating this ratio as independent of the other asset management ratios \u2014 in practice it's really a composite of how well a firm manages inventory, receivables, and fixed assets together.", "examQuestion": "If a firm's fixed assets turnover matches the industry average but its total assets turnover is below average, what does that imply about its current assets?", "mnemonic": null}, {"id": "ch4-financial-leverage", "term": "Financial leverage", "tier": "must_know", "lo": "4.4", "chapterId": "ch4", "section": "4.4", "definition": "The use of debt financing; 'leveraging up' can raise a firm's return on equity (ROE) when it earns more on its assets than the interest rate it pays on debt, but it also increases risk.", "plain": "Borrowing money to fund the business, in hopes that what you earn with that borrowed money beats what it costs you in interest \u2014 the upside and downside both get bigger.", "why": "It explains why two firms with identical operations and identical EBIT can end up with very different ROE and very different risk \u2014 purely because of how each is financed.", "example": "Buying a rental property with a mortgage instead of paying all cash: if the property's return beats the mortgage rate, your personal return on the cash you invested goes up \u2014 but so does your risk if rents fall.", "textbookExample": "The chapter's Firm U vs. Firm L example: with identical sales and operating costs, all-equity Firm U's ROE ranges from 0% to 33.75% across bad-to-good conditions, while 50%-debt-financed Firm L's ROE swings much further \u2014 from \u221210% to 60% \u2014 because its fixed interest cost eats into results in bad years and is fully covered in good ones.", "commonMistake": "Assuming more debt always helps \u2014 leverage cuts both ways: it boosts ROE when times are good but can turn a firm's return sharply negative (as with Firm L's \u221210% ROE) when times are bad.", "examQuestion": "Using the Firm U vs. Firm L example, explain why Firm L's ROE is more volatile than Firm U's even though both firms have identical EBIT in every scenario.", "mnemonic": "Leverage = a lever \u2014 it amplifies whatever direction results are already moving, up or down."}, {"id": "ch4-total-debt-to-total-capital", "term": "Total debt to total capital ratio", "tier": "must_know", "lo": "4.4", "chapterId": "ch4", "section": "4.4", "definition": "Total debt divided by total capital (total debt plus total equity); measures the percentage of a firm's capital provided by debtholders.", "formula": "Total Debt to Total Capital = Total Debt \u00f7 (Total Debt + Total Equity)", "plain": "What share of a company's entire funding pie came from lenders rather than from stockholders.", "why": "Creditors prefer a low ratio here since it means a bigger equity cushion protects them if the firm runs into trouble; stockholders may want more debt since it can magnify their returns.", "example": "A firm funded by $30 million of debt and $70 million of equity has a debt-to-capital ratio of 30% \u2014 a relatively conservative capital structure.", "textbookExample": "Allied Food Products: total debt of $860M ($110M notes payable + $750M long-term bonds) divided by total capital of $1,800M ($860M debt + $940M equity) = 47.8%, versus an industry average of 36.4% \u2014 a red flag that could make lenders reluctant to extend Allied more credit without it first raising equity.", "commonMistake": "Total debt here means only interest-bearing debt (notes payable and bonds) \u2014 it does not include operating liabilities like accounts payable and accruals, which is a common point of confusion.", "examQuestion": "Why does the textbook exclude accounts payable and accruals from 'total debt' when calculating the total debt to total capital ratio?", "mnemonic": null}, {"id": "ch4-times-interest-earned-tie-ratio", "term": "Times-interest-earned (TIE) ratio", "tier": "must_know", "lo": "4.4", "chapterId": "ch4", "section": "4.4", "definition": "EBIT divided by interest charges; measures the extent to which operating income can decline before a firm is unable to meet its annual interest costs.", "formula": "TIE = EBIT \u00f7 Interest Charges", "plain": "How many times over a company's operating profit could cover its interest bill \u2014 a cushion measure against defaulting on debt.", "why": "Failing to pay interest can trigger legal action from creditors and potentially bankruptcy, so this ratio is a direct read on how much breathing room a firm has before that becomes a real risk.", "example": "A firm with $10 million of EBIT and $2 million of interest charges has a TIE of 5\u00d7 \u2014 its operating income could fall by 80% and it would still just cover its interest payments.", "textbookExample": "Allied Food Products: $278M \u00f7 $83M = 3.3\u00d7, versus an industry average of 6.0\u00d7 \u2014 reinforcing the debt ratio's conclusion that Allied would struggle to borrow additional money.", "commonMistake": "The numerator is EBIT (pretax, pre-interest), not net income \u2014 using net income understates the firm's true ability to cover interest, since interest itself is paid before tax is calculated.", "examQuestion": "Why does the TIE ratio use EBIT rather than net income in its numerator?", "mnemonic": "TIE = how many Times Interest is Earned by operating income."}, {"id": "ch4-operating-margin", "term": "Operating margin", "tier": "must_know", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Operating income (EBIT) divided by sales; gives the operating profit earned per dollar of sales.", "formula": "Operating Margin = EBIT \u00f7 Sales", "plain": "Out of every dollar in sales, how many cents are left over as pure operating profit, before interest and taxes get involved.", "why": "Because it excludes financing effects, it isolates whether a firm's core operations \u2014 pricing, cost control \u2014 are strong or weak, independent of how it's financed.", "example": "A firm with $10 million in sales and $1.2 million in EBIT has a 12% operating margin.", "textbookExample": "Allied Food Products: $278M \u00f7 $3,000M = 9.3%, versus an industry average of 10.0% \u2014 a subpar result the chapter ties directly to Allied's high operating costs, consistent with its weak inventory turnover and DSO.", "commonMistake": "Confusing operating margin with profit margin \u2014 operating margin uses EBIT (before interest and taxes), while profit margin uses net income (after both).", "examQuestion": "Explain why the chapter says Allied's low operating margin is 'consistent with' its earlier inventory turnover and DSO results.", "mnemonic": null}, {"id": "ch4-profit-margin", "term": "Profit margin", "tier": "must_know", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Net income divided by sales; also called the net profit margin, it shows how much of each sales dollar ultimately flows through to the bottom line.", "formula": "Profit Margin = Net Income \u00f7 Sales", "plain": "Out of every dollar in sales, how many cents the company actually keeps as profit after every cost, including interest and taxes, is paid.", "why": "It captures the combined effect of operating efficiency AND financing choices \u2014 two firms with identical operations but different debt levels will show different profit margins purely because of their interest expense.", "example": "A firm with $10 million in sales and $500,000 in net income has a 5% profit margin.", "textbookExample": "Allied Food Products: $146.3M \u00f7 $3,000M = 4.9%, versus an industry average of 6.0% \u2014 explained by both its high operating costs (a lower operating margin) and its heavier use of debt (higher interest charges).", "commonMistake": "Assuming profit margin alone tells the whole story \u2014 the chapter stresses that turnover matters too: a high margin with low sales volume can still produce weak overall net income.", "examQuestion": "Explain how two firms with the same operating margin can end up with different profit margins.", "mnemonic": null}, {"id": "ch4-return-on-total-assets-roa", "term": "Return on total assets (ROA)", "tier": "must_know", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Net income divided by total assets; measures the overall return a firm generates on everything it owns.", "formula": "ROA = Net Income \u00f7 Total Assets", "plain": "For every dollar of assets a company owns, how many cents of profit it generates in a year.", "why": "It's a broad efficiency measure that combines both profitability (profit margin) and asset utilization (turnover) into a single number.", "example": "A company with $2 million in net income and $25 million in total assets has an ROA of 8%.", "textbookExample": "Allied Food Products: $146.3M \u00f7 $2,000M = 7.3%, versus an industry average of 10.8% \u2014 a below-average result, though the chapter notes ROA can look artificially low for firms that use a lot of debt, since heavy interest expense drags down net income.", "commonMistake": "Judging a firm's overall performance from ROA alone \u2014 a low ROA can stem from a deliberate, otherwise-reasonable decision to use more debt rather than from poor operations.", "examQuestion": "Why does the chapter caution against judging a company's performance purely on its ROA?", "mnemonic": null}, {"id": "ch4-return-on-common-equity-roe", "term": "Return on common equity (ROE)", "tier": "must_know", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Net income divided by common equity; tells stockholders how well they are doing, in an accounting sense, on their invested money.", "formula": "ROE = Net Income \u00f7 Common Equity", "plain": "Out of every dollar stockholders have invested in the company, how many cents came back to them as profit this year.", "why": "It's the ratio stockholders care about most directly, since it's their return on their own money \u2014 and it's the ratio the DuPont equation is built to explain.", "example": "A company with $2 million in net income and $10 million in common equity has an ROE of 20%.", "textbookExample": "Allied Food Products: $146.3M \u00f7 $940M = 15.6%, versus an industry average of 18.7% \u2014 somewhat better relative to the industry than its ROA, because of Allied's greater use of debt.", "commonMistake": "Don't confuse ROE with ROA \u2014 ROA divides by total assets (owned by both stockholders and creditors), while ROE divides by common equity (owned only by stockholders), so ROE is always higher for a firm that uses any debt at all.", "examQuestion": "Explain why Allied's ROE (15.6%) is closer to its industry average than its ROA (7.3%) is to its own industry average.", "mnemonic": null}, {"id": "ch4-return-on-invested-capital-roic", "term": "Return on invested capital (ROIC)", "tier": "must_know", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "NOPAT [EBIT(1\u2212T)] divided by total invested capital (debt plus equity); measures the total return a company provides for all of its investors, not just stockholders.", "formula": "ROIC = EBIT(1 \u2212 T) \u00f7 Total Invested Capital", "plain": "How much operating profit (after tax, before any financing effects) a company squeezes out of every dollar raised from BOTH lenders and stockholders combined.", "why": "Unlike ROA, its return is based on total invested capital; unlike ROE, its numerator (NOPAT) is available to pay both stockholders and debtholders \u2014 making it a cleaner measure of a firm's true operating return, independent of financing mix.", "example": "Two firms with identical operations but different debt levels will have different ROE and ROA, but the same ROIC.", "textbookExample": "Allied Food Products: EBIT(1\u2212T) \u00f7 (Debt + Equity) = $208.5M \u00f7 $1,800M = 11.6%, versus an industry average of 13.2%.", "commonMistake": "ROIC's numerator is NOPAT, not net income \u2014 net income already subtracts interest expense (a payment to debtholders), which would double-count that group's claim on returns.", "examQuestion": "A firm has $20 billion of sales, $1 billion of net income, $10 billion of total assets (which equal total invested capital, split half debt/half equity), a 5% interest rate, and a 25% tax rate. Calculate its ROIC.", "mnemonic": "ROIC serves ALL investors (debt + equity); ROE serves stockholders only."}, {"id": "ch4-basic-earning-power-bep-ratio", "term": "Basic earning power (BEP) ratio", "tier": "must_know", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Operating income (EBIT) divided by total assets; shows the raw earning power of a firm's assets before the influence of taxes and debt.", "formula": "BEP = EBIT \u00f7 Total Assets", "plain": "How much raw operating profit a company's total assets generate, completely ignoring how the firm is financed or taxed \u2014 the most 'apples-to-apples' profitability measure across firms with different debt loads.", "why": "Because it excludes both taxes and interest, it's the cleanest ratio for comparing firms with very different capital structures or tax situations.", "example": "A firm with $500,000 of EBIT and $2.5 million in total assets has a BEP of 20%.", "textbookExample": "Allied Food Products: $278M \u00f7 $2,000M = 13.9%, versus an industry average of 18.0% \u2014 a low result the chapter attributes to Allied's weak turnover ratios and poor profit margin.", "commonMistake": "BEP looks similar to ROA, but ROA's numerator is net income (after interest and taxes) while BEP's numerator is EBIT (before both) \u2014 mixing these up is a common error.", "examQuestion": "Why is BEP considered more useful than ROA when comparing firms with very different amounts of debt?", "mnemonic": null}, {"id": "ch4-price-earnings-pe-ratio", "term": "Price/earnings (P/E) ratio", "tier": "must_know", "lo": "4.6", "chapterId": "ch4", "section": "4.6", "definition": "Price per share divided by earnings per share; shows how much investors are willing to pay per dollar of a company's reported profits.", "formula": "P/E Ratio = Price per Share \u00f7 Earnings per Share", "plain": "How many years' worth of current earnings investors are effectively paying for when they buy one share.", "why": "High P/E ratios are typically associated with firms that have strong growth prospects and low risk; low P/E ratios are typical of slow-growing or riskier firms.", "example": "A stock trading at $50 with $2.50 of EPS has a P/E of 20\u00d7.", "textbookExample": "Allied Food Products: $23.06 \u00f7 $1.95 = 11.8\u00d7, versus an industry average of 13.6\u00d7 \u2014 suggesting the market sees Allied as relatively risky, with poor growth prospects, or both. For comparison, in mid-2020 the S&P 500's P/E was 18.90\u00d7, Apple's was 22.07\u00d7, Amazon's was 77.87\u00d7, and AFLAC's (facing Affordable Care Act uncertainty) was just 7.83\u00d7.", "commonMistake": "A high P/E doesn't automatically mean a stock is 'expensive' in a bad sense \u2014 it often just reflects the market pricing in strong expected future growth.", "examQuestion": "Using the Amazon vs. AFLAC comparison, explain what a large gap in P/E ratios between two companies usually signals about the market's expectations.", "mnemonic": null}, {"id": "ch4-market-book-mb-ratio", "term": "Market/book (M/B) ratio", "tier": "must_know", "lo": "4.6", "chapterId": "ch4", "section": "4.6", "definition": "Market price per share divided by book value per share; gives an indication of how investors regard a company relative to its accounting (book) value.", "formula": "M/B Ratio = Market Price per Share \u00f7 Book Value per Share", "plain": "How much more (or less) than the company's accounting 'sticker price' investors are willing to pay for one share.", "why": "Companies regarded as low-risk with high growth prospects have high M/B ratios, since investors are paying for expected future value the balance sheet can't capture.", "example": "A stock with a $40 market price and $20 book value per share has an M/B ratio of 2.0\u00d7.", "textbookExample": "Allied Food Products: Book value per share = $940M \u00f7 75M shares = $12.53. M/B = $23.06 \u00f7 $12.53 = 1.8\u00d7, versus an industry average of 2.6\u00d7. In mid-March 2020, Alphabet's (Google's parent) M/B ratio was 4.50\u00d7, while MetLife's was just 0.56\u00d7.", "commonMistake": "M/B ratios typically exceed 1.0 because book values, based on historical cost, don't reflect either inflation or goodwill \u2014 don't assume an M/B near 1.0 means a stock is fairly priced by some objective standard.", "examQuestion": "Why do M/B ratios typically exceed 1.0, according to the chapter?", "mnemonic": null}, {"id": "ch4-enterprise-value", "term": "Enterprise value (EV)", "tier": "supporting", "lo": "4.6", "chapterId": "ch4", "section": "4.6", "definition": "Market value of equity plus market value of total debt plus market value of other financial claims, minus cash and equivalents; represents the total market value of all of a firm's key financial claims.", "example": "Allied Food Products: ($23.06 \u00d7 75M shares) + ($110M + $750M) + $0 \u2212 $10M = $1,729.5M + $860M \u2212 $10M = $2,579.5 million."}, {"id": "ch4-enterprise-value-ebitda-ratio", "term": "Enterprise value/EBITDA (EV/EBITDA) ratio", "tier": "must_know", "lo": "4.6", "chapterId": "ch4", "section": "4.6", "definition": "Enterprise value divided by EBITDA; unlike the P/E and market/book ratios, it looks at the relative market value of all of a company's key financial claims rather than just its equity.", "formula": "EV/EBITDA = Enterprise Value \u00f7 EBITDA", "plain": "How the whole company \u2014 not just its stock \u2014 is priced relative to the cash-like profit (EBITDA) it generates, letting you compare companies fairly even if they use very different amounts of debt or cash.", "why": "Because it isn't heavily influenced by a company's debt and tax situation the way the P/E ratio is, it's become a favorite tool for analysts comparing companies across different capital structures.", "example": "A company with a $500 million enterprise value and $50 million of EBITDA has an EV/EBITDA of 10\u00d7.", "textbookExample": "Allied Food Products: $2,579.5M \u00f7 $378M = 6.8\u00d7, versus an industry average of 9.2\u00d7 \u2014 reinforcing the chapter's other findings that Allied's operations aren't run as efficiently as they could be.", "commonMistake": "Enterprise value subtracts out cash holdings \u2014 skipping this adjustment would understate how efficient a cash-heavy company's operations really are relative to a peer with less cash on hand.", "examQuestion": "Why does the chapter subtract cash and equivalents when calculating enterprise value?", "mnemonic": null}, {"id": "ch4-dupont-equation", "term": "DuPont equation", "tier": "must_know", "lo": "4.7", "chapterId": "ch4", "section": "4.7", "definition": "A formula, developed by DuPont's financial staff in the 1920s, that breaks ROE down into three component ratios: profit margin, total assets turnover, and the equity multiplier.", "formula": "ROE = Profit Margin \u00d7 Total Assets Turnover \u00d7 Equity Multiplier", "plain": "A way of cracking open the single ROE number into three separate ingredients \u2014 how profitable each sale is, how many sales each dollar of assets generates, and how much debt is amplifying the result \u2014 so you can see exactly WHY a firm's ROE is what it is.", "why": "It turns a single, somewhat mysterious number (ROE) into a diagnostic tool: management can see whether a weak ROE traces back to weak margins, weak turnover, or too little (or too much) leverage, and target the actual problem.", "example": "Two firms could have identical 15% ROEs for completely different reasons \u2014 one from strong margins and little debt, another from thin margins offset by heavy leverage \u2014 and the DuPont equation is what reveals the difference.", "textbookExample": "Allied Food Products: ROE = 4.88% (profit margin) \u00d7 1.5\u00d7 (total assets turnover) \u00d7 2.13\u00d7 (equity multiplier) = 15.6%, versus the industry's 6.0% \u00d7 1.8\u00d7 \u00d7 1.73\u00d7 = 18.7%. The breakdown shows Allied's weak margin AND weak turnover are only partly offset by its heavier use of debt (higher equity multiplier) \u2014 and the chapter notes that if Allied cut its debt down to the industry's average leverage, its ROE would actually fall further, to about 12.66%.", "commonMistake": "Don't assume a firm with below-average ROE has uniformly bad performance \u2014 the DuPont breakdown might show its margin and turnover are both fine, with a low equity multiplier (little debt) simply holding ROE down, which isn't necessarily a problem.", "examQuestion": "Write out the DuPont equation and explain what a firm's management could do differently if a DuPont breakdown revealed its profit margin was the weak link.", "mnemonic": "DuPont breaks ROE into 3 M's-ish parts: Margin, (Asset) Movement/turnover, and Multiplier."}, {"id": "ch4-equity-multiplier", "term": "Equity multiplier", "tier": "must_know", "lo": "4.7", "chapterId": "ch4", "section": "4.7", "definition": "Total assets divided by total common equity; the third term in the DuPont equation, it adjusts ROA upward to account for the use of debt financing.", "formula": "Equity Multiplier = Total Assets \u00f7 Total Common Equity", "plain": "How many dollars of total assets a company is running for every dollar stockholders actually put in \u2014 the rest funded by debt. A higher number means more leverage.", "why": "Because a portion of a firm's return on assets legally belongs to bondholders (as interest) before it ever reaches stockholders, this multiplier is what 'grosses up' ROA into ROE, showing how debt amplifies stockholders' return.", "example": "A firm with $100 million in assets and $40 million in common equity has an equity multiplier of 2.5\u00d7 \u2014 for every $1 of stockholders' money, it's running $2.50 of total assets.", "textbookExample": "Allied Food Products: $2,000M \u00f7 $940M = 2.13\u00d7, versus an industry average of 1.73\u00d7 \u2014 Allied's heavier use of debt is exactly what pushes its ROE closer to the industry average despite its weaker margin and turnover.", "commonMistake": "A higher equity multiplier isn't automatically good \u2014 it boosts ROE, but it also means more of the firm's assets are funded by debt, raising the risk of bankruptcy if operating performance weakens.", "examQuestion": "In the DuPont equation, ROA \u00d7 Equity Multiplier = ROE. Explain in words what multiplying by the equity multiplier is actually doing to the ROA figure.", "mnemonic": null}, {"id": "ch4-benchmarking", "term": "Benchmarking", "tier": "must_know", "lo": "4.8", "chapterId": "ch4", "section": "4.8", "definition": "Comparing a firm's ratios against those of a specific, chosen subset of close competitors (rather than a broad industry average), to see exactly where the firm stands relative to its real rivals.", "plain": "Picking a handful of your company's actual head-to-head competitors and lining up your numbers directly against theirs, instead of a vague industry-wide average.", "why": "An industry average can blend together very different kinds of firms; benchmarking against a firm's real, chosen competitors gives management a much more actionable sense of where it truly stands.", "example": "A regional coffee chain might benchmark itself against Starbucks and Dunkin' specifically, rather than against a broad 'restaurant industry' average that includes fast food and fine dining.", "textbookExample": "Allied benchmarks itself against Campbell Soup, Hershey, J&J Snack Foods, Conagra Brands, Flowers Foods, Tyson Foods, and Kellogg. On profit margin, Allied's 4.88% ranks near the bottom of the group \u2014 behind Campbell Soup's 17.95%, Hershey's 14.40%, and five other competitors \u2014 ahead of only Tyson Foods (4.71%) and Flowers Foods (3.99%).", "commonMistake": "Different data providers (Yahoo Finance, D&B, MSN Money) sometimes calculate the 'same' ratio using different definitions \u2014 always check a source's specific methodology before comparing its numbers to your own calculations.", "examQuestion": "Why might a company prefer benchmarking against a handful of chosen competitors rather than relying solely on a broad industry average?", "mnemonic": null}, {"id": "ch4-trend-analysis", "term": "Trend analysis", "tier": "must_know", "lo": "4.8", "chapterId": "ch4", "section": "4.8", "definition": "Plotting a firm's own ratio over several years to see whether its financial condition is improving or deteriorating over time, rather than looking only at a single year's snapshot.", "plain": "Instead of asking 'is this ratio good or bad this year,' asking 'is this ratio getting better or worse over time' \u2014 a single year can be a fluke, but a multi-year direction tells a real story.", "why": "A ratio that looks fine in isolation can still be part of a worrying downward trend, or a weak ratio might actually be improving \u2014 comparing only to the current industry average would miss that entirely.", "example": "A retailer's current ratio might sit right at the industry average for years, but if it has been steadily falling from 2.5\u00d7 toward 1.8\u00d7 over five years, that trend itself is a warning sign the single-year comparison wouldn't catch.", "textbookExample": "Allied's ROE has been declining since 2018 even though the industry average has stayed relatively stable \u2014 a trend the chapter says is worth investigating further to understand why Allied's performance has been slipping relative to its peers.", "commonMistake": "Looking only at the most recent year's ratio and comparing it to the industry average, without checking whether that ratio has been trending in a concerning direction over several years.", "examQuestion": "Why can a firm's ratio look acceptable when compared to the industry average in a single year, yet still be cause for concern?", "mnemonic": null}, {"id": "ch3-preferred-stock", "term": "Preferred stock", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.2", "definition": "A hybrid security, generally paying a fixed annual amount like debt, but where a missed payment does not trigger bankruptcy the way a missed debt payment would; shown on the balance sheet between total debt and common stock.", "plain": "A stock that acts a lot like a bond \u2014 fixed payments, but skipping a payment doesn't put the company at risk of bankruptcy the way skipping a bond payment would.", "why": "There's no fixed accounting rule for whether to treat preferred stock as debt or equity when calculating financial ratios \u2014 bondholders often think of it as equity (since it's paid after debt), while stockholders often think of it as debt (since it's a fixed, recurring claim) \u2014 in truth it's a hybrid, and analysts must choose how to treat it.", "commonMistake": "Assuming preferred stock always counts as either 100% debt or 100% equity in ratio analysis \u2014 there is no universal rule, and the choice affects the resulting ratios.", "examQuestion": "Explain why preferred stock is described as a hybrid security, and why its treatment in ratio analysis is a judgment call rather than a fixed rule."}, {"id": "ch3-macrs-depreciation", "term": "MACRS depreciation", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.2", "definition": "Modified Accelerated Cost Recovery System \u2014 the accelerated depreciation method prescribed by the IRS for tax purposes prior to the Tax Cuts and Jobs Act (TCJA); it front-loads depreciation expense into a asset's early years.", "plain": "A faster way of writing off an asset's cost for tax purposes, which lowers taxable income (and therefore taxes) more in the early years of owning the asset than straight-line depreciation would.", "why": "Because it lowers taxable income sooner, MACRS lowers taxes sooner and increases a firm's cash flow sooner \u2014 which is why most firms use an accelerated method for their tax books even while using straight-line depreciation for the financial statements shown to investors.", "example": "A firm reports higher net income to shareholders using straight-line depreciation, while simultaneously using MACRS (or, since the TCJA, full expensing) on its tax return to minimize its actual cash tax payments.", "commonMistake": "Assuming a company must use the same depreciation method for its tax return and for the financial statements it reports to shareholders \u2014 firms routinely use different methods for each, entirely legally.", "examQuestion": "Why might a company use straight-line depreciation for its investor-facing financial statements but an accelerated method (or full expensing) for its tax return?"}], "caseStudies": [{"id": "cs-allied", "title": "Allied Food Products (running example)", "lo": "3.1", "tier": "helpful_example", "chapterId": "ch3", "summary": "The textbook's running example throughout Chapter 3: a food processor whose 2021 balance sheet shows $2B in assets, whose income statement shows earnings falling from $152.3M to $146.3M despite a drought and strike, and whose cash flow statement shows a concerning reliance on new borrowing to fund a $230M plant expansion.", "whyItMatters": "Nearly every formula in the chapter (NWC, NOWC, FCF, MVA) is worked out using Allied's actual numbers \u2014 knowing this one company's figures well makes every calculation question far easier."}, {"id": "cs-enron-worldcom", "title": "Enron, WorldCom, and Arthur Andersen", "lo": "1.5", "tier": "helpful_example", "chapterId": "ch1", "summary": "Executives at Enron and WorldCom used misleading accounting to overstate profits while secretly selling their own stock. Their auditor, Arthur Andersen, was found guilty of fostering a culture that enabled the fraud and was put out of business entirely, costing all 85,000 of its employees their jobs.", "whyItMatters": "It's the chapter's central case for both Sarbanes-Oxley (Ch.1) and the 'is it the firm or just a few employees' question about corporate accountability, and it reappears in Chapter 3's discussion of GAAP discretion and fraud."}, {"id": "cs-wells-fargo", "title": "Wells Fargo Fake Accounts Scandal", "lo": "1.3", "tier": "helpful_example", "chapterId": "ch1", "summary": "Employees, under pressure to hit sales quotas tied to bonuses, created fake accounts and unauthorized credit cards. Wells Fargo fired its CEO, other senior leaders, and thousands of employees, and ultimately paid billions in fines and settlements.", "whyItMatters": "It's the textbook's go-to modern example of what happens when short-term-focused compensation incentives override long-run value and ethics."}, {"id": "cs-project-lh", "title": "Project L vs. Project H (stockholder\u2013bondholder conflict)", "lo": "1.4", "tier": "helpful_example", "chapterId": "ch1", "summary": "Two projects have the same expected cash flow, but Project H is far riskier (all-or-nothing payoff). Stockholders' expected return jumps from ~12% under Project L to ~66% under Project H, while bondholders get no extra upside and bear more default risk.", "whyItMatters": "It's the clearest numeric illustration in the whole course of why stockholders (via managers) have an incentive to shift toward riskier projects after debt is already issued \u2014 and why bondholders demand covenants in response."}, {"id": "cs-home-depot-fcf", "title": "Home Depot's Free Cash Flow", "lo": "3.2", "tier": "helpful_example", "chapterId": "ch3", "summary": "Home Depot generates cash from its existing stores (NOPAT + depreciation) while spending cash to build new ones (capital expenditures + working capital). The company as a whole generates positive FCF only if money from existing stores exceeds the cost of building new ones.", "whyItMatters": "It translates the abstract FCF formula into a real, intuitive business you already know, making the formula's two halves (cash IN vs. cash OUT for growth) concrete."}, {"id": "cs-buffett-bet", "title": "Buffett's Million-Dollar Bet", "lo": "2.1", "tier": "helpful_example", "chapterId": "ch2", "summary": "In 2007, Warren Buffett bet that a low-cost S&P 500 index fund would beat a basket of five hedge funds over 10 years. The index fund returned 125.8% total; the five hedge funds ranged from just 2.8% to 87.7%.", "whyItMatters": "It's real-world evidence behind the chapter's broader push toward index investing, and a favorite exam example for the active-vs-passive fee/performance debate."}, {"id": "cs-ltcm", "title": "Long-Term Capital Management's Near-Collapse", "lo": "2.1", "tier": "helpful_example", "chapterId": "ch2", "summary": "LTCM used highly leveraged arbitrage strategies that nearly collapsed the global financial system in 1998 before the Federal Reserve orchestrated a bailout by its creditors.", "whyItMatters": "It's the textbook's clearest illustration of how hedge fund leverage and light regulation can create systemic risk, not just fund-level risk."}, {"id": "cs-google-facebook-ipo", "title": "Google, Facebook, and Twitter IPOs", "lo": "2.2", "tier": "helpful_example", "chapterId": "ch2", "summary": "Google's 2004 Dutch-auction IPO priced at $85 and rose steadily (Alphabet later traded above $1,160). Facebook's 2012 IPO priced at $38 and fell below $18 within months before recovering. Twitter generated buzz at its 2013 IPO but languished for years afterward.", "whyItMatters": "These three contrasting outcomes are the textbook's core evidence that a strong first-day IPO reaction doesn't reliably predict long-run stock performance."}, {"id": "cs-tcja-changes", "title": "The Tax Cuts and Jobs Act (TCJA) of 2017", "lo": "3.3", "tier": "helpful_example", "chapterId": "ch3", "summary": "The most sweeping U.S. tax overhaul since 1986: a flat 21% corporate rate, higher standard deductions, capped SALT and mortgage-interest deductions on the individual side (sunsetting in 2025), and a 30%-of-income cap on the corporate interest deduction.", "whyItMatters": "Its provisions touch nearly every later chapter \u2014 capital budgeting (via bonus depreciation), capital structure (via the interest deduction cap), and personal financial planning."}], "quiz": [{"id": "ch1-q1", "type": "multiple_choice", "lo": "1.1", "difficulty": "medium", "prompt": "A bank lending officer evaluating a business loan mainly needs a strong grasp of:", "options": ["Behavioral finance only", "Corporate finance", "Advertising strategy", "Federal tax law only"], "correctIndex": 1, "explanation": "The three areas of finance overlap constantly \u2014 a lending officer evaluating a business loan needs to understand corporate finance to judge whether the loan is sound.", "concept": "ch1-capital-markets", "chapterId": "ch1"}, {"id": "ch1-q2", "type": "multiple_choice", "lo": "1.1", "difficulty": "easy", "prompt": "In the standard corporate hierarchy, who directs a firm's marketing, production, and HR departments?", "options": ["The CFO", "The Board of Directors", "The COO", "The Chairperson only"], "correctIndex": 2, "explanation": "The COO directs a firm's operations, including marketing, production, HR, and other operating departments, while the CFO handles accounting and finance-side functions.", "concept": "ch1-coo-chief-operating-officer", "chapterId": "ch1"}, {"id": "ch1-q3", "type": "multiple_choice", "lo": "1.2", "difficulty": "medium", "prompt": "Which business form exposes its owner(s) to unlimited personal liability AND makes it hardest to raise large sums of capital?", "options": ["Corporation", "S corporation", "Proprietorship", "LLC"], "correctIndex": 2, "explanation": "Proprietorships are easy and cheap to start, but the owner has unlimited personal liability, the business's life is tied to the owner's, and it's hard to raise large amounts of capital \u2014 which is why proprietorships are mainly used for small businesses.", "concept": "ch1-proprietorship", "chapterId": "ch1"}, {"id": "ch1-q4", "type": "multiple_choice", "lo": "1.2", "difficulty": "medium", "prompt": "Why can't large companies like IBM or Microsoft elect S corporation status?", "options": ["S corporations aren't allowed to pay dividends", "S corporations are capped at 100 stockholders", "S corporations can't operate outside one state", "S corporations are only for non-profits"], "correctIndex": 1, "explanation": "To qualify as an S corporation, a firm can have no more than 100 stockholders \u2014 which rules it out for large, widely-held public companies.", "concept": "ch1-s-corporation", "chapterId": "ch1"}, {"id": "ch1-q5", "type": "multiple_choice", "lo": "1.3", "difficulty": "medium", "prompt": "A stock's intrinsic value differs from its market price because:", "options": ["Intrinsic value is always higher than market price", "Market price reflects the marginal investor's perceptions, which may be based on incomplete or incorrect information", "Intrinsic value is set directly by the SEC", "They are mathematically always identical"], "correctIndex": 1, "explanation": "Intrinsic value is an analyst's best estimate given accurate data, while market price reflects what the marginal investor currently believes \u2014 and that belief can be wrong, at least until more information comes out.", "concept": "ch1-intrinsic-value", "chapterId": "ch1"}, {"id": "ch1-q6", "type": "multiple_choice", "lo": "1.3", "difficulty": "hard", "prompt": "Tying executive stock options to a single exercise date, rather than phasing pay in over several years, mainly risks:", "options": ["Making managers too risk-averse", "Encouraging managers to boost the stock price right before that date, even at the expense of long-run value", "Eliminating double taxation for the company", "Automatically triggering a hostile takeover"], "correctIndex": 1, "explanation": "When compensation depends on the stock price on one specific date, some managers have turned down good long-run projects \u2014 or worse, inflated reported profits \u2014 just to boost the price on that day, which is why phased-in awards tied to a longer average price are preferred.", "concept": "ch1-corporate-governance", "chapterId": "ch1"}, {"id": "ch1-q7", "type": "multiple_choice", "lo": "1.4", "difficulty": "hard", "prompt": "In the Project L vs. Project H example, why would bondholders object to switching to Project H?", "options": ["Project H guarantees bondholders a higher fixed return", "Bondholders get no extra upside if the market is good, but bear default risk if it's bad", "Project H has a lower expected cash flow than Project L", "Bondholders are legally barred from investing in risky projects"], "correctIndex": 1, "explanation": "Project H has the same expected cash flow as Project L but is riskier \u2014 stockholders capture all the extra upside if things go well, while bondholders get nothing extra and risk losing everything if the market is bad.", "concept": "ch1-bond-covenant", "chapterId": "ch1"}, {"id": "ch1-q8", "type": "multiple_choice", "lo": "1.5", "difficulty": "medium", "prompt": "According to the chapter, does maximizing shareholder value conflict with acting ethically toward society?", "options": ["Yes \u2014 they are always in direct conflict", "No \u2014 ignoring stakeholders' interests tends to create costs (boycotts, lawsuits, poor reputation) that reduce shareholder value over time", "Ethics is irrelevant to a firm's stock price", "Shareholder value can only be maximized by breaking the law"], "correctIndex": 1, "explanation": "The chapter argues these goals usually align: a company that ignores employees, customers, and the community faces real costs \u2014 from lawsuits to bad publicity \u2014 that ultimately hurt shareholder value, so being ethical and maximizing long-run value tend to go together.", "concept": "ch1-business-ethics", "chapterId": "ch1"}, {"id": "ch1-q9", "type": "multiple_choice", "lo": "1.5", "difficulty": "exam", "prompt": "Why was the accounting firm Arthur Andersen put out of business over the Enron and WorldCom frauds, even though only a relatively small share of its 85,000 employees were directly involved?", "options": ["Federal law requires firing every employee of any company involved in fraud", "Regulators concluded the firm itself fostered a culture and incentive system that let the fraud happen", "Its clients demanded the firm be dissolved", "It was a random, unrelated bankruptcy"], "correctIndex": 1, "explanation": "The Justice Department concluded that Andersen, not just a handful of rogue employees, was guilty because the firm fostered a climate where unethical behavior was permitted and profitable \u2014 which is why the entire firm was shut down rather than just the individuals involved.", "concept": "ch1-arthur-andersen-case-study", "chapterId": "ch1"}, {"id": "ch1-q10", "type": "multiple_choice", "lo": "1.5", "difficulty": "exam", "prompt": "A lower-level employee who is ordered to enter fraudulent data faces which real-world risk, according to the chapter?", "options": ["None \u2014 whistleblowers are always protected and promoted", "They risk being fired if they report a concern that turns out to be false, and in past scandals have sometimes received harsher sentences than the executives who gave the orders", "They automatically become personally liable for all company debts", "They are legally required to obey any order from a manager"], "correctIndex": 1, "explanation": "Employees who speak up risk their jobs even when they're right, and in several scandals the lower-level people who physically entered fraudulent data received longer prison sentences than the bosses who directed them \u2014 which is exactly why ethical pressure at the bottom of an organization is such a hard problem.", "concept": "ch1-insider-trading", "chapterId": "ch1"}, {"id": "ch1-q11", "type": "true_false", "lo": "1.2", "difficulty": "easy", "prompt": "A corporation is subject to double taxation because its earnings are taxed once at the corporate level and again when paid out as dividends.", "correctAnswer": true, "explanation": "True \u2014 this is the classic double-taxation drawback of the corporate form, which S corporation status is specifically designed to avoid.", "concept": "ch1-corporation", "chapterId": "ch1"}, {"id": "ch1-q12", "type": "true_false", "lo": "1.4", "difficulty": "medium", "prompt": "A corporate raider is most likely to target a company whose stock price is trading ABOVE its intrinsic value.", "correctAnswer": false, "explanation": "False \u2014 raiders target undervalued stocks, where the market price sits below intrinsic value, since that represents a bargain.", "concept": "ch1-hostile-takeover", "chapterId": "ch1"}, {"id": "ch1-q13", "type": "fill_blank", "lo": "1.3", "difficulty": "medium", "prompt": "A stock is said to be in ______ when its market price equals its intrinsic value.", "correctAnswer": "equilibrium", "acceptableAnswers": ["equilibrium"], "explanation": "Equilibrium is the state where market price and intrinsic value match, leaving no pressure for the price to change.", "concept": "ch1-equilibrium-stock-price", "chapterId": "ch1"}, {"id": "ch1-q14", "type": "two_truths_trap", "lo": "1.2", "difficulty": "hard", "prompt": "Which statement about business organization forms is INCORRECT?", "options": ["A proprietorship is easy and cheap to form but exposes the owner to unlimited liability.", "An LLC combines a corporation's limited liability with a partnership's tax treatment.", "An S corporation can have an unlimited number of shareholders as long as they are all individuals."], "correctIndex": 2, "explanation": "S corporations are capped at 100 shareholders \u2014 the third statement is false, which is exactly why large firms like IBM cannot elect S status.", "concept": "ch1-s-corporation", "chapterId": "ch1"}, {"id": "ch1-q15", "type": "matching", "lo": "1.2", "difficulty": "medium", "prompt": "Match each business form to its defining trait.", "pairs": [{"left": "Proprietorship", "right": "Owned by one person, unlimited personal liability"}, {"left": "Partnership", "right": "Owned by two or more people, generally unlimited liability"}, {"left": "Corporation", "right": "Separate legal entity, limited liability, double taxation"}, {"left": "LLC", "right": "Hybrid: limited liability with partnership-style taxation"}], "explanation": "Each business form trades off ease of formation, liability protection, and tax treatment differently \u2014 matching them to their defining trait is a classic exam format.", "concept": "ch1-corporation", "chapterId": "ch1"}, {"id": "ch2-q1", "type": "multiple_choice", "lo": "2.1", "difficulty": "medium", "prompt": "Why is a transaction that goes through an investment bank still called a primary market transaction?", "options": ["Because the investment bank keeps the securities permanently", "Because the issuing corporation receives the sale proceeds, even though the securities pass through the investment bank", "Because only government securities qualify as primary market transactions", "Because no money changes hands in this type of transaction"], "correctIndex": 1, "explanation": "Even when an investment bank underwrites and resells the securities, the issuing company is the one that receives the proceeds \u2014 that's what makes it a primary market transaction rather than a secondary one.", "concept": "ch2-primary-market-transaction", "chapterId": "ch2"}, {"id": "ch2-q2", "type": "multiple_choice", "lo": "2.1", "difficulty": "easy", "prompt": "A farmer agreeing today to sell soybeans at a fixed price six months from now is participating in which type of market?", "options": ["A spot market", "A futures market", "A secondary market", "A private market"], "correctIndex": 1, "explanation": "Futures markets let participants agree today on a price for a transaction that will occur at a future date \u2014 exactly what lets the farmer hedge against a future price drop.", "concept": "ch2-futures-markets", "chapterId": "ch2"}, {"id": "ch2-q3", "type": "multiple_choice", "lo": "2.1", "difficulty": "medium", "prompt": "What is the key regulatory difference between mutual funds and hedge funds?", "options": ["Mutual funds are unregulated, hedge funds are heavily regulated", "Mutual funds are registered and regulated by the SEC; hedge funds are largely unregulated", "Both are equally regulated by the Federal Reserve", "Hedge funds can only be sold to retail investors"], "correctIndex": 1, "explanation": "Mutual funds (and ETFs) are SEC-registered and regulated because they're marketed to everyday savers, while hedge funds are largely unregulated since they're marketed to institutions and high-net-worth investors who can meet large minimum investments.", "concept": "ch2-hedge-funds", "chapterId": "ch2"}, {"id": "ch2-q4", "type": "multiple_choice", "lo": "2.2", "difficulty": "medium", "prompt": "What made Spotify's 2018 stock market debut different from a traditional IPO?", "options": ["It used a Dutch auction to set the price", "It was a direct listing \u2014 only existing shareholders' shares were sold, and the company raised no new capital", "It listed only on NASDAQ, never on the NYSE", "It was a closely held corporation that never went public"], "correctIndex": 1, "explanation": "Spotify's direct listing sold only existing shareholders' shares \u2014 no new shares were issued, so unlike a typical IPO, the company itself raised no new capital in the transaction.", "concept": "ch2-direct-listing", "chapterId": "ch2"}, {"id": "ch2-q5", "type": "multiple_choice", "lo": "2.3", "difficulty": "medium", "prompt": "A stock's beta of 0.37 (as in the Twitter example) tells you that the stock:", "options": ["Pays a dividend yield of 0.37%", "Has moved roughly 40% as much as the overall market \u2014 i.e., it's less volatile than the market", "Has a P/E ratio of 0.37", "Is guaranteed to underperform the market"], "correctIndex": 1, "explanation": "Beta measures a stock's volatility relative to the overall market; a beta of 0.37 means the stock has historically moved about 37\u201340% as much as the market, making it comparatively less volatile.", "concept": "ch2-nasdaq-composite-index", "chapterId": "ch2"}, {"id": "ch2-q6", "type": "multiple_choice", "lo": "2.3", "difficulty": "medium", "prompt": "Over the 52 years from 1968\u20132019, how often was the S&P 500's total annual return negative?", "options": ["Never \u2014 it was positive every single year", "In 11 of the 52 years, including three straight losing years from 2000\u20132002", "In roughly half of all years", "Only during the 2007\u20132008 financial crisis"], "correctIndex": 1, "explanation": "Even though the market's long-run trend has been strongly upward since 1968, the S&P 500 was still down in 11 of those 52 years \u2014 including three consecutive losing years from 2000 through 2002.", "concept": "ch2-s-p-500-index", "chapterId": "ch2"}, {"id": "ch2-q7", "type": "multiple_choice", "lo": "2.4", "difficulty": "hard", "prompt": "According to the efficient markets hypothesis's 'semi-strong form,' which of the following should NOT be possible?", "options": ["Using past price patterns to predict future prices", "Consistently beating the market by analyzing publicly available information, like published financial reports", "Company insiders earning abnormal returns from private information", "Prices ever changing in response to news"], "correctIndex": 1, "explanation": "Semi-strong form efficiency holds that all publicly available information is already reflected in stock prices, so analyzing published reports shouldn't let an investor consistently beat the market \u2014 that's a job for weak form (past prices) or strong form (insider information).", "concept": "ch2-efficient-markets-hypothesis-emh", "chapterId": "ch2"}, {"id": "ch2-q8", "type": "multiple_choice", "lo": "2.4", "difficulty": "hard", "prompt": "According to the 'efficiency continuum' described in the chapter, which stock is likely to be priced LEAST efficiently?", "options": ["A large company followed by hundreds of analysts with strong investor communications", "A small company followed by few analysts with limited investor contact", "A company listed on the NYSE", "A company included in the S&P 500"], "correctIndex": 1, "explanation": "The efficiency continuum places small, thinly followed companies with limited investor communication toward the inefficient end, since fewer analysts and less information flow mean prices are slower to reflect a company's true value.", "concept": "ch2-efficiency-continuum", "chapterId": "ch2"}, {"id": "ch2-q9", "type": "multiple_choice", "lo": "2.5", "difficulty": "exam", "prompt": "Why does behavioral finance argue that 'limits to arbitrage' allow mispricings to persist?", "options": ["Because arbitrage is illegal in most markets", "Because exploiting a known mispricing can still be risky or costly, so rational traders may not correct it right away", "Because only company insiders are legally allowed to arbitrage", "Because mispricings are corrected instantly by regulators"], "correctIndex": 1, "explanation": "Even traders who correctly identify a mispriced stock may avoid trading on it because doing so is risky \u2014 as seen when traders who correctly believed dot-com stocks were overpriced still lost money shorting them before prices eventually collapsed.", "concept": "ch2-limits-to-arbitrage", "chapterId": "ch2"}, {"id": "ch2-q10", "type": "multiple_choice", "lo": "2.5", "difficulty": "exam", "prompt": "What do self-attribution bias and hindsight bias combine to produce, according to the chapter?", "options": ["Excessive risk-aversion in all situations", "Chronic overconfidence, which has been linked to excessive trading and overly optimistic corporate investment decisions", "A permanent shift toward index fund investing", "Complete elimination of investor psychology from asset pricing"], "correctIndex": 1, "explanation": "Crediting your own talent for successes (self-attribution bias) while believing you predicted past events better than you actually did (hindsight bias) combine to produce chronic overconfidence \u2014 which research has linked to both excessive individual trading and overly optimistic corporate investment decisions.", "concept": "ch2-hindsight-bias", "chapterId": "ch2"}, {"id": "ch2-q11", "type": "true_false", "lo": "2.1", "difficulty": "easy", "prompt": "Mutual funds are largely unregulated compared to hedge funds.", "correctAnswer": false, "explanation": "False \u2014 it's the reverse: mutual funds are SEC-registered and regulated since they target small investors, while hedge funds are largely unregulated.", "concept": "ch2-mutual-funds", "chapterId": "ch2"}, {"id": "ch2-q12", "type": "true_false", "lo": "2.4", "difficulty": "medium", "prompt": "According to the efficiency continuum, small companies followed by few analysts tend to be priced more efficiently than large, heavily-followed companies.", "correctAnswer": false, "explanation": "False \u2014 it's the opposite. Large, heavily-followed companies with strong investor communications tend to be priced more efficiently.", "concept": "ch2-efficiency-continuum", "chapterId": "ch2"}, {"id": "ch2-q13", "type": "fill_blank", "lo": "2.1", "difficulty": "medium", "prompt": "A contract offering protection against a borrower's default, in exchange for regular payments, is called a credit default ______.", "correctAnswer": "swap", "acceptableAnswers": ["swap", "swaps"], "explanation": "A credit default swap (CDS) is exactly this kind of protection contract, and its explosive growth was a major factor in the 2007\u20132008 financial crisis.", "concept": "ch2-credit-default-swap-cds", "chapterId": "ch2"}, {"id": "ch2-q14", "type": "two_truths_trap", "lo": "2.2", "difficulty": "hard", "prompt": "Which statement about stock markets is INCORRECT?", "options": ["The NYSE is a physical location exchange with a real trading floor.", "NASDAQ is an example of a dealer, or over-the-counter, market.", "A secondary market transaction sends new proceeds directly to the issuing corporation."], "correctIndex": 2, "explanation": "Secondary market transactions occur between investors and generate no proceeds for the issuing company \u2014 only primary market transactions do that.", "concept": "ch2-secondary-markets", "chapterId": "ch2"}, {"id": "ch2-q15", "type": "matching", "lo": "2.1", "difficulty": "medium", "prompt": "Match each financial institution to its primary role.", "pairs": [{"left": "Investment bank", "right": "Underwrites and helps issue new securities"}, {"left": "Commercial bank", "right": "Serves everyday savers and borrowers"}, {"left": "Pension fund", "right": "Invests retirement contributions in stocks, bonds, and real estate"}, {"left": "Hedge fund", "right": "Pursues varied strategies for wealthy, sophisticated investors"}], "explanation": "Each institution serves a different segment of the capital-allocation process, from underwriting new securities to managing retirement savings.", "concept": "ch2-financial-intermediary", "chapterId": "ch2"}, {"id": "ch3-q1", "type": "multiple_choice", "lo": "3.1", "difficulty": "easy", "prompt": "Which financial statement is best described as a 'snapshot' of a firm's position at one specific point in time?", "options": ["The income statement", "The balance sheet", "The statement of cash flows", "The statement of stockholders' equity"], "correctIndex": 1, "explanation": "The balance sheet reports assets, liabilities, and equity as of one specific date, unlike the income statement and cash flow statement, which cover an entire period.", "concept": "ch3-balance-sheet", "chapterId": "ch3"}, {"id": "ch3-q2", "type": "multiple_choice", "lo": "3.1", "difficulty": "easy", "prompt": "If a firm has $1,000 million in current assets and $310 million in current liabilities, what is its net working capital?", "options": ["$1,310 million", "$690 million", "$310 million", "$1,000 million"], "correctIndex": 1, "explanation": "Net working capital = <span class='src-box ln-tca y2021'>$1,000M</span> \u2212 <span class='src-box ln-tcl y2021'>$310M</span> = <strong><span class='src-box calc-result'>$690 million</span></strong>, exactly as in Allied's 2021 balance sheet.<details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td cols
