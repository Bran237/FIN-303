e_choice", "lo": "3.1", "difficulty": "medium", "prompt": "Why do analysts often prefer to compare companies using EBIT (operating income) rather than net income?", "options": ["EBIT already accounts for taxes, making it more accurate", "EBIT strips out the effects of financing (interest) and tax differences, isolating core operating performance", "Net income is always higher than EBIT", "EBIT is required by GAAP, while net income is optional"], "correctIndex": 1, "explanation": "Two companies with identical operations can report very different net incomes if they use different amounts of debt (and thus pay different interest), which is why analysts focus on EBIT to compare core operating performance.", "concept": "ch3-operating-income-ebit", "chapterId": "ch3"}, {"id": "ch3-q4", "type": "multiple_choice", "lo": "3.2", "difficulty": "hard", "prompt": "A firm has EBIT of $278 million, a 25% tax rate, $100 million of depreciation, $230 million of capital expenditures, and a $150 million increase in NOWC. What is its free cash flow?", "options": ["$308.5 million", "-$71.5 million", "$78.5 million", "$486 million"], "correctIndex": 1, "explanation": "NOPAT = <span class='src-box ln2-ebit y2021'>$278M</span> \u00d7 0.75 = <span class='src-box calc-result'>$208.5M</span>. Adding depreciation: <span class='src-box calc-result'>$208.5M</span> + <span class='src-box ln2-dep y2021'>$100M</span> = <span class='src-box calc-result'>$308.5M</span>. Subtracting investment needs: <span class='src-box calc-result'>$308.5M</span> \u2212 ($230M + $150M) = <strong><span class='src-box calc-result'>-$71.5 million</span></strong> \u2014 exactly Allied's 2021 result.<details class='src-fold'><summary>Table 3.2 \u2014 Allied Food Products: Income Statements</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr><td>Net sales</td><td><span class='src-box ln2-sales y2021'>$3,000.0</span></td><td><span class='src-box ln2-sales y2020'>$2,850.0</span></td></tr><tr><td>Operating costs except depreciation and amortization</td><td><span class='src-box ln2-opex y2021'>2,622.0</span></td><td><span class='src-box ln2-opex y2020'>2,497.0</span></td></tr><tr><td>Depreciation and amortization</td><td><span class='src-box ln2-dep y2021'>100.0</span></td><td><span class='src-box ln2-dep y2020'>90.0</span></td></tr><tr class='bs-subtotal'><td>Total operating costs</td><td><span class='src-box ln2-toc y2021'>$2,722.0</span></td><td><span class='src-box ln2-toc y2020'>$2,587.0</span></td></tr><tr class='bs-total'><td>Operating income (EBIT)</td><td><span class='src-box ln2-ebit y2021'>$278.0</span></td><td><span class='src-box ln2-ebit y2020'>$263.0</span></td></tr><tr><td>Less interest</td><td><span class='src-box ln2-int y2021'>83.0</span></td><td><span class='src-box ln2-int y2020'>60.0</span></td></tr><tr class='bs-subtotal'><td>Earnings before taxes (EBT)</td><td><span class='src-box ln2-ebt y2021'>$195.0</span></td><td><span class='src-box ln2-ebt y2020'>$203.0</span></td></tr><tr><td>Taxes (25%)</td><td><span class='src-box ln2-tax y2021'>48.8</span></td><td><span class='src-box ln2-tax y2020'>50.8</span></td></tr><tr class='bs-total'><td>Net income</td><td><span class='src-box ln2-ni y2021'>$146.3</span></td><td><span class='src-box ln2-ni y2020'>$152.3</span></td></tr><tr><td>Total dividends</td><td><span class='src-box ln2-div y2021'>86.3</span></td><td><span class='src-box ln2-div y2020'>79.5</span></td></tr><tr><td>Addition to retained earnings</td><td><span class='src-box ln2-addre y2021'>60.0</span></td><td><span class='src-box ln2-addre y2020'>72.8</span></td></tr><tr><td>Common stock price</td><td><span class='src-box ln2-price y2021'>$23.06</span></td><td><span class='src-box ln2-price y2020'>$26.00</span></td></tr><tr><td>Earnings per share (EPS)</td><td><span class='src-box ln2-eps y2021'>$1.95</span></td><td><span class='src-box ln2-eps y2020'>$2.03</span></td></tr><tr><td>Dividends per share (DPS)</td><td><span class='src-box ln2-dps y2021'>$1.15</span></td><td><span class='src-box ln2-dps y2020'>$1.06</span></td></tr><tr><td>Book value per share (BVPS)</td><td><span class='src-box ln2-bvps y2021'>$12.53</span></td><td><span class='src-box ln2-bvps y2020'>$11.73</span></td></tr></tbody></table><p class='small-muted' style='margin-top:8px;'>Operating costs include cost of goods sold, operating expenses, and overhead; Allied's cost of goods sold specifically is 70% of net sales, or $2,100 million in 2021. Shares outstanding: 75 million in both years.</p></div></details>", "concept": "ch3-free-cash-flow-fcf", "chapterId": "ch3"}, {"id": "ch3-q5", "type": "multiple_choice", "lo": "3.2", "difficulty": "medium", "prompt": "A rapidly growing company reports negative free cash flow. What does the chapter say this most likely means?", "options": ["The company is certainly failing and should be avoided", "This is common for fast-growing firms, since fixed-asset and working-capital needs often exceed cash from existing operations", "The company has broken GAAP rules", "Free cash flow can never be negative for a healthy company"], "correctIndex": 1, "explanation": "Most rapidly growing companies have negative FCF because the investment needed to support growth outpaces cash generated by current operations \u2014 not necessarily a red flag, as long as the new investments eventually pay off.", "concept": "ch3-free-cash-flow-fcf", "chapterId": "ch3"}, {"id": "ch3-q6", "type": "multiple_choice", "lo": "3.2", "difficulty": "medium", "prompt": "What is the key difference between Market Value Added (MVA) and Economic Value Added (EVA)?", "options": ["MVA and EVA are two names for exactly the same calculation", "MVA compares a firm's total market value of equity to its book value; EVA compares after-tax operating profit to the dollar cost of all capital used, and can be measured for a single division", "EVA can only be calculated once, at a firm's founding", "MVA is calculated for divisions, while EVA is only for the whole company"], "correctIndex": 1, "explanation": "MVA is market value of equity minus book value of equity, calculated for the firm as a whole, while EVA (NOPAT minus the dollar cost of capital) can be calculated for individual divisions as well as the whole company.", "concept": "ch3-market-value-added-mva", "chapterId": "ch3"}, {"id": "ch3-q7", "type": "multiple_choice", "lo": "3.3", "difficulty": "medium", "prompt": "A single filer has $45,000 of taxable income, a 22% marginal tax rate, and a 12.64% average tax rate. Why is the average rate so much lower than the marginal rate?", "options": ["The IRS made an error", "Under a progressive tax system, only the top slice of income is taxed at the marginal rate \u2014 earlier, lower brackets are taxed at lower rates", "Average tax rates only apply to corporations", "The taxpayer must have claimed the standard deduction twice"], "correctIndex": 1, "explanation": "Because the tax system is progressive, only income within the top bracket is taxed at the 22% marginal rate \u2014 income in the lower brackets is taxed at 10% and 12%, pulling the overall average rate well below the marginal rate.", "concept": "ch3-marginal-tax-rate", "chapterId": "ch3"}, {"id": "ch3-q8", "type": "multiple_choice", "lo": "3.3", "difficulty": "hard", "prompt": "Why does the U.S. corporate tax system favor debt financing over equity financing?", "options": ["Dividends are tax-deductible, but interest is not", "Interest paid on debt is tax-deductible, but dividends paid to stockholders are not", "Both interest and dividends are fully deductible, so there's no difference", "Equity financing carries no risk to investors"], "correctIndex": 1, "explanation": "A firm needs only $1 of pretax income to pay $1 of interest (since it's deductible), but needs about $1.33 of pretax income (at a 25% tax rate) to pay $1 of dividends, since dividends aren't deductible \u2014 a direct tax incentive favoring debt.", "concept": "ch3-progressive-tax", "chapterId": "ch3"}, {"id": "ch3-q9", "type": "multiple_choice", "lo": "3.3", "difficulty": "medium", "prompt": "What did the Tax Cuts and Jobs Act (TCJA) of 2017 do to the corporate tax rate?", "options": ["Raised it to 39.6%", "Set a flat 21% federal corporate tax rate, down from a top rate around 35%", "Eliminated corporate taxes entirely", "Left the corporate tax rate unchanged but raised individual rates"], "correctIndex": 1, "explanation": "The TCJA established a flat 21% federal corporate tax rate (versus a prior top rate near 35%, among the highest in the developed world), which is why the textbook uses a 25% federal-plus-state rate as its working assumption.", "concept": "ch3-tax-cuts-and-jobs-act-tcja", "chapterId": "ch3"}, {"id": "ch3-q10", "type": "multiple_choice", "lo": "3.3", "difficulty": "exam", "prompt": "Company X loses $12 million in 2021, then earns $10 million of taxable income in 2022. Given the 80%-of-taxable-income limit on loss carryforwards, how much of the 2021 loss can it apply in 2022?", "options": ["The full $12 million", "$8 million (80% of the $10 million 2022 taxable income)", "$0 \u2014 losses can't be carried forward", "$2 million"], "correctIndex": 1, "explanation": "80% of the 2022 taxable income ($10M) is $8 million, which is less than the full $12 million loss available, so only $8 million can be applied in 2022 \u2014 leaving $4 million of the loss to carry forward into future years.", "concept": "ch3-loss-carryforward", "chapterId": "ch3"}, {"id": "ch3-q11", "type": "true_false", "lo": "3.1", "difficulty": "easy", "prompt": "Depreciation and amortization are cash expenses that reduce a firm's actual cash balance each year.", "correctAnswer": false, "explanation": "False \u2014 both are non-cash charges. The cash was spent when the asset was originally acquired; no cash goes out the door for depreciation itself.", "concept": "ch3-depreciation", "chapterId": "ch3"}, {"id": "ch3-q12", "type": "true_false", "lo": "3.3", "difficulty": "medium", "prompt": "Under the tax code, interest paid on debt is tax-deductible, while dividends paid on equity are not.", "correctAnswer": true, "explanation": "True \u2014 this asymmetry is exactly why the tax system favors debt financing over equity financing.", "concept": "ch3-tax-cuts-and-jobs-act-tcja", "chapterId": "ch3"}, {"id": "ch3-q13", "type": "fill_blank", "lo": "3.2", "difficulty": "medium", "prompt": "EBIT multiplied by (1 minus the tax rate) is called ______ \u2014 the profit a firm would generate if it had no debt.", "correctAnswer": "nopat", "acceptableAnswers": ["nopat", "NOPAT"], "explanation": "NOPAT (net operating profit after taxes) strips out financing effects so operating performance can be compared across firms with different capital structures.", "concept": "ch3-nopat", "chapterId": "ch3"}, {"id": "ch3-q14", "type": "two_truths_trap", "lo": "3.1", "difficulty": "hard", "prompt": "Which statement about the financial statements is INCORRECT?", "options": ["The balance sheet is a snapshot of a firm's position at one point in time.", "The income statement reports performance over a period of time, like a quarter or year.", "Retained earnings on the balance sheet represents a firm's actual cash on hand."], "correctIndex": 2, "explanation": "Retained earnings is a claim, not cash \u2014 a firm can report rising retained earnings while still being short on actual cash if it has reinvested that money into assets.", "concept": "ch3-retained-earnings", "chapterId": "ch3"}, {"id": "ch3-q15", "type": "matching", "lo": "3.2", "difficulty": "exam", "prompt": "Match each performance measure to what it actually measures.", "pairs": [{"left": "NOPAT", "right": "After-tax operating profit with no debt effects"}, {"left": "Free cash flow (FCF)", "right": "Cash available to withdraw without harming future operations"}, {"left": "MVA", "right": "Market value of equity minus its book value"}, {"left": "EVA", "right": "NOPAT minus the full dollar cost of all capital used"}], "explanation": "These four measures build on each other, moving from pure operating profit (NOPAT) to cash generation (FCF) to market-based (MVA) and true economic (EVA) value creation.", "concept": "ch3-nopat", "chapterId": "ch3"}, {"id": "ch4-q1", "type": "multiple_choice", "lo": "4.1", "difficulty": "easy", "prompt": "Which category of ratios gives an idea of how efficiently a firm is using its assets to generate sales?", "options": ["Liquidity ratios", "Asset management ratios", "Market value ratios", "Debt management ratios"], "correctIndex": 1, "explanation": "Asset management ratios (inventory turnover, DSO, fixed and total assets turnover) specifically measure how efficiently a firm is using its assets relative to its sales.", "concept": "ch4-asset-management-ratios", "chapterId": "ch4"}, {"id": "ch4-q2", "type": "multiple_choice", "lo": "4.2", "difficulty": "easy", "prompt": "A firm has $1,000 million in current assets and $310 million in current liabilities. What is its current ratio?", "options": ["0.31\u00d7", "3.2\u00d7", "4.2\u00d7", "1.0\u00d7"], "correctIndex": 1, "explanation": "Current ratio = Current Assets \u00f7 Current Liabilities = <span class='src-box ln-tca y2021'>$1,000M</span> \u00f7 <span class='src-box ln-tcl y2021'>$310M</span> = <strong><span class='src-box calc-result'>3.2\u00d7</span></strong>, exactly Allied's 2021 result.<details class='src-fold'><summary>Table 3.1 \u2014 Allied Food Products: Balance Sheets</summary><div class='src-fold-body'><table class='bs-table' style='margin:0;'><thead><tr><th>&nbsp;</th><th>2021</th><th>2020</th></tr></thead><tbody><tr class='bs-section'><td colspan='3'>Assets</td></tr><tr><td>Current assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Cash and equivalents</td><td><span class='src-box ln-cash y2021'>$10</span></td><td><span class='src-box ln-cash y2020'>$80</span></td></tr><tr><td style='padding-left:28px;'>Accounts receivable</td><td><span class='src-box ln-ar y2021'>375</span></td><td><span class='src-box ln-ar y2020'>315</span></td></tr><tr><td style='padding-left:28px;'>Inventories</td><td><span class='src-box ln-inv y2021'>615</span></td><td><span class='src-box ln-inv y2020'>415</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current assets</td><td><span class='src-box ln-tca y2021'>$1,000</span></td><td><span class='src-box ln-tca y2020'>$810</span></td></tr><tr><td>Net fixed assets:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Net plant and equipment (cost minus depreciation)</td><td><span class='src-box ln-ppe y2021'>1,000</span></td><td><span class='src-box ln-ppe y2020'>870</span></td></tr><tr><td>Other assets expected to last more than a year</td><td>0</td><td>0</td></tr><tr class='bs-total'><td>Total assets</td><td><span class='src-box ln-ta y2021'>$2,000</span></td><td><span class='src-box ln-ta y2020'>$1,680</span></td></tr><tr class='bs-section'><td colspan='3'>Liabilities and Equity</td></tr><tr><td>Current liabilities:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Accounts payable</td><td><span class='src-box ln-ap y2021'>$60</span></td><td><span class='src-box ln-ap y2020'>$30</span></td></tr><tr><td style='padding-left:28px;'>Accruals</td><td><span class='src-box ln-accr y2021'>140</span></td><td><span class='src-box ln-accr y2020'>130</span></td></tr><tr><td style='padding-left:28px;'>Notes payable</td><td><span class='src-box ln-np y2021'>110</span></td><td><span class='src-box ln-np y2020'>60</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total current liabilities</td><td><span class='src-box ln-tcl y2021'>$310</span></td><td><span class='src-box ln-tcl y2020'>$220</span></td></tr><tr><td>Long-term bonds</td><td><span class='src-box ln-ltb y2021'>750</span></td><td><span class='src-box ln-ltb y2020'>580</span></td></tr><tr class='bs-subtotal'><td>Total liabilities</td><td><span class='src-box ln-tl y2021'>$1,060</span></td><td><span class='src-box ln-tl y2020'>$800</span></td></tr><tr><td>Common equity:</td><td></td><td></td></tr><tr><td style='padding-left:28px;'>Common stock (75,000,000 shares)</td><td><span class='src-box ln-cs y2021'>$130</span></td><td><span class='src-box ln-cs y2020'>$130</span></td></tr><tr><td style='padding-left:28px;'>Retained earnings</td><td><span class='src-box ln-re y2021'>810</span></td><td><span class='src-box ln-re y2020'>750</span></td></tr><tr class='bs-subtotal'><td style='padding-left:14px;'>Total common equity</td><td><span class='src-box ln-tce y2021'>$940</span></td><td><span class='src-box ln-tce y2020'>$880</span></td></tr><tr class='bs-total'><td>Total liabilities and equity</td><td><span class='src-box ln-tle y2021'>$2,000</span></td><td><span class='src-box ln-tle y2020'>$1,680</span></td></tr></tbody></table></div></details>", "concept": "ch4-current-ratio", "chapterId": "ch4"}, {"id": "ch4-q3", "type": "multiple_choice", "lo": "4.2", "difficulty": "medium", "prompt": "Why does the quick (acid-test) ratio subtract inventories from current assets?", "options": ["Because inventories are not a current asset", "Because inventories are typically the least liquid current asset and could lose value in a liquidation", "Because inventories are already counted in current liabilities", "Because subtracting inventories always increases the ratio"], "correctIndex": 1, "explanation": "Inventories may not convert to cash as quickly as expected if sales slow down, and they're the asset most likely to lose value in a liquidation, so the quick ratio excludes them for a stricter liquidity test.", "concept": "ch4-quick-ratio", "chapterId": "ch4"}, {"id": "ch4-q4", "type": "multiple_choice", "lo": "4.3", "difficulty": "medium", "prompt": "Why does the inventory turnover ratio use cost of goods sold rather than sales in its numerator?", "options": ["Cost of goods sold is always larger than sales", "Sales are stated at market prices while inventories are carried at cost, so using sales would overstate turnover", "Sales data isn't available for most firms", "Inventory turnover doesn't actually use cost of goods sold"], "correctIndex": 1, "explanation": "Since inventories are recorded at cost, dividing by sales (which reflects market prices) would inflate the apparent turnover rate \u2014 cost of goods sold keeps the comparison apples-to-apples.", "concept": "ch4-inventory-turnover-ratio", "chapterId": "ch4"}, {"id": "ch4-q5", "type": "multiple_choice", "lo": "4.3", "difficulty": "hard", "prompt": "Allied's DSO is 46 days, its credit policy calls for payment within 30 days, and the industry average DSO is 36 days. What does this combination most strongly suggest?", "options": ["Allied's credit policy is too generous for its industry", "Allied's own customers are paying later than Allied's stated terms require, risking bad debts", "Allied has no accounts receivable", "The industry average is calculated incorrectly"], "correctIndex": 1, "explanation": "Comparing DSO to a firm's own credit terms (not just the industry average) reveals that Allied's customers are paying about 16 days later than required, tying up cash and raising default risk.", "concept": "ch4-days-sales-outstanding-dso", "chapterId": "ch4"}, {"id": "ch4-q6", "type": "multiple_choice", "lo": "4.3", "difficulty": "medium", "prompt": "An older firm and an identical newer firm have the same operations, but the older firm shows a higher fixed assets turnover ratio. What is the most likely explanation?", "options": ["The older firm is genuinely more efficient", "The older firm's fixed assets are more heavily depreciated on the books due to inflation, understating their true value in the denominator", "The newer firm has no fixed assets", "Fixed assets turnover cannot differ between firms with identical operations"], "correctIndex": 1, "explanation": "Fixed assets are shown at historical cost less depreciation; inflation can seriously understate older assets' book value, inflating the older firm's ratio even though true efficiency may be identical.", "concept": "ch4-fixed-assets-turnover-ratio", "chapterId": "ch4"}, {"id": "ch4-q7", "type": "multiple_choice", "lo": "4.4", "difficulty": "hard", "prompt": "In the Firm U vs. Firm L example, why is Firm L's ROE under 'bad' conditions negative (\u221210%) while Firm U's ROE under the same conditions is exactly 0%?", "options": ["Firm L has higher operating costs than Firm U", "Firm L must still pay its fixed $5 of interest even when EBIT is $0, producing a net loss, while debt-free Firm U simply earns zero profit", "Firm U's sales are higher than Firm L's in bad conditions", "Firm L pays a higher tax rate than Firm U"], "correctIndex": 1, "explanation": "Both firms have identical EBIT ($0) in the bad scenario, but Firm L's fixed interest obligation isn't reduced just because business is bad, pushing it into a net loss and a negative ROE that Firm U, with no debt, doesn't experience.", "concept": "ch4-financial-leverage", "chapterId": "ch4"}, {"id": "ch4-q8", "type": "multiple_choice", "lo": "4.4", "difficulty": "medium", "prompt": "When calculating the total debt to total capital ratio, which of the following is correctly EXCLUDED from 'total debt'?", "options": ["Long-term bonds", "Short-term notes payable", "Accounts payable and accruals", "Both long-term bonds and notes payable"], "correctIndex": 2, "explanation": "Total debt includes only interest-bearing debt (notes payable and long-term bonds) \u2014 non-interest-bearing operating liabilities like accounts payable and accruals are excluded.", "concept": "ch4-total-debt-to-total-capital", "chapterId": "ch4"}, {"id": "ch4-q9", "type": "multiple_choice", "lo": "4.4", "difficulty": "medium", "prompt": "Why does the times-interest-earned (TIE) ratio use EBIT instead of net income in its numerator?", "options": ["EBIT is always a larger number, which looks better", "Interest is paid with pretax dollars, so a firm's ability to pay current interest isn't affected by taxes", "Net income isn't reported on the income statement", "TIE is only used by companies with no debt"], "correctIndex": 1, "explanation": "Because interest is a pretax expense, EBIT (which sits before both interest and taxes) more directly reflects how much operating profit is available to cover the interest bill, regardless of the firm's tax situation.", "concept": "ch4-times-interest-earned-tie-ratio", "chapterId": "ch4"}, {"id": "ch4-q10", "type": "multiple_choice", "lo": "4.5", "difficulty": "medium", "prompt": "Two firms have identical sales, operating costs, and EBIT, but Firm A uses more debt than Firm B. Which of the following is true?", "options": ["Firm A will have a higher profit margin than Firm B", "Firm A will have a lower profit margin than Firm B, due to higher interest expense", "Both firms will have identical profit margins", "Profit margin is unaffected by a firm's use of debt"], "correctIndex": 1, "explanation": "Even with identical operations, the more indebted firm pays more interest, which lowers net income and therefore lowers profit margin (net income \u00f7 sales), purely because of financing choices.", "concept": "ch4-profit-margin", "chapterId": "ch4"}, {"id": "ch4-q11", "type": "true_false", "lo": "4.2", "difficulty": "easy", "prompt": "A current ratio well above the industry average is always a clearly positive sign for a company.", "correctAnswer": false, "explanation": "False \u2014 an unusually high current ratio can actually signal too much old, unproductive inventory or too many accounts receivable that may turn into bad debts, rather than genuinely strong liquidity.", "concept": "ch4-current-ratio", "chapterId": "ch4"}, {"id": "ch4-q12", "type": "true_false", "lo": "4.3", "difficulty": "medium", "prompt": "The days sales outstanding (DSO) ratio should only ever be compared to the industry average, never to a firm's own credit policy.", "correctAnswer": false, "explanation": "False \u2014 the chapter explicitly compares Allied's 46-day DSO to its own 30-day credit policy, which reveals a payment problem the industry comparison alone wouldn't fully capture.", "concept": "ch4-days-sales-outstanding-dso", "chapterId": "ch4"}, {"id": "ch4-q13", "type": "fill_blank", "lo": "4.4", "difficulty": "medium", "prompt": "The ratio of EBIT to interest charges, which measures how far operating income can fall before a firm can't cover its interest costs, is called the times-interest-______ ratio.", "correctAnswer": "earned", "acceptableAnswers": ["earned"], "explanation": "The times-interest-earned (TIE) ratio directly measures how many times over a firm's operating income could cover its required interest payments.", "concept": "ch4-times-interest-earned-tie-ratio", "chapterId": "ch4"}, {"id": "ch4-q14", "type": "two_truths_trap", "lo": "4.5", "difficulty": "hard", "prompt": "Which statement about profitability ratios is INCORRECT?", "options": ["Operating margin uses EBIT, while profit margin uses net income", "A firm can have a high profit margin per sale but still generate low overall net income if its sales volume is low", "Return on total assets (ROA) is always a pure measure of operating efficiency, completely unaffected by financing choices"], "correctIndex": 2, "explanation": "ROA (net income \u00f7 total assets) IS affected by financing choices \u2014 heavy use of debt raises interest expense, which lowers net income and therefore lowers ROA, even if operations themselves are efficient.", "concept": "ch4-return-on-total-assets-roa", "chapterId": "ch4"}, {"id": "ch4-q15", "type": "matching", "lo": "4.1", "difficulty": "medium", "prompt": "Match each ratio category to the question it answers.", "pairs": [{"left": "Liquidity ratios", "right": "Can the firm pay off debts maturing within a year?"}, {"left": "Asset management ratios", "right": "Is the firm using its assets efficiently relative to sales?"}, {"left": "Debt management ratios", "right": "How has the firm financed its assets, and can it service long-term debt?"}, {"left": "Profitability ratios", "right": "What is the net result of all financing and operating decisions combined?"}], "explanation": "Each ratio category answers a distinct question, and profitability ratios in particular summarize the combined effect of everything the other three categories measure.", "concept": "ch4-liquidity-ratios", "chapterId": "ch4"}, {"id": "ch4b-q1", "type": "multiple_choice", "lo": "4.5", "difficulty": "medium", "prompt": "A firm's ROA is 7.3% and its ROE is 15.6%. What does this gap between the two ratios primarily reflect?", "options": ["A calculation error, since ROA and ROE should always be equal", "The firm's use of debt financing, which concentrates the asset-generated return onto a smaller equity base", "The firm paying no taxes", "The firm having no fixed assets"], "correctIndex": 1, "explanation": "ROE divides net income by common equity alone, while ROA divides by total assets (funded by both debt and equity) \u2014 any use of debt will push ROE above ROA, exactly as the equity multiplier in the DuPont equation shows.", "concept": "ch4-return-on-common-equity-roe", "chapterId": "ch4"}, {"id": "ch4b-q2", "type": "multiple_choice", "lo": "4.5", "difficulty": "hard", "prompt": "Why does ROIC use NOPAT [EBIT(1-T)] in its numerator instead of net income?", "options": ["NOPAT is always a larger number", "Net income already subtracts interest paid to debtholders, which would double-count their claim since ROIC's denominator already includes debt", "NOPAT is easier to calculate", "ROIC doesn't actually use EBIT"], "correctIndex": 1, "explanation": "Because ROIC's denominator (total invested capital) includes both debt and equity, its numerator must represent income available to BOTH groups \u2014 which is exactly what NOPAT is, before interest is paid out.", "concept": "ch4-return-on-invested-capital-roic", "chapterId": "ch4"}, {"id": "ch4b-q3", "type": "multiple_choice", "lo": "4.6", "difficulty": "medium", "prompt": "A company's P/E ratio is far below its industry average. According to the chapter, what does this most likely suggest?", "options": ["The company is certain to be a great investment", "The market regards the company as relatively risky, having poor growth prospects, or both", "The company has no earnings", "The industry average must be wrong"], "correctIndex": 1, "explanation": "Low P/E ratios are typical of firms the market sees as slow-growing or risky, just as Allied's below-average P/E was interpreted in the chapter.", "concept": "ch4-price-earnings-pe-ratio", "chapterId": "ch4"}, {"id": "ch4b-q4", "type": "multiple_choice", "lo": "4.6", "difficulty": "medium", "prompt": "Why does the chapter subtract a company's cash and equivalents when calculating enterprise value?", "options": ["Cash should never be counted as part of a company's value", "Without this adjustment, a company with large cash holdings but inefficient operations could look like it's outperforming a more efficient peer with less cash on hand", "Cash is already included in EBITDA", "Enterprise value doesn't actually subtract cash"], "correctIndex": 1, "explanation": "Subtracting cash makes EV/EBITDA comparisons fairer across companies with very different cash balances, since a big cash pile isn't itself a sign of efficient operations.", "concept": "ch4-enterprise-value", "chapterId": "ch4"}, {"id": "ch4b-q5", "type": "multiple_choice", "lo": "4.7", "difficulty": "hard", "prompt": "In the DuPont equation, if a firm reduced its debt down to the industry-average equity multiplier while leaving its profit margin and total assets turnover unchanged, what would happen to its ROE?", "options": ["ROE would rise, since less debt is always better", "ROE would fall, since a lower equity multiplier means less leverage amplifying the return", "ROE would stay exactly the same", "ROE cannot be calculated without more information"], "correctIndex": 1, "explanation": "Exactly as the chapter shows for Allied \u2014 cutting debt down to the industry's lower equity multiplier (1.73\u00d7) while margin and turnover stay the same drops ROE from 15.6% to about 12.66%, since less leverage means less amplification of an already below-average ROA.", "concept": "ch4-dupont-equation", "chapterId": "ch4"}, {"id": "ch4b-q6", "type": "multiple_choice", "lo": "4.7", "difficulty": "exam", "prompt": "A division manager rejects a genuinely profitable new project (35% ROE, well above the firm's 10% cost of capital) because it would pull the division's average ROE down from 45% to something lower. Which 'misuse of ROE' problem does this illustrate?", "options": ["ROE not considering risk", "ROE not considering the amount of invested capital", "A focus on ROE causing managers to turn down profitable projects", "This isn't a misuse of ROE at all"], "correctIndex": 2, "explanation": "This is exactly the third misuse the chapter describes: bonus schemes tied purely to ROE can cause managers to reject projects that are genuinely profitable (well above the cost of capital) simply because they'd dilute an already-high average ROE.", "concept": "ch4-dupont-equation", "chapterId": "ch4"}, {"id": "ch4b-q7", "type": "multiple_choice", "lo": "4.7", "difficulty": "hard", "prompt": "According to the chapter's EVA formula EVA = Equity(ROE \u2212 Cost of Equity), what three factors does EVA ultimately depend on?", "options": ["Only the firm's ROE", "Rate of return (ROE), risk (which affects the cost of equity), and size (the amount of equity employed)", "Only the firm's total assets", "Only the firm's tax rate"], "correctIndex": 1, "explanation": "The rewritten EVA formula makes explicit that value creation depends on all three: how well a firm performs (ROE), how risky that performance is (cost of equity), and how much capital is actually employed (equity).", "concept": "ch3-economic-value-added-eva", "chapterId": "ch4"}, {"id": "ch4b-q8", "type": "multiple_choice", "lo": "4.8", "difficulty": "medium", "prompt": "Why might a firm prefer benchmarking against a handful of specific competitors rather than relying only on a broad industry average?", "options": ["Benchmarking is always required by law", "A broad industry average can blend together very different kinds of firms, while chosen benchmark competitors give a more directly comparable picture", "Industry averages are never publicly available", "Benchmarking eliminates the need for any ratio calculations"], "correctIndex": 1, "explanation": "As with Allied's comparison to Campbell Soup, Hershey, Kellogg, and others, benchmarking against real, chosen competitors gives management a much more actionable sense of where it truly stands than a broad average can.", "concept": "ch4-benchmarking", "chapterId": "ch4"}, {"id": "ch4b-q9", "type": "true_false", "lo": "4.8", "difficulty": "medium", "prompt": "A ratio that matches the industry average in the current year can still be concerning if trend analysis shows it has been steadily declining for several years.", "correctAnswer": true, "explanation": "True \u2014 trend analysis is specifically designed to catch this: a single-year snapshot compared to the industry average can miss a real multi-year decline, which is exactly what happened with Allied's ROE since 2018.", "concept": "ch4-trend-analysis", "chapterId": "ch4"}, {"id": "ch4b-q10", "type": "true_false", "lo": "4.8", "difficulty": "easy", "prompt": "Ratio analysis is equally easy to apply to a large, multidivisional conglomerate operating in many different industries as it is to a narrowly focused single-industry firm.", "correctAnswer": false, "explanation": "False \u2014 the chapter specifically notes that it's difficult to develop a meaningful industry average for multidivisional firms, so ratio analysis is more useful for narrowly focused firms.", "concept": "ch4-trend-analysis", "chapterId": "ch4"}, {"id": "ch4b-q11", "type": "fill_blank", "lo": "4.6", "difficulty": "medium", "prompt": "A stock's market price divided by its book value per share is called the market/______ ratio.", "correctAnswer": "book", "acceptableAnswers": ["book"], "explanation": "The market/book (M/B) ratio compares what investors are willing to pay for a share against its accounting book value.", "concept": "ch4-market-book-mb-ratio", "chapterId": "ch4"}, {"id": "ch4b-q12", "type": "two_truths_trap", "lo": "4.5", "difficulty": "hard", "prompt": "Which statement about ROA, ROE, ROIC, and BEP is INCORRECT?", "options": ["BEP uses EBIT (before interest and taxes) in its numerator, making it useful for comparing firms with different debt and tax situations", "ROIC's numerator is NOPAT, making it available to both stockholders and debtholders", "ROE will always be lower than ROA for any firm that uses any amount of debt financing"], "correctIndex": 2, "explanation": "This is backwards \u2014 ROE will always be HIGHER than ROA for a firm using debt, since ROE concentrates the same total return onto a smaller equity base (the equity multiplier effect in the DuPont equation).", "concept": "ch4-basic-earning-power-bep-ratio", "chapterId": "ch4"}, {"id": "ch4b-q13", "type": "matching", "lo": "4.6", "difficulty": "medium", "prompt": "Match each market value ratio to what it measures.", "pairs": [{"left": "P/E ratio", "right": "How much investors pay per dollar of reported profits"}, {"left": "Market/book ratio", "right": "How much investors pay per dollar of accounting (book) value"}, {"left": "EV/EBITDA ratio", "right": "The market value of all financial claims relative to cash operating profit"}], "explanation": "Each market value ratio relates the stock's price to a different underlying measure \u2014 earnings, book value, or enterprise-wide cash profitability.", "concept": "ch4-price-earnings-pe-ratio", "chapterId": "ch4"}], "loProse": {"1.1": [{"heading": "What finance is, and how it's organized (Sections 1-1, 1-1A)", "html": "<p>Finance covers three interrelated areas. <span class='term' data-cid='ch1-financial-management-corporate-finance'>Financial management</span> (also called corporate finance) is about which assets a firm should acquire, how to raise the capital to pay for them, and how to run the firm to maximize its value. <span class='term' data-cid='ch2-capital-markets'>Capital markets</span> is the study of where interest rates and security prices are determined, and the institutions \u2014 banks, investment banks, insurers, the Federal Reserve, the SEC \u2014 that channel savers' money to businesses. <span class='term' data-cid='ch1-investments'>Investments</span> covers decisions about stocks and bonds themselves, including <span class='term' data-cid='ch1-security-analysis'>security analysis</span> (valuing individual stocks/bonds), <span class='term' data-cid='ch1-portfolio-theory'>portfolio theory</span> (building diversified baskets of securities to control risk), and <span class='term' data-cid='ch1-market-analysis'>market analysis</span> (judging whether markets overall are too high, too low, or about right) \u2014 including <span class='term' data-cid='ch2-behavioral-finance'>behavioral finance</span>, which studies investor psychology behind bubbles and excessive pessimism.</p><div class='example'><span class='example-label'>Why the split matters less than it looks</span>A bank loan officer still needs to understand corporate finance to judge a business loan, and a corporate treasurer needs to understand banking to negotiate good loan terms \u2014 the three areas constantly lean on each other.</div>"}, {"heading": "Where finance sits inside a company (Section 1-1B)", "html": "<p>Most organizations run through a chain of command: the <span class='term'>Board of Directors</span> sits at the top, followed by the <span class='term' data-cid='ch1-ceo-chief-executive-officer'>CEO</span>. Below the CEO, the <span class='term' data-cid='ch1-coo-chief-operating-officer'>COO</span> runs operating departments (marketing, production, HR), while the <span class='term' data-cid='ch1-cfo-chief-financial-officer'>CFO</span> \u2014 usually the third-ranking officer \u2014 controls accounting, treasury, credit policy, capital budgeting, and investor relations.</p><p>Since 2002, the <span class='term' data-cid='ch1-sarbanes-oxley-act'>Sarbanes-Oxley Act</span> has required the CEO and CFO of a public company to personally certify that the financial statements released to stockholders are accurate, with real legal exposure if they're wrong.</p><div class='example'><span class='example-label'>Why this law exists</span>Congress passed Sarbanes-Oxley after scandals at companies like Enron and WorldCom, where false financial reporting cost investors, employees, and suppliers billions of dollars.</div>"}, {"heading": "Finance, economics, and accounting \u2014 and why it matters even if you're not a finance major (Sections 1-1C, 1-2)", "html": "<p>Finance grew out of two older disciplines: economics supplies the idea that an asset's value comes from the future cash flows it will generate, and accounting supplies the data on how big those cash flows are likely to be. That's why the accounting department typically reports up through the CFO.</p><p>Finance knowledge also matters outside a finance career. Marketing proposals get evaluated on their financial payoff, management decisions get judged by their effect on firm value, and individuals now personally manage their own <span class='term'>defined-contribution</span> retirement accounts \u2014 deciding how much goes into stocks, bonds, or money funds, and how much risk to take.</p>"}], "1.2": [{"heading": "Four ways to organize a business (Section 1-3)", "html": "<p>The basics of financial management are the same for all businesses, large or small, regardless of how they're organized. Still, a firm's legal structure affects its operations, so it's worth understanding. There are four main forms of business organization: (1) proprietorships, (2) partnerships, (3) corporations, and (4) limited liability companies (LLCs) and limited liability partnerships (LLPs).</p><p>In terms of raw numbers, most businesses are proprietorships. But measured by the dollar value of sales, more than 80% of all business is done by corporations. Because corporations conduct the most business \u2014 and because most successful businesses eventually convert to corporations \u2014 this book focuses mainly on them. Still, it's important to understand the legal differences between the forms.</p><p>A <span class='term' data-cid='ch1-proprietorship'>proprietorship</span> is an unincorporated business owned by one individual. Going into business as a sole proprietor is easy \u2014 a person simply begins operating. Proprietorships have three important advantages:</p><ol><li>They're easy and inexpensive to form.</li><li>They're subject to few government regulations.</li><li>They're subject to lower income taxes than corporations.</li></ol><p>However, proprietorships also carry three important limitations:</p><ol><li>Proprietors have <b>unlimited personal liability</b> for the business's debts, so they can lose more than the amount of money they invested in the company.</li><li>The life of the business is limited to the life of the individual who created it, and bringing in new equity investors requires changing the structure of the business.</li><li>Because of the first two points, proprietorships have difficulty obtaining large sums of capital \u2014 which is exactly why they're used primarily for small businesses.</li></ol><div class='example'><span class='example-label'>Concrete example \u2014 unlimited liability</span>You invest $10,000 to start a business, but you could be sued for $1 million if one of your employees runs over someone with a car during company time. As a sole proprietor, your personal assets \u2014 not just the $10,000 you invested \u2014 are on the hook.</div><p>Businesses are frequently started as proprietorships and then converted to corporations later, once growth causes the disadvantages to outweigh the advantages.</p><p>A <span class='term' data-cid='ch1-partnership'>partnership</span> is a legal arrangement between two or more people who decide to do business together. Partnerships can be established about as easily and inexpensively as proprietorships, and the firm's income is allocated to the partners on a pro rata basis and taxed individually \u2014 which lets the business avoid the corporate income tax entirely. The catch: partners are generally subject to unlimited personal liability, which means that if the partnership goes bankrupt and any one partner can't cover their pro rata share of its debts, the remaining partners become responsible for making up the shortfall.</p><div class='example'><span class='example-label'>Concrete example \u2014 one partner's mistake, everyone's liability</span>The bad decisions of a partner in Texas can financially ruin a millionaire partner in New York who had nothing to do with what went wrong \u2014 that's what unlimited liability means for a partnership. It's also exactly why partnerships find it difficult to raise large amounts of capital: investors are reluctant to expose themselves to debts run up by people they don't control.</div><p>A <span class='term' data-cid='ch1-corporation'>corporation</span> is a legal entity created by a state, separate and distinct from its owners and managers. That separation is what limits stockholders' losses to the amount they invested \u2014 the corporation itself can lose everything, but its owners can only lose what they put in. Corporations also have unlimited life, and shares of corporate stock are easier to transfer than an ownership interest in an unincorporated business. Together, these factors make it far easier for corporations to raise the capital needed to run a large business \u2014 which is exactly why companies like Hewlett-Packard and Microsoft generally started out as proprietorships or partnerships, but found it advantageous to become corporations once they grew.</p><p>The major drawback to the corporate form is taxes: most corporate earnings are subject to <span class='term' data-cid='ch1-double-taxation'>double taxation</span> \u2014 the corporation's earnings are taxed once, and then taxed again as personal income when the after-tax earnings are paid out to stockholders as dividends. As a partial remedy for small businesses, Congress created the <span class='term' data-cid='ch1-s-corporation'>S corporation</span>, which is taxed as if it were a proprietorship or partnership and so is exempt from the corporate income tax. To qualify, a firm can have no more than 100 stockholders \u2014 which limits S-corp status to relatively small, privately held firms. Larger corporations are known as <b>C corporations</b>. The vast majority of small corporations elect S status and keep it until they decide to sell stock to the public, at which point they become C corporations.</p><p>A <span class='term' data-cid='ch1-llc-limited-liability-company'>limited liability company (LLC)</span> is a popular hybrid between a partnership and a corporation. A <span class='term' data-cid='ch1-llp-limited-liability-partnership'>limited liability partnership (LLP)</span> is similar \u2014 LLPs tend to be used by professional firms in fields like accounting, law, and architecture, while LLCs are used by other kinds of businesses. Like corporations, LLCs and LLPs provide limited liability protection, but they're taxed like partnerships. And unlike a limited partnership, where the general partner retains full control of the business, investors in an LLC or LLP get votes in proportion to their ownership stake. LLCs and LLPs have been gaining popularity, but large companies still generally find it advantageous to be C corporations because of how much more easily corporations can raise capital to support growth. LLCs/LLPs were dreamed up by lawyers; they're often structured in complicated ways and their legal protections vary by state \u2014 so it's genuinely necessary to hire a good lawyer when setting one up.</p>"}, {"heading": "Why most large, successful firms end up as corporations (Section 1-3, cont.)", "html": "<p>When deciding on its form of organization, a firm has to weigh the advantages of incorporation against double taxation. For any business beyond a relatively small one, though, value is generally maximized by organizing as a corporation, for three reasons:</p><ol><li><b>Limited liability reduces the risk borne by investors</b>, and all else equal, lower risk means higher value.</li><li><b>A firm's value depends on its growth opportunities</b>, which in turn depend on its ability to attract capital. Because corporations can attract capital more easily than other business forms, they're better positioned to seize growth opportunities.</li><li><b>An asset's value also depends on its liquidity</b> \u2014 how much time and effort it takes to sell it for cash at a fair price. Corporate stock is easier to transfer to a buyer than an interest in a proprietorship or partnership, and more investors are willing to invest in stock than in a partnership (with its unlimited-liability risk), so a corporate investment is relatively liquid. That liquidity, too, raises a corporation's value.</li></ol><div class='recap-block'><h4>What you need to understand</h4><ul><li>Why unlimited liability is the central limitation of both proprietorships and partnerships, and how it can expose an owner to losses far beyond what they invested.</li><li>Why the corporate form, despite double taxation, still tends to maximize value for any business beyond a small one.</li></ul><h4>What you need to remember</h4><ul><li>The four forms: proprietorship, partnership, corporation, and the LLC/LLP hybrid.</li><li>S corporations avoid double taxation but are capped at 100 stockholders; larger firms are C corporations.</li></ul><h4>Common confusions</h4><ul><li>Assuming LLC/LLP investors have full partnership-style control \u2014 they actually vote in proportion to ownership stake, unlike a limited partnership's general partner.</li><li>Confusing which firms would want S-corp status \u2014 large companies like IBM, GE, or Microsoft can't qualify (too many shareholders), and wouldn't want to even if they could.</li></ul><h4>Possible exam question</h4><ul><li>\u201cExplain why a business's value is generally maximized by organizing as a corporation once it grows beyond a small size, despite the corporate form's tax disadvantage.\u201d</li></ul></div>"}], "1.3": [{"heading": "The firm's main financial goal (Section 1-4)", "html": "<p>For a public corporation, the stated goal is <span class='term' data-cid='ch1-shareholder-wealth-maximization'>shareholder wealth maximization</span> \u2014 maximizing the long-run value of the firm's stock. This isn't the same as chasing growth, market share, or this quarter's earnings per share for their own sake; those are secondary if they don't ultimately serve long-run stockholder value. Because a share's value comes from the cash flows it's expected to generate over many future years (covered in depth later, in stock valuation), pursuing this goal requires a long-run view \u2014 even though the market may not immediately reflect the value of a good long-run decision.</p>"}, {"heading": "Intrinsic value vs. market price (Sections 1-4A, 1-4B)", "html": "<p>A stock's <span class='term' data-cid='ch2-intrinsic-value-stock-market-context'>intrinsic value</span> is a competent analyst's best estimate of its true worth, based on the most accurate available data about future cash flows and risk. Its <span class='term' data-cid='ch2-market-price-stock-market-context'>market price</span> is simply what it's actually trading at, which reflects the perceptions \u2014 sometimes mistaken \u2014 of the <span class='term' data-cid='ch1-marginal-investor'>marginal investor</span>, the investor whose buy/sell decisions are what actually set the current price. When market price and intrinsic value are equal, the stock is in <span class='term' data-cid='ch1-equilibrium-stock-price'>equilibrium</span>; the two can drift apart in the short run, but tend to converge as more information comes out.</p><div class='example'><span class='example-label'>Concrete example</span>In early 2001, investors perceived Enron as highly profitable and low-risk. The company's true financial position \u2014 known to its executives but hidden from the public \u2014 was actually far weaker and riskier. Perceived value and true (intrinsic) value had diverged sharply.</div><p>Because intrinsic value can't be directly observed, managers should aim to maximize it \u2014 which maximizes the stock's average price over the long run \u2014 and then communicate honestly with investors (without tipping off competitors) so the market price stays close to that true value.</p>"}, {"heading": "What happens when managers focus on the short run instead (Section 1-4C)", "html": "<p>The chapter uses two real cases to show the cost of chasing short-term numbers. Before the 2007\u20132008 financial crisis, many Wall Street executives were paid large bonuses for short-term trading profits that later collapsed, forcing a government bailout. At Wells Fargo, incentives tied to new-account sign-ups led employees to open fake accounts and unauthorized credit cards \u2014 resulting in the firing of thousands of employees (including senior leadership), a Fed-imposed growth cap, and a $3 billion settlement.</p><p>The chapter's proposed fix is <span class='term' data-cid='ch1-corporate-governance'>corporate governance</span>: boards putting rules and practices in place \u2014 including well-designed executive pay \u2014 to keep managers focused on long-run shareholder value while still weighing other stakeholders.</p>"}, {"heading": "Designing compensation around the long run (Section 1-5A)", "html": "<p>Stock and stock options are popular because they're meant to make managers think like stockholders. But compensation tied to a single option-exercise date can backfire: managers may reject genuinely good long-run projects because they'd hurt short-term profit (and the stock price on that one date), or even inflate reported profits temporarily to cash out before the truth comes out. The chapter's fix is to phase options or stock awards in over several years, and \u2014 where possible \u2014 base pay on an average stock price over time rather than one snapshot date.</p>"}], "1.4": [{"heading": "Agency theory: stockholders vs. managers (Section 1-5)", "html": "<p>Managers' personal goals don't always match stockholders' goals \u2014 this is the core idea behind <span class='term' data-cid='ch1-agency-theory-agency-conflict'>agency theory</span>. A manager might prefer a high salary, job security, or a short-term stock pop over the shareholders' long-run interest. Three main tools push managers back toward shareholders' interests: well-designed <span class='term'>compensation packages</span>, the risk of being fired for poor performance, and the threat of a <span class='term' data-cid='ch1-hostile-takeover'>hostile takeover</span>.</p>"}, {"heading": "Corporate raiders and the takeover threat (Section 1-5C)", "html": "<p>If a stock's market price falls well below its intrinsic value, a <span class='term' data-cid='ch1-corporate-raider'>corporate raider</span> may see a bargain and attempt a hostile takeover \u2014 an acquisition pushed through over management's objection. If it succeeds, the target's executives are almost always fired. That risk gives managers a strong incentive to keep working toward the stock's true, long-run value rather than let it become undervalued.</p>"}, {"heading": "Direct stockholder intervention (Section 1-5B)", "html": "<p>Today most shares are held by large institutional investors \u2014 pension funds, insurers, mutual funds \u2014 who can pressure management directly. Any shareholder who has held $2,000 of stock for a year can sponsor a nonbinding proposal at the annual meeting, and Dodd-Frank-era SEC rules mandate a periodic 'say-on-pay' advisory vote on CEO compensation. In recent years, this kind of pressure has contributed to CEO departures at a number of well-known companies following poor performance.</p><div class='example'><span class='example-label'>Concrete example</span>Coca-Cola revised its executive compensation package after facing public criticism from its largest shareholder, Warren Buffett.</div>"}, {"heading": "Agency theory: stockholders vs. bondholders (Section 1-6)", "html": "<p>A second conflict runs between stockholders and <span class='term'>debtholders</span> (bondholders and bankers). Debtholders receive fixed payments no matter how well the company does, while stockholders capture all the upside \u2014 so stockholders (acting through managers) have an incentive to shift toward riskier projects after debt is already in place, since they gain most of the extra reward while bondholders bear more of the extra risk without extra return.</p><div class='example'><span class='example-label'>Concrete example \u2014 Project L vs. Project H</span>Both projects have the same expected cash flow, but Project L is safer (worth $2,000\u2013$2,400 either way) while Project H is high-risk (worth $4,400 if the market is good, $0 if it's bad). Stockholders' expected return jumps from about 12% under Project L to about 66% under Project H \u2014 but bondholders get no extra upside and could lose everything, which is exactly why they'd object to the switch.</div><p>Because bondholders anticipate this risk-shifting temptation, they protect themselves with <span class='term' data-cid='ch1-bond-covenant'>bond covenants</span> \u2014 contract terms that restrict a firm's ability to take on more debt or take other risky actions \u2014 and by charging higher interest rates on debt they see as more exposed to this kind of behavior.</p>"}], "1.5": [{"heading": "Shareholder value doesn't mean 'at all costs' (Section 1-7)", "html": "<p>Even though shareholder wealth maximization is the primary financial goal, managers are still bound by ethical standards and legal, society-imposed constraints. A company that ignores employees, customers, its community, and the environment tends to face real costs anyway \u2014 difficulty attracting good employees, boycotts, lawsuits, added regulation, and bad publicity \u2014 all of which eventually reduce shareholder value. In that sense, ignoring society's interests and maximizing long-run shareholder value tend to pull in the same direction, not opposite ones.</p>"}, {"heading": "ESG and B corporations (Section 1-7, cont.)", "html": "<p>A growing share of investors evaluate firms on <span class='term' data-cid='ch1-esg-measures'>ESG measures</span> \u2014 environmental, social, and governance criteria \u2014 and some mutual funds invest only in companies that clear specific social bars. Some companies go further and become certified <span class='term' data-cid='ch1-b-corporation'>B corporations</span> ('benefit corporations'), formally committing to weigh employees, customers, and community alongside shareholders, subject to an annual audit of their social and governance practices.</p>"}, {"heading": "Business ethics (Section 1-8)", "html": "<p><span class='term' data-cid='ch1-business-ethics'>Business ethics</span> refers to a company's standards of conduct toward its employees, customers, community, and stockholders \u2014 covering things like product safety, fair employment and marketing practices, protecting confidential information, and avoiding illegal payments to win business. The push for stronger ethics has come from multiple directions: state lawsuits against companies for improper conduct, Sarbanes-Oxley's sanctions on executives who certify false statements, the <span class='term' data-cid='ch1-dodd-frank-act'>Dodd-Frank Act</span>'s broader financial-regulation overhaul, and business schools building ethics into their curricula.</p><div class='example'><span class='example-label'>Why it's not just a compliance issue</span>Companies (like people) build reputations based on how ethically they behave, and those reputations carry real financial consequences \u2014 good or bad \u2014 over time. Ethisphere's annual 'World's Most Ethical Companies' list is one attempt to formally recognize firms that promote ethical standards internally and help shape industry-wide best practices.</div>"}, {"heading": "What companies are doing \u2014 and where it gets genuinely hard (Section 1-8A)", "html": "<p>Most firms today maintain written codes of ethical conduct and run training programs so employees know how to handle common situations. But policies don't resolve every case \u2014 some of the toughest calls involve a real conflict between profit and ethics where the 'right' answer isn't obvious.</p><div class='example'><span class='example-label'>Concrete example \u2014 legal but polluting</span>Suppose a railroad's coal trains pollute the air within legal limits, but cutting pollution further would be costly. Are managers ethically obligated to reduce pollution beyond what the law requires, even at a cost to shareholders?</div><div class='example'><span class='example-label'>Concrete example \u2014 Merck and Vioxx</span>Early research hinted that Merck's pain medication Vioxx might raise heart-attack risk, but the evidence was initially weak and the drug was clearly helping many patients. As stronger evidence accumulated over time, the dilemma sharpened: releasing preliminary, possibly incorrect warnings could scare off patients who were benefiting, while delaying disclosure risked real harm to others. The hard question isn't just what to disclose, but when.</div>"}, {"heading": "Consequences of unethical behavior (Section 1-8B)", "html": "<p>Unethical behavior has driven some of the highest-profile corporate collapses on record. At <span class='term'>Enron</span> and <span class='term'>WorldCom</span>, executives used misleading accounting to overstate profits \u2014 and were quietly selling their own stock while still publicly recommending it to employees and outside investors, who were left holding the losses. Their auditor, <span class='term' data-cid='ch1-arthur-andersen-case-study'>Arthur Andersen</span>, was found guilty of fostering a culture where the misconduct was allowed to happen, and the firm was put out of business entirely \u2014 costing all 85,000 of its employees their jobs, even though only a relatively small number had directly participated in the fraud. That outcome raised a hard question the chapter poses directly: when fraud happens inside a company, is the *company* unethical, or just a handful of its people? Regulators concluded that a firm can be held responsible when its incentive systems make unethical behavior profitable for the people who commit it.</p><p>Not every ethical lapse ends in bankruptcy, but many still cause serious reputational and financial damage. Toyota's reputation for reliability was tarnished by safety concerns and questions about how quickly management shared them publicly. GM paid a $900 million settlement over delayed action on defective ignition switches linked to 57 deaths and a 2.6-million-vehicle recall. Goldman Sachs paid $550 million to settle SEC fraud claims over mortgage-backed securities it marketed to investors. Hedge fund manager Raj Rajaratnam was convicted and sentenced to 11 years in prison for insider trading. Sixteen major banks were sued over manipulating the LIBOR benchmark rate that underlies many financial contracts, with several paying billions to settle. Pharmaceutical company Mylan paid $465 million for overcharging Medicaid on its EpiPen. Theranos founder Elizabeth Holmes settled SEC fraud charges and was barred from serving as a public-company officer or director for 10 years. Wells Fargo fired its CEO, other senior leaders, and thousands of employees, and ultimately paid billions in fines and settlements, after employees created fake accounts to hit sales quotas. Volkswagen admitted to installing software on roughly 11 million vehicles worldwide to cheat emissions tests, triggering its first quarterly loss in 15 years and the resignation of its CEO.</p><div class='example'><span class='example-label'>Why this matters beyond the companies involved</span>When investors broadly lose faith in corporate honesty, they pull back from the stock market \u2014 making it harder for *all* companies, not just wrongdoers, to raise the capital they need to grow, create jobs, and support the wider economy.</div>"}, {"heading": "How should employees deal with unethical behavior? (Section 1-8C)", "html": "<p>Pressure for stock options, bonuses, and promotions can push managers toward smaller-scale misconduct too \u2014 inflating a division's numbers, withholding bad news about a product, or skipping costly environmental protections. In these situations, at least some lower-level employees usually know what's happening, and may even be told to carry it out. Their choices are all uncomfortable: follow the order, refuse it, or report it to the board, the auditors, or a regulator.</p><p>Speaking up carries real risk. If the concern turns out to be unfounded, the employee who raised it may be fired for causing needless harm to the company; if it's valid, many organizations still treat someone who challenges a boss as a troublemaker. Staying quiet carries risk too \u2014 in several major scandals, the lower-level employees who actually entered fraudulent data received longer prison sentences than the executives who directed them. That squeeze \u2014 between doing the right thing and protecting one's own job or freedom \u2014 is exactly why business ethics gets serious, sustained attention rather than being treated as a side issue.</p>"}], "2.1": [{"heading": "Why capital has to move efficiently (Section 2-1)", "html": "<p>Businesses, individuals, and governments regularly need more capital than they currently have on hand, while others have more than they currently need. In a well-functioning economy, capital flows efficiently from savers to borrowers through what the chapter calls the <span class='term'>capital allocation process</span>.</p><div class='example'><span class='example-label'>Concrete examples of both sides</span>A utility company needing $1 billion to build a new power plant, a family needing $150,000 beyond their savings to buy a $200,000 home, and a city needing $200 million for a sewer plant are all demanders of capital. On the other side, someone earning $36,000 with $30,000 in expenses has $6,000 available to invest, and Microsoft has held over $130 billion in cash and marketable securities awaiting deployment \u2014 both are suppliers of capital.</div><p>Capital moves from savers to borrowers three ways: a <span class='term' data-cid='ch2-direct-transfer'>direct transfer</span>, where a business sells stock or bonds straight to savers with no institution involved (common mainly for small firms); through an <span class='term' data-cid='ch2-investment-bank'>investment bank</span> that underwrites the issue \u2014 buying the securities from the company and reselling them to savers, which makes it a <span class='term' data-cid='ch2-primary-market-transaction'>primary market transaction</span> since the company itself receives the proceeds; or through a <span class='term' data-cid='ch2-financial-intermediary'>financial intermediary</span> such as a bank, insurer, or mutual fund, which takes savers' money and effectively creates a new kind of security (e.g., a certificate of deposit) that's safer and more liquid than the underlying loan it's funding.</p>"}, {"heading": "Classifying financial markets (Sections 2-2, 2-2A)", "html": "<p>Financial markets are usually grouped along a few dimensions. <span class='term' data-cid='ch2-physical-asset-markets'>Physical asset markets</span> trade tangible goods (wheat, real estate, machinery), while <span class='term' data-cid='ch2-financial-asset-markets'>financial asset markets</span> trade stocks, bonds, and <span class='term' data-cid='ch2-derivative-security'>derivative securities</span> whose value is derived from some other underlying asset. <span class='term' data-cid='ch2-spot-markets'>Spot markets</span> involve immediate ('on the spot') delivery, while <span class='term' data-cid='ch2-futures-markets'>futures markets</span> involve an agreement today to buy or sell at a set price on a future date \u2014 useful for hedging, as when a farmer locks in a future selling price for soybeans.</p><p><span class='term' data-cid='ch2-money-markets'>Money markets</span> trade short-term debt (under a year), while <span class='term' data-cid='ch2-capital-markets'>capital markets</span> trade intermediate- and long-term debt and stock \u2014 the New York Stock Exchange is a capital market. <span class='term' data-cid='ch2-primary-markets'>Primary markets</span> are where corporations raise new capital by issuing new securities; <span class='term' data-cid='ch2-secondary-markets'>secondary markets</span> are where existing securities trade between investors, with no money going to the issuing company. Finally, <span class='term' data-cid='ch2-private-markets'>private markets</span> involve terms negotiated directly between parties (like a bank loan), while <span class='term' data-cid='ch2-public-markets'>public markets</span> trade standardized contracts on organized exchanges (like common stock) \u2014 broad ownership and standardization are exactly what make publicly traded securities more liquid.</p>"}, {"heading": "Recent trends transforming financial markets (Section 2-2B)", "html": "<p>Technology has reshaped these markets in several distinct ways. <span class='term' data-cid='ch2-high-frequency-trading-hft'>High-frequency trading (HFT)</span> firms use algorithms to trade in fractions of a second \u2014 supporters say this adds liquidity and lowers costs, while critics (echoed in Michael Lewis's book <em>Flash Boys</em>) argue it can create instability and self-serving trades. <span class='term' data-cid='ch2-crowdfunding'>Crowdfunding</span> platforms like Kickstarter and Indiegogo let individuals and firms raise money directly from many small investors, bypassing intermediaries altogether. <span class='term' data-cid='ch2-robo-advisor'>Robo-advisors</span> use algorithms to build low-cost portfolios matched to an investor's time horizon and risk tolerance, disrupting more expensive human advisors. And payments themselves have shifted toward cards, services like PayPal, and \u2014 more speculatively \u2014 cryptocurrencies, whose prices (Bitcoin swung from about $1,000 in March 2017 to nearly $19,800 by December 2017 and back down) have made regulators wary even as many see promise in the underlying blockchain technology.</p><p><span class='term' data-cid='ch2-derivatives'>Derivatives</span> \u2014 any security whose value is derived from another underlying asset, such as a stock option or a currency futures contract \u2014 have grown faster than any other market segment. <span class='term' data-cid='ch2-credit-default-swap-cds'>Credit default swaps (CDS)</span> are a good example: contracts where one party pays regularly in exchange for protection if a borrower defaults. The CDS market exploded from under $1 trillion in 2001 to over $60 trillion by the end of 2007, and its unwinding was a central part of the 2007\u20132008 financial crisis.</p><div class='example'><span class='example-label'>Hedging vs. speculating with the same tool</span>A wheat processor can buy wheat futures to hedge against rising costs \u2014 reducing risk. Used the other way, derivatives raise risk: Procter & Gamble once disclosed a $150 million loss on derivative bets, and mortgage-related derivative losses helped trigger the 2008 credit collapse.</div>"}, {"heading": "Financial institutions: the major players (Section 2-3)", "html": "<p>Direct transfers of funds between individuals and small businesses are common, especially in economies where financial markets and institutions are less developed. But large businesses in developed economies generally find it more efficient to go through a financial institution when it's time to raise capital.</p><p>In the United States and other developed nations, a set of highly efficient financial intermediaries has evolved. Their original roles were fairly specific, and regulation prevented them from diversifying. In recent years, though, most of those anti-diversification regulations have been removed, and the differences between institution types have blurred considerably. Still, enough institutional identity remains that it's useful to understand the major categories \u2014 keeping in mind that one company can own several subsidiaries that each perform a different one of the functions below.</p><ol><li><span class='term' data-cid='ch2-investment-bank'>Investment banks</span> traditionally help companies raise capital. They (1) help corporations design securities with features that are currently attractive to investors, (2) buy those securities from the corporation, and (3) resell them to savers. Because the investment bank generally guarantees that the firm will raise the needed capital, investment bankers are also called <i>underwriters</i>. The 2007\u20132008 credit crisis hit this industry hard: Bear Stearns collapsed and was acquired by JPMorgan, Lehman Brothers went bankrupt outright, and Merrill Lynch was forced into a sale to Bank of America. The two major investment banks that survived independently, Morgan Stanley and Goldman Sachs, received Federal Reserve approval to convert into commercial bank holding companies.</li><li><span class='term' data-cid='ch2-commercial-banks'>Commercial banks</span>, such as Bank of America, Citibank, Wells Fargo, and JPMorgan Chase, are the traditional \u2018department stores of finance\u2019 because they serve a wide variety of savers and borrowers. Historically, commercial banks were the main institutions handling checking accounts, and the channel through which the Federal Reserve expanded or contracted the money supply. Today several other kinds of institutions also offer checking services and meaningfully influence the money supply, and most large banks are part of larger financial services corporations, described next.</li><li><span class='term' data-cid='ch2-financial-services-corporation'>Financial services corporations</span> are large conglomerates that combine many different kinds of financial institutions inside a single corporate umbrella. Most started out focused on one area but have since diversified across most of the financial spectrum. Citigroup is the textbook example: it owns Citibank (a commercial bank), an investment bank, a securities brokerage arm, insurance companies, and leasing companies, all under one corporate roof.</li><li><span class='term' data-cid='ch2-credit-unions'>Credit unions</span> are cooperative associations whose members are supposed to share some common bond, such as working for the same employer. Members' savings are loaned only to other members \u2014 typically for auto purchases, home improvement, or home mortgages \u2014 which is exactly why credit unions are often the cheapest source of funds available to individual borrowers.</li><li><span class='term' data-cid='ch2-pension-funds'>Pension funds</span> are retirement plans funded by corporations or government agencies for their workers, administered mainly by the trust departments of commercial banks or by life insurance companies. Pension funds invest primarily in bonds, stocks, mortgages, and real estate.</li><li><span class='term' data-cid='ch2-life-insurance-companies'>Life insurance companies</span> take in savers' money in the form of annual premiums, invest those funds in stocks, bonds, real estate, and mortgages, and eventually make payments to the beneficiaries of the insured parties. In recent years, life insurers have also begun offering a variety of tax-deferred savings plans designed to pay out benefits later in participants' lives.</li><li><span class='term' data-cid='ch2-mutual-funds'>Mutual funds</span> are corporations that accept money from savers and use it to buy stocks, long-term bonds, or short-term debt instruments issued by businesses or government units. By pooling many savers' money, these organizations reduce risk through diversification and achieve economies of scale in analyzing securities, managing portfolios, and trading. Different funds are designed for different kinds of savers: bond funds for those who prioritize safety, stock funds for savers willing to accept more risk in exchange for higher potential returns, and <span class='term'>money market funds</span> that function much like interest-bearing checking accounts.</li></ol><p>Within mutual funds, there's an important further distinction between <span class='term' data-cid='ch2-actively-managed-funds'>actively managed funds</span>, which try to outperform the overall market, and <span class='term' data-cid='ch2-index-funds'>indexed funds</span>, which are designed simply to replicate the performance of a specific market index. The portfolio manager of an actively managed stock fund uses their own judgment to pick what they believe will be the best-performing stocks over a given period; an index fund tracking the S&amp;P 500, by contrast, simply holds the same basket of stocks that make up the S&amp;P 500. Both approaches give investors valuable diversification, but actively managed funds typically charge much higher fees \u2014 in large part because of the extra cost of trying to (hopefully) beat the market. In any given year, the very best actively managed funds will outperform the market index, but many others will do worse than the index even before their higher fees are subtracted \u2014 and it's extremely difficult to predict in advance which funds will be the winners. For this reason, many academics and practitioners have encouraged investors to rely more heavily on index funds. There are literally thousands of different mutual funds with dozens of distinct goals; <i>Value Line Investment Survey</i> and <i>Morningstar Mutual Funds</i> are two widely available sources of detailed information on individual funds' objectives and track records.</p><ol start='8'><li><span class='term' data-cid='ch2-exchange-traded-funds-etfs'>Exchange-traded funds (ETFs)</span> are similar to regular mutual funds and are often run by the same fund companies. An ETF buys a portfolio of stocks of a certain type \u2014 say, the S&amp;P 500, or media companies, or Chinese companies \u2014 and then sells its own shares to the public. Those shares trade on public markets just like a stock, so an investor who wants exposure to, say, the Chinese market can simply buy shares of an ETF holding Chinese stocks.</li></ol><table class='mini-table'><caption>Table 2.2 \u2014 The 10 Largest Exchange-Traded Funds (March 2020)</caption><thead><tr><th>Symbol</th><th>Fund Name</th><th>AUM (Billions)</th><th>Underlying Index</th></tr></thead><tbody><tr><td>SPY</td><td>SPDR S&amp;P 500 ETF</td><td>$226.14</td><td>S&amp;P 500</td></tr><tr><td>IVV</td><td>iShares Core S&amp;P 500 ETF</td><td>153.54</td><td>S&amp;P 500</td></tr><tr><td>VOO</td><td>Vanguard S&amp;P 500 ETF</td><td>110.73</td><td>S&amp;P 500</td></tr><tr><td>VTI</td><td>Vanguard Total Stock Market ETF</td><td>109.98</td><td>CRSP U.S. Total Market</td></tr><tr><td>QQQ</td><td>Invesco QQQ</td><td>82.93</td><td>NASDAQ 100</td></tr><tr><td>AGG</td><td>iShares Core U.S. Aggregate Bond ETF</td><td>66.61</td><td>Barclays Capital U.S. Aggregate Bond</td></tr><tr><td>VEA</td><td>Vanguard FTSE Developed Markets ETF</td><td>57.66</td><td>MSCI EAFE</td></tr><tr><td>IEFA</td><td>iShares Core MSCI EAFE ETF</td><td>55.21</td><td>MSCI EAFE Investable Market Index</td></tr><tr><td>BND</td><td>Vanguard Total Bond Market ETF</td><td>49.51</td><td>Barclays Capital U.S. Aggregate Bond</td></tr><tr><td>GLD</td><td>SPDR Gold Trust</td><td>48.31</td><td>Gold Bullion</td></tr></tbody></table><p class='small-muted'><em>Source (as cited in the textbook): etfdb.com/compare/market-cap/.</em></p><ol start='9'><li><span class='term' data-cid='ch2-hedge-funds'>Hedge funds</span> are similar to mutual funds in that they, too, accept savers' money and invest it in securities \u2014 but with some important differences. Mutual funds and ETFs are registered with, and regulated by, the SEC; hedge funds are largely unregulated. That difference in regulation stems from who each one targets: mutual funds are aimed at small investors, while hedge funds typically require large minimum investments (often exceeding $1 million) and market themselves to institutions and high-net-worth individuals. The name 'hedge fund' comes from their original purpose \u2014 hedging risk. For example, a hedge fund manager who believes the rate difference between corporate and Treasury bonds is too wide might simultaneously buy a portfolio of corporate bonds and sell a portfolio of Treasury bonds. That position would be 'hedged' against overall interest-rate movements, but would perform especially well if the spread between the two kinds of bonds narrowed.</li><li><span class='term' data-cid='ch2-private-equity'>Private equity companies</span> operate somewhat like hedge funds, but instead of buying some of a firm's stock, private equity players buy and then manage entire companies \u2014 typically using mostly borrowed money to fund the purchase. Private equity activity slowed around the financial crisis, but over the following decade high-profile acquisition targets included H.J. Heinz, Dell Computer,
