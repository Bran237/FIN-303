<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Management Study Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0F131B;        /* page background */
  --sidebar-bg:#0A0D13;   /* darkest, sidebar/topbar */
  --card:#171C28;         /* card surface, elevated */
  --paper-2:#1E2536;      /* secondary panel: examples, banners-alt, table headers */
  --ink:#F1EDE3;          /* primary text (warm off-white) */
  --ink-soft:#A9AFC0;     /* secondary text */
  --rule:#2C3346;         /* borders */
  --rule-soft:#232A3B;
  --lo1:#4FC3AC; --lo2:#E3924F; --lo3:#7DA6F0; --lo4:#C48EDA; --lo5:#E5C15C;
  --lo1-tint:#123128; --lo2-tint:#33220F; --lo3-tint:#16233F; --lo4-tint:#2C1E38; --lo5-tint:#332B10;
  --good:#57C98A; --good-bg:#12301F;
  --bad:#E2685E; --bad-bg:#3A1815;
  --warn:#E3924F;
  --accent:#7DA6F0;
  --font-head:'Fraunces',Georgia,serif;
  --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --shadow: 0 2px 10px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;color:var(--ink);}
button{font-family:var(--font-body);cursor:pointer;}
a{color:inherit;}
.mono{font-family:var(--font-mono);}
::selection{background:#3A5A8C;color:#fff;}

.topbar{display:none;position:sticky;top:0;z-index:40;background:var(--sidebar-bg);color:var(--ink);padding:10px 14px;align-items:center;gap:10px;border-bottom:1px solid var(--rule);}
.topbar button{background:none;border:1px solid var(--rule);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:13px;}
.topbar .brand{font-family:var(--font-head);font-weight:600;font-size:15px;}
.panel-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.panel-header h1{font-size:1.4rem;}

.layout{display:flex;min-height:100vh;}
.sidebar{
  width:270px;flex-shrink:0;background:var(--sidebar-bg);color:var(--ink);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--rule);
}
.sidebar .brand{font-family:var(--font-head);font-size:18px;font-weight:600;margin:0 0 14px;color:var(--ink);}
.sidebar .brand .sub{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);font-weight:400;margin-top:2px;letter-spacing:.04em;}

.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.04);border-radius:10px;padding:4px;margin-bottom:12px;}
.mode-toggle button{border:none;background:transparent;padding:8px 0;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.mode-toggle button.active{background:var(--ink);color:var(--sidebar-bg);}

.side-search{width:100%;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:13px;background:rgba(255,255,255,.03);color:var(--ink);margin-bottom:6px;}
.side-search::placeholder{color:#6B7186;}
.side-search-results{margin-bottom:14px;max-height:240px;overflow-y:auto;}
.side-search-item{padding:7px 8px;font-size:12.5px;border-radius:6px;cursor:pointer;color:var(--ink);}
.side-search-item:hover{background:rgba(255,255,255,.06);}
.side-search-item .ssi-sub{font-size:10.5px;color:var(--ink-soft);display:block;}

.chapter-block{margin-bottom:4px;}
.chapter-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:9px 8px;border-radius:7px;font-weight:600;font-size:13px;}
.chapter-head:hover{background:rgba(255,255,255,.05);}
.chapter-head .kicker-mini{display:block;font-weight:400;font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.chevron{transition:transform .25s;font-size:11px;color:var(--ink-soft);}
.chevron.open{transform:rotate(90deg);}
.lo-list{list-style:none;margin:0;padding:0 0 0 8px;max-height:0;overflow:hidden;transition:max-height .35s ease;}
.lo-list.open{max-height:1200px;}
.lo-list li a{display:block;text-decoration:none;color:#C7CBD8;font-size:12px;padding:6px 8px;border-radius:6px;border-left:3px solid transparent;cursor:pointer;}
.lo-list li a:hover{background:rgba(255,255,255,.06);}

.sidebar-utility{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;}
.util-link{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;border:none;background:transparent;color:#C7CBD8;font-size:12.5px;text-align:left;width:100%;}
.util-link:hover{background:rgba(255,255,255,.06);}
.sidebar-footer{margin-top:12px;padding:10px 8px 4px;font-size:11.5px;color:var(--ink-soft);border-top:1px solid var(--rule);}

.main{flex:1;min-width:0;}
.main-inner{padding:26px 40px 90px;max-width:900px;margin:0 auto;}
.mode-panel{display:none;}
.mode-panel.active{display:block;}

@media (max-width:860px){
  .topbar{display:flex;}
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .25s ease;z-index:50;box-shadow:2px 0 16px rgba(0,0,0,.5);}
  .sidebar.open{transform:translateX(0);}
  .main-inner{padding:20px 18px 70px;}
}

.hl-toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:10px 14px;background:var(--card);border:1px solid var(--rule);border-radius:9px;flex-wrap:wrap;}
.hl-toolbar .lbl{font-size:12px;color:var(--ink-soft);margin-right:2px;}
.swatch{padding:5px 11px;border-radius:999px;border:1.5px solid var(--rule);cursor:pointer;font-size:11px;font-family:var(--font-mono);color:#111;font-weight:600;}
.swatch.selected{outline:2px solid var(--ink);outline-offset:1px;}
.hl-clear{margin-left:auto;border:1px solid var(--rule);background:var(--paper-2);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);}
mark.uhl{padding:0 2px;border-radius:3px;cursor:pointer;color:#0C0F14;}

.chapter-kicker{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px;}
.chapter-title{font-size:26px;font-weight:700;margin:0 0 20px;}

section.lo{margin-bottom:26px;scroll-margin-top:20px;}
.lo-banner{display:flex;align-items:baseline;gap:12px;padding:12px 18px;border-radius:10px 10px 0 0;color:#0B0D12;}
.lo-banner .lo-num{font-family:var(--font-head);font-size:24px;font-weight:700;opacity:.75;}
.lo-banner h2{font-size:15.5px;font-weight:700;color:#0B0D12;}
.lo-card{background:var(--card);border:1px solid var(--rule);border-top:none;border-radius:0 0 10px 10px;padding:22px 24px;}
.lo-card h3.section-heading{font-size:14px;font-weight:700;margin:0 0 8px;}
.lo-card .lo-section + .lo-section{margin-top:18px;}
.lo-card p{font-size:14px;line-height:1.65;margin:0 0 12px;max-width:70ch;color:var(--ink);}
.lo-card ul,.lo-card ol{margin:0 0 12px;padding-left:20px;font-size:14px;line-height:1.6;color:var(--ink);}
.lo-card li{margin-bottom:5px;}
span.term{font-weight:700;color:var(--lo3);border-bottom:1.5px dotted var(--lo3);cursor:pointer;}
span.term:hover{color:var(--ink);background:var(--lo3-tint);border-bottom-color:var(--ink);}
section.lo.flash .lo-banner{animation:flashglow 1.3s ease;}
@keyframes flashglow{0%{filter:brightness(1.6);}100%{filter:brightness(1);}}

.example{border-left:4px solid var(--rule);background:var(--paper-2);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0;font-size:13.5px;line-height:1.55;color:var(--ink);}
.example-label{display:block;font-weight:700;font-size:12px;margin-bottom:4px;color:var(--ink-soft);}
.formula{font-family:var(--font-head);font-size:15px;font-weight:600;background:var(--paper-2);border-radius:8px;padding:10px 16px;margin:10px 0;color:var(--ink);}
.formula-box{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--lo3);border-radius:8px;padding:14px 18px;margin:14px 0;}
.formula-label{display:block;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--lo3);margin-bottom:8px;font-weight:700;}
.formula-eq{font-family:var(--font-head);font-size:16px;font-weight:600;background:var(--paper-2);border-radius:6px;padding:10px 14px;margin:6px 0;color:var(--ink);}
.formula-vars{margin-top:10px;font-size:13px;line-height:1.6;color:var(--ink-soft);}
.formula-vars div{margin-bottom:4px;}
.step-list{counter-reset:step;list-style:none;padding-left:0;margin:12px 0;}
.step-list li{counter-increment:step;position:relative;padding:8px 0 8px 36px;border-bottom:1px dashed var(--rule);font-size:13.5px;line-height:1.5;}
.step-list li:last-child{border-bottom:none;}
.step-list li::before{content:counter(step);position:absolute;left:0;top:8px;width:23px;height:23px;border-radius:50%;background:var(--lo3);color:#0B0D12;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;}
table.bs-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.5px;background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden;}
table.bs-table caption{caption-side:top;text-align:left;font-family:var(--font-head);font-size:14px;font-weight:600;margin-bottom:8px;color:var(--ink);}
table.bs-table th{text-align:right;padding:8px 14px;background:var(--paper-2);font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
table.bs-table th:first-child{text-align:left;}
table.bs-table td{padding:5px 14px;text-align:right;border-top:1px solid var(--rule-soft);color:var(--ink);}
table.bs-table td:first-child{text-align:left;}
table.bs-table tr.bs-section td{font-style:italic;color:var(--ink-soft);padding-top:12px;border-top:none;}
table.bs-table tr.bs-subtotal td{border-top:1px solid var(--ink-soft);font-weight:600;}
table.bs-table tr.bs-total td{border-top:3px double var(--ink);font-weight:700;}
details.src-fold{margin:10px 0 16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper-2);overflow:hidden;}
details.src-fold summary{cursor:pointer;list-style:none;padding:9px 14px;font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--lo3);letter-spacing:.02em;display:flex;align-items:center;gap:6px;}
details.src-fold summary::-webkit-details-marker{display:none;}
details.src-fold summary::before{content:'\25B8';display:inline-block;transition:transform .15s;}
details.src-fold[open] summary::before{transform:rotate(90deg);}
details.src-fold[open] summary{border-bottom:1px solid var(--rule);}
details.src-fold .src-fold-body{padding:12px 14px;}
details.src-fold .src-fold-body table{margin:0;}
.src-box{font-weight:700;font-family:var(--font-head);}
.src-box .src-tag{display:none;}
.src-box.calc-result{color:#8FE0AE;}
.src-box[class*='ln-'],.src-box[class*='ln2-']{cursor:pointer;border-bottom:1.5px dotted var(--ink-soft);padding-bottom:1px;transition:border-color .15s,color .15s;}
.src-box[class*='ln-']:hover,.src-box[class*='ln2-']:hover{border-bottom-color:var(--lo3);color:var(--lo3);}
@keyframes srcPulse{0%{transform:scale(1.18);}60%{transform:scale(0.98);}100%{transform:scale(1);}}
.src-box.active{display:inline-flex;align-items:baseline;gap:5px;padding:2px 8px;border-radius:5px;border-width:2px;border-style:solid;margin:0 1px;white-space:nowrap;animation:srcPulse .35s ease;}
.src-box.active.y2020{border-style:dashed;}
tr.src-row-active td:first-child{color:var(--ink);font-weight:700;}
tr.src-row-active{background:rgba(255,255,255,.035);}
.src-box.ln-cash.active{border-color:#4FC3AC;background:rgba(79,195,172,.15);color:#BFEFE4;}
.src-box.ln-ar.active{border-color:#6FA8E8;background:rgba(111,168,232,.15);color:#CFE6FF;}
.src-box.ln-inv.active{border-color:#E3924F;background:rgba(227,146,79,.16);color:#F6D3B0;}
.src-box.ln-tca.active{border-color:#E5C15C;background:rgba(229,193,92,.17);color:#F7E7B8;}
.src-box.ln-ppe.active{border-color:#C48EDA;background:rgba(196,142,218,.15);color:#EBD3F7;}
.src-box.ln-ta.active{border-color:#5FD6D6;background:rgba(95,214,214,.17);color:#C9F3F3;}
.src-box.ln-ap.active{border-color:#E38DBB;background:rgba(227,141,187,.15);color:#F7D3E5;}
.src-box.ln-accr.active{border-color:#B5A67A;background:rgba(181,166,122,.17);color:#EAE2C9;}
.src-box.ln-np.active{border-color:#D98BA0;background:rgba(217,139,160,.15);color:#F5D2DD;}
.src-box.ln-tcl.active{border-color:#9B8CDE;background:rgba(155,140,222,.17);color:#DDD5F7;}
.src-box.ln-ltb.active{border-color:#C2996B;background:rgba(194,153,107,.17);color:#EBD7BF;}
.src-box.ln-tl.active{border-color:#8B98B8;background:rgba(139,152,184,.17);color:#D6DCEA;}
.src-box.ln-cs.active{border-color:#D9A441;background:rgba(217,164,65,.17);color:#F5DFAE;}
.src-box.ln-re.active{border-color:#A88CE0;background:rgba(168,140,224,.16);color:#DED2F5;}
.src-box.ln-tce.active{border-color:#D9B36A;background:rgba(217,179,106,.17);color:#F3E4C4;}
.src-box.ln-tle.active{border-color:#5FD6D6;background:rgba(95,214,214,.17);color:#C9F3F3;}
.src-box.ln2-sales.active{border-color:#4FA6E0;background:rgba(79,166,224,.15);color:#C6E5FA;}
.src-box.ln2-cogs.active{border-color:#E0763F;background:rgba(224,118,63,.16);color:#F8D2BB;}
.src-box.ln2-opex.active{border-color:#B98FE0;background:rgba(185,143,224,.15);color:#E9D8FA;}
.src-box.ln2-dep.active{border-color:#5FAFA0;background:rgba(95,175,160,.16);color:#C6E9E1;}
.src-box.ln2-toc.active{border-color:#D9A63F;background:rgba(217,166,63,.17);color:#F5E3B8;}
.src-box.ln2-ebit.active{border-color:#E05F8C;background:rgba(224,95,140,.16);color:#F9CEDE;}
.src-box.ln2-int.active{border-color:#8FA8D9;background:rgba(143,168,217,.16);color:#DCE5F5;}
.src-box.ln2-ebt.active{border-color:#C9915F;background:rgba(201,145,95,.17);color:#F0DBC4;}
.src-box.ln2-tax.active{border-color:#9F8FD9;background:rgba(159,143,217,.16);color:#E1D9F5;}
.src-box.ln2-ni.active{border-color:#5FC2C2;background:rgba(95,194,194,.17);color:#C6EEEE;}
.src-box.ln2-div.active{border-color:#D95FA6;background:rgba(217,95,166,.16);color:#F5CDE5;}
.src-box.ln2-addre.active{border-color:#8FB35F;background:rgba(143,179,95,.16);color:#DCEBC6;}
.src-box.ln2-shares.active{border-color:#7A8FA6;background:rgba(122,143,166,.17);color:#D2DBE5;}
.src-box.ln2-eps.active{border-color:#C25FD9;background:rgba(194,95,217,.16);color:#EDCDF5;}
.src-box.ln2-dps.active{border-color:#5F8FD9;background:rgba(95,143,217,.16);color:#C9DBF5;}
.src-box.ln2-price.active{border-color:#D9C25F;background:rgba(217,194,95,.17);color:#F5EEC6;}
.src-box.ln2-bvps.active{border-color:#7FD4A8;background:rgba(127,212,168,.16);color:#D2F5E2;}
.src-box.ln3-invchg.active{border-color:#D4823F;background:rgba(212,130,63,.17);color:#F5DBC0;}
.src-box.ln3-archg.active{border-color:#4FA8D4;background:rgba(79,168,212,.16);color:#C6E6F5;}
.src-box.ln3-apchg.active{border-color:#A84FD4;background:rgba(168,79,212,.16);color:#E6C6F5;}
.src-box.ln3-accrchg.active{border-color:#3FA88F;background:rgba(63,168,143,.17);color:#C0E9DF;}
.src-box.ln3-capex.active{border-color:#D44F8F;background:rgba(212,79,143,.16);color:#F5C6DD;}
.src-box.ln3-npchg.active{border-color:#8F4FD4;background:rgba(143,79,212,.16);color:#DDC6F5;}
.src-box.ln3-bondschg.active{border-color:#D4B84F;background:rgba(212,184,79,.17);color:#F5EAC0;}
.src-box.ln2-bvps.active{border-color:#7BAFC9;background:rgba(123,175,201,.16);color:#D2E7F0;}
.tbl-annot{display:block;font-size:10.5px;font-weight:400;font-style:italic;color:var(--ink-soft);margin-top:1px;}
table.bs-table td .tbl-annot{white-space:normal;}
.key-concept{border-left:4px solid var(--lo3);background:var(--paper-2);border-radius:0 8px 8px 0;padding:14px 16px;margin:14px 0;}
.key-concept .kc-label{font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--lo3);text-transform:uppercase;display:block;margin-bottom:6px;}
.before-after{background:var(--paper-2);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:13.5px;}
.before-after b{color:var(--lo3);}
.recap-block{border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:18px 0;background:var(--card);}
.recap-block h4{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--lo3);margin:12px 0 4px;}
.recap-block h4:first-child{margin-top:0;}
.recap-block ul{margin:0 0 4px 18px;padding:0;font-size:13.5px;}
.trace-chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;margin:10px 0;color:var(--ink-soft);}
.trace-chain .tc-node{background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;padding:4px 9px;}
table.bs-table td .src-box{padding:1px 8px;}
.flow-checklist{display:flex;flex-direction:column;gap:2px;}
.flow-check-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;}
.flow-check-row:hover{background:var(--paper-2);}
.flow-check-row.locked{cursor:default;opacity:.55;}
.flow-check-icon{width:20px;text-align:center;font-weight:700;}
.flow-check-label{flex:1;font-size:13.5px;}
.flow-check-detail{font-size:11.5px;white-space:nowrap;}
.flow-quiz-options{display:flex;flex-direction:column;gap:8px;}
.flow-quiz-opt{text-align:left;padding:11px 14px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper-2);color:var(--ink);cursor:pointer;font-size:13.5px;}
.flow-quiz-opt:hover{border-color:var(--lo3);background:var(--lo3-tint);}
.flow-reading-section{scroll-margin-top:20px;}

table.mini-table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:12.5px;}
table.mini-table th{background:var(--paper-2);text-align:left;padding:7px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
table.mini-table td{padding:7px 10px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink);}

.wrapup-banner{background:var(--paper-2);color:var(--ink);padding:12px 18px;border-radius:10px 10px 0 0;border:1px solid var(--rule);border-bottom:none;}
.wrapup-card{background:var(--card);border:1px solid var(--rule);border-top:none;border-radius:0 0 10px 10px;padding:22px 24px;margin-bottom:26px;}
.wrapup-card p{font-size:14px;line-height:1.65;margin:0 0 12px;color:var(--ink);}
.wrapup-card p:last-child{margin-bottom:0;}

.gloss-banner{background:var(--paper-2);color:var(--ink);padding:12px 18px;border-radius:10px 10px 0 0;border:1px solid var(--rule);border-bottom:none;}
.gloss-note{font-weight:400;font-size:11.5px;color:var(--ink-soft);}
table.gloss{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;margin-bottom:26px;}
table.gloss th{background:var(--paper-2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 14px;color:var(--ink-soft);}
table.gloss td{padding:9px 14px;font-size:13px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink);}
table.gloss td.term-cell{font-weight:700;white-space:nowrap;cursor:pointer;border-left:4px solid transparent;}
table.gloss td.term-cell:hover{text-decoration:underline;}
table.gloss td.tier-mk{font-size:9.5px;font-family:var(--font-mono);color:var(--bad);}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);}
.card.clickable{cursor:pointer;transition:transform .1s,border-color .15s;}
.card.clickable:hover{transform:translateY(-2px);border-color:var(--ink-soft);}
.stat-card .stat-value{font-family:var(--font-head);font-weight:700;font-size:1.9rem;color:var(--ink);}
.stat-card .stat-label{font-family:var(--font-mono);font-size:.65rem;color:var(--ink-soft);}
.progress-bar{height:8px;border-radius:999px;background:var(--paper-2);overflow:hidden;border:1px solid var(--rule);}
.progress-bar > div{height:100%;background:var(--lo3);border-radius:999px;}
.small-muted{font-size:.76rem;color:var(--ink-soft);}
.divider{height:1px;background:var(--rule);margin:16px 0;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.flex-row{display:flex;gap:10px;align-items:center;}
.wrap-row{display:flex;gap:8px;flex-wrap:wrap;}
.empty-state{text-align:center;padding:44px 18px;color:var(--ink-soft);}

.badge{display:inline-block;font-family:var(--font-mono);font-size:.63rem;padding:3px 9px;border-radius:999px;font-weight:700;}
.badge-status-notstarted{background:var(--paper-2);color:var(--ink-soft);}
.badge-status-learning{background:var(--lo2-tint);color:var(--lo2);}
.badge-status-improving{background:var(--lo5-tint);color:var(--lo5);}
.badge-status-mastered{background:var(--lo1-tint);color:var(--lo1);}
.badge-tier-must_know{background:var(--bad);color:#fff;}
.badge-tier-supporting{background:var(--paper-2);color:var(--ink-soft);}
.lo-chip{font-family:var(--font-mono);font-size:.65rem;padding:5px 11px;border-radius:999px;font-weight:700;}

.btn{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;}
.btn:hover{border-color:var(--ink-soft);}
.btn.primary{background:var(--ink);color:var(--sidebar-bg);border-color:var(--ink);}
.btn.secondary{background:var(--paper-2);color:var(--ink);border-color:var(--rule);}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;}
.btn.ghost{background:transparent;border-color:var(--rule);}
.btn.small{padding:6px 12px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.icon-btn{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:8px 10px;font-size:.9rem;color:var(--ink);}
.icon-btn:hover{border-color:var(--ink-soft);}
input[type=text],input[type=number],textarea,select{
  font-family:var(--font-body);padding:9px 11px;border-radius:8px;border:1.5px solid var(--rule);
  background:var(--paper-2);color:var(--ink);width:100%;font-size:13.5px;
}
textarea{resize:vertical;min-height:100px;}
label{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-soft);display:block;margin-bottom:5px;}

.practice-toggle{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.practice-toggle button{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.practice-toggle button.active{background:var(--ink);color:var(--sidebar-bg);border-color:var(--ink);}
.pill-btn{font-family:var(--font-mono);font-size:.72rem;padding:6px 13px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink-soft);}
.pill-btn.active{color:#0B0D12;font-weight:700;background:var(--ink);border-color:var(--ink);}

.fc-scene{perspective:1400px;width:100%;max-width:520px;height:270px;margin:0 auto 14px;cursor:pointer;}
.fc-card{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.3,1);transform-style:preserve-3d;}
.fc-card.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;}
.fc-face.back{transform:rotateY(180deg);}
.fc-term{font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--ink);}
.fc-def{font-size:14px;line-height:1.5;color:var(--ink);}

.quiz-card{max-width:580px;margin:0 auto;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;}
.opt-btn{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:8px;}
.opt-btn:hover:not(:disabled){border-color:var(--ink-soft);}
.opt-btn.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700;}
.opt-btn.incorrect{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700;}
.match-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.match-row select{flex:1;}
.timer-display{font-family:var(--font-mono);font-size:.9rem;padding:4px 10px;border-radius:6px;background:var(--paper-2);color:var(--warn);}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:680px;margin:0 auto;}
.match-cell{border:1.5px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:12.5px;text-align:left;line-height:1.35;}
.match-cell.term-cell{font-weight:700;font-family:var(--font-head);font-size:13.5px;}
.match-cell.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;}
.match-cell.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);}
.match-cell.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.match-head{display:flex;justify-content:space-between;max-width:680px;margin:0 auto 12px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}

.xw-toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.xw-wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;}
.xw-grid{display:inline-grid;border:2px solid var(--ink);}
.xw-cell{width:25px;height:25px;position:relative;border:1px solid var(--rule);background:var(--paper-2);}
.xw-cell.block{background:var(--sidebar-bg);border-color:var(--sidebar-bg);}
.xw-cell input{width:100%;height:100%;border:none;text-align:center;font-size:12.5px;font-weight:700;text-transform:uppercase;background:transparent;padding:0;font-family:var(--font-body);color:var(--ink);}
.xw-cell input:focus{outline:2px solid var(--lo3);}
.xw-cell input.ok{background:var(--good-bg);color:var(--good);}
.xw-cell input.no{background:var(--bad-bg);color:var(--bad);}
.xw-num{position:absolute;top:0;left:1px;font-size:7px;color:var(--ink-soft);}
.xw-clues{min-width:220px;font-size:12.5px;color:var(--ink);}
.xw-clues h4{font-family:var(--font-head);margin:0 0 6px;font-size:13.5px;}
.xw-clues ol{padding-left:18px;margin:0 0 14px;}
.xw-clues li{margin-bottom:6px;line-height:1.4;}

.modal-backdrop{position:fixed;inset:0;background:rgba(5,6,10,.7);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal-box{background:var(--card);border:1px solid var(--rule);border-radius:12px;max-width:640px;width:100%;padding:24px 26px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.modal-close{position:absolute;top:14px;right:16px;background:transparent;border:none;color:var(--ink-soft);font-size:1.2rem;}
.concept-field{margin-bottom:10px;}
.concept-field .fl{font-family:var(--font-mono);font-size:.63rem;color:var(--ink-soft);margin-bottom:2px;}
.concept-field .fv{font-size:.9rem;line-height:1.5;color:var(--ink);}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sidebar-bg);padding:10px 20px;border-radius:8px;font-size:.85rem;z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s;font-weight:600;}
#toast.show{opacity:1;}

rporate finance)", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "Decisions on what assets a firm should acquire, how to raise capital to pay for them, and how to run the firm to maximize its value."}, {"id": "ch1-capital-markets", "term": "Capital markets", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "Markets where interest rates and stock/bond prices are set, and the institutions that channel capital from savers to businesses."}, {"id": "ch1-investments", "term": "Investments", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "The study of security analysis, portfolio construction, and market analysis for stocks and bonds."}, {"id": "ch1-security-analysis", "term": "Security analysis", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "Determining the proper value of individual stocks and bonds."}, {"id": "ch1-portfolio-theory", "term": "Portfolio theory", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "How to combine stocks and bonds into a diversified basket to manage risk."}, {"id": "ch1-market-analysis", "term": "Market analysis", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "Judging whether stock and bond markets overall are priced too high, too low, or about right."}, {"id": "ch1-behavioral-finance", "term": "Behavioral finance", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "The study of investor psychology used to explain speculative bubbles and excessive pessimism in prices."}, {"id": "ch1-ceo-chief-executive-officer", "term": "CEO (Chief Executive Officer)", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "The top operating executive of a firm, often also chair of the board."}, {"id": "ch1-coo-chief-operating-officer", "term": "COO (Chief Operating Officer)", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "The executive who directs a firm's operating departments, such as marketing and production."}, {"id": "ch1-cfo-chief-financial-officer", "term": "CFO (Chief Financial Officer)", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "The senior officer in charge of accounting, treasury, credit policy, capital budgeting, and investor relations."}, {"id": "ch1-sarbanes-oxley-act", "term": "Sarbanes-Oxley Act", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "A 2002 law requiring the CEO and CFO to personally certify that their firm's financial statements are accurate."}, {"id": "ch1-proprietorship", "term": "Proprietorship", "tier": "must_know", "lo": "1.2", "chapterId": "ch1", "section": "1.2", "definition": "An unincorporated business owned by one individual, with unlimited personal liability.", "plain": "One person, one business, no legal wall between them \u2014 the simplest and cheapest way to start a company.", "why": "It explains the tradeoff every founder faces: easy and cheap to start, but the owner is personally on the hook for everything the business owes.", "example": "A freelance photographer operating under their own name with no separate business entity.", "textbookExample": "The chapter's example: you invest $10,000 to start a business, but could be sued for $1 million if an employee causes an accident on company time \u2014 you'd be personally liable for the difference.", "commonMistake": "Don't assume 'small business' and 'proprietorship' are synonyms \u2014 a small business can also be an LLC or an S corporation.", "examQuestion": "What are the three advantages and three limitations of a proprietorship listed in the chapter?", "mnemonic": null}, {"id": "ch1-partnership", "term": "Partnership", "tier": "must_know", "lo": "1.2", "chapterId": "ch1", "section": "1.2", "definition": "An unincorporated business owned by two or more people, generally with unlimited personal liability for the partners.", "plain": "Like a proprietorship, but split between two or more owners \u2014 and often just as risky, since one partner's mistakes can be everyone's problem.", "why": "It shows why unlimited liability doesn't just threaten one person's savings \u2014 it can pull in partners who had nothing to do with the bad decision.", "example": "Two friends open a bakery together as general partners with no liability protection.", "textbookExample": "The chapter's example: 'the actions of a Texas partner can bring ruin to a millionaire New York partner who had nothing to do with' the failure.", "commonMistake": "Students often forget that a limited partner's liability IS capped \u2014 it's only general partners who carry unlimited liability.", "examQuestion": "Explain how a limited partnership differs from a general partnership in terms of liability and control.", "mnemonic": null}, {"id": "ch1-corporation", "term": "Corporation", "tier": "must_know", "lo": "1.2", "chapterId": "ch1", "section": "1.2", "definition": "A legal entity created by a state, separate from its owners, offering limited liability, unlimited life, and easy ownership transfer.", "plain": "A business that legally exists separately from the people who own it \u2014 so if it fails, the owners generally only lose what they invested, not their house or savings.", "why": "This separation is exactly what lets corporations raise the large amounts of capital needed to run big businesses, which is why most large, successful firms end up organized this way despite the tax downside.", "example": "You buy 100 shares of a company that later goes bankrupt \u2014 you lose what you paid for the shares, but creditors can't come after your personal bank account.", "textbookExample": "The chapter notes that although proprietorships are the most numerous business form, corporations conduct more than 80% of all business by dollar value.", "commonMistake": "Students sometimes think 'corporation' just means 'big company.' It's actually a specific legal structure \u2014 even a very small business can incorporate.", "examQuestion": "List the three reasons the chapter gives for why incorporating tends to maximize the value of any business beyond a small one.", "mnemonic": "Corp = separate \u2014 the company's legal life is separate from its owners' personal finances."}, {"id": "ch1-double-taxation", "term": "Double taxation", "tier": "supporting", "lo": "1.2", "chapterId": "ch1", "section": "1.2", "definition": "Corporate earnings taxed once at the corporate level, then again as personal income when paid out as dividends."}, {"id": "ch1-s-corporation", "term": "S corporation", "tier": "must_know", "lo": "1.2", "chapterId": "ch1", "section": "1.2", "definition": "A corporation with 100 or fewer shareholders that elects to be taxed like a proprietorship or partnership.", "plain": "A small corporation that gets to keep limited liability but is taxed like a proprietorship or partnership instead of paying corporate tax.", "why": "It's the chapter's bridge between the two forms \u2014 you get the legal protection of a corporation without the double-taxation cost, but only if you stay small.", "example": "A 20-shareholder family manufacturing business that elects S status to avoid corporate-level tax.", "textbookExample": "The chapter explains why IBM, GE, and Microsoft can't be S corporations: the cap is 100 shareholders, and these firms have vastly more owners than that.", "commonMistake": "S corporations aren't a different legal entity from C corporations \u2014 it's the same corporate structure with a special tax election.", "examQuestion": "Why can't a company like Microsoft elect S corporation status?", "mnemonic": "S = Small (limited to 100 shareholders); C = Common (the standard, unlimited-shareholder corporation)."}, {"id": "ch1-llc-limited-liability-company", "term": "LLC (limited liability company)", "tier": "supporting", "lo": "1.2", "chapterId": "ch1", "section": "1.2", "definition": "A hybrid entity combining a corporation's limited liability with a partnership's tax treatment."}, {"id": "ch1-llp-limited-liability-partnership", "term": "LLP (limited liability partnership)", "tier": "supporting", "lo": "1.2", "chapterId": "ch1", "section": "1.2", "definition": "Similar to an LLC; used by professional firms such as accounting, law, and architecture practices."}, {"id": "ch1-shareholder-wealth-maximization", "term": "Shareholder wealth maximization", "tier": "must_know", "lo": "1.3", "chapterId": "ch1", "section": "1.3", "definition": "The primary financial goal for public-company managers: maximizing the long-run value of the firm's stock.", "plain": "The rule that managers should make decisions based on what grows the stock's true long-run worth \u2014 not this quarter's earnings, not market share, not any other side goal.", "why": "Nearly everything else in the course \u2014 investment decisions, financing choices, dividend policy \u2014 gets evaluated against this one yardstick.", "example": "A manager turns down a project that would boost this year's earnings but expects lower profits in future years, in favor of one that costs more now but builds more long-term value.", "textbookExample": "The chapter is explicit that this does NOT mean maximizing shareholder value 'at all costs' \u2014 ethical and legal constraints still apply.", "commonMistake": "Don't equate this with maximizing today's stock price \u2014 the chapter stresses it's the long-run intrinsic value that matters, since prices can be wrong in the short run.", "examQuestion": "Explain why 'maximize the current stock price' is not quite the same as 'maximize shareholder wealth,' per the chapter.", "mnemonic": null}, {"id": "ch1-intrinsic-value", "term": "Intrinsic value", "tier": "must_know", "lo": "1.3", "chapterId": "ch1", "section": "1.3", "definition": "An analyst's best estimate of a stock's true worth, based on accurate data about future cash flows and risk.", "plain": "What a stock would really be worth if everyone had perfect, complete information about the company's future \u2014 as opposed to whatever it happens to be trading for right now.", "why": "It's the anchor concept for the entire goal of financial management \u2014 managers are supposed to maximize THIS, not the current market price, which can be temporarily wrong.", "example": "A biotech company's stock trades at $40, but an analyst with a full model of its drug pipeline estimates its 'true' value at $55 once new information becomes public.", "textbookExample": "The chapter's Enron example: in early 2001 investors perceived the company as low-risk and highly profitable, while its true (intrinsic) financial position was far weaker \u2014 a case where market price and intrinsic value diverged sharply.", "commonMistake": "Intrinsic value isn't something you can look up \u2014 it's always an estimate, and different well-informed analysts can reasonably disagree on what it is.", "examQuestion": "Using the Enron example, explain how a stock's market price and its intrinsic value can diverge.", "mnemonic": null}, {"id": "ch1-market-price", "term": "Market price", "tier": "supporting", "lo": "1.3", "chapterId": "ch1", "section": "1.3", "definition": "A stock's actual trading price, based on the (possibly imperfect) perceptions of the marginal investor."}, {"id": "ch1-marginal-investor", "term": "Marginal investor", "tier": "supporting", "lo": "1.3", "chapterId": "ch1", "section": "1.3", "definition": "The investor whose buy/sell decisions actually set a stock's current market price."}, {"id": "ch1-equilibrium-stock-price", "term": "Equilibrium (stock price)", "tier": "supporting", "lo": "1.3", "chapterId": "ch1", "section": "1.3", "definition": "The condition where market price equals intrinsic value, leaving no pressure for the price to change."}, {"id": "ch1-corporate-governance", "term": "Corporate governance", "tier": "must_know", "lo": "1.3", "chapterId": "ch1", "section": "1.3", "definition": "Rules and practices set by a board of directors to keep managers focused on shareholders' interests while balancing other stakeholders.", "plain": "The rulebook and oversight structure \u2014 set mainly by the board of directors \u2014 meant to keep managers focused on shareholders' interests without ignoring everyone else who matters.", "why": "It's the chapter's proposed fix for stockholder-manager agency conflicts, tying directly into why boards, compensation design, and shareholder activism all matter.", "example": "A board requires that executive stock awards vest over five years instead of all at once, so managers can't just pump the price and cash out.", "textbookExample": "The chapter ties weak governance directly to the Wells Fargo fake-accounts scandal and the run-up to the 2007\u20132008 financial crisis.", "commonMistake": "Corporate governance isn't just about punishing bad behavior after the fact \u2014 it's meant to be a proactive structure that shapes incentives up front.", "examQuestion": "How does phased-in stock compensation serve as a corporate governance tool?", "mnemonic": null}, {"id": "ch1-agency-theory-agency-conflict", "term": "Agency theory / agency conflict", "tier": "must_know", "lo": "1.4", "chapterId": "ch1", "section": "1.4", "definition": "The study of conflicts of interest, especially between stockholders and managers, and between stockholders and debtholders.", "plain": "The formal study of what happens when the people running a company (managers) don't have exactly the same interests as the people who own it (stockholders) or who lent it money (bondholders).", "why": "It's the conceptual umbrella covering both major conflicts in the chapter \u2014 stockholders vs. managers, and stockholders vs. bondholders \u2014 and explains why firms need governance and compensation design at all.", "example": "A CEO chooses a safe, comfortable strategy that protects their own job over a riskier one that would likely maximize shareholder value.", "textbookExample": "The chapter cites the classic Jensen and Meckling paper on 'Theory of the Firm, Managerial Behavior, Agency Costs, and Ownership Structure' as the foundation of this idea.", "commonMistake": "Agency theory covers TWO distinct conflicts \u2014 don't only think of manager-vs-shareholder; stockholder-vs-bondholder conflicts (like risk-shifting) are just as central.", "examQuestion": "Name the two main agency conflicts discussed in the chapter and one tool used to address each.", "mnemonic": null}, {"id": "ch1-corporate-raider", "term": "Corporate raider", "tier": "supporting", "lo": "1.4", "chapterId": "ch1", "section": "1.4", "definition": "An investor who targets an undervalued company for a hostile takeover."}, {"id": "ch1-hostile-takeover", "term": "Hostile takeover", "tier": "must_know", "lo": "1.4", "chapterId": "ch1", "section": "1.4", "definition": "The acquisition of a company over the objection of its existing management.", "plain": "When an outside investor buys up a company against the wishes of its own management \u2014 usually because the stock looks like a bargain relative to what the company is really worth.", "why": "It's the 'stick' behind good management \u2014 the real threat of losing your job to a raider is what keeps managers focused on the stock's long-run value.", "example": "An activist investor quietly builds a large stake in an underperforming retailer, then pushes out its CEO and replaces the board.", "textbookExample": "The chapter notes that if a raid succeeds, 'the target's executives will almost certainly be fired' \u2014 turning undervaluation into a direct personal risk for management.", "commonMistake": "A hostile takeover isn't illegal or even necessarily bad for the company long-term \u2014 it's a market mechanism, not a scandal.", "examQuestion": "Explain the chain of logic connecting an undervalued stock to a manager's job security.", "mnemonic": null}, {"id": "ch1-bond-covenant", "term": "Bond covenant", "tier": "supporting", "lo": "1.4", "chapterId": "ch1", "section": "1.4", "definition": "A contract term in a bond agreement restricting a firm's additional borrowing or other risky managerial actions."}, {"id": "ch1-esg-measures", "term": "ESG measures", "tier": "supporting", "lo": "1.5", "chapterId": "ch1", "section": "1.5", "definition": "Environmental, Social, and Governance criteria used to evaluate a company's social responsibility."}, {"id": "ch1-b-corporation", "term": "B corporation", "tier": "supporting", "lo": "1.5", "chapterId": "ch1", "section": "1.5", "definition": "A certified 'benefit corporation' that formally commits to balancing profit with employee, customer, and community interests."}, {"id": "ch1-business-ethics", "term": "Business ethics", "tier": "must_know", "lo": "1.5", "chapterId": "ch1", "section": "1.5", "definition": "A company's standards of conduct toward its employees, customers, community, and stockholders.", "plain": "A company's track record of doing right by its employees, customers, community, and shareholders \u2014 not just staying technically legal.", "why": "The chapter's central point is that ethics and shareholder value aren't opposites \u2014 ignoring stakeholders creates costs (lawsuits, boycotts, bad hires) that eventually show up in a lower stock price.", "example": "A company voluntarily recalls a product at its own expense after discovering a safety issue, even before regulators require it.", "textbookExample": "The chapter contrasts Enron/WorldCom (fraud, bankruptcy, jail time) with Ethisphere's 'World's Most Ethical Companies' list, which includes firms like Aflac and PepsiCo.", "commonMistake": "Don't treat ethics as separate from financial strategy \u2014 the chapter frames it as a component of long-run value maximization, not a constraint fighting against it.", "examQuestion": "Using the Wells Fargo or Volkswagen example, explain how an ethical lapse translates into a financial cost.", "mnemonic": null}, {"id": "ch1-dodd-frank-act", "term": "Dodd-Frank Act", "tier": "supporting", "lo": "1.5", "chapterId": "ch1", "section": "1.5", "definition": "A law overhauling U.S. financial regulation, passed in response to the 2007\u20132008 financial crisis to help prevent reckless practices that could cause another one."}, {"id": "ch1-insider-trading", "term": "Insider trading", "tier": "supporting", "lo": "1.5", "chapterId": "ch1", "section": "1.5", "definition": "Trading a security based on material, nonpublic information \u2014 illegal under U.S. securities law."}, {"id": "ch1-arthur-andersen-case-study", "term": "Arthur Andersen (case study)", "tier": "supporting", "lo": "1.5", "chapterId": "ch1", "section": "1.5", "definition": "Enron and WorldCom's auditing firm, put out of business after being found guilty of fostering a culture that permitted its clients' accounting fraud \u2014 illustrating that a firm, not just individual employees, can be held responsible for unethical behavior."}, {"id": "ch2-direct-transfer", "term": "Direct transfer", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "A business selling stock or bonds straight to savers with no financial institution acting as a go-between."}, {"id": "ch2-investment-bank", "term": "Investment bank", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "An organization that underwrites new securities \u2014 buying them from a company and reselling them to savers \u2014 and helps businesses obtain financing."}, {"id": "ch2-primary-market-transaction", "term": "Primary market transaction", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "A transaction in which a corporation raises new capital by issuing new securities, and receives the sale proceeds."}, {"id": "ch2-financial-intermediary", "term": "Financial intermediary", "tier": "must_know", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "An institution (bank, insurer, mutual fund) that takes savers' money and creates new securities backed by loans or investments made with it.", "plain": "A middleman institution \u2014 a bank, insurer, or fund \u2014 that takes in money from savers and turns it into a different, often safer or more liquid, product to lend or invest elsewhere.", "why": "It's one of the three core ways capital moves from savers to borrowers, and it's the one responsible for most capital raised in a developed economy like the U.S.", "example": "You deposit money in a bank savings account (a safe, liquid product); the bank uses those deposits to fund a mortgage loan to a homebuyer.", "textbookExample": "The chapter's example: a saver deposits money and gets a certificate of deposit, while the bank lends that same money out as a mortgage \u2014 the intermediary literally creates a new, safer security in the process.", "commonMistake": "Don't confuse this with a direct transfer or an investment bank \u2014 an intermediary actually holds and transforms the underlying asset, rather than just passing securities through.", "examQuestion": "Explain how a financial intermediary 'creates new forms of capital,' using the CD/mortgage example.", "mnemonic": null}, {"id": "ch2-physical-asset-markets", "term": "Physical asset markets", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets for tangible goods such as wheat, real estate, computers, and machinery."}, {"id": "ch2-financial-asset-markets", "term": "Financial asset markets", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets for stocks, bonds, notes, mortgages, and derivative securities."}, {"id": "ch2-derivative-security", "term": "Derivative security", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Any security whose value is derived from the price of some other underlying asset."}, {"id": "ch2-spot-markets", "term": "Spot markets", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets where assets are bought or sold for near-immediate ('on the spot') delivery."}, {"id": "ch2-futures-markets", "term": "Futures markets", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets where participants agree today to buy or sell an asset at a set price on a future date."}, {"id": "ch2-money-markets", "term": "Money markets", "tier": "must_know", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets for short-term, highly liquid debt securities with maturities under one year.", "plain": "The market for short-term IOUs \u2014 anything due in under a year, like Treasury bills or commercial paper.", "why": "It's one half of the money-vs-capital market split that organizes how the chapter classifies every debt instrument by maturity.", "example": "A large corporation issues 90-day commercial paper to cover short-term cash needs.", "textbookExample": "The chapter lists U.S. Treasury bills, commercial paper, negotiable CDs, and money market mutual funds as classic money market instruments.", "commonMistake": "Don't confuse 'money market' with a specific product like a money market mutual fund \u2014 it's the broader category of short-term debt markets.", "examQuestion": "Give two examples of money market instruments and explain what makes them 'money market' rather than 'capital market.'", "mnemonic": "Money markets = short (under a year); Capital markets = long (over a year)."}, {"id": "ch2-capital-markets", "term": "Capital markets", "tier": "must_know", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets for intermediate- and long-term debt (over a year) and corporate stock.", "plain": "The market for longer-term debt (over a year) and for stocks \u2014 where big, lasting financing decisions get made.", "why": "This is where the New York Stock Exchange lives, and it's the market type most directly tied to the corporate finance decisions covered throughout the course.", "example": "A company issues 20-year corporate bonds to fund a new factory.", "textbookExample": "The chapter identifies the NYSE, where the largest U.S. corporations' stocks trade, as 'a prime example of a capital market.'", "commonMistake": "This is a different meaning of 'capital markets' from the general area-of-finance term in Chapter 1 \u2014 here it specifically refers to a market for long-term securities.", "examQuestion": "Classify the following as money market or capital market instruments: a 6-month Treasury bill, a 20-year corporate bond, common stock.", "mnemonic": null}, {"id": "ch2-primary-markets", "term": "Primary markets", "tier": "must_know", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets in which corporations raise new capital by issuing new securities.", "plain": "The market where a company gets NEW money by issuing brand-new stock or bonds directly.", "why": "It's the half of the primary/secondary distinction that actually funds the company \u2014 this is the only case where the corporation itself receives cash from the sale.", "example": "A company sells 10 million new shares in a follow-on stock offering to raise expansion capital.", "textbookExample": "The chapter's example: if Allied Food Products issues 1 million additional shares to raise new equity capital, that's a primary market transaction.", "commonMistake": "An IPO is a primary market transaction, but so is any later new-share issuance by an already-public company \u2014 'primary' doesn't only mean 'first time.'", "examQuestion": "Is a company's IPO a primary or secondary market transaction? Explain why.", "mnemonic": "Primary = proceeds go to the company."}, {"id": "ch2-secondary-markets", "term": "Secondary markets", "tier": "must_know", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets in which already-issued securities trade among investors, with no proceeds going to the issuing company.", "plain": "Where investors trade stocks and bonds among themselves \u2014 the company that originally issued them isn't involved and gets no money from the trade.", "why": "This is where the vast majority of day-to-day stock trading (like on the NYSE) actually happens, and it's what most people mean when they say 'the stock market.'", "example": "You buy 100 shares of an existing public company through your brokerage app \u2014 the seller gets your cash, not the company.", "textbookExample": "The chapter's example: if Jane Doe buys 1,000 shares of GE stock on the NYSE, that's a secondary market transaction \u2014 GE receives nothing from that sale.", "commonMistake": "Secondary doesn't mean 'less important' \u2014 it's simply the market for already-issued securities, and it's by far the largest and most active market.", "examQuestion": "Why does the NYSE count as a secondary market rather than a primary one?", "mnemonic": null}, {"id": "ch2-private-markets", "term": "Private markets", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets where transactions are negotiated directly between parties, such as a bank loan."}, {"id": "ch2-public-markets", "term": "Public markets", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Markets where standardized contracts are traded on organized exchanges."}, {"id": "ch2-high-frequency-trading-hft", "term": "High-frequency trading (HFT)", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Algorithm-driven trading executed at extremely high speed, often in fractions of a second."}, {"id": "ch2-crowdfunding", "term": "Crowdfunding", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Raising money directly from many individual investors online, bypassing traditional financial intermediaries."}, {"id": "ch2-robo-advisor", "term": "Robo-advisor", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "An automated, algorithm-driven service that builds low-cost investment portfolios matched to an investor's goals and risk tolerance."}, {"id": "ch2-derivatives", "term": "Derivatives", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Any financial asset whose value is derived from the value of some other underlying asset."}, {"id": "ch2-credit-default-swap-cds", "term": "Credit default swap (CDS)", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "A contract offering protection against a borrower's default, in exchange for regular payments to the protection seller."}, {"id": "ch2-hedging", "term": "Hedging", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Using a financial instrument, such as a derivative, to reduce a firm's or investor's risk exposure."}, {"id": "ch2-speculation", "term": "Speculation", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Taking on additional risk (often via derivatives) in the hope of earning higher returns."}, {"id": "ch2-commercial-banks", "term": "Commercial banks", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Traditional 'department stores of finance' that serve a wide variety of savers and borrowers."}, {"id": "ch2-financial-services-corporation", "term": "Financial services corporation", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "A large conglomerate combining several types of financial institutions (banking, insurance, brokerage) under one corporate roof."}, {"id": "ch2-credit-unions", "term": "Credit unions", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Cooperative associations that lend members' pooled savings back to other members, typically at low cost."}, {"id": "ch2-pension-funds", "term": "Pension funds", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Retirement plans funded by employers or government agencies and invested in bonds, stocks, mortgages, and real estate."}, {"id": "ch2-life-insurance-companies", "term": "Life insurance companies", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Institutions that invest policyholders' premiums and pay benefits to beneficiaries when a claim is made."}, {"id": "ch2-mutual-funds", "term": "Mutual funds", "tier": "must_know", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Organizations that pool investor funds to buy diversified portfolios of stocks, bonds, or other securities.", "plain": "A pooled investment fund that takes many people's money and buys a diversified basket of securities on their behalf.", "why": "It's the most common way ordinary individual investors get instant diversification without having to pick and manage dozens of stocks themselves.", "example": "You invest $500 a month into an S&P 500 index mutual fund instead of buying individual stocks yourself.", "textbookExample": "The chapter's Buffett-vs-Seides bet used a low-cost S&P 500 index fund (a type of mutual fund) that returned 125.8% over 10 years, beating a basket of five hedge funds.", "commonMistake": "Not all mutual funds are index funds \u2014 actively managed funds are also mutual funds, they're just trying to beat the market rather than track it (at a higher fee).", "examQuestion": "Explain the difference between actively managed and index mutual funds, using the fee comparison from the chapter.", "mnemonic": null}, {"id": "ch2-actively-managed-funds", "term": "Actively managed funds", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Mutual funds where a manager tries to outperform the overall market, typically at a higher fee."}, {"id": "ch2-index-funds", "term": "Index funds", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Funds designed simply to replicate the performance of a specific market index, at low cost."}, {"id": "ch2-exchange-traded-funds-etfs", "term": "Exchange-traded funds (ETFs)", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Funds similar to mutual funds that hold a portfolio of securities but trade on public markets like ordinary stock."}, {"id": "ch2-hedge-funds", "term": "Hedge funds", "tier": "must_know", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Largely unregulated pools of capital, marketed mainly to institutions and wealthy investors, that pursue varied and sometimes highly leveraged strategies.", "plain": "Pools of capital that work like mutual funds in structure, but are lightly regulated, require large minimum investments, and are only marketed to institutions and wealthy investors.", "why": "They illustrate what happens at the far end of the regulation spectrum from mutual funds \u2014 more freedom to take risk, but also a history of spectacular failures.", "example": "A hedge fund uses heavy leverage to bet that the gap between corporate and Treasury bond yields will narrow.", "textbookExample": "The chapter's example of Long-Term Capital Management: its highly leveraged strategies nearly collapsed the global financial system in 1998 before a Fed-orchestrated bailout by its creditors.", "commonMistake": "Hedge funds aren't automatically riskier than mutual funds because of what they invest in \u2014 it's their light regulation, leverage, and strategy flexibility that create the added risk.", "examQuestion": "What key regulatory difference separates hedge funds from mutual funds, and why does that difference exist?", "mnemonic": null}, {"id": "ch2-private-equity", "term": "Private equity", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Firms that buy and directly manage entire companies, often using significant borrowed money, rather than simply holding shares."}, {"id": "ch2-securitization", "term": "Securitization", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Bundling a large pool of loans (such as mortgages) into new tradable securities backed by those loan payments."}, {"id": "ch2-collateralized-debt-obligation-cdo", "term": "Collateralized debt obligation (CDO)", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "A security backed by a pool of loans, divided into tranches with different risk and return levels."}, {"id": "ch2-physical-location-exchanges", "term": "Physical location exchanges", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "Formal exchanges, like the NYSE, with a tangible trading floor that conduct auction markets in listed securities."}, {"id": "ch2-specialist", "term": "Specialist", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "An exchange member who keeps an inventory of a specific stock and quotes bid/ask prices to keep supply and demand in balance."}, {"id": "ch2-electronic-communications-network-ecn", "term": "Electronic communications network (ECN)", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "An electronic system that matches buyers and sellers directly, bypassing traditional stock exchanges."}, {"id": "ch2-over-the-counter-otc-market", "term": "Over-the-counter (OTC) market", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "A large network of brokers and dealers, connected electronically, that trades securities not listed on a physical exchange."}, {"id": "ch2-dealer-market", "term": "Dealer market", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "A market made up of dealers holding inventory, brokers connecting dealers to investors, and the electronic links between them."}, {"id": "ch2-finra", "term": "FINRA", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "The Financial Industry Regulatory Authority \u2014 the self-regulatory body that licenses brokers and oversees OTC trading practices."}, {"id": "ch2-nasdaq", "term": "NASDAQ", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "An electronic, dealer-based stock market that grew from a simple quotation system into a full exchange with its own listing standards."}, {"id": "ch2-closely-held-corporation", "term": "Closely held corporation", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "A corporation owned by a small number of people, typically associated with its own management."}, {"id": "ch2-publicly-owned-corporation", "term": "Publicly owned corporation", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "A corporation owned by a large number of investors who are not actively involved in managing it."}, {"id": "ch2-initial-public-offering-ipo", "term": "Initial public offering (IPO)", "tier": "must_know", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "The first sale of a privately held company's stock to the public \u2014 'going public.'", "plain": "The very first time a private company sells stock to the general public \u2014 'going public.'", "why": "It's the doorway between the private and public capital markets, and its unpredictable aftermath (Facebook's rocky start, Twitter's slow fade, Google's smooth rise) is a favorite illustration of market uncertainty.", "example": "A fast-growing tech startup sells shares to the public for the first time to fund expansion and let early investors cash out.", "textbookExample": "The chapter contrasts Google's steady long-run rise from its $85 IPO price with Facebook's sharp post-IPO drop and eventual rebound, and Twitter's persistent post-IPO struggles.", "commonMistake": "An IPO doesn't necessarily raise new capital for the company \u2014 Spotify's 2018 direct listing let existing shareholders sell shares publicly without the company issuing anything new.", "examQuestion": "Explain why Spotify's 2018 direct listing counted as 'going public' even though the company itself raised no new capital.", "mnemonic": null}, {"id": "ch2-dutch-auction", "term": "Dutch auction", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "An IPO pricing method where the offer price is set at the highest level that will sell all the offered shares."}, {"id": "ch2-direct-listing", "term": "Direct listing", "tier": "supporting", "lo": "2.2", "chapterId": "ch2", "section": "2.2", "definition": "A method of going public in which only existing shareholders' shares are sold and no new shares \u2014 and no new capital \u2014 are raised."}, {"id": "ch2-dow-jones-industrial-average-djia", "term": "Dow Jones Industrial Average (DJIA)", "tier": "supporting", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "A stock index tracking 30 large, widely held U.S. companies, first published in 1896."}, {"id": "ch2-s-p-500-index", "term": "S&P 500 Index", "tier": "supporting", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "A market-value-weighted index of 500 leading U.S. companies, widely used as the benchmark for the broad market."}, {"id": "ch2-nasdaq-composite-index", "term": "NASDAQ Composite Index", "tier": "supporting", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "An index of roughly 3,300 NASDAQ-listed companies, often treated as a proxy for the technology sector."}, {"id": "ch2-market-price-stock-market-context", "term": "Market price (stock market context)", "tier": "supporting", "lo": "2.4", "chapterId": "ch2", "section": "2.4", "definition": "A stock's current trading price at a given moment."}, {"id": "ch2-intrinsic-value-stock-market-context", "term": "Intrinsic value (stock market context)", "tier": "supporting", "lo": "2.4", "chapterId": "ch2", "section": "2.4", "definition": "What a stock would sell for if all investors had complete, accurate information about the company."}, {"id": "ch2-equilibrium-price", "term": "Equilibrium price", "tier": "supporting", "lo": "2.4", "chapterId": "ch2", "section": "2.4", "definition": "The price that balances buy and sell orders at a given time."}, {"id": "ch2-efficient-market", "term": "Efficient market", "tier": "supporting", "lo": "2.4", "chapterId": "ch2", "section": "2.4", "definition": "A market in which prices stay close to intrinsic values and stocks are generally in equilibrium."}, {"id": "ch2-efficient-markets-hypothesis-emh", "term": "Efficient markets hypothesis (EMH)", "tier": "must_know", "lo": "2.4", "chapterId": "ch2", "section": "2.4", "definition": "The theory that market prices fully reflect available information, tested at weak, semi-strong, and strong levels.", "plain": "The theory that stock prices already reflect all the relevant information out there, so it's very hard to consistently beat the market by analyzing that same information.", "why": "It's the central, most debated idea in the whole chapter \u2014 everything about market efficiency, the efficiency continuum, and behavioral finance is a reaction to or elaboration of this hypothesis.", "example": "If EMH is right, poring over a company's public financial statements shouldn't let you reliably find bargains other investors have missed.", "textbookExample": "The chapter notes the 2013 Nobel Prize in Economics went jointly to Eugene Fama (EMH's champion) and Robert Shiller (a leading skeptic) \u2014 a sign the debate remains genuinely unresolved.", "commonMistake": "EMH has three distinct forms (weak, semi-strong, strong) with different claims \u2014 'the market is efficient' is not a single, all-or-nothing statement.", "examQuestion": "Explain the difference between weak-form, semi-strong-form, and strong-form market efficiency.", "mnemonic": null}, {"id": "ch2-efficiency-continuum", "term": "Efficiency continuum", "tier": "supporting", "lo": "2.4", "chapterId": "ch2", "section": "2.4", "definition": "The idea that large, heavily followed companies tend to be priced more efficiently than small, thinly followed ones."}, {"id": "ch2-arbitrage", "term": "Arbitrage", "tier": "supporting", "lo": "2.4", "chapterId": "ch2", "section": "2.4", "definition": "Buying an asset at a low price in an inefficient market and reselling it at a higher price for a profit."}, {"id": "ch2-behavioral-finance", "term": "Behavioral finance", "tier": "must_know", "lo": "2.5", "chapterId": "ch2", "section": "2.5", "definition": "A field applying psychological insight to explain investor behavior that the efficient markets hypothesis can't fully account for.", "plain": "The field that uses real psychology \u2014 not just rational-investor assumptions \u2014 to explain why stock prices sometimes stay 'wrong' for a long time.", "why": "It's the direct counterweight to EMH in this chapter, and gives concrete, testable reasons (limits to arbitrage, overconfidence, loss aversion) for market anomalies like bubbles.", "example": "Investors who correctly believed dot-com stocks were overpriced still lost money shorting them too early, because prices kept climbing before the eventual crash.", "textbookExample": "The chapter cites Kahneman, Tversky, and Thaler as the field's pioneers, and notes upward of 90% of people rate themselves as above-average drivers \u2014 a textbook illustration of overconfidence.", "commonMistake": "Behavioral finance doesn't claim markets are always wrong \u2014 it explains specific, persistent deviations from EMH's predictions, not a wholesale rejection of market pricing.", "examQuestion": "Name the two core arguments behavioral finance makes against strict market efficiency, per the chapter.", "mnemonic": null}, {"id": "ch2-limits-to-arbitrage", "term": "Limits to arbitrage", "tier": "supporting", "lo": "2.5", "chapterId": "ch2", "section": "2.5", "definition": "The idea that exploiting a known mispricing is often too risky or costly for traders to do reliably, letting mispricings persist."}, {"id": "ch2-self-attribution-bias", "term": "Self-attribution bias", "tier": "supporting", "lo": "2.5", "chapterId": "ch2", "section": "2.5", "definition": "The tendency to credit one's own skill for successes while blaming bad luck for failures."}, {"id": "ch2-hindsight-bias", "term": "Hindsight bias", "tier": "supporting", "lo": "2.5", "chapterId": "ch2", "section": "2.5", "definition": "The tendency to believe, after an event occurs, that one had predicted it beforehand."}, {"id": "ch3-annual-report", "term": "Annual report", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "A yearly report a corporation issues to stockholders, containing a verbal summary plus the four core financial statements."}, {"id": "ch3-balance-sheet", "term": "Balance sheet", "tier": "must_know", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "A financial snapshot showing what a firm owns (assets) and who has claims on those assets (liabilities and equity) at one specific date.", "plain": "A snapshot of everything a company owns and owes on one specific date \u2014 like a photo, not a video.", "why": "It's one of the four core financial statements and the one that shows a firm's overall size, asset mix, and financing structure at a glance.", "example": "Looking at a company's balance sheet on December 31 tells you its total assets and debts as of that exact day, but not how they changed during the year.", "textbookExample": "Using Allied Food Products, the chapter shows $2 billion in total assets at the end of 2021, financed by $310 million of current liabilities, $750 million of long-term debt, and $940 million of common equity.", "commonMistake": "Don't confuse a balance sheet's snapshot nature with the income statement's period coverage \u2014 mixing up 'as of a date' vs. 'over a year' is a classic early mistake.", "examQuestion": "Why is the balance sheet described as a 'snapshot' rather than a 'video' of a firm's finances?", "mnemonic": null}, {"id": "ch3-income-statement", "term": "Income statement", "tier": "must_know", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "A report summarizing a firm's revenues, expenses, and profit over a period of time, such as a quarter or year.", "plain": "The report that shows whether a company actually made money over a stretch of time \u2014 a quarter or a year \u2014 by tracking sales, costs, and what's left over.", "why": "It's where EPS ('the bottom line') lives, and it's the statement most casual investors look at first to judge whether a company is profitable.", "example": "A retailer's income statement shows $3 billion in sales and $146 million in net income for the year.", "textbookExample": "Allied's EPS fell from $2.03 in 2020 to $1.95 in 2021 even though operating income (EBIT) actually rose \u2014 because higher interest expense from new debt ate into the difference.", "commonMistake": "A rising EBIT doesn't guarantee rising net income \u2014 financing costs (interest) and taxes sit between the two and can move in the opposite direction.", "examQuestion": "Explain how Allied's operating income rose in 2021 while its net income fell.", "mnemonic": null}, {"id": "ch3-statement-of-cash-flows", "term": "Statement of cash flows", "tier": "must_know", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "A report showing how a firm's operating, investing, and financing activities changed its cash balance over a period.", "plain": "The report that tracks where a company's actual cash came from and where it went \u2014 split into operating, investing, and financing activities.", "why": "Since 'cash is king,' this statement often reveals problems that net income alone hides \u2014 like Allied relying on new borrowing to cover an aggressive capital expenditure.", "example": "A company reports positive net income but its cash flow statement shows a big cash outflow for new equipment and inventory, explaining why its bank balance actually shrank.", "textbookExample": "Allied's 2021 statement shows only a small $26.3 million operating cash inflow against $230 million in new plant spending \u2014 covered mostly by new borrowing, dropping its cash balance from $80 million to $10 million.", "commonMistake": "A company can be profitable (positive net income) and still be low on cash \u2014 this statement is the one that actually tracks the bank balance.", "examQuestion": "Name the four sections of the statement of cash flows and briefly describe what each covers.", "mnemonic": null}, {"id": "ch3-statement-of-stockholders-equity", "term": "Statement of stockholders' equity", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "A statement showing how and why a firm's total stockholders' equity changed during the year."}, {"id": "ch3-stockholders-equity", "term": "Stockholders' equity", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "Paid-in capital plus retained earnings; equivalently, total assets minus total liabilities."}, {"id": "ch3-retained-earnings", "term": "Retained earnings", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "The cumulative total of all the earnings a company has kept (not paid out as dividends) over its entire life."}, {"id": "ch3-current-assets-working-capital", "term": "Current assets (working capital)", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "Assets expected to convert to cash within one year, such as cash, accounts receivable, and inventory."}, {"id": "ch3-net-working-capital-nwc", "term": "Net working capital (NWC)", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "Current assets minus current liabilities."}, {"id": "ch3-net-operating-working-capital-nowc", "term": "Net operating working capital (NOWC)", "tier": "must_know", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "Operating current assets (current assets minus excess cash) minus operating current liabilities (current liabilities minus notes payable).", "plain": "A refined version of working capital that strips out excess cash and interest-bearing short-term debt, focusing only on what's actually tied up running day-to-day operations.", "why": "It's a required building block for calculating free cash flow \u2014 you can't get FCF right without first isolating the true operating investment in working capital.", "example": "A company's simple 'current assets minus current liabilities' number includes a bank loan due soon; NOWC strips that financing item out to isolate the purely operational piece.", "textbookExample": "Allied's NOWC was calculated as ($1,000M \u2212 $0 excess cash) \u2212 ($310M current liabilities \u2212 $110M notes payable) = $800 million for 2021.", "commonMistake": "NOWC is not the same as NWC \u2014 NWC includes notes payable (a financing item) and doesn't separate out excess cash; NOWC deliberately removes both.", "examQuestion": "Walk through the NOWC formula and explain why notes payable is subtracted out of current liabilities.", "mnemonic": null}, {"id": "ch3-total-debt", "term": "Total debt", "tier": "supporting", "lo": "3.1", "chapterId": "ch3", "section": "3.1", "definition": "A firm's short-term debt plus long-term debt \u2014 only its interest-bearing borrowing."}, {"id": "ch3-total-liabilities", "term": "Total liabilities", "tier": "supporting", "lo": "3.1", "ch
